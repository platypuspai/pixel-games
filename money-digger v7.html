<script>

// CONSTANTS
// ═══════════════════════════════

const OBJECTS = [

  {m:324.0,   label:'Eiffeltoren',                                    emoji:'🗼'},
  {m:443.0,   label:'Empire State Building',                          emoji:'🏙️'},
  {m:600.0,   label:'Pterodactylus vliegend',                         emoji:'🦕'},

  {m:100000,  label:'Kármánlijn (Ruimte)',                            emoji:'🌌'},
  {m:408000,  label:'ISS',                                            emoji:'🛸'},
  {m:384400000, label:'De Maan',                                      emoji:'🌕'},
  {m:149600000000, label:'De Zon',                                    emoji:'☀️'},
];

// ═══════════════════════════════
// STATE
// ═══════════════════════════════
let totalBills   = 0;
let displayBills = 0;
let cloudT       = 0;

let deviceId = localStorage.getItem('md6_did');
if(!deviceId){ deviceId = 'dev-'+Math.random().toString(36).slice(2,12); localStorage.setItem('md6_did',deviceId); }
let myName   = localStorage.getItem('md6_n')||'Speler'+Math.floor(Math.random()*9000+1000);
let myClicks = 0; 
let scores   = {}; 
let shownMS  = new Set(JSON.parse(localStorage.getItem('md6_m')||'[]'));

// ═══════════════════════════════
// CANVAS
// ═══════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0, GY = 0;

function resize(){
  W  = canvas.width  = window.innerWidth;
  H  = canvas.height = window.innerHeight;
  GY = Math.round(H * 0.72);
}
resize();
window.addEventListener('resize', resize);

// ═══════════════════════════════
// HELPERS
// ═══════════════════════════════
function fmtN(n){ return n < 1000 ? n : n.toLocaleString('nl-NL'); }
function fmtH(m){
  if(m>=1e9)   return(m/1e9).toFixed(3)+' Gm';
  if(m>=1e6)   return(m/1e6).toFixed(3)+' Mm';
  if(m>=1000)  return(m/1000).toFixed(3)+' km';
  if(m>=1)     return m.toFixed(3)+' m';
  if(m>=0.01)  return(m*100).toFixed(2)+' cm';
  return(m*1000).toFixed(2)+' mm';
}

// ═══════════════════════════════
// DRAWING BACKGROUND & STACK
// ═══════════════════════════════
function drawSky(altM){
  const t  = Math.min(1, altM/100000);
  const sg = ctx.createLinearGradient(0, 0, 0, GY);
  sg.addColorStop(0, `rgb(${20*(1-t)},${42*(1-t)},${58*(1-t)})`);
  sg.addColorStop(1, `rgb(${135*(1-t)+2*t},${186*(1-t)+5*t},${235*(1-t)+18*t})`);
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, GY);
}

function drawGround(altM){
  ctx.fillStyle = '#1c1c1c'; ctx.fillRect(0, GY, W, H-GY);
}

function drawStack(bills){
  if(bills <= 0) return;
  const cx = W/2, maxH = H * 0.38, sh = Math.min(bills * 0.5, maxH), top = GY - sh, sw = 110;
  
  const ff = ctx.createLinearGradient(cx,top,cx,GY);
  ff.addColorStop(0,'#166534'); ff.addColorStop(1,'#14532d');
  ctx.fillStyle = ff; ctx.fillRect(cx-sw/2, top, sw, sh);
  
  if(sh > 20){
    ctx.fillStyle='rgba(255,255,255,.1)'; ctx.font=`bold ${Math.min(36,sh*.26)}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$1', cx, top+sh*.52);
  }
}

// ═══════════════════════════════
// DRAW OBJECTS (HET VERNIEUWDE SCHUIF-SYSTEEM)
// ═══════════════════════════════
function drawObjects(bills){
  if(bills <= 0) return;
  const altM    = bills * BILL_M;
  const maxH    = H * 0.38;
  const pxPerM  = maxH / Math.max(altM, BILL_M);
  const stackCX = W/2;
  const stackSW = 110;
  const stackR  = stackCX + stackSW/2 + 20; // Startpositie rechts
  const stackL  = stackCX - stackSW/2 - 20; // Startpositie links
  
  // Zodra een voorwerp op het scherm kleiner is dan 15 pixels, verbergen we het!
  // Het blijft in de OBJECTS array bestaan, maar de nieuwere voorwerpen schuiven eroverheen.
  const MIN_PX  = 15;  
  const GAP     = 16;

  const vis = [];
  for(let i=0;i<OBJECTS.length;i++){
    const obj   = OBJECTS[i];
    const ph    = obj.m * pxPerM;
    const ratio = obj.m / altM;
    
    if(ratio > 8) break;
    if(ratio < 0.0001) continue; // Te oud/klein = overslaan om plaats te maken
    
    const drawH = Math.min(ph, H*0.9);
    const emojiW = Math.max(drawH*0.65, 30); // Neemt ruimte in die het nodig heeft
    
    vis.push({obj, drawH, emojiW, ratio, opacity: 1}); // Opacity vast voor duidelijkheid
  }
  if(!vis.length) return;

  const smaller = vis.filter(v=>v.ratio<=1).sort((a,b)=>b.ratio-a.ratio); 
  const bigger  = vis.filter(v=>v.ratio>1).sort((a,b)=>a.ratio-b.ratio);  

  // LINKS: Kleinere objecten schuiven door naar links
  let curX = stackL;
  for(const v of smaller){
    // VERBERGEN: Als hij kleiner is dan MIN_PX, tekenen we hem niet (maakt plaats!)
    if(v.drawH < MIN_PX) continue; 
    
    const cx2 = curX - v.emojiW/2;
    if(cx2 + v.emojiW < 0) break; // Ligt volledig buiten links scherm = stop de loop
    
    drawOneObject(v, cx2);
    
    // Alleen als hij daadwerkelijk getekend is, schuift de X positie op voor de volgende!
    curX = cx2 - v.emojiW/2 - GAP;
  }

  // RECHTS: Grotere objecten schuiven door naar rechts
  curX = stackR;
  for(const v of bigger){
    if(v.drawH < MIN_PX) continue; 
    
    const cx2 = curX + v.emojiW/2;
    if(cx2 - v.emojiW > W) break; // Ligt volledig buiten rechts scherm = stop de loop
    
    drawOneObject(v, cx2);
    
    curX = cx2 + v.emojiW/2 + GAP;
  }
}

function drawOneObject(v, cx2){
  const {obj, drawH} = v;
  ctx.save();
  ctx.font = `${Math.min(drawH, 500)}px serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(obj.emoji, cx2, GY);

  if(drawH > 14){
    ctx.font = '600 10px DM Sans,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff'; ctx.fillText(obj.label, cx2, GY+6);
  }
  ctx.restore();
}

// ═══════════════════════════════
// HUD & CLICK & LOOP (Vereenvoudigd voor weergave)
// ═══════════════════════════════
function updateHUD(){
  const altM = displayBills * BILL_M;
  document.getElementById('bnum').textContent = fmtN(Math.round(totalBills));
}

document.getElementById('cbtn').addEventListener('click', ()=>{
  totalBills++;
  // (In je eigen code doe je hier de Firebase updates)
});

function loop(){
  requestAnimationFrame(loop);
  displayBills += (totalBills - displayBills) * 0.1;
  const b = Math.round(displayBills);
  ctx.clearRect(0, 0, W, H);
  drawSky(b * BILL_M);
  drawGround(b * BILL_M);
  drawObjects(b);
  drawStack(displayBills);
  updateHUD();
}
loop();
</script>
