<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Money Digger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif}
#c{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud{position:absolute;top:20px;left:20px}
#alt{font-size:2.4rem;font-weight:700;color:#fff;line-height:1;text-shadow:0 2px 24px rgba(0,0,0,.7);letter-spacing:-1px}
#unit{font-size:.88rem;font-weight:300;color:rgba(255,255,255,.6);margin-top:2px}
#nxt{margin-top:8px;font-size:.66rem;color:rgba(255,255,255,.42);max-width:240px;line-height:1.5}
#sb{position:absolute;top:20px;right:20px;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;min-width:135px}
#sb h3{font-size:.52rem;font-weight:500;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase;margin-bottom:7px}
.sr{display:flex;justify-content:space-between;gap:10px;font-size:.6rem;color:rgba(255,255,255,.5);padding:2px 0}
.sr.me{color:#22c55e}
.sn{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv{font-family:'DM Mono',monospace;font-size:.56rem}
#bctr{position:absolute;bottom:110px;right:28px;text-align:right}
#bnum{font-size:1.2rem;font-weight:700;color:#22c55e;font-family:'DM Mono',monospace;text-shadow:0 2px 12px rgba(34,197,94,.4)}
#blbl{font-size:.56rem;color:rgba(255,255,255,.3);margin-top:2px}
#cbtn{position:fixed;bottom:28px;right:28px;z-index:20;width:72px;height:72px;border-radius:50%;border:none;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 20px rgba(34,197,94,.5);display:flex;align-items:center;justify-content:center;animation:pulse 2.5s infinite;transition:transform .08s;pointer-events:all}
@keyframes pulse{0%,100%{box-shadow:0 4px 20px rgba(34,197,94,.5),0 0 0 0 rgba(34,197,94,.3)}70%{box-shadow:0 4px 20px rgba(34,197,94,.5),0 0 0 16px rgba(34,197,94,0)}}
#cbtn:active{transform:scale(.88);animation:none}
#online{position:absolute;bottom:28px;left:20px;font-size:.58rem;color:rgba(255,255,255,.3)}
#nw{position:absolute;bottom:54px;left:20px;display:flex;align-items:center;gap:5px}
#nl{font-size:.52rem;color:rgba(255,255,255,.22)}
#ni{font-family:'DM Sans',sans-serif;font-size:.56rem;padding:3px 7px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.08);border-radius:5px;width:100px;pointer-events:all}
#msb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .5s;pointer-events:none;background:rgba(0,0,0,.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px 32px}
#msb.show{opacity:1}
#mse{font-size:3.5rem}
#msn{font-size:1.3rem;font-weight:700;color:#fff;margin-top:6px}
#mss{font-size:.62rem;color:rgba(255,255,255,.5);margin-top:3px}
.fb{position:fixed;font-size:1.1rem;pointer-events:none;z-index:25;animation:fup .85s ease-out forwards}
@keyframes fup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-70px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud"><div id="alt">0,000</div><div id="unit">millimeter</div><div id="nxt">Laadt...</div></div>
  <div id="sb"><h3>Top klikkers</h3><div id="sl"></div></div>
  <div id="bctr"><div id="bnum">0</div><div id="blbl">biljetten gestapeld</div></div>
  <div id="nw"><span id="nl">naam:</span><input id="ni" type="text" maxlength="16"/></div>
  <div id="online">● verbinden...</div>
  <div id="msb"><div id="mse"></div><div id="msn"></div><div id="mss"></div></div>
</div>
<button id="cbtn">💵</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ═══════════════════════════════
// CONSTANTS
// ═══════════════════════════════
const BILL_M = 0.0001; // 0.1mm per biljet

const OBJECTS = [

  {m:0.015,   label:'Druif',                                          emoji:'🍇'},

  {m:0.300,   label:'Tulp',                                           emoji:'🌷'},
  {m:0.450,   label:'Zonnebloem',                                     emoji:'🌻'},
  {m:0.600,   label:'Kat',                                            emoji:'🐱'},
  {m:0.900,   label:'Hond',                                           emoji:'🐕'},
  {m:1.750,   label:'Mens',                                           emoji:'🧍'},
  {m:2.400,   label:'Paard',                                          emoji:'🐴'},
  {m:4.000,   label:'Olifant',                                        emoji:'🐘'},
  {m:5.500,   label:'Giraf',                                          emoji:'🦒'},
  {m:7.000,   label:'Jonge boom',                                     emoji:'🌲'},
  {m:8.500,   label:'Huis',                                           emoji:'🏠'},
  {m:15.00,   label:'Grote eik',                                      emoji:'🌳'},
  {m:25.00,   label:'Sequoia',                                        emoji:'🌲'},
  {m:46.00,   label:'Scheve toren van Pisa',                          emoji:'🗼'},
  {m:93.00,   label:'Vrijheidsbeeld',                                 emoji:'🗽'},
  {m:115.0,   label:'Reuzensequoia',                                  emoji:'🌲'},
  {m:169.0,   label:'Washington Monument',                            emoji:'🏛️'},
  {m:324.0,   label:'Eiffeltoren',                                    emoji:'🗼'},
  {m:443.0,   label:'Empire State Building',                          emoji:'🏙️'},
  {m:600.0,   label:'Pterodactylus vliegend',                         emoji:'🦕'},
  {m:828.0,   label:'Burj Khalifa',                                   emoji:'🏙️'},
  {m:1000,    label:'1 kilometer!',                                   emoji:'🎊'},

  {m:1178,    label:'Jeddah Tower',                                   emoji:'🏗️'},
  {m:1200,    label:'Monarchvlinder',                                 emoji:'🦋'},
  {m:1345,    label:'Ben Nevis — hoogste berg VK',                    emoji:'⛰️'},
  {m:1620,    label:'5× de Eiffeltoren',                              emoji:'🗼'},
  {m:1909,    label:'Mont Ventoux',                                   emoji:'🚴'},
  {m:2250,    label:'Mil V-12 helikopter',                            emoji:'🚁'},
  {m:3776,    label:'Mount Fuji',                                     emoji:'🗻'},
  {m:4800,    label:'1 uur wandelen omhoog',                          emoji:'🥾'},
  {m:5500,    label:'Zuurstof gedaald tot 50%',                       emoji:'😮‍💨'},
  {m:5850,    label:'65 voetbalvelden op elkaar',                     emoji:'⚽'},
  {m:7000,    label:'Death zone',                                     emoji:'💀'},
  {m:8849,    label:'Mount Everest',                                  emoji:'🏔️'},
  {m:9144,    label:'Blériot XI',                                     emoji:'✈️'},
  {m:10000,   label:'Verloren ballon knapt hier!',                    emoji:'🎈'},
  {m:11278,   label:'Rüppells gier',                                  emoji:'🦅'},
  {m:16500,   label:'Stratosfeer',                                    emoji:'🌤️'},
  {m:26000,   label:'SR-71 Blackbird',                                emoji:'✈️'},
  {m:38969,   label:'Felix Baumgartner',                              emoji:'🪂'},
  {m:40000,   label:'0,01% naar de maan!',                            emoji:'🌕'},
  {m:50000,   label:'Mesosfeer',                                      emoji:'🌌'},
  {m:61000,   label:'Saturn V raket',                                 emoji:'🚀'},
  {m:100000,  label:'Kármánlijn (Ruimte)',                            emoji:'🌌'},
  {m:408000,  label:'ISS Ruimtestation',                              emoji:'🛸'},
  {m:384400000, label:'De Maan',                                      emoji:'🌕'},
  {m:149600000000, label:'De Zon',                                    emoji:'☀️'},
];

// ═══════════════════════════════
// STATE
// ═══════════════════════════════
let totalBills   = 0;
let displayBills = 0;
let cloudT       = 0;

let deviceId = localStorage.getItem('md6_did');
if(!deviceId){ deviceId = 'dev-'+Math.random().toString(36).slice(2,12); localStorage.setItem('md6_did',deviceId); }
let myName   = localStorage.getItem('md6_n')||'Speler'+Math.floor(Math.random()*9000+1000);
let myClicks = 0;
let scores   = {};
let shownMS  = new Set(JSON.parse(localStorage.getItem('md6_m')||'[]'));

// ═══════════════════════════════
// CANVAS
// ═══════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0, GY = 0;

function resize(){
  W  = canvas.width  = window.innerWidth;
  H  = canvas.height = window.innerHeight;
  GY = Math.round(H * 0.72);
}
resize();
window.addEventListener('resize', resize);

// ═══════════════════════════════
// HELPERS
// ═══════════════════════════════
function fmtN(n){
  if(n>=1e15) return(n/1e15).toFixed(2)+'P';
  if(n>=1e12) return(n/1e12).toFixed(2)+'T';
  if(n>=1e9)  return(n/1e9).toFixed(2)+'B';
  if(n>=1e6)  return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)  return(n/1e3).toFixed(1)+'K';
  return n.toLocaleString('nl-NL');
}
function fmtH(m){
  if(m>=1e12)  return(m/1e12).toFixed(3)+' Tm';
  if(m>=1e9)   return(m/1e9).toFixed(3)+' Gm';
  if(m>=1e6)   return(m/1e6).toFixed(3)+' Mm';
  if(m>=1000)  return(m/1000).toFixed(3)+' km';
  if(m>=1)     return m.toFixed(3)+' m';
  if(m>=0.01)  return(m*100).toFixed(2)+' cm';
  return(m*1000).toFixed(2)+' mm';
}

// ═══════════════════════════════
// DRAW SKY
// ═══════════════════════════════
function drawSky(altM){
  const t  = Math.min(1, altM/100000);
  const r0 = Math.round(20*(1-t)),  g0 = Math.round(42*(1-t)),  b0 = Math.round(58*(1-t));
  const r1 = Math.round(135*(1-t)+2*t), g1 = Math.round(186*(1-t)+5*t), b1 = Math.round(235*(1-t)+18*t);
  const sg = ctx.createLinearGradient(0, 0, 0, GY);
  sg.addColorStop(0, `rgb(${r0},${g0},${b0})`);
  sg.addColorStop(1, `rgb(${r1},${g1},${b1})`);
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, GY);

  // Stars
  const sa = Math.min(1, Math.max(0,(altM-30000)/70000));
  if(sa > 0){
    ctx.save(); ctx.globalAlpha = sa;
    for(let i=0;i<200;i++){
      const f = 0.5+0.5*Math.sin(Date.now()*.001+i);
      ctx.fillStyle = `rgba(255,255,255,${f*(0.3+(i%3)*.25)})`;
      ctx.beginPath();
      ctx.arc((i*137.5+50)%W,(i*97.3+10)%(GY*.9),0.4+(i%4)*.35,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Clouds
  const ca = Math.min(Math.max(0,(altM-1500)/500), Math.max(0,1-(altM-12000)/3000));
  if(ca > 0){
    ctx.save(); ctx.globalAlpha = ca*.88;
    cloudT += 0.00015;
    const cd = [{x:.07,y:.26,s:90},{x:.3,y:.36,s:110},{x:.56,y:.2,s:75},{x:.76,y:.3,s:92},{x:.48,y:.44,s:65}];
    for(const c of cd){
      const cx = ((c.x+cloudT*.05)%1.15)*W, cy = c.y*GY;
      ctx.fillStyle='rgba(150,160,180,.3)';
      ctx.beginPath(); ctx.ellipse(cx,cy+c.s*.18,c.s*.7,c.s*.16,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.96)';
      ctx.beginPath();
      ctx.arc(cx,cy,c.s*.38,0,Math.PI*2);
      ctx.arc(cx+c.s*.36,cy-c.s*.1,c.s*.3,0,Math.PI*2);
      ctx.arc(cx-c.s*.3,cy+c.s*.06,c.s*.25,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ═══════════════════════════════
// DRAW GROUND
// ═══════════════════════════════
function drawGround(altM){
  const ag = ctx.createLinearGradient(0,GY,0,H);
  ag.addColorStop(0,'#1c1c1c'); ag.addColorStop(.3,'#242424'); ag.addColorStop(1,'#111');
  ctx.fillStyle = ag;
  ctx.fillRect(0, GY, W, H-GY);

  const fade = Math.max(0, 1-altM/400);
  if(fade > 0){
    ctx.save(); ctx.globalAlpha = fade;
    ctx.strokeStyle='rgba(255,255,255,.04)'; ctx.lineWidth=1;
    for(let i=-9;i<=9;i++){
      ctx.beginPath(); ctx.moveTo(W/2,GY); ctx.lineTo(W/2+i*220,H); ctx.stroke();
    }
    for(let d=.05;d<1;d+=.12){
      const y=GY+(H-GY)*d;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    ctx.strokeStyle='rgba(255,255,255,.09)'; ctx.lineWidth=2; ctx.setLineDash([22,32]);
    ctx.beginPath(); ctx.moveTo(W/2-90,GY); ctx.lineTo(W/2-220,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2+90,GY); ctx.lineTo(W/2+220,H); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

// ═══════════════════════════════
// DRAW STACK
// ═══════════════════════════════
function drawStack(bills){
  if(bills <= 0) return;
  const cx   = W/2;
  const maxH = H * 0.38;
  const sh   = Math.min(bills * 0.5, maxH);
  const top  = GY - sh;
  const sw   = 110, depth = 20;

  // Shadow
  const shg = ctx.createRadialGradient(cx+depth*.4,GY+4,0,cx+depth*.4,GY+4,sw*.7);
  shg.addColorStop(0,'rgba(0,0,0,.5)'); shg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = shg;
  ctx.beginPath(); ctx.ellipse(cx+depth*.4,GY+4,sw*.7,10,0,0,Math.PI*2); ctx.fill();

  // Right face
  const rf = ctx.createLinearGradient(cx+sw/2,top,cx+sw/2+depth,top-depth*.5);
  rf.addColorStop(0,'#14532d'); rf.addColorStop(1,'#052e16');
  ctx.fillStyle = rf;
  ctx.beginPath();
  ctx.moveTo(cx+sw/2,top); ctx.lineTo(cx+sw/2+depth,top-depth*.5);
  ctx.lineTo(cx+sw/2+depth,GY-depth*.5); ctx.lineTo(cx+sw/2,GY); ctx.fill();

  // Front face
  const ff = ctx.createLinearGradient(cx,top,cx,GY);
  ff.addColorStop(0,'#166534'); ff.addColorStop(.3,'#22c55e');
  ff.addColorStop(.7,'#16a34a'); ff.addColorStop(1,'#14532d');
  ctx.fillStyle = ff;
  ctx.fillRect(cx-sw/2, top, sw, sh);

  // Bill lines
  const le = Math.max(1, Math.floor(sh/Math.min(100,bills)));
  ctx.strokeStyle='rgba(0,60,20,.22)'; ctx.lineWidth=.5;
  for(let y=GY;y>top;y-=le){
    ctx.beginPath(); ctx.moveTo(cx-sw/2,y); ctx.lineTo(cx+sw/2,y); ctx.stroke();
  }

  if(sh > 20){
    ctx.fillStyle='rgba(255,255,255,.1)';
    ctx.font=`bold ${Math.min(36,sh*.26)}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('$1', cx, top+sh*.52);
    ctx.strokeStyle='rgba(0,80,20,.15)'; ctx.lineWidth=1;
    ctx.strokeRect(cx-sw/2+3,top+3,sw-6,sh-6);
  }

  // Top face
  const tf = ctx.createLinearGradient(cx-sw/2,top,cx+sw/2+depth,top-depth*.5);
  tf.addColorStop(0,'#4ade80'); tf.addColorStop(.5,'#86efac'); tf.addColorStop(1,'#22c55e');
  ctx.fillStyle = tf;
  ctx.beginPath();
  ctx.moveTo(cx-sw/2,top); ctx.lineTo(cx+sw/2,top);
  ctx.lineTo(cx+sw/2+depth,top-depth*.5); ctx.lineTo(cx-sw/2+depth,top-depth*.5);
  ctx.closePath(); ctx.fill();

  // Glow
  ctx.save();
  ctx.shadowColor='#22c55e'; ctx.shadowBlur=14;
  ctx.strokeStyle='rgba(34,197,94,.28)'; ctx.lineWidth=1;
  ctx.strokeRect(cx-sw/2,top,sw,sh);
  ctx.restore();

  // Height label
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1; ctx.setLineDash([2,6]);
  const lx = cx-sw/2-26;
  ctx.beginPath(); ctx.moveTo(lx,top); ctx.lineTo(cx-sw/2-10,top); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lx,GY); ctx.lineTo(cx-sw/2-10,GY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lx,top); ctx.lineTo(lx,GY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.4)';
  ctx.font='9px DM Mono,monospace';
  ctx.textAlign='right'; ctx.textBaseline='middle';
  ctx.fillText(fmtH(bills*BILL_M), lx-4, top+sh*.5);
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  return {top, sh, cx, sw, depth};
}

// ═══════════════════════════════
// DRAW OBJECTS (GECORRIGEERD MET SCHUIVEN EN PLAATSMAKEN)
// ═══════════════════════════════
function drawObjects(bills){
  if(bills <= 0) return;
  const altM    = bills * BILL_M;
  const maxH    = H * 0.38;
  const pxPerM  = maxH / Math.max(altM, BILL_M);
  const stackCX = W/2;
  const stackSW = 110, stackDepth = 20;
  const stackR  = stackCX + stackSW/2 + stackDepth + 14;
  const stackL  = stackCX - stackSW/2 - 14;
  
  // Bereken de werkelijke schermhoogte van de stapel
  const stackPx = Math.min(bills * 0.5, maxH);
  
  // MIN_PX: Een object verdwijnt als het < 1/4de van de stapel is, 
  // maar sowieso als het kleiner is dan 15 pixels (dan zie je het toch amper).
  const MIN_PX  = Math.max(15, stackPx * 0.25);  
  const GAP     = 16;

  const vis = [];
  for(let i=0;i<OBJECTS.length;i++){
    const obj   = OBJECTS[i];
    const ph    = obj.m * pxPerM;
    const ratio = obj.m / altM;
    
    if(ratio > 8) break;
    if(ratio < 0.0001) continue; 
    
    const opIn  = Math.min(1,(ratio-0.0005)/0.03);
    const opOut = Math.min(1,(8-ratio)/3);
    const opacity = opIn * opOut;
    
    const drawH = Math.min(ph, H*0.9);
    
    // Breedte berekenen ZONDER geforceerde minimale pixels, 
    // hierdoor ontstaan er géén onzichtbare gaten meer!
    const emojiW = Math.max(drawH * 0.65, 30); 
    
    vis.push({obj, drawH, emojiW, ratio, opacity});
  }
  if(!vis.length) return;

  const smaller = vis.filter(v=>v.ratio<=1).sort((a,b)=>b.ratio-a.ratio); 
  const bigger  = vis.filter(v=>v.ratio>1).sort((a,b)=>a.ratio-b.ratio);  

  // LEFT side: schuift naar links
  let curX = stackL - 10;
  for(const v of smaller){
    if(v.drawH < MIN_PX) continue; // Maakt direct ruimte voor de volgende!
    
    const cx2 = curX - v.emojiW/2;
    if(cx2 + v.emojiW < 0) break; // Buiten het scherm = stoppen met tekenen
    drawOneObject(v, cx2);
    
    // Alleen opschuiven als het voorwerp daadwerkelijk getekend is
    curX = cx2 - v.emojiW/2 - GAP;
  }

  // RIGHT side: schuift naar rechts
  curX = stackR + 10;
  for(const v of bigger){
    if(v.drawH < MIN_PX) continue; 
    
    const cx2 = curX + v.emojiW/2;
    if(cx2 - v.emojiW > W) break; // Buiten het scherm = stoppen met tekenen
    drawOneObject(v, cx2);
    
    curX = cx2 + v.emojiW/2 + GAP;
  }
}

function drawOneObject(v, cx2){
  const {obj, drawH, opacity} = v;
  ctx.save();
  ctx.globalAlpha = Math.max(0.04, opacity);

  // Ground shadow
  const shRX = drawH*0.28, shRY = Math.max(3, drawH*0.036);
  const shg = ctx.createRadialGradient(cx2,GY,0,cx2,GY,shRX);
  shg.addColorStop(0,'rgba(0,0,0,.4)'); shg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = shg;
  ctx.beginPath(); ctx.ellipse(cx2,GY+shRY*.4,shRX,shRY,0,0,Math.PI*2); ctx.fill();

  // Emoji
  const fs = Math.min(drawH, 500);
  ctx.font = `${fs}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.shadowColor = 'rgba(0,0,0,.45)';
  ctx.shadowBlur  = Math.min(fs*.08, 28);
  ctx.shadowOffsetX = fs*.03;
  ctx.shadowOffsetY = fs*.04;
  ctx.fillText(obj.emoji, cx2, GY);
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;

  // Label pill
  if(drawH > 14){
    const lblSz = Math.min(13, Math.max(8, 8+drawH*.07));
    ctx.font = `600 ${lblSz}px DM Sans,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const tw = ctx.measureText(obj.label).width;
    const pad = 5, ph2 = lblSz+pad;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath(); ctx.roundRect(cx2-tw/2-pad, GY+4, tw+pad*2, ph2, ph2/2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(obj.label, cx2, GY+4+pad/2);
    if(drawH > 28){
      ctx.font = `${Math.max(7,lblSz-3)}px DM Mono,monospace`;
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.fillText(fmtH(obj.m), cx2, GY+4+ph2+3);
    }
  }
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

// ═══════════════════════════════
// HUD
// ═══════════════════════════════
let bannerTO = null;
function showBanner(obj){
  document.getElementById('mse').textContent = obj.emoji;
  document.getElementById('msn').textContent = obj.label;
  document.getElementById('mss').textContent = `${fmtH(obj.m)} hoog · ${fmtN(Math.round(obj.m/BILL_M))} klikken`;
  const el = document.getElementById('msb');
  el.classList.add('show');
  if(bannerTO) clearTimeout(bannerTO);
  bannerTO = setTimeout(()=>el.classList.remove('show'), 3800);
}

function updateHUD(){
  const altM = displayBills * BILL_M;
  const ae = document.getElementById('alt');
  const ue = document.getElementById('unit');
  if(altM>=1e9){ae.textContent=(altM/1e9).toFixed(3);ue.textContent='gigameter';}
  else if(altM>=1e6){ae.textContent=(altM/1e6).toFixed(3);ue.textContent='megameter';}
  else if(altM>=1000){ae.textContent=(altM/1000).toFixed(4);ue.textContent='kilometer';}
  else if(altM>=1){ae.textContent=altM.toFixed(4);ue.textContent='meter';}
  else if(altM>=.01){ae.textContent=(altM*100).toFixed(3);ue.textContent='centimeter';}
  else{ae.textContent=(altM*1000).toFixed(3);ue.textContent='millimeter';}

  let next = null;
  for(const o of OBJECTS) if(o.m > altM){ next=o; break; }
  document.getElementById('nxt').textContent = next
    ? `${next.emoji} ${next.label} — nog ${fmtN(Math.ceil((next.m-altM)/BILL_M))} klikken`
    : '🌌 Voorbij alle mijlpalen!';
  document.getElementById('bnum').textContent = fmtN(totalBills);

  // Milestone check
  for(const obj of OBJECTS){
    if(obj.m > 0 && altM >= obj.m && !shownMS.has(obj.label)){
      shownMS.add(obj.label);
      localStorage.setItem('md6_m', JSON.stringify([...shownMS]));
      showBanner(obj);
      break;
    }
  }
}

function updateScoreboard(){
  const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const list = document.getElementById('sl');
  list.innerHTML = '';
  for(const [name,clicks] of sorted){
    const row = document.createElement('div');
    row.className = 'sr'+(name===myName?' me':'');
    row.innerHTML = `<span class="sn">${name}</span><span class="sv">${fmtN(clicks)}</span>`;
    list.appendChild(row);
  }
}

// ═══════════════════════════════
// CLICK
// ═══════════════════════════════
function doClick(){
  myClicks++; 
  spawnBill();
  billsRef.transaction(v => (v||0)+1);
  scoresRef.child(myName.replace(/[.#$\[\]]/g,'_')).transaction(v=>(v||0)+1);
}
document.getElementById('cbtn').addEventListener('click', doClick);

function spawnBill(){
  const btn = document.getElementById('cbtn');
  const r   = btn.getBoundingClientRect();
  const el  = document.createElement('div');
  el.className = 'fb'; el.textContent = '💵';
  el.style.left = (r.left+r.width/2-10+(Math.random()-.5)*22)+'px';
  el.style.top  = (r.top-8)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 850);
}

// ═══════════════════════════════
// NAME
// ═══════════════════════════════
const ni = document.getElementById('ni');
ni.value = myName;
ni.addEventListener('change', ()=>{
  const v = ni.value.trim();
  if(!v) return;
  myName = v;
  localStorage.setItem('md6_n', myName);
  scoresRef.child(deviceId).update({name: myName});
});

const db        = firebase.database();
const billsRef  = db.ref('totalBills');
const scoresRef = db.ref('scores');

// Online aanwezigheid
myRef.set(true);
myRef.onDisconnect().remove();
onlineRef.on('value', snap=>{
  document.getElementById('online').textContent = `● ${snap.numChildren()} online`;
});

// Realtime teller — Firebase is de enige bron van waarheid
billsRef.on('value', snap=>{
  const val = snap.val() || 0;
  totalBills = val;
});

// Scores — opgeslagen als {deviceId: {name, clicks}}
scoresRef.on('value', snap=>{
  scores = {};
  snap.forEach(child=>{
    const rec = child.val();
    if(!rec) return;
    const did   = child.key;
    const name  = rec.name  || 'Onbekend';
    const clicks= rec.clicks|| 0;
    if(did === deviceId){
      myClicks = clicks;
      myName   = rec.name || myName; 
      document.getElementById('ni').value = myName;
    }
    scores[name] = (scores[name]||0) + clicks;
  });
  updateScoreboard();
});

// ═══════════════════════════════
// RENDER LOOP
// ═══════════════════════════════
function loop(){
  requestAnimationFrame(loop);
  displayBills += (totalBills - displayBills) * 0.1;
  const b = Math.round(displayBills);
  ctx.clearRect(0, 0, W, H);
  drawSky(b * BILL_M);
  drawGround(b * BILL_M);
  drawObjects(b);
  drawStack(displayBills);
  updateHUD();
}

updateHUD();
updateScoreboard();
loop();
</script>
