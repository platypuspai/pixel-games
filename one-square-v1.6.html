<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>One Square v1.6</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  overflow: hidden; background: #111; font-family: monospace;
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
}
#top-bar {
  width: 200px; height: 20px; background: #1a1a1a;
  display: flex; align-items: center; padding: 0 6px;
  border-bottom: 1px solid #333; position: relative;
  flex-shrink: 0;
}
#game-title {
  font-size: 8px; font-weight: bold; color: #666; flex: 1; letter-spacing: 1px;
}
#mode-badge {
  font-size: 7px; color: #888; margin-right: 6px;
}
#btn-settings {
  font-size: 9px; background: none; border: none; color: #aaa;
  cursor: pointer; padding: 0 2px; line-height: 1;
}
#btn-settings:hover { color: #fff; }

/* Settings panel */
#settings-panel {
  position: absolute; top: 20px; right: 0; width: 180px;
  background: #1c1c1c; border: 1px solid #383838; border-top: none;
  border-radius: 0 0 6px 6px; z-index: 50; padding: 8px;
  display: flex; flex-direction: column; gap: 6px;
}
#settings-panel.hidden { display: none; }
.settings-sep {
  border: none; border-top: 1px solid #2e2e2e; margin: 2px 0;
}
.s-btn {
  font-size: 8px; padding: 3px 0; cursor: pointer; border-radius: 3px;
  border: 1px solid; font-family: monospace; width: 100%; text-align: center;
}
.s-btn-mp   { background:#1a3a1a; border-color:#2a6a2a; color:#6f6; }
.s-btn-mp:hover { background:#254a25; }
.s-btn-mp.in-mp { background:#1a1a4a; border-color:#2a2a9a; color:#88f; }
.s-btn-reset { background:#3a1a1a; border-color:#7a3a3a; color:#f88; }
.s-btn-reset:hover { background:#4a2a2a; }
.s-btn-home  { background:#1a2a3a; border-color:#2a5a8a; color:#8af; }
.s-btn-home:hover { background:#253545; }
.s-btn-fs    { background:#1a1a2a; border-color:#4a4a8a; color:#aaf; }
.s-btn-fs:hover { background:#25253a; }
#mp-status { font-size: 7px; color: #5a5; text-align:center; }
#mp-status.hidden { display: none; }
canvas { display: block; image-rendering: pixelated; }
:fullscreen #top-bar { width: 100vw; }
:fullscreen canvas { width: 100vw !important; height: calc(100vh - 20px) !important; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="top-bar">
  <span id="game-title">ONE SQUARE</span>
  <span id="mode-badge">🎮 SP</span>
  <button id="btn-settings" title="Settings">⚙</button>
  <div id="settings-panel" class="hidden">
    <button class="s-btn s-btn-mp" id="btn-toggle-mp">🌐 Go to Multiplayer</button>
    <div id="mp-status" class="hidden"></div>
    <hr class="settings-sep">
    <button class="s-btn s-btn-reset" id="btn-reset">🗑 Reset singleplayer world</button>
    <hr class="settings-sep">
    <button class="s-btn s-btn-home" id="btn-home">🏠 Go to website</button>
    <button class="s-btn s-btn-fs" id="btn-fs">⛶ Fullscreen</button>
  </div>
</div>
<canvas id="game" width="200" height="200"></canvas>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ═══════════════════════════════════════════════════════
//  TAAL SYSTEEM
// ═══════════════════════════════════════════════════════
function getLanguageFromStorage() {
  let lang = localStorage.getItem("app_lang");
  if (lang) lang = lang.toLowerCase().trim();
  if (["nl", "en", "fr"].includes(lang)) {
    return lang;
  }
  return "en";
}

let currentLang = getLanguageFromStorage();

const TRANSLATIONS = {
  nl: {
    toMultiplayer: "🌐 Ga naar Multiplayer",
    toSingleplayer: "🏠 Ga naar Singleplayer",
    resetWorld: "🗑 Reset singleplayer wereld",
    goToWebsite: "🏠 Ga naar website",
    fullscreen: "⛶ Volledig scherm",
    exitFullscreen: "✕ Verlaat volledig scherm"
  },
  en: {
    toMultiplayer: "🌐 Go to Multiplayer",
    toSingleplayer: "🏠 Go to Singleplayer",
    resetWorld: "🗑 Reset singleplayer world",
    goToWebsite: "🏠 Go to website",
    fullscreen: "⛶ Fullscreen",
    exitFullscreen: "✕ Exit fullscreen"
  },
  fr: {
    toMultiplayer: "🌐 Mode Multijoueur",
    toSingleplayer: "🏠 Mode Solo",
    resetWorld: "🗑 Réinitialiser le monde",
    goToWebsite: "🏠 Aller au site web",
    fullscreen: "⛶ Plein écran",
    exitFullscreen: "✕ Quitter plein écran"
  }
};

function t(key) {
  return TRANSLATIONS[currentLang][key] || key;
}

function updateTexts() {
  document.getElementById("btn-toggle-mp").textContent = isMultiplayer ? t("toSingleplayer") : t("toMultiplayer");
  document.getElementById("btn-reset").textContent = t("resetWorld");
  document.getElementById("btn-home").textContent = t("goToWebsite");
  document.getElementById("btn-fs").textContent = document.fullscreenElement ? t("exitFullscreen") : t("fullscreen");
}

window.addEventListener("storage", (e) => {
  if (e.key === "app_lang" || e.key === "pg_player_name") {
    currentLang = getLanguageFromStorage();
    updateTexts();
  }
});

window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "changeLang" && e.data.lang) {
    if (["nl", "en", "fr"].includes(e.data.lang)) {
      currentLang = e.data.lang;
      updateTexts();
    }
  }
});

// ═══════════════════════════════════════════════════════
//  FIREBASE CONFIG & TEXTUREN
// ═══════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyA9wKFVXmT6kUpuaBgwlPilF86LaKKDYFU",
  authDomain:        "money-digger-9b05e.firebaseapp.com",
  databaseURL:       "https://money-digger-9b05e-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "money-digger-9b05e",
  storageBucket:     "money-digger-9b05e.appspot.com",
  messagingSenderId: "883506536944",
  appId:             "1:883506536944:web:921b342dff76154fcbbd35"
};

// Voeg hieronder je base64 PNG data toe indien gewenst
window._imgSrcs = {
  'dirt.png':    '',
  'grass.png':   ''
};

let isMultiplayer = false;
// Rest van de game logica komt hier...
// ═══════════════════════════════════════════════════════
//  ASSET LOADER & TEXTURES
// ═══════════════════════════════════════════════════════
const images = {};
let imagesLoaded = 0;
let totalImages = Object.keys(window._imgSrcs).length;

function loadImages(callback) {
  if (totalImages === 0) {
    callback();
    return;
  }
  
  for (let key in window._imgSrcs) {
    const img = new Image();
    img.onload = () => {
      images[key] = img;
      imagesLoaded++;
      if (imagesLoaded === totalImages) {
        callback();
      }
    };
    img.onerror = () => {
      // Fallback als een afbeelding ontbreekt of leeg is
      console.warn(`Kon afbeelding ${key} niet laden.`);
      imagesLoaded++;
      if (imagesLoaded === totalImages) {
        callback();
      }
    };
    img.src = window._imgSrcs[key];
  }
}

// Spelersinstellingen en variabelen
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
  x: 100,
  y: 100,
  size: 16,
  speed: 2
};

// Besturing
const keys = {};
window.addEventListener("keydown", (e) => { keys[e.key] = true; });
window.addEventListener("keyup", (e) => { keys[e.key] = false; });
// ═══════════════════════════════════════════════════════
//  WERELD & GRID LOGICA
// ═══════════════════════════════════════════════════════
const WORLD_SIZE = 20; // Aantal blokken breed en hoog
const tileSize = 10;
let world = [];

function initWorld() {
  world = [];
  for (let y = 0; y < WORLD_SIZE; y++) {
    let row = [];
    for (let x = 0; x < WORLD_SIZE; x++) {
      // Eenvoudige generatie: onderste rijen zijn aarde/gras (1), bovenste is leeg (0)
      if (y > 10) {
        row.push(1); // 1 = blok aanwezig
      } else {
        row.push(0); // 0 = lucht
      }
    }
    world.push(row);
  }
}

// Start de wereld direct op
initWorld();
// ═══════════════════════════════════════════════════════
//  GAME LOOP & RENDER LOGICA
// ═══════════════════════════════════════════════════════
function update() {
  // Speler beweging op basis van toetsen
  if (keys["ArrowLeft"] || keys["a"]) player.x -= player.speed;
  if (keys["ArrowRight"] || keys["d"]) player.x += player.speed;
  if (keys["ArrowUp"] || keys["w"]) player.y -= player.speed;
  if (keys["ArrowDown"] || keys["s"]) player.y += player.speed;

  // Houd de speler binnen het canvas
  player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));
}

function render() {
  // Scherm leegmaken
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Wereld/blokken tekenen
  for (let y = 0; y < world.length; y++) {
    for (let x = 0; x < world[y].length; x++) {
      if (world[y][x] === 1) {
        // Als er een afbeelding is voor gras/dirt, teken die; anders een standaardkleur
        if (images['dirt.png']) {
          ctx.drawImage(images['dirt.png'], x * tileSize, y * tileSize, tileSize, tileSize);
        } else {
          ctx.fillStyle = "#5c4033"; // Fallbackkleur voor aarde
          ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
        }
      }
    }
  }

  // Speler tekenen (rood vierkantje)
  ctx.fillStyle = "#ff0055";
  ctx.fillRect(player.x, player.y, player.size, player.size);
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}
// ═══════════════════════════════════════════════════════
//  MUISBESTURING & UI KOPPELINGEN
// ═══════════════════════════════════════════════════════

// Muisklikken om blokken te breken of plaatsen
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  const gridX = Math.floor(mouseX / tileSize);
  const gridY = Math.floor(mouseY / tileSize);

  if (gridX >= 0 && gridX < WORLD_SIZE && gridY >= 0 && gridY < WORLD_SIZE) {
    // Schakel blok om: als er al een blok is (1), haal weg (0); anders zet neer (1)
    world[gridY][gridX] = world[gridY][gridX] === 1 ? 0 : 1;
  }
});

// UI Koppelingslogica voor de instellingenbalk
const settingsPanel = document.getElementById("settings-panel");
const btnSettings = document.getElementById("btn-settings");
const btnToggleMp = document.getElementById("btn-toggle-mp");
const btnReset = document.getElementById("btn-reset");
const btnHome = document.getElementById("btn-home");
const btnFs = document.getElementById("btn-fs");
const modeBadge = document.getElementById("mode-badge");

btnSettings.addEventListener("click", () => {
  settingsPanel.classList.toggle("hidden");
});

// Volledig scherm knop
btnFs.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch((err) => {
      console.error("Kon volledig scherm niet starten:", err);
    });
  } else {
    document.exitFullscreen();
  }
});

document.addEventListener("fullscreenchange", () => {
  updateTexts();
});

// Reset wereld knop
btnReset.addEventListener("click", () => {
  initWorld();
  settingsPanel.classList.add("hidden");
});

// Ga naar website knop (pas de URL hieronder aan naar wens)
btnHome.addEventListener("click", () => {
  window.location.href = "https://example.com";
});

// Multiplayer knop toggle (basis setup)
btnToggleMp.addEventListener("click", () => {
  isMultiplayer = !isMultiplayer;
  if (isMultiplayer) {
    modeBadge.textContent = "🌐 MP";
    btnToggleMp.classList.add("in-mp");
  } else {
    modeBadge.textContent = "🎮 SP";
    btnToggleMp.classList.remove("in-mp");
  }
  updateTexts();
  settingsPanel.classList.add("hidden");
});

// ═══════════════════════════════════════════════════════
//  START HET SPEL
// ═══════════════════════════════════════════════════════
loadImages(() => {
  updateTexts();
  gameLoop();
});
</script>
</body>
</html>
