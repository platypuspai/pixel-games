<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>One Square v1.6</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  overflow: hidden; background: #111; font-family: monospace;
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
}
#top-bar {
  width: 720px; height: 20px; background: #1a1a1a;
  display: flex; align-items: center; padding: 0 6px;
  border-bottom: 1px solid #333; position: relative;
  flex-shrink: 0;
}
#game-title {
  font-size: 8px; font-weight: bold; color: #666; flex: 1; letter-spacing: 1px;
}
#mode-badge {
  font-size: 7px; color: #888; margin-right: 6px;
}
#btn-settings {
  font-size: 9px; background: none; border: none; color: #aaa;
  cursor: pointer; padding: 0 2px; line-height: 1;
}
#btn-settings:hover { color: #fff; }

/* Settings panel */
#settings-panel {
  position: absolute; top: 20px; right: 0; width: 180px;
  background: #1c1c1c; border: 1px solid #383838; border-top: none;
  border-radius: 0 0 6px 6px; z-index: 50; padding: 8px;
  display: flex; flex-direction: column; gap: 6px;
}
#settings-panel.hidden { display: none; }
.settings-row {
  display: flex; gap: 4px; align-items: center;
}
.settings-row label {
  font-size: 7px; color: #777; width: 52px; flex-shrink: 0;
}
.settings-row input[type=text] {
  flex: 1; background: #2a2a2a; border: 1px solid #444; border-radius: 2px;
  color: #eee; font-family: monospace; font-size: 8px; padding: 2px 4px; outline: none;
}
.settings-row input[type=text]:focus { border-color: #777; }
.settings-sep {
  border: none; border-top: 1px solid #2e2e2e; margin: 2px 0;
}
.s-btn {
  font-size: 8px; padding: 3px 0; cursor: pointer; border-radius: 3px;
  border: 1px solid; font-family: monospace; width: 100%; text-align: center;
}
.s-btn-mp   { background:#1a3a1a; border-color:#2a6a2a; color:#6f6; }
.s-btn-mp:hover { background:#254a25; }
.s-btn-mp.in-mp { background:#1a1a4a; border-color:#2a2a9a; color:#88f; }
.s-btn-reset { background:#3a1a1a; border-color:#7a3a3a; color:#f88; }
.s-btn-reset:hover { background:#4a2a2a; }
.s-btn-name  { background:#2a2a1a; border-color:#6a6a2a; color:#ff8; }
.s-btn-name:hover { background:#3a3a1a; }
.s-btn-home  { background:#1a2a3a; border-color:#2a5a8a; color:#8af; }
.s-btn-home:hover { background:#253545; }
.s-btn-fs    { background:#1a1a2a; border-color:#4a4a8a; color:#aaf; }
.s-btn-fs:hover { background:#25253a; }
#mp-status { font-size: 7px; color: #5a5; text-align:center; }
canvas { display: block; image-rendering: pixelated; }
#game { width: 720px; height: 400px; }
:fullscreen #top-bar { width: 100vw; }
:fullscreen canvas { width: 100vw !important; height: calc(100vh - 20px) !important; image-rendering: pixelated; }
#name-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
#name-modal.hidden { display: none; }
#name-box {
  background: #1a1a1a; border: 1px solid #444; border-radius: 6px;
  padding: 18px 22px; display: flex; flex-direction: column; gap: 10px;
  font-family: monospace; color: #eee; text-align: center;
}
#name-box h2 { font-size: 13px; color: #aaa; letter-spacing: 1px; }
#name-box input {
  background: #2a2a2a; border: 1px solid #555; border-radius: 3px;
  color: #fff; font-family: monospace; font-size: 12px;
  padding: 5px 8px; outline: none; text-align: center;
}
#name-box input:focus { border-color: #888; }
#name-box button {
  background: #2a4a2a; border: 1px solid #3a7a3a; border-radius: 3px;
  color: #6f6; font-family: monospace; font-size: 11px;
  padding: 5px 0; cursor: pointer;
}
#name-box button:hover { background: #3a5a3a; }

#btn-chat{font:10px monospace;background:none;border:0;color:#aaa;cursor:pointer;padding:0 3px}#btn-chat:hover{color:#fff}
#chat-panel{position:absolute;left:5px;top:24px;width: min(270px, calc(100% - 10px));height:150px;z-index:80;background:rgba(10,12,16,.62);border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#fff;display:flex;flex-direction:column;padding:6px;backdrop-filter:blur(2px);font:10px monospace}
#chat-panel.hidden{display:none}#chat-messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}#chat-form{display:flex;gap:4px;margin-top:5px}#chat-input{min-width:0;flex:1;background:rgba(0,0,0,.55);color:#fff;border:1px solid #777;padding:4px;font:10px monospace}#chat-form button{background:#333;color:#fff;border:1px solid #666;padding:3px 7px;font:10px monospace}#magma-warning{position:absolute;inset:20px 0 24px;pointer-events:none;z-index:30;box-shadow:inset 0 0 24px rgba(255,25,0,.0)}

#plixo-login{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
#plixo-login.hidden{display:none}
#plixo-login-card{width:min(340px,calc(100% - 24px));display:flex;flex-direction:column;gap:10px;padding:22px;background:#1a1a1a;border:1px solid #444;border-radius:8px;color:#eee;text-align:center;font-family:monospace}
#plixo-login-card h2{font-size:16px;color:#ff6666;letter-spacing:1px}
#plixo-login-card p{font-size:11px;color:#aaa;line-height:1.5}
#plixo-login-card input{width:100%;background:#2a2a2a;border:1px solid #555;border-radius:3px;color:#fff;font:12px monospace;padding:9px 8px;text-align:center;outline:none}
#plixo-login-card input:focus{border-color:#999}
#plixo-login-card button{background:#2a4a2a;border:1px solid #3a7a3a;border-radius:3px;color:#6f6;font:12px monospace;padding:9px;cursor:pointer}
#plixo-login-card button:disabled{opacity:.6;cursor:wait}
#plixo-login-card a{color:#8af;font-size:10px;line-height:1.5}
#plixo-login-error{min-height:18px;color:#ff8888;font-size:10px;line-height:1.4}

</style>
</head>
<body>
<div id="top-bar">
  <span id="game-title">ONE SQUARE</span>
  <span id="mode-badge">🎮 SP</span>
  <button id="btn-chat" title="Toggle chat" aria-label="Toggle chat">▤</button>
  <section id="chat-panel" class="hidden" aria-label="Chat"><div id="chat-messages"></div><form id="chat-form"><input id="chat-input" maxlength="180" autocomplete="off" placeholder="Type a message..."><button type="submit">Send</button></form></section>
  <button id="btn-settings" title="Settings">⚙</button>
  <div id="settings-panel" class="hidden">
    <div class="settings-row">
      <label>Name</label>
      <input id="settings-name" type="text" maxlength="12" placeholder="your name..." />
    </div>
    <button class="s-btn s-btn-name" id="btn-save-name">Save name</button>
    <button class="s-btn s-btn-name" id="btn-change-account">🔑 Change PLIXO account</button>
    <hr class="settings-sep">
    <button class="s-btn s-btn-mp" id="btn-toggle-mp">🌐 Go to Multiplayer</button>
    <div id="mp-status" class="hidden"></div>
    <hr class="settings-sep">
    <button class="s-btn s-btn-reset" id="btn-reset">🗑 Reset singleplayer world</button>
    <hr class="settings-sep">
    <button class="s-btn s-btn-home" id="btn-home">🏠 Go to website</button>
    <button class="s-btn s-btn-fs" id="btn-fs">⛶ Fullscreen</button>
  </div>
</div>
<div id="magma-warning"></div>
<canvas id="game" width="720" height="400"></canvas>
<div id="plixo-login">
  <div id="plixo-login-card">
    <h2>ONE SQUARE</h2>
    <p>Log in with your PLIXO Arcade account</p>
    <input id="plixo-account-code" type="text" maxlength="20" placeholder="20-CHARACTER ACCOUNT CODE" autocomplete="off" spellcheck="false" />
    <button id="plixo-login-button">LOG IN &amp; PLAY</button>
    <a href="https://platypuspai.github.io/pixel-games/leaderboard.html" target="_blank" rel="noopener noreferrer">Need a PLIXO account? Open the leaderboard</a>
    <div id="plixo-login-error" role="alert"></div>
  </div>
</div>

const _origImage = window.Image;
window.Image = function(...args) {
  const img = new _origImage(...args);
  const origSrcDesc = Object.getOwnPropertyDescriptor(_origImage.prototype, 'src');
  Object.defineProperty(img, 'src', {
    set(val) {
      const key = val.split('/').pop().split('?')[0];
      origSrcDesc.set.call(img, window._imgSrcs[key] || val);
    },
    get() { return origSrcDesc.get.call(img); }
  });
  return img;
};

const selectedSkinImage = new _origImage();
let selectedSkinReady = false;
let fbSkinsRef = null;

function refreshSelectedSkinImage() {
  const dataUrl = localStorage.getItem("plixo_skin_image");
  selectedSkinReady = false;

  if (dataUrl) {
    selectedSkinImage.onload = () => { selectedSkinReady = true; };
    selectedSkinImage.onerror = () => { selectedSkinReady = false; };
    selectedSkinImage.src = dataUrl;
  }

  // Keep the current skin in Firebase; remove a stale remote copy when no image exists.
  if (fbSkinsRef && myPlayerId && isMultiplayer) {
    const skinRef = fbSkinsRef.child(myPlayerId);
    if (dataUrl && /^data:image\//.test(dataUrl)) {
      skinRef.set(dataUrl).catch(e => console.warn("Skin sync failed", e));
    } else {
      skinRef.remove().catch(e => console.warn("Skin cleanup failed", e));
    }
  }
}
refreshSelectedSkinImage();
window.addEventListener("storage", e => {
  if (e.key === "plixo_skin_image" || e.key === "plixo_selected_skin") refreshSelectedSkinImage();
});
window.addEventListener("pageshow", refreshSelectedSkinImage);
window.addEventListener("focus", refreshSelectedSkinImage);

function loadSPWorld() {
  try {
    const raw = localStorage.getItem("onesquare_sp_world_" + myPlayerId);
    if (raw) {
      const saved = JSON.parse(raw);
      if (Array.isArray(saved)) {
        // Keep existing blocks while adapting saves from the wider v1.8.0 build.
        return Array.from({length: WORLD_H}, (_, row) =>
          Array.from({length: WORLD_W}, (_, col) =>
            Array.isArray(saved[row]) ? (saved[row][col] || null) : null
          )
        );
      }
    }
  } catch(e) {}
  return Array.from({length: WORLD_H}, () => Array(WORLD_W).fill(null));
}

function readLocalJSON(key, fallback = {}) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function recordOneSquareProgress(ids) {
  const idList = Array.isArray(ids) ? ids : [ids];
  const globalProgress = readLocalJSON("plixo_mission_progress", {});
  const today = new Date().toDateString();
  const dailyKey = "plixo_daily_progress_" + today;
  const dailyProgress = readLocalJSON(dailyKey, {});

  for (const id of idList) {
    globalProgress[id] = (Number(globalProgress[id]) || 0) + 1;
    dailyProgress[id] = (Number(dailyProgress[id]) || 0) + 1;
  }

  try {
    localStorage.setItem("plixo_mission_progress", JSON.stringify(globalProgress));
    localStorage.setItem(dailyKey, JSON.stringify(dailyProgress));
  } catch (e) {}

  syncOneSquareProgressToFirebase(globalProgress, today, dailyProgress);
}

function syncOneSquareProgressToFirebase(globalProgress, today, dailyProgress) {
  const candidates = [localStorage.getItem("pg_account_code"), localStorage.getItem("pg_player_id"), localStorage.getItem("plixo_sync_code")];
  const code = candidates.map(value => String(value || "").trim().toUpperCase()).find(value => /^(?:[A-HJ-NP-Z2-9]{20}|[0-9]{20})$/.test(value));
  if (!code) return;

  initFirebase();
  if (!db) return;

  const dailyClaimed = readLocalJSON("plixo_daily_claimed_" + today, {});
  const dailyBonus = localStorage.getItem("plixo_daily_bonus_date") || "";
  const userRef = db.ref("plixo_users/" + code);

  userRef.transaction(current => {
    current = current || {};
    const mergedMissionProgress = current.mission_progress || {};
    for (const id of Object.keys(globalProgress)) {
      mergedMissionProgress[id] = Math.max(Number(mergedMissionProgress[id]) || 0, Number(globalProgress[id]) || 0);
    }
    current.mission_progress = mergedMissionProgress;

    const remoteDaily = current.daily || {};
    let mergedDailyProgress;
    let mergedDailyClaimed;
    if (remoteDaily.date === today) {
      mergedDailyProgress = { ...(remoteDaily.progress || {}) };
      for (const id of Object.keys(dailyProgress)) {
        mergedDailyProgress[id] = Math.max(Number(mergedDailyProgress[id]) || 0, Number(dailyProgress[id]) || 0);
      }
      mergedDailyClaimed = { ...(remoteDaily.claimed || {}), ...dailyClaimed };
    } else {
      mergedDailyProgress = { ...dailyProgress };
      mergedDailyClaimed = { ...dailyClaimed };
    }

    current.daily = {
      date: today,
      progress: mergedDailyProgress,
      claimed: mergedDailyClaimed,
      bonus: dailyBonus || (remoteDaily.date === today ? remoteDaily.bonus : "") || ""
    };
    return current;
  }).catch(e => console.warn("One Square PLIXO progress sync failed", e));
}

//  PLAYER CLASS

class Player {
  constructor(x,y,color="red") {
    this.px=x*BLOCK_SIZE; this.py=y*BLOCK_SIZE;
    this.w=18; this.h=26; 
    this.vx=0; this.vy=0;
    this.onGround=false; this.color=color;
  }
  isBlockSolid(bx,by) {
    if(bx<0||bx>=WORLD_W) return true;
    if(by>=WORLD_H) return true;
    if(by<0) return false;
    if(bx===ONE_BLOCK_X&&by===ONE_BLOCK_Y) return true;
    const id=world[by][bx];
    if(!id) return false;
    const bt=getBlockType(id);
    if(bt&&bt.isLadder) return false;
    return true;
  }
  isOnLadder() {
    const left=Math.floor(this.px/BLOCK_SIZE);
    const right=Math.floor((this.px+this.w-0.01)/BLOCK_SIZE);
    const top=Math.floor(this.py/BLOCK_SIZE);
    const bot=Math.floor((this.py+this.h-0.01)/BLOCK_SIZE);
    for(let by=top;by<=bot;by++) for(let bx=left;bx<=right;bx++) {
      if(by<0||by>=WORLD_H||bx<0||bx>=WORLD_W) continue;
      const id=world[by][bx];
      if(id){const bt=getBlockType(id);if(bt&&bt.isLadder)return true;}
    }
    return false;
  }
  update(keys) {
    const onLadder=this.isOnLadder();
    this.vx=0;
    if(keys["ArrowLeft"]) this.vx=-MOVE_SPEED;
    if(keys["ArrowRight"]) this.vx=MOVE_SPEED;
    if(onLadder) {
      if(keys["ArrowUp"]) this.vy=-LADDER_SPEED;
      else this.vy=LADDER_SINK;
      this.onGround=false;
    } else {
      if((keys["ArrowUp"]||keys[" "])&&this.onGround){this.vy=JUMP_FORCE;this.onGround=false;}
      this.vy+=GRAVITY;
    }
    this.px+=this.vx;
    const left=Math.floor(this.px/BLOCK_SIZE);
    const right=Math.floor((this.px+this.w-0.01)/BLOCK_SIZE);
    const top=Math.floor(this.py/BLOCK_SIZE);
    const bot=Math.floor((this.py+this.h-0.01)/BLOCK_SIZE);
    if(this.vx>0&&(this.isBlockSolid(right,top)||this.isBlockSolid(right,bot))) this.px=right*BLOCK_SIZE-this.w-0.01;
    if(this.vx<0&&(this.isBlockSolid(left,top)||this.isBlockSolid(left,bot))) this.px=(left+1)*BLOCK_SIZE;
    this.py+=this.vy;
    const left2=Math.floor(this.px/BLOCK_SIZE);
    const right2=Math.floor((this.px+this.w-0.01)/BLOCK_SIZE);
    const top2=Math.floor(this.py/BLOCK_SIZE);
    const bot2=Math.floor((this.py+this.h-0.01)/BLOCK_SIZE);
    if(!onLadder) {
      if(this.vy>0&&(this.isBlockSolid(left2,bot2)||this.isBlockSolid(right2,bot2))){this.py=bot2*BLOCK_SIZE-this.h;this.vy=0;this.onGround=true;}
      else if(this.vy<0||(!this.isBlockSolid(left2,bot2+1)&&!this.isBlockSolid(right2,bot2+1))) this.onGround=false;
      if(this.vy<0&&(this.isBlockSolid(left2,top2)||this.isBlockSolid(right2,top2))){this.py=(top2+1)*BLOCK_SIZE;this.vy=0;}
    } else {
      if(this.vy<0&&(this.isBlockSolid(left2,top2)||this.isBlockSolid(right2,top2))){this.py=(top2+1)*BLOCK_SIZE;this.vy=0;}
      if(this.vy>0&&(this.isBlockSolid(left2,bot2)||this.isBlockSolid(right2,bot2))){this.py=bot2*BLOCK_SIZE-this.h;this.vy=0;this.onGround=true;}
    }
    if(this.py+this.h>=FLOOR_Y){this.py=FLOOR_Y-this.h;this.vy=0;this.onGround=true;}
    if(this.py<0){this.py=0;this.vy=0;} 
    
    // Camera verandert alleen de weergave; spelerposities blijven wereldcoördinaten.
    updateCameraToPlayer();
  }
  draw(label, useSelectedSkin = false) {
    const sx=Math.round(this.px-camX);
    const sy=Math.round(this.py-camY);
    
    if (useSelectedSkin && localStorage.getItem("plixo_selected_skin") === "rainbow_spiral") {
      // Animated reward skin drawn directly at the current sprite size; no hitbox changes.
      ctx.save();
      ctx.beginPath(); ctx.rect(sx, sy, this.w, this.h); ctx.clip();
      ctx.fillStyle = "#080812"; ctx.fillRect(sx, sy, this.w, this.h);
      const tNow = performance.now() / 1000;
      const phase = tNow * 2.4;
      ctx.shadowBlur = 3;
      for (let t = 0; t < Math.PI * 10; t += 0.12) {
        const radius = 0.25 + t * 0.34;
        const px = sx + this.w / 2 + Math.cos(t + phase) * radius * 0.53;
        const py = sy + this.h / 2 + Math.sin(t + phase) * radius * 0.92;
        const hue = (t * 42 + tNow * 115) % 360;
        ctx.fillStyle = `hsl(${hue},100%,62%)`;
        ctx.shadowColor = `hsl(${hue},100%,62%)`;
        ctx.fillRect(Math.round(px), Math.round(py), 1.35, 1.35);
      }
      ctx.restore();
    } else if (useSelectedSkin && selectedSkinReady) {
      const wasSmoothingEnabled = ctx.imageSmoothingEnabled;
      ctx.imageSmoothingEnabled = false;
      // The source PNG remains untouched; its one-pixel transparent border sits outside the hitbox.
      ctx.drawImage(selectedSkinImage, sx - 1, sy - 1, 20, 28);
      ctx.imageSmoothingEnabled = wasSmoothingEnabled;
    } else {
      ctx.fillStyle=this.color;
      ctx.fillRect(sx,sy,this.w,this.h);
    }
    
    if(label) {
      ctx.fillStyle="rgba(0,0,0,0.6)";
      ctx.font="10px monospace";
      const tw=ctx.measureText(label).width;
      ctx.fillRect(sx+this.w/2-tw/2-2,sy-16,tw+4,14);
      ctx.fillStyle="#fff";
      ctx.fillText(label,sx+this.w/2-tw/2,sy-4);
    }
  }
}

let camX=0;
let camY=0;

function updateCameraToPlayer() {
  const maxCamX = Math.max(0, WORLD_W * BLOCK_SIZE - CANVAS_W);
  const wantedX = player.px - CANVAS_W / 2 + player.w / 2;
  camX = Math.max(0, Math.min(maxCamX, wantedX));
  const maxCamY = Math.max(0, WORLD_H * BLOCK_SIZE - VIEW_H);
  const wantedY = player.py - VIEW_H / 2 + player.h / 2;
  camY = Math.max(0, Math.min(maxCamY, wantedY));
}

// Absolute world coordinates only: camX must never affect spawn selection.
function isPlayerRectClear(px, py) {
  if (!Number.isFinite(px) || !Number.isFinite(py)) return false;
  if (px < 0 || py < 0 || px + player.w > WORLD_W * BLOCK_SIZE ||
      py + player.h > FLOOR_Y) return false;

  const left = Math.floor(px / BLOCK_SIZE);
  const right = Math.floor((px + player.w - 0.01) / BLOCK_SIZE);
  const top = Math.floor(py / BLOCK_SIZE);
  const bottom = Math.floor((py + player.h - 0.01) / BLOCK_SIZE);

  for (let by = top; by <= bottom; by++) {
    for (let bx = left; bx <= right; bx++) {
      if (player.isBlockSolid(bx, by)) return false;
    }
  }
  return true;
}

function spawnOverlapsRemotePlayer(px, py) {
  const now = Date.now();
  for (const id in remotePlayers) {
    const rp = remotePlayers[id];
    if (!rp || !Number.isFinite(Number(rp.px)) || !Number.isFinite(Number(rp.py))) continue;
    if (now - (Number(rp.t) || 0) > 15000) continue;

    const rx = Number(rp.px), ry = Number(rp.py);
    if (px < rx + player.w && px + player.w > rx &&
        py < ry + player.h && py + player.h > ry) return true;
  }
  return false;
}

function findSafeSpawnPosition() {
  const targetX = ONE_BLOCK_X * BLOCK_SIZE;
  const targetY = ONE_BLOCK_Y * BLOCK_SIZE - player.h;
  const xPositions = Array.from(
    { length: WORLD_W },
    (_, bx) => bx * BLOCK_SIZE + (BLOCK_SIZE - player.w) / 2
  );

  // Prefer a solid, free landing surface; first avoid existing players too.
  function bestSupportedPosition(avoidOtherPlayers) {
    let best = null;
    let bestScore = Infinity;

    function consider(px, py) {
      if (!isPlayerRectClear(px, py)) return;
      if (avoidOtherPlayers && spawnOverlapsRemotePlayer(px, py)) return;
      const dx = px - targetX;
      const dy = py - targetY;
      const score = dx * dx + dy * dy;
      if (score < bestScore) {
        bestScore = score;
        best = { x: px, y: py, supported: true };
      }
    }

    // Virtual floor is also a valid support surface if the player body is clear.
    const floorY = FLOOR_Y - player.h;
    for (const px of xPositions) consider(px, floorY);

    const lastVisibleRow = Math.min(WORLD_H - 1, Math.floor((FLOOR_Y - 1) / BLOCK_SIZE));
    for (let by = 1; by <= lastVisibleRow; by++) {
      const py = by * BLOCK_SIZE - player.h;
      if (py < 0 || py + player.h > FLOOR_Y) continue;
      for (let bx = 0; bx < WORLD_W; bx++) {
        if (!player.isBlockSolid(bx, by)) continue; // ladders aren't solid
        consider(xPositions[bx], py);
      }
    }
    return best;
  }

  let best = bestSupportedPosition(true);
  if (best) return best;
  best = bestSupportedPosition(false);
  if (best) return best;

  // If no supported position exists, choose clear air and let gravity settle
  // the player; this fallback still forbids spawning inside any solid block.
  function bestClearAirPosition(avoidOtherPlayers) {
    let bestAir = null;
    let bestScore = Infinity;
    const maxY = Math.max(0, FLOOR_Y - player.h);
    for (let py = 0; py <= maxY; py += 4) {
      for (const px of xPositions) {
        if (!isPlayerRectClear(px, py)) continue;
        if (avoidOtherPlayers && spawnOverlapsRemotePlayer(px, py)) continue;
        const dx = px - targetX;
        const dy = py - targetY;
        const score = dx * dx + dy * dy;
        if (score < bestScore) {
          bestScore = score;
          bestAir = { x: px, y: py, supported: false };
        }
      }
    }
    return bestAir;
  }

  return bestClearAirPosition(true) || bestClearAirPosition(false) || null;
}

function spawnPlayer(useSafeMultiplayerSpawn = false) {
  let spawnX = ONE_BLOCK_X * BLOCK_SIZE;
  let spawnY = ONE_BLOCK_Y * BLOCK_SIZE - player.h;
  let foundSafeSpawn = null;

  if (useSafeMultiplayerSpawn) {
    foundSafeSpawn = findSafeSpawnPosition();
    if (!foundSafeSpawn) {
      setStatus("⚠ Geen vrije spawnplek; maak ruimte in de wereld.", "#f88");
      return false;
    }
    spawnX = foundSafeSpawn.x;
    spawnY = foundSafeSpawn.y;
  }

  player.px = spawnX;
  player.py = spawnY;
  player.vx = 0;
  player.vy = 0;
  player.onGround = !!(foundSafeSpawn && foundSafeSpawn.supported);
  updateCameraToPlayer();

  // Force a fresh world-coordinate broadcast for the new spawn.
  lastSentX = -1;
  lastSentY = -1;
  fbThrottle = 0;
  if (useSafeMultiplayerSpawn) setStatus("");
  return true;
}

function worldToScreen(bx,by){return{sx:bx*BLOCK_SIZE-camX,sy:by*BLOCK_SIZE-camY};}
function screenToWorld(sx,sy){return{bx:Math.floor((sx+camX)/BLOCK_SIZE),by:Math.floor((sy+camY)/BLOCK_SIZE)};}

canvas.addEventListener("mousedown",(e)=>{
  const rect=canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  const mx=(e.clientX-rect.left)*scaleX;
  const my=(e.clientY-rect.top)*scaleY;
  
  if(my>=VIEW_H){
    const startX = (CANVAS_W - HOTBAR_W) / 2;
    if(mx >= startX && mx <= startX + HOTBAR_W) {
      const slotW = HOTBAR_W / HOTBAR_SLOTS;
      const slot = Math.floor((mx - startX) / slotW);
      if(slot>=0&&slot<HOTBAR_SLOTS) selectedSlot=slot;
    }
    return;
  }
  const{bx,by}=screenToWorld(mx,my);
  if(e.button===2){e.preventDefault();placeBlock(bx,by);}
  else if(e.button===0){startBreaking(bx,by);}
});
canvas.addEventListener("mouseup",(e)=>{if(e.button===0)breaking=null;});
canvas.addEventListener("contextmenu",e=>e.preventDefault());

function startBreaking(bx,by) {
  if(bx<0||bx>=WORLD_W||by<0||by>=WORLD_H) return;
  if(bx===ONE_BLOCK_X&&by===ONE_BLOCK_Y){breaking={bx,by,startTime:Date.now(),duration:800,isOneBlock:true};return;}
  if(world[by][bx]===null) return;
  const bt=getBlockType(world[by][bx]);
  if(!bt) return;
  breaking={bx,by,startTime:Date.now(),duration:bt.breakTime,isOneBlock:false};
}

function placeBlock(bx,by) {
  if(bx<0||bx>=WORLD_W||by<0||by>=WORLD_H) return;
  if(bx===ONE_BLOCK_X&&by===ONE_BLOCK_Y) return;
  if(world[by][bx]!==null) return;
  const px1=Math.floor(player.px/BLOCK_SIZE);
  const px2=Math.floor((player.px+player.w-0.01)/BLOCK_SIZE);
  const py1=Math.floor(player.py/BLOCK_SIZE);
  const py2=Math.floor((player.py+player.h-0.01)/BLOCK_SIZE);
  const slot=hotbar[selectedSlot];
  if(!slot) return;
  const bt=getBlockType(slot.id);
  if(!bt) return;
  if(!bt.isLadder&&bx>=px1&&bx<=px2&&by>=py1&&by<=py2) return;
  world[by][bx]=slot.id;
  removeFromHotbar(selectedSlot);
  recordOneSquareProgress(["dm_51", "dm_52"]);
  onWorldChanged();
}

function oneSquareGrantReceipts(code) {
  try {
    const raw = JSON.parse(localStorage.getItem("onesquare_block_grant_receipts_" + code) || "{}");

function saveOneSquareGrantReceipt(code, grantId, mode) {
  const receipts = oneSquareGrantReceipts(code);
  const existing = receipts[grantId] && typeof receipts[grantId] === "object" ? receipts[grantId] : {};
  existing[mode] = true;
  existing[mode + "_received_at"] = Date.now();
  existing.player_id = myPlayerId;

    const bTime = Math.max(Number(b[1]?.singleplayer_received_at) || 0, Number(b[1]?.multiplayer_received_at) || 0, Number(b[1]?.received_at) || 0);
    return bTime - aTime;
  }).slice(0, 400);
  try { localStorage.setItem("onesquare_block_grant_receipts_" + code, JSON.stringify(Object.fromEntries(entries))); } catch (_) {}
}
function getOneSquareModeHotbar(mode) {

}
function addBlocksToOneSquareHotbar(items, blockId, quantity) {
  const copy = items.map(slot => slot ? { ...slot } : null);
  if (!copy.some(slot => slot && slot.id === blockId) && !copy.some(slot => !slot)) return null;
  for (let i = 0; i < quantity; i++) {
    const existing = copy.find(slot => slot && slot.id === blockId);
    if (existing) existing.count = (Number(existing.count) || 0) + 1;
    else {
      const emptyIndex = copy.findIndex(slot => !slot);
      if (emptyIndex < 0) return null;
      copy[emptyIndex] = { id: blockId, count: 1 };
    }
  }
  return copy;
}
async function markOneSquareGrantClaimed(code, grantId) {
  const ref = db.ref("onesquare/blockGrants/" + code + "/" + grantId);
  return ref.transaction(current => {
    if (!current || current.status === "claimed") return;
    return { ...current, status: "claimed", claimed_at: Date.now(), claimed_by: myPlayerId };
  }, undefined, false);
}
async function releaseOneSquareGrantClaim(code, grantId, token) {
  const ref = db.ref("onesquare/blockGrants/" + code + "/" + grantId);
  await ref.transaction(current => {
    if (!current || current.status !== "processing" || current.processing_by !== token) return;
    return { ...current, status: "pending", processing_by: null, processing_at: null };
  }, undefined, false);
}
async function processOneSquareBlockGrant(code, grantId, grant) {
  const block = BLOCK_TYPES.find(item => item.id === String(grant.block_id || ""));
  const quantity = Math.floor(Number(grant.quantity) || 0);
  if (!block || quantity < 1 || quantity > 9999) return;

  let receipts = oneSquareGrantReceipts(code);
  let receipt = receipts[grantId] && typeof receipts[grantId] === "object" ? receipts[grantId] : {};
  // Compatibility with an older receipt format: never issue a gift twice if it was already recorded.
  if (receipt.received_at && receipt.singleplayer === undefined && receipt.multiplayer === undefined) {
    await markOneSquareGrantClaimed(code, grantId).catch(error => console.warn("Could not confirm an already-received One Square grant:", error));
    return;
  }
  if (receipt.singleplayer && receipt.multiplayer) {
    await markOneSquareGrantClaimed(code, grantId).catch(error => console.warn("Could not finalize a completed One Square grant:", error));
    return;
  }
  if (grant.status === "claimed") return;
  const initialStatus = String(grant.status || "pending");
  if (initialStatus === "processing" && Date.now() - (Number(grant.processing_at) || 0) < 60000) return;
  if (initialStatus !== "pending" && initialStatus !== "processing") return;

  const claimToken = oneSquareGrantSessionToken + '-' + grantId;
  const grantRef = db.ref("onesquare/blockGrants/" + code + "/" + grantId);
  const claimResult = await grantRef.transaction(current => {
    if (!current || current.status === "claimed") return;
    const status = String(current.status || "pending");
    const processingAge = Date.now() - (Number(current.processing_at) || 0);
    if (status === "processing" && processingAge < 60000) return;
    if (status !== "pending" && status !== "processing") return;
    return { ...current, status: "processing", processing_by: claimToken, processing_at: Date.now() };
  }, undefined, false);
  const claimed = claimResult && claimResult.snapshot ? claimResult.snapshot.val() : null;
  if (!claimResult || !claimResult.committed || !claimed || claimed.processing_by !== claimToken) return;

  if (getOneSquareAccountCode() !== code) {
    await releaseOneSquareGrantClaim(code, grantId, claimToken).catch(() => {});
    return;
  }

  let deliveredAny = false;
  for (const mode of ["singleplayer", "multiplayer"]) {
    receipts = oneSquareGrantReceipts(code);
    receipt = receipts[grantId] && typeof receipts[grantId] === "object" ? receipts[grantId] : {};
    if (receipt[mode]) continue;
    const currentItems = getOneSquareModeHotbar(mode);
    const updatedItems = addBlocksToOneSquareHotbar(currentItems, block.id, quantity);
    if (!updatedItems) continue; // This mode's hotbar is full; leave the gift pending for a retry.
    saveOneSquareModeHotbar(mode, updatedItems);
    saveOneSquareGrantReceipt(code, grantId, mode);
    deliveredAny = true;
  }

  receipts = oneSquareGrantReceipts(code);
  receipt = receipts[grantId] && typeof receipts[grantId] === "object" ? receipts[grantId] : {};
  if (receipt.singleplayer && receipt.multiplayer) {
    await markOneSquareGrantClaimed(code, grantId).catch(error => console.warn("Could not finalize One Square block grant; local receipts prevent duplicate delivery:", error));
  } else {
    await releaseOneSquareGrantClaim(code, grantId, claimToken).catch(error => console.warn("Could not release a partially delivered One Square grant:", error));
  }

  if (deliveredAny) {
    const message = "🎁 +" + quantity + " " + block.name + " received";
    setStatus(message, "#ff8");
    if (!isMultiplayer) setTimeout(() => { if (!isMultiplayer && statusEl.textContent === message) setStatus(""); }, 4500);
  }
}
async function processOneSquareBlockGrants(code, grants) {
  if (getOneSquareAccountCode() !== code || !grants || typeof grants !== "object") return;
  for (const [grantId, rawGrant] of Object.entries(grants)) {
    if (!rawGrant || typeof rawGrant !== "object" || oneSquareBlockGrantsInFlight.has(grantId)) continue;
    if (rawGrant.status === "claimed" && !oneSquareGrantReceipts(code)[grantId]) continue;
    oneSquareBlockGrantsInFlight.add(grantId);
    try { await processOneSquareBlockGrant(code, grantId, rawGrant); }
    catch (error) { console.warn("Could not receive One Square block grant:", error); }
    finally { oneSquareBlockGrantsInFlight.delete(grantId); }
  }
}
function setupOneSquareBlockGrantListener() {
  if (!fbInited || !db) return;
  const code = getOneSquareAccountCode();
  if (!code) {
    if (oneSquareBlockGrantRef && oneSquareBlockGrantCallback) oneSquareBlockGrantRef.off("value", oneSquareBlockGrantCallback);
    oneSquareBlockGrantRef = null;
    oneSquareBlockGrantCallback = null;
    oneSquareBlockGrantAccountCode = null;
    return;
  }
  if (code === oneSquareBlockGrantAccountCode && oneSquareBlockGrantRef) {
    oneSquareBlockGrantRef.once("value").then(snapshot => processOneSquareBlockGrants(code, snapshot.val() || {})).catch(error => console.warn("Could not retry One Square block grants:", error));
    return;
  }
  if (oneSquareBlockGrantRef && oneSquareBlockGrantCallback) oneSquareBlockGrantRef.off("value", oneSquareBlockGrantCallback);
  oneSquareBlockGrantAccountCode = code;
  oneSquareBlockGrantRef = db.ref("onesquare/blockGrants/" + code);
  oneSquareBlockGrantCallback = snapshot => {
    processOneSquareBlockGrants(code, snapshot.val() || {}).catch(error => console.warn("One Square block grant sync failed:", error));
  };
  oneSquareBlockGrantRef.on("value", oneSquareBlockGrantCallback, error => console.warn("Could not listen for One Square block grants:", error));
}

function setRemoteSkinImage(playerId, dataUrl) {
  if (typeof dataUrl !== "string" || !/^data:image\//.test(dataUrl)) {
    delete remoteSkinImages[playerId];
    return;
  }
  const img = new Image();
  img.onerror = () => {
    if (remoteSkinImages[playerId] === img) delete remoteSkinImages[playerId];
  };
  remoteSkinImages[playerId] = img;
  img.src = dataUrl;
}

// also sweep expired records so stale messages do not accumulate indefinitely.

 chatButton.addEventListener("click",()=>{chatPanel.classList.toggle("hidden");if(!chatPanel.classList.contains("hidden")){initFirebase();startOneSquareChat();chatInput.focus();}});
}
function startOneSquareChat(){
 if(!db||chatRef)return;
 chatRef=db.ref("onesquare/chat");
 chatListener=chatRef.limitToLast(40).on("child_added",snap=>{
  const m=snap.val();if(!m||!m.text||!m.expiresAt)return;
  const left=m.expiresAt-Date.now();
  if(left<=0){snap.ref.remove().catch(()=>{});return;}
  const line=document.createElement("div");
  const who=document.createElement("b");who.textContent=(m.name||"Player")+": ";
  const body=document.createElement("span");body.textContent=String(m.text).slice(0,180);
  line.append(who,body);chatMessages.appendChild(line);chatMessages.scrollTop=chatMessages.scrollHeight;
  setTimeout(()=>{line.remove();snap.ref.remove().catch(()=>{});},left);
 });
 chatRef.once("value").then(s=>s.forEach(child=>{const m=child.val();if(!m||!m.expiresAt||m.expiresAt<=Date.now())child.ref.remove().catch(()=>{});})).catch(()=>{});
}
if(chatForm)chatForm.addEventListener("submit",async e=>{
 e.preventDefault();const value=String(chatInput.value||"").trim().slice(0,180);if(!value)return;
 initFirebase();if(!db){return;}startOneSquareChat();
 const now=Date.now();try{await chatRef.push({name:myName||"Player",playerId:myPlayerId,text:value,createdAt:now,expiresAt:now+10000});chatInput.value="";}catch(err){console.warn("Chat send failed",err);}
});

function enterMultiplayer() {
  initFirebase();
  if(!db){setStatus("❌ offline","#f66");return;}

  // The world snapshot is async; freeze movement and broadcasts until safe spawn.
  mpWorldReady = false;
  mpSpawnPending = true;
  breaking = null; // don't let a singleplayer block-break carry into the shared world
  fbWorldRef=db.ref("onesquare/world");
  const fbPlayersRef=db.ref("onesquare/players");
  const fbOnlineRef=db.ref("onesquare/online");
  fbSkinsRef=db.ref("onesquare/playerSkins");

  myFbRef=fbPlayersRef.child(myPlayerId);
  myFbRef.onDisconnect().remove();
  
  const mySkinData = localStorage.getItem("plixo_skin_image");
  const mySkinRef = fbSkinsRef.child(myPlayerId);
  mySkinRef.onDisconnect().remove();
  if (mySkinData && /^data:image\//.test(mySkinData)) {
    mySkinRef.set(mySkinData).catch(e => console.warn("Skin sync failed", e));
  } else {
    mySkinRef.remove().catch(e => console.warn("Skin cleanup failed", e));
  }
  
  myOnlineRef=fbOnlineRef.child(myPlayerId);
  myOnlineRef.set(true);
  myOnlineRef.onDisconnect().remove();

  myHotbarRef=db.ref("onesquare/hotbars/"+myPlayerId);
  hotbar=loadMPHotbar();

  const onlineL=fbOnlineRef.on("value",snap=>{setStatus("● "+snap.numChildren()+" online");});
  fbListeners.push(()=>fbOnlineRef.off("value",onlineL));

  const worldL=fbWorldRef.on("value",snap=>{
    const val=snap.val();
    if(val) {
      const arr=Array.from({length:WORLD_H},()=>Array(WORLD_W).fill(null));
      for(let r=0;r<WORLD_H;r++) {
        if(!val[r]) continue;
        for(let c=0;c<WORLD_W;c++) {
          arr[r][c]=val[r][c]||null;
        }
      }
      world=arr;
    } else {
      world=Array.from({length:WORLD_H},()=>Array(WORLD_W).fill(null));
    }

    // Wait for this authoritative world snapshot before selecting a spawn.
    const wasWorldReady = mpWorldReady;
    mpWorldReady = true;
    if (mpSpawnPending) {
      if (spawnPlayer(true)) mpSpawnPending = false;
    } else if (wasWorldReady && isMultiplayer && !isPlayerRectClear(player.px, player.py)) {
      // Remote edits may never leave this player embedded in a block.
      mpSpawnPending = true;
      if (spawnPlayer(true)) mpSpawnPending = false;
    }
  }, error => {
    console.warn("One Square world sync failed:", error);
    // Do not use the local singleplayer world as if it were the multiplayer world.
    // Freeze the join and block all broadcasts until an authoritative snapshot arrives.
    mpWorldReady = false;
    mpSpawnPending = true;
    setStatus("⚠ Multiplayerwereld niet geladen — verlaat en probeer opnieuw", "#f88");
  });
  fbListeners.push(()=>fbWorldRef.off("value",worldL));

  const addL=fbPlayersRef.on("child_added",snap=>{if(snap.key!==myPlayerId&&snap.val())remotePlayers[snap.key]=snap.val();});
  const chgL=fbPlayersRef.on("child_changed",snap=>{if(snap.key!==myPlayerId&&snap.val())remotePlayers[snap.key]=snap.val();});
  const remL=fbPlayersRef.on("child_removed",snap=>{delete remotePlayers[snap.key];});
  fbListeners.push(()=>{fbPlayersRef.off("child_added",addL);fbPlayersRef.off("child_changed",chgL);fbPlayersRef.off("child_removed",remL);});

  const skinAdd = fbSkinsRef.on("child_added", snap => {
    if (snap.key !== myPlayerId) setRemoteSkinImage(snap.key, snap.val());
  });
  const skinChg = fbSkinsRef.on("child_changed", snap => {
    if (snap.key !== myPlayerId) setRemoteSkinImage(snap.key, snap.val());
  });
  const skinRem = fbSkinsRef.on("child_removed", snap => {
    delete remoteSkinImages[snap.key];
  });
  fbListeners.push(() => {
      fbSkinsRef.off("child_added", skinAdd);
      fbSkinsRef.off("child_changed", skinChg);
      fbSkinsRef.off("child_removed", skinRem);
  });

  isMultiplayer=true;
  modeBadge.textContent="🌐 MP";
  btnToggle.textContent="🏠 Go to Singleplayer";
  btnToggle.classList.add("in-mp");
  btnReset.style.display="none";
  // Safe spawn is performed by the world listener after the authoritative snapshot.
}

function exitMultiplayer() {
  mpWorldReady = false;
  mpSpawnPending = false;
  fbListeners.forEach(fn=>fn());
  if(myFbRef){myFbRef.remove();myFbRef=null;}
  if(myOnlineRef){myOnlineRef.remove();myOnlineRef=null;}
  if(fbSkinsRef && myPlayerId) {fbSkinsRef.child(myPlayerId).remove();}

}

let lastSentX=-1,lastSentY=-1,fbThrottle=0;
function broadcastPos() {
  if(!isMultiplayer || !myFbRef || !mpWorldReady || mpSpawnPending) return;
  fbThrottle++;
  const moved=Math.round(player.px)!==lastSentX||Math.round(player.py)!==lastSentY;
  if(!moved&&fbThrottle<20) return;
  fbThrottle=0;
  lastSentX=Math.round(player.px);
  lastSentY=Math.round(player.py);
  // px/py are absolute world pixels, never camera-relative screen pixels.
  try { myFbRef.set({px:lastSentX,py:lastSentY,name:myName,t:Date.now()}); } catch(e){}
}

function cleanupRemote() {
  const now=Date.now();
  for(let id in remotePlayers) if(now-(remotePlayers[id].t||0)>15000) delete remotePlayers[id];
}

//  DRAW
// ═══════════════════════════════════════════════════════
function drawWorld() {
  ctx.fillStyle="#87CEEB";
  ctx.fillRect(0,0,CANVAS_W,VIEW_H);

  for(let by=0;by<WORLD_H;by++) for(let bx=0;bx<WORLD_W;bx++) {
    const{sx,sy}=worldToScreen(bx,by);
    if(sx+BLOCK_SIZE<0||sx>CANVAS_W) continue;

    if(bx===ONE_BLOCK_X&&by===ONE_BLOCK_Y) {
      if(MYSTERY_TEX.complete&&MYSTERY_TEX.naturalWidth>0){ctx.imageSmoothingEnabled=false;ctx.drawImage(MYSTERY_TEX,sx,sy,BLOCK_SIZE,BLOCK_SIZE);}
      else{ctx.fillStyle="#7B1FA2";ctx.fillRect(sx,sy,BLOCK_SIZE,BLOCK_SIZE);}
      if(breaking&&breaking.bx===bx&&breaking.by===by){const prog=Math.min(1,(Date.now()-breaking.startTime)/breaking.duration);ctx.fillStyle=`rgba(0,0,0,${prog*0.7})`;ctx.fillRect(sx,sy,BLOCK_SIZE,BLOCK_SIZE);}
      continue;
    }

    const id=world[by][bx];
    if(!id) continue;
    const bt=getBlockType(id);
    if(!bt) continue;
    const tex=TEXTURES[id];
    if(tex&&tex.complete&&tex.naturalWidth>0){ctx.imageSmoothingEnabled=false;ctx.drawImage(tex,sx,sy,BLOCK_SIZE,BLOCK_SIZE);}
    else{ctx.fillStyle=bt.color;ctx.fillRect(sx,sy,BLOCK_SIZE,BLOCK_SIZE);}

    if(breaking&&breaking.bx===bx&&breaking.by===by) {
      const prog=Math.min(1,(Date.now()-breaking.startTime)/breaking.duration);
      ctx.fillStyle=`rgba(0,0,0,${prog*0.7})`;
      ctx.fillRect(sx,sy,BLOCK_SIZE,BLOCK_SIZE);
      const cracks=Math.floor(prog*4);
      ctx.strokeStyle=`rgba(0,0,0,${prog})`;
      ctx.lineWidth=2;
      if(cracks>=1){ctx.beginPath();ctx.moveTo(sx+8,sy+8);ctx.lineTo(sx+16,sy+20);ctx.stroke();}
      if(cracks>=2){ctx.beginPath();ctx.moveTo(sx+16,sy+4);ctx.lineTo(sx+26,sy+16);ctx.stroke();}
      if(cracks>=3){ctx.beginPath();ctx.moveTo(sx+6,sy+20);ctx.lineTo(sx+18,sy+28);ctx.stroke();}
      if(cracks>=4){ctx.beginPath();ctx.moveTo(sx+22,sy+10);ctx.lineTo(sx+30,sy+24);ctx.stroke();}
    }
  }
}

function drawHotbar() {
  const slotW = HOTBAR_W / HOTBAR_SLOTS;
  const startX = (CANVAS_W - HOTBAR_W) / 2;
  const barY = VIEW_H;

  ctx.fillStyle="#333";
  ctx.fillRect(0,barY,CANVAS_W,HOTBAR_H); // Grijze achtergrond over de hele breedte

  for(let i=0;i<HOTBAR_SLOTS;i++) {
    const sx = startX + i * slotW;
    const sy = barY + 4;
    const sw = slotW - 4;
    const sh = HOTBAR_H - 8;
    ctx.fillStyle=i===selectedSlot?"#666":"#444";
    ctx.fillRect(sx+2,sy,sw,sh);
    ctx.strokeStyle=i===selectedSlot?"#fff":"#555";
    ctx.lineWidth=2;
    ctx.strokeRect(sx+3,sy+1,sw-2,sh-2);
    const slot=hotbar[i];
    if(slot) {
      const bt=getBlockType(slot.id);
      if(bt) {
        const tex=TEXTURES[slot.id];
        if(tex&&tex.complete&&tex.naturalWidth>0){ctx.imageSmoothingEnabled=false;ctx.drawImage(tex,sx+6,sy+4,sw-8,sh-8);}
        else{ctx.fillStyle=bt.color;ctx.fillRect(sx+6,sy+4,sw-8,sh-8);}
        ctx.fillStyle="white";
        ctx.font="10px monospace";
        ctx.fillText(slot.count,sx+4,barY+HOTBAR_H-8);
      }
    }
  }
}

function drawRemotePlayers() {
  for(let id in remotePlayers) {
    const rp=remotePlayers[id];
    const sx=Math.round(rp.px-camX);
    const sy=Math.round(rp.py-camY);
    if(sx<-40||sx>CANVAS_W+40) continue;
    
    const rSkin = remoteSkinImages[id];
    if (rSkin && rSkin.complete && rSkin.naturalWidth > 0) {
        const wasSmoothing = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(rSkin, sx - 1, sy - 1, 20, 28);
        ctx.imageSmoothingEnabled = wasSmoothing;
    } else {
        ctx.fillStyle=REMOTE_COLOR;
        ctx.fillRect(sx,sy,18,26); 
    }
    
    const label=rp.name||id.slice(0,4);
    ctx.fillStyle="rgba(0,0,0,0.65)";
    ctx.font="10px monospace";
    const tw=ctx.measureText(label).width;
    ctx.fillRect(sx+9-tw/2-2,sy-16,tw+4,14);
    ctx.fillStyle="#fff";
    ctx.fillText(label,sx+9-tw/2,sy-4);
  }
}

let magmaContactStart=0;
function hasFireSkin(){
 const id=String(localStorage.getItem("plixo_selected_skin")||"").toLowerCase();
 return id==="fire"||id.includes("fire")||id==="flame"||id.includes("flame");
}
function updateMagma(){
 const warning=document.getElementById("magma-warning");
 if(hasFireSkin()){magmaContactStart=0;if(warning)warning.style.boxShadow="inset 0 0 24px rgba(255,25,0,0)";return;}
 const footY=player.py+player.h+1;
 const by=Math.floor(footY/BLOCK_SIZE);
 const left=Math.floor((player.px+1)/BLOCK_SIZE),right=Math.floor((player.px+player.w-1)/BLOCK_SIZE);
 let touching=false;
 for(let bx=left;bx<=right;bx++)if(by>=0&&by<WORLD_H&&bx>=0&&bx<WORLD_W&&world[by][bx]==="magma")touching=true;
 if(touching){if(!magmaContactStart)magmaContactStart=Date.now();const p=Math.min(1,(Date.now()-magmaContactStart)/5000);if(warning)warning.style.boxShadow=`inset 0 0 ${12+p*34}px rgba(255,20,0,${.18+p*.48})`;if(p>=1){magmaContactStart=0;spawnPlayer();}}
 else{magmaContactStart=0;if(warning)warning.style.boxShadow="inset 0 0 24px rgba(255,25,0,0)";}
}

// ═══════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════
const TARGET_FPS=60;
const FRAME_TIME=1000/TARGET_FPS;
let lastTime=0,frameCount=0;

function loop(timestamp) {
  requestAnimationFrame(loop);
  if(timestamp-lastTime<FRAME_TIME) return;
  lastTime=timestamp;

  if (!isMultiplayer || (mpWorldReady && !mpSpawnPending)) {
    player.update(keys);
    updateMagma();
  }

  if(breaking) {
    const elapsed=Date.now()-breaking.startTime;
    if(elapsed>=breaking.duration) {
      const{bx,by}=breaking;
      let completedBreak = false;
      if(breaking.isOneBlock){
        const droppedBlock = getRandomDrop();
        const receivedDrop = addToHotbar(droppedBlock);
        if (receivedDrop && droppedBlock === "chicken_jockey") recordOneSquareProgress("a_chicken_jockey");
        completedBreak = true;
      } else {
        const id=world[by][bx];
        if(id){
          addToHotbar(id);
          world[by][bx]=null;
          completedBreak = true;
          // Per block type: increment all three thresholds. Chicken Jockey is not a world block and is excluded.
          if (id !== "chicken_jockey" && BLOCK_TYPES.some(bt => bt.id === id)) {
            recordOneSquareProgress([`dm_os_mine_${id}_3`, `dm_os_mine_${id}_5`, `dm_os_mine_${id}_9`]);
          }
        }
      }
      if (completedBreak) recordOneSquareProgress(["dm_53", "dm_54", "a66"]); // permanent DEMOLISHER mission in skin.html
      onWorldChanged();
      breaking=null;
    }
  }

  frameCount++;
  broadcastPos();
  if(frameCount%30===0) cleanupRemote();

  ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  drawWorld();
  drawRemotePlayers();
  player.draw(isMultiplayer ? myName : null, true);
  drawHotbar();
}

const fsBtn = document.getElementById("btn-fs");
fsBtn.addEventListener("click", () => {
  if(!document.fullscreenElement) {
    document.body.requestFullscreen().catch(() => {});
    fsBtn.textContent = "✕ Exit fullscreen";
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener("fullscreenchange", () => {
  if(!document.fullscreenElement) {
    fsBtn.textContent = "⛶ Fullscreen";
  }
});

// PLIXO account login and live skin synchronization.
const ACCOUNT_STORAGE_KEY = "onesquare_plixo_account_code_v1";
const loginPanel = document.getElementById("plixo-login");
const accountCodeInput = document.getElementById("plixo-account-code");
const loginButton = document.getElementById("plixo-login-button");
const loginError = document.getElementById("plixo-login-error");
const changeAccountButton = document.getElementById("btn-change-account");
let plixoAccount = null;
let plixoProfile = {};
let plixoProfileRef = null;
let plixoProfileListener = null;
let gameStarted = false;

function validPlixoCode(value) {
  return /^(?:[A-HJ-NP-Z2-9]{20}|[0-9]{20})$/.test(String(value || "").trim().toUpperCase());
}

function applyPlixoProfile(profile) {
  plixoProfile = profile && typeof profile === "object" ? profile : {};
  const skinId = String(plixoProfile.selected_skin || "classic");
  localStorage.setItem("plixo_selected_skin", skinId);
  const imageData = typeof plixoProfile.skin_image === "string" ? plixoProfile.skin_image : "";
  if (imageData && /^data:image\//i.test(imageData)) {
    localStorage.setItem("plixo_skin_image", imageData);
  } else {
    localStorage.removeItem("plixo_skin_image");
  }
  refreshSelectedSkinImage();
}

function attachPlixoProfileListener() {
  if (!plixoAccount || !db) return;
  if (plixoProfileRef && plixoProfileListener) {
    plixoProfileRef.off("value", plixoProfileListener);
  }
  plixoProfileRef = db.ref("plixo_users/" + plixoAccount.code);
  plixoProfileListener = snapshot => applyPlixoProfile(snapshot.val() || {});
  plixoProfileRef.on("value", plixoProfileListener, error => {
    console.warn("PLIXO live skin sync failed:", error);
    loginError.textContent = "Account connected, but live skin updates are temporarily unavailable.";
  });
}

async function loginWithPlixo(code) {
  initFirebase();
  if (!db) throw new Error("Could not connect to PLIXO. Check your internet connection.");
  const normalizedCode = String(code || "").trim().toUpperCase();
  const accountSnap = await db.ref("accountCodes/" + normalizedCode).once("value");
  const accountRecord = accountSnap.val();
  if (!accountRecord || !accountRecord.deviceId || !accountRecord.name) {
    throw new Error("Account code not found. Copy the 20-character code from your PLIXO Leaderboard page.");
  }

  plixoAccount = { code: normalizedCode, name: String(accountRecord.name), deviceId: String(accountRecord.deviceId) };
  localStorage.setItem(ACCOUNT_STORAGE_KEY, normalizedCode);
  localStorage.setItem("pg_account_code", normalizedCode);
  localStorage.setItem("pg_player_name", plixoAccount.name);
  localStorage.setItem("pg_device_id", plixoAccount.deviceId);
  localStorage.setItem("onesquare_name", plixoAccount.name);
  myName = plixoAccount.name;
  const nameInput = document.getElementById("settings-name");
  if (nameInput) nameInput.value = myName;

  const profileSnap = await db.ref("plixo_users/" + normalizedCode).once("value");
  applyPlixoProfile(profileSnap.val() || {});
  attachPlixoProfileListener();
  setupOneSquareBlockGrantListener();
  loginError.textContent = "";
  loginPanel.classList.add("hidden");
  if (!gameStarted) {
    gameStarted = true;
    requestAnimationFrame(loop);
  }
}

loginButton.addEventListener("click", async () => {
  const code = String(accountCodeInput.value || "").trim().toUpperCase();
  if (!validPlixoCode(code)) {
    loginError.textContent = "Enter your complete 20-character PLIXO account code.";
    return;
  }
  loginButton.disabled = true;
  loginButton.textContent = "CHECKING...";
  loginError.textContent = "";
  try {
    await loginWithPlixo(code);
  } catch (error) {
    loginError.textContent = error && error.message ? error.message : "Login failed. Check your connection and try again.";
  } finally {
    loginButton.disabled = false;
    loginButton.textContent = "LOG IN & PLAY";
  }
});
accountCodeInput.addEventListener("keydown", event => {
  if (event.key === "Enter") loginButton.click();
});
if (changeAccountButton) {
  changeAccountButton.addEventListener("click", () => {
    accountCodeInput.value = localStorage.getItem(ACCOUNT_STORAGE_KEY) || "";
    loginError.textContent = "";
    loginPanel.classList.remove("hidden");
    accountCodeInput.focus();
  });
}

window.addEventListener("storage", event => {
  if (["pg_account_code", "pg_player_id", "plixo_sync_code", "onesquare_plixo_account_code_v1"].includes(event.key)) {
    if (getOneSquareAccountCode()) {
      if (fbInited) setupOneSquareBlockGrantListener();
      else initFirebase();
    }
  }
});
window.addEventListener("focus", () => {
  if (getOneSquareAccountCode()) {
    if (fbInited) setupOneSquareBlockGrantListener();
    else initFirebase();
  }
});

(async function restorePlixoAccount() {
  const savedCode = String(localStorage.getItem(ACCOUNT_STORAGE_KEY) || "").trim().toUpperCase();
  if (!savedCode) {
    accountCodeInput.focus();
    return;
  }
  accountCodeInput.value = savedCode;
  loginButton.disabled = true;
  loginButton.textContent = "RESTORING...";
  try {
    await loginWithPlixo(savedCode);
  } catch (error) {
    localStorage.removeItem(ACCOUNT_STORAGE_KEY);
    loginError.textContent = error && error.message ? error.message : "Saved account could not be restored. Please log in again.";
    accountCodeInput.focus();
  } finally {
    loginButton.disabled = false;
    loginButton.textContent = "LOG IN & PLAY";
  }
})();

</script>
</body>
</html>
