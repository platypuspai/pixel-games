<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>One Square v1.6</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  overflow: hidden; background: #111; font-family: monospace;
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
}
#top-bar {
  width: 200px; height: 20px; background: #1a1a1a;
  display: flex; align-items: center; padding: 0 6px;
  border-bottom: 1px solid #333; position: relative;
  flex-shrink: 0;
}
#game-title {
  font-size: 8px; font-weight: bold; color: #666; flex: 1; letter-spacing: 1px;
}
#mode-badge {
  font-size: 7px; color: #888; margin-right: 6px;
}
#btn-settings {
  font-size: 9px; background: none; border: none; color: #aaa;
  cursor: pointer; padding: 0 2px; line-height: 1;
}
#btn-settings:hover { color: #fff; }

/* Settings panel */
#settings-panel {
  position: absolute; top: 20px; right: 0; width: 180px;
  background: #1c1c1c; border: 1px solid #383838; border-top: none;
  border-radius: 0 0 6px 6px; z-index: 50; padding: 8px;
  display: flex; flex-direction: column; gap: 6px;
}
#settings-panel.hidden { display: none; }
.settings-row {
  display: flex; gap: 4px; align-items: center;
}
.settings-row label {
  font-size: 7px; color: #777; width: 52px; flex-shrink: 0;
}
.settings-row input[type=text] {
  flex: 1; background: #2a2a2a; border: 1px solid #444; border-radius: 2px;
  color: #eee; font-family: monospace; font-size: 8px; padding: 2px 4px; outline: none;
}
.settings-row input[type=text]:focus { border-color: #777; }
.settings-sep {
  border: none; border-top: 1px solid #2e2e2e; margin: 2px 0;
}
.s-btn {
  font-size: 8px; padding: 3px 0; cursor: pointer; border-radius: 3px;
  border: 1px solid; font-family: monospace; width: 100%; text-align: center;
}
.s-btn-mp   { background:#1a3a1a; border-color:#2a6a2a; color:#6f6; }
.s-btn-mp:hover { background:#254a25; }
.s-btn-mp.in-mp { background:#1a1a4a; border-color:#2a2a9a; color:#88f; }
.s-btn-reset { background:#3a1a1a; border-color:#7a3a3a; color:#f88; }
.s-btn-reset:hover { background:#4a2a2a; }
.s-btn-name  { background:#2a2a1a; border-color:#6a6a2a; color:#ff8; }
.s-btn-name:hover { background:#3a3a1a; }
.s-btn-home  { background:#1a2a3a; border-color:#2a5a8a; color:#8af; }
.s-btn-home:hover { background:#253545; }
.s-btn-fs    { background:#1a1a2a; border-color:#4a4a8a; color:#aaf; }
.s-btn-fs:hover { background:#25253a; }
#mp-status { font-size: 7px; color: #5a5; text-align:center; }
canvas { display: block; image-rendering: pixelated; }
:fullscreen #top-bar { width: 100vw; }
:fullscreen canvas { width: 100vw !important; height: calc(100vh - 20px) !important; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="top-bar">
  <span id="game-title">ONE SQUARE</span>
  <span id="mode-badge">🎮 SP</span>
  <button id="btn-settings" title="Settings">⚙</button>
  <div id="settings-panel" class="hidden">
    <div class="settings-row">
      <label id="lbl-name">Name</label>
      <input id="settings-name" type="text" maxlength="12" placeholder="your name..." />
    </div>
    <button class="s-btn s-btn-name" id="btn-save-name">Save name</button>
    <hr class="settings-sep">
    <button class="s-btn s-btn-mp" id="btn-toggle-mp">🌐 Go to Multiplayer</button>
    <div id="mp-status" class="hidden"></div>
    <hr class="settings-sep">
    <button class="s-btn s-btn-reset" id="btn-reset">🗑 Reset singleplayer world</button>
    <hr class="settings-sep">
    <button class="s-btn s-btn-home" id="btn-home">🏠 Go to website</button>
    <button class="s-btn s-btn-fs" id="btn-fs">⛶ Fullscreen</button>
  </div>
</div>
<canvas id="game" width="200" height="200"></canvas>

    fsBtnEl.textContent = document.fullscreenElement ? t('btnFsExit') : t('btnFsEnter');

const _origImage = window.Image;
window.Image = function(...args) {
  const img = new _origImage(...args);
  const origSrcDesc = Object.getOwnPropertyDescriptor(_origImage.prototype, 'src');
  Object.defineProperty(img, 'src', {
    set(val) {
      const key = val.split('/').pop().split('?')[0];
      origSrcDesc.set.call(img, window._imgSrcs[key] || val);
    },
    get() { return origSrcDesc.get.call(img); }
  });
  return img;
};

function loadSPWorld() {

  return Array.from({length: WORLD_H}, () => Array(WORLD_W).fill(null));
}

function addToHotbar(id) {
  for(let i=0;i<HOTBAR_SLOTS;i++) { if(hotbar[i]&&hotbar[i].id===id){hotbar[i].count++;return;} }
  for(let i=0;i<HOTBAR_SLOTS;i++) { if(!hotbar[i]){hotbar[i]={id,count:1};return;} }
}
function removeFromHotbar(slot) {
  if(!hotbar[slot]) return false;
  hotbar[slot].count--;
  if(hotbar[slot].count<=0) hotbar[slot]=null;
  return true;
}
function getBlockType(id) { return BLOCK_TYPES.find(b=>b.id===id)||null; }
function getRandomDrop() {
  const total=ONE_BLOCK_DROPS.reduce((s,d)=>s+d.weight,0);
  let r=Math.random()*total;
  for(const d of ONE_BLOCK_DROPS){r-=d.weight;if(r<=0)return d.id;}
  return ONE_BLOCK_DROPS[0].id;
}

// ═══════════════════════════════════════════════════════
//  PLAYER CLASS
// ═══════════════════════════════════════════════════════
class Player {
  constructor(x,y,color="red") {
    this.px=x*BLOCK_SIZE; this.py=y*BLOCK_SIZE;
    this.w=10; this.h=14; this.vx=0; this.vy=0;
    this.onGround=false; this.color=color;
  }
  isBlockSolid(bx,by) {
    if(bx<0||bx>=WORLD_W) return true;
    if(by>=WORLD_H) return true;
    if(by<0) return false;
    if(bx===ONE_BLOCK_X&&by===ONE_BLOCK_Y) return true;
    const id=world[by][bx];
    if(!id) return false;
    const bt=getBlockType(id);
    if(bt&&bt.isLadder) return false;
    return true;
  }
  isOnLadder() {
    const left=Math.floor(this.px/BLOCK_SIZE);
    const right=Math.floor((this.px+this.w-0.01)/BLOCK_SIZE);
    const top=Math.floor(this.py/BLOCK_SIZE);
    const bot=Math.floor((this.py+this.h-0.01)/BLOCK_SIZE);
    for(let by=top;by<=bot;by++) for(let bx=left;bx<=right;bx++) {
      if(by<0||by>=WORLD_H||bx<0||bx>=WORLD_W) continue;
      const id=world[by][bx];
      if(id){const bt=getBlockType(id);if(bt&&bt.isLadder)return true;}
    }
    return false;
  }
  update(keys) {
    const onLadder=this.isOnLadder();
    this.vx=0;
    if(keys["ArrowLeft"]) this.vx=-MOVE_SPEED;
    if(keys["ArrowRight"]) this.vx=MOVE_SPEED;
    if(onLadder) {
      if(keys["ArrowUp"]) this.vy=-LADDER_SPEED;
      else this.vy=LADDER_SINK;
      this.onGround=false;
    } else {
      if((keys["ArrowUp"]||keys[" "])&&this.onGround){this.vy=JUMP_FORCE;this.onGround=false;}
      this.vy+=GRAVITY;
    }
    this.px+=this.vx;
    const left=Math.floor(this.px/BLOCK_SIZE);
    const right=Math.floor((this.px+this.w-0.01)/BLOCK_SIZE);
    const top=Math.floor(this.py/BLOCK_SIZE);
    const bot=Math.floor((this.py+this.h-0.01)/BLOCK_SIZE);
    if(this.vx>0&&(this.isBlockSolid(right,top)||this.isBlockSolid(right,bot))) this.px=right*BLOCK_SIZE-this.w-0.01;
    if(this.vx<0&&(this.isBlockSolid(left,top)||this.isBlockSolid(left,bot))) this.px=(left+1)*BLOCK_SIZE;
    this.py+=this.vy;
    const left2=Math.floor(this.px/BLOCK_SIZE);
    const right2=Math.floor((this.px+this.w-0.01)/BLOCK_SIZE);
    const top2=Math.floor(this.py/BLOCK_SIZE);
    const bot2=Math.floor((this.py+this.h-0.01)/BLOCK_SIZE);
    if(!onLadder) {
      if(this.vy>0&&(this.isBlockSolid(left2,bot2)||this.isBlockSolid(right2,bot2))){this.py=bot2*BLOCK_SIZE-this.h;this.vy=0;this.onGround=true;}
      else if(this.vy<0||(!this.isBlockSolid(left2,bot2+1)&&!this.isBlockSolid(right2,bot2+1))) this.onGround=false;
      if(this.vy<0&&(this.isBlockSolid(left2,top2)||this.isBlockSolid(right2,top2))){this.py=(top2+1)*BLOCK_SIZE;this.vy=0;}
    } else {
      if(this.vy<0&&(this.isBlockSolid(left2,top2)||this.isBlockSolid(right2,top2))){this.py=(top2+1)*BLOCK_SIZE;this.vy=0;}
      if(this.vy>0&&(this.isBlockSolid(left2,bot2)||this.isBlockSolid(right2,bot2))){this.py=bot2*BLOCK_SIZE-this.h;this.vy=0;this.onGround=true;}
    }
    if(this.py+this.h>=FLOOR_Y){this.py=FLOOR_Y-this.h;this.vy=0;this.onGround=true;}
    if(this.py<0){this.py=0;this.vy=0;}
    camX=this.px-CANVAS_W/2+this.w/2;
    camX=Math.max(0,Math.min(WORLD_W*BLOCK_SIZE-CANVAS_W,camX));
  }
  draw(label) {
    const sx=Math.round(this.px-camX);
    const sy=Math.round(this.py-camY);
    ctx.fillStyle=this.color;
    ctx.fillRect(sx,sy,this.w,this.h);
    if(label) {
      ctx.fillStyle="rgba(0,0,0,0.6)";
      ctx.font="5px monospace";
      const tw=ctx.measureText(label).width;
      ctx.fillRect(sx+this.w/2-tw/2-1,sy-8,tw+2,7);
      ctx.fillStyle="#fff";
      ctx.fillText(label,sx+this.w/2-tw/2,sy-2);
    }
  }
}

let camX=0;
const camY=0;

function spawnPlayer() {
  player.px=ONE_BLOCK_X*BLOCK_SIZE;
  player.py=(ONE_BLOCK_Y-1)*BLOCK_SIZE;
  player.vx=0; player.vy=0;
}

let player=new Player(ONE_BLOCK_X,ONE_BLOCK_Y-1,MY_COLOR);

// ═══════════════════════════════════════════════════════
//  BLOCK BREAKING
// ═══════════════════════════════════════════════════════
let breaking=null;

function worldToScreen(bx,by){return{sx:bx*BLOCK_SIZE-camX,sy:by*BLOCK_SIZE-camY};}
function screenToWorld(sx,sy){return{bx:Math.floor((sx+camX)/BLOCK_SIZE),by:Math.floor((sy+camY)/BLOCK_SIZE)};}

canvas.addEventListener("mousedown",(e)=>{
  const rect=canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  const mx=(e.clientX-rect.left)*scaleX;
  const my=(e.clientY-rect.top)*scaleY;
  const slotW=CANVAS_W/HOTBAR_SLOTS;
  if(my>=VIEW_H){
    const slot=Math.floor(mx/slotW);
    if(slot>=0&&slot<HOTBAR_SLOTS) selectedSlot=slot;
    return;
  }
  const{bx,by}=screenToWorld(mx,my);
  if(e.button===2){e.preventDefault();placeBlock(bx,by);}
  else if(e.button===0){startBreaking(bx,by);}
});
canvas.addEventListener("mouseup",(e)=>{if(e.button===0)breaking=null;});
canvas.addEventListener("contextmenu",e=>e.preventDefault());

function startBreaking(bx,by) {
  if(bx<0||bx>=WORLD_W||by<0||by>=WORLD_H) return;
  if(bx===ONE_BLOCK_X&&by===ONE_BLOCK_Y){breaking={bx,by,startTime:Date.now(),duration:800,isOneBlock:true};return;}
  if(world[by][bx]===null) return;
  const bt=getBlockType(world[by][bx]);
  if(!bt) return;
  breaking={bx,by,startTime:Date.now(),duration:bt.breakTime,isOneBlock:false};
}

function placeBlock(bx,by) {
  if(bx<0||bx>=WORLD_W||by<0||by>=WORLD_H) return;
  if(bx===ONE_BLOCK_X&&by===ONE_BLOCK_Y) return;
  if(world[by][bx]!==null) return;
  const px1=Math.floor(player.px/BLOCK_SIZE);
  const px2=Math.floor((player.px+player.w-0.01)/BLOCK_SIZE);
  const py1=Math.floor(player.py/BLOCK_SIZE);
  const py2=Math.floor((player.py+player.h-0.01)/BLOCK_SIZE);
  const slot=hotbar[selectedSlot];
  if(!slot) return;
  const bt=getBlockType(slot.id);
  if(!bt) return;
  if(!bt.isLadder&&bx>=px1&&bx<=px2&&by>=py1&&by<=py2) return;
  world[by][bx]=slot.id;
  removeFromHotbar(selectedSlot);
  onWorldChanged();
}

// ═══════════════════════════════════════════════════════
//  FIREBASE MULTIPLAYER
// ═══════════════════════════════════════════════════════
let db=null, fbInited=false;
let myFbRef=null, myOnlineRef=null, myHotbarRef=null;
let fbWorldRef=null;
let remotePlayers={};
let fbListeners=[];

const statusEl=document.getElementById("mp-status");
const modeBadge=document.getElementById("mode-badge");
const btnToggle=document.getElementById("btn-toggle-mp");
const btnReset=document.getElementById("btn-reset");
const settingsPanel=document.getElementById("settings-panel");
const settingsNameInput=document.getElementById("settings-name");
const btnSaveName=document.getElementById("btn-save-name");
const btnSettingsToggle=document.getElementById("btn-settings");

function setStatus(msg,color="#5a5"){
  if(msg){statusEl.textContent=msg;statusEl.style.color=color;statusEl.classList.remove("hidden");}
  else{statusEl.classList.add("hidden");}
}

function initFirebase() {
  if(fbInited) return;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
    fbInited=true;
  } catch(e) { console.warn("Firebase init failed",e); }
}

function enterMultiplayer() {
  initFirebase();
  if(!db){setStatus("❌ offline","#f66");return;}

  fbWorldRef=db.ref("onesquare/world");
  const fbPlayersRef=db.ref("onesquare/players");
  const fbOnlineRef=db.ref("onesquare/online");

  myFbRef=fbPlayersRef.child(myPlayerId);
  myFbRef.onDisconnect().remove();
  myOnlineRef=fbOnlineRef.child(myPlayerId);
  myOnlineRef.set(true);
  myOnlineRef.onDisconnect().remove();

  myHotbarRef=db.ref("onesquare/hotbars/"+myPlayerId);
  hotbar=loadMPHotbar();

  const onlineL=fbOnlineRef.on("value",snap=>{setStatus("● "+snap.numChildren()+" online");});
  fbListeners.push(()=>fbOnlineRef.off("value",onlineL));

  const worldL=fbWorldRef.on("value",snap=>{
    const val=snap.val();
    if(val) {
      const arr=Array.from({length:WORLD_H},()=>Array(WORLD_W).fill(null));
      for(let r=0;r<WORLD_H;r++) {
        if(!val[r]) continue;
        for(let c=0;c<WORLD_W;c++) {
          arr[r][c]=val[r][c]||null;
        }
      }
      world=arr;
    } else {
      world=Array.from({length:WORLD_H},()=>Array(WORLD_W).fill(null));
    }
  });
  fbListeners.push(()=>fbWorldRef.off("value",worldL));

  const addL=fbPlayersRef.on("child_added",snap=>{if(snap.key!==myPlayerId&&snap.val())remotePlayers[snap.key]=snap.val();});
  const chgL=fbPlayersRef.on("child_changed",snap=>{if(snap.key!==myPlayerId&&snap.val())remotePlayers[snap.key]=snap.val();});
  const remL=fbPlayersRef.on("child_removed",snap=>{delete remotePlayers[snap.key];});
  fbListeners.push(()=>{fbPlayersRef.off("child_added",addL);fbPlayersRef.off("child_changed",chgL);fbPlayersRef.off("child_removed",remL);});

  isMultiplayer=true;
  modeBadge.textContent="🌐 MP";
  btnToggle.textContent=t('btnSp');
  btnToggle.classList.add("in-mp");
  btnReset.style.display="none";
  spawnPlayer();
}

function exitMultiplayer() {
  fbListeners.forEach(fn=>fn());
  fbListeners=[];
  if(myFbRef){myFbRef.remove();myFbRef=null;}
  if(myOnlineRef){myOnlineRef.remove();myOnlineRef=null;}
  myHotbarRef=null;
  fbWorldRef=null;
  remotePlayers={};

  saveMPHotbar();

  world=loadSPWorld();
  hotbar=loadSPHotbar();
  isMultiplayer=false;
  modeBadge.textContent="🎮 SP";
  btnToggle.textContent=t('btnMp');
  btnToggle.classList.remove("in-mp");
  btnReset.style.display="";
  setStatus("");
  spawnPlayer();
}

btnToggle.addEventListener("click",()=>{
  if(isMultiplayer) exitMultiplayer();
  else enterMultiplayer();
});

btnReset.addEventListener("click",()=>{
  if(isMultiplayer) return;
  world=Array.from({length:WORLD_H},()=>Array(WORLD_W).fill(null));
  hotbar=Array(HOTBAR_SLOTS).fill(null);
  saveSPWorld();
  saveSPHotbar();
  spawnPlayer();
});

function onWorldChanged() {
  if(isMultiplayer) {
    saveMPHotbar();
    if(fbWorldRef) try { fbWorldRef.set(world); } catch(e){}
  } else {
    saveSPWorld();
    saveSPHotbar();
  }
}

// ═══════════════════════════════════════════════════════
//  POSITIE BROADCAST (MP)
// ═══════════════════════════════════════════════════════
let lastSentX=-1,lastSentY=-1,fbThrottle=0;
function broadcastPos() {
  if(!isMultiplayer||!myFbRef) return;
  fbThrottle++;
  const moved=Math.round(player.px)!==lastSentX||Math.round(player.py)!==lastSentY;
  if(!moved&&fbThrottle<20) return;
  fbThrottle=0;
  lastSentX=Math.round(player.px);
  lastSentY=Math.round(player.py);
  try { myFbRef.set({px:lastSentX,py:lastSentY,name:myName,t:Date.now()}); } catch(e){}
}

function cleanupRemote() {
  const now=Date.now();
  for(let id in remotePlayers) if(now-(remotePlayers[id].t||0)>15000) delete remotePlayers[id];
}

// ═══════════════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════════════
function drawWorld() {
  ctx.fillStyle="#87CEEB";
  ctx.fillRect(0,0,CANVAS_W,VIEW_H);

  for(let by=0;by<WORLD_H;by++) for(let bx=0;bx<WORLD_W;bx++) {
    const{sx,sy}=worldToScreen(bx,by);
    if(sx+BLOCK_SIZE<0||sx>CANVAS_W) continue;

    if(bx===ONE_BLOCK_X&&by===ONE_BLOCK_Y) {
      if(MYSTERY_TEX.complete&&MYSTERY_TEX.naturalWidth>0){ctx.imageSmoothingEnabled=false;ctx.drawImage(MYSTERY_TEX,sx,sy,BLOCK_SIZE,BLOCK_SIZE);}
      else{ctx.fillStyle="#7B1FA2";ctx.fillRect(sx,sy,BLOCK_SIZE,BLOCK_SIZE);}
      if(breaking&&breaking.bx===bx&&breaking.by===by){const prog=Math.min(1,(Date.now()-breaking.startTime)/breaking.duration);ctx.fillStyle=`rgba(0,0,0,${prog*0.7})`;ctx.fillRect(sx,sy,BLOCK_SIZE,BLOCK_SIZE);}
      continue;
    }

    const id=world[by][bx];
    if(!id) continue;
    const bt=getBlockType(id);
    if(!bt) continue;
    const tex=TEXTURES[id];
    if(tex&&tex.complete&&tex.naturalWidth>0){ctx.imageSmoothingEnabled=false;ctx.drawImage(tex,sx,sy,BLOCK_SIZE,BLOCK_SIZE);}
    else{ctx.fillStyle=bt.color;ctx.fillRect(sx,sy,BLOCK_SIZE,BLOCK_SIZE);}

    if(breaking&&breaking.bx===bx&&breaking.by===by) {
      const prog=Math.min(1,(Date.now()-breaking.startTime)/breaking.duration);
      ctx.fillStyle=`rgba(0,0,0,${prog*0.7})`;
      ctx.fillRect(sx,sy,BLOCK_SIZE,BLOCK_SIZE);
      const cracks=Math.floor(prog*4);
      ctx.strokeStyle=`rgba(0,0,0,${prog})`;
      ctx.lineWidth=1;
      if(cracks>=1){ctx.beginPath();ctx.moveTo(sx+4,sy+4);ctx.lineTo(sx+8,sy+10);ctx.stroke();}
      if(cracks>=2){ctx.beginPath();ctx.moveTo(sx+8,sy+2);ctx.lineTo(sx+13,sy+8);ctx.stroke();}
      if(cracks>=3){ctx.beginPath();ctx.moveTo(sx+3,sy+10);ctx.lineTo(sx+9,sy+14);ctx.stroke();}
      if(cracks>=4){ctx.beginPath();ctx.moveTo(sx+11,sy+5);ctx.lineTo(sx+15,sy+12);ctx.stroke();}
    }
  }
}

function drawHotbar() {
  const slotW=CANVAS_W/HOTBAR_SLOTS;
  const barY=VIEW_H;
  ctx.fillStyle="#333";
  ctx.fillRect(0,barY,CANVAS_W,HOTBAR_H);
  for(let i=0;i<HOTBAR_SLOTS;i++) {
    const sx=i*slotW;
    const sy=barY+2;
    const sw=slotW-2;
    const sh=HOTBAR_H-4;
    ctx.fillStyle=i===selectedSlot?"#666":"#444";
    ctx.fillRect(sx+1,sy,sw,sh);
    ctx.strokeStyle=i===selectedSlot?"#fff":"#555";
    ctx.strokeRect(sx+1.5,sy+0.5,sw-1,sh-1);
    const slot=hotbar[i];
    if(slot) {
      const bt=getBlockType(slot.id);
      if(bt) {
        const tex=TEXTURES[slot.id];
        if(tex&&tex.complete&&tex.naturalWidth>0){ctx.imageSmoothingEnabled=false;ctx.drawImage(tex,sx+3,sy+2,sw-4,sh-4);}
        else{ctx.fillStyle=bt.color;ctx.fillRect(sx+3,sy+2,sw-4,sh-4);}
        ctx.fillStyle="white";
        ctx.font="5px monospace";
        ctx.fillText(slot.count,sx+2,barY+HOTBAR_H-4);
      }
    }
  }
}

function drawRemotePlayers() {
  for(let id in remotePlayers) {
    const rp=remotePlayers[id];
    const sx=Math.round(rp.px-camX);
    const sy=Math.round(rp.py-camY);
    if(sx<-20||sx>CANVAS_W+20) continue;
    ctx.fillStyle=REMOTE_COLOR;
    ctx.fillRect(sx,sy,10,14);
    const label=rp.name||id.slice(0,4);
    ctx.fillStyle="rgba(0,0,0,0.65)";
    ctx.font="5px monospace";
    const tw=ctx.measureText(label).width;
    ctx.fillRect(sx+5-tw/2-1,sy-8,tw+2,7);
    ctx.fillStyle="#fff";
    ctx.fillText(label,sx+5-tw/2,sy-2);
  }
}

// ═══════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════
const keys={};
window.addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(e.key>="1"&&e.key<="8") selectedSlot=parseInt(e.key)-1;
});
window.addEventListener("keyup",e=>keys[e.key]=false);
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  selectedSlot=(selectedSlot+(e.deltaY>0?1:-1)+HOTBAR_SLOTS)%HOTBAR_SLOTS;
},{passive:false});

// ═══════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════
const TARGET_FPS=60;
const FRAME_TIME=1000/TARGET_FPS;
let lastTime=0,frameCount=0;

function loop(timestamp) {
  requestAnimationFrame(loop);
  if(timestamp-lastTime<FRAME_TIME) return;
  lastTime=timestamp;

  player.update(keys);

  if(breaking) {
    const elapsed=Date.now()-breaking.startTime;
    if(elapsed>=breaking.duration) {
      const{bx,by}=breaking;
      if(breaking.isOneBlock){addToHotbar(getRandomDrop());}
      else{const id=world[by][bx];if(id){addToHotbar(id);world[by][bx]=null;}}
      onWorldChanged();
      breaking=null;
    }
  }

  frameCount++;
  broadcastPos();
  if(frameCount%30===0) cleanupRemote();

  ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  drawWorld();
  drawRemotePlayers();
  player.draw(isMultiplayer ? myName : null);
  drawHotbar();
}

// Settings toggle
btnSettingsToggle.addEventListener("click", e => {
  e.stopPropagation();
  settingsPanel.classList.toggle("hidden");
  if(!settingsPanel.classList.contains("hidden")) {
    settingsNameInput.value = myName;
    settingsNameInput.focus();
  }
});
document.addEventListener("click", e => {
  if(!settingsPanel.contains(e.target) && e.target !== btnSettingsToggle) {
    settingsPanel.classList.add("hidden");
  }
});
settingsPanel.addEventListener("mousedown", e => e.stopPropagation());

btnSaveName.addEventListener("click", () => {
  const n = settingsNameInput.value.trim();
  if(!n) return;
  myName = n;
  localStorage.setItem("onesquare_name", myName);
  btnSaveName.textContent = t('btnSaveNameDone');
  setTimeout(() => { btnSaveName.textContent = t('btnSaveName'); }, 1500);
});
settingsNameInput.addEventListener("keydown", e => {
  if(e.key === "Enter") btnSaveName.click();
  e.stopPropagation();
});

document.getElementById("btn-home").addEventListener("click", () => {
  window.open("https://platypuspai.github.io/pixel-games/", "_blank");
});

const fsBtn = document.getElementById("btn-fs");
fsBtn.addEventListener("click", () => {
  if(!document.fullscreenElement) {
    document.body.requestFullscreen().catch(() => {});
    fsBtn.textContent = t('btnFsExit');
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener("fullscreenchange", () => {
  if(!document.fullscreenElement) {
    fsBtn.textContent = t('btnFsEnter');
  }
});

// Start de game direct op
requestAnimationFrame(loop);
</script>
