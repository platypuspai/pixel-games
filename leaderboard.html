<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Leaderboard & Account Sync - Pixel Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --card: #1a1a28;
            --border: #2a2a42;
            --accent: #00e5ff;
            --text: #e8e8ff;
            --text-muted: #7777aa;
            --error: #ff44aa;
            --success: #00ff88;
        }

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header { margin-bottom: 20px; text-align: center; }

        h1 {
            font-family: 'Press Start 2P', monospace;
            color: var(--accent);
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            width: 100%;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-top: 3px solid var(--accent);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1rem;
            color: var(--accent);
            margin-top: 0;
            margin-bottom: 15px;
        }

        .account-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"] {
            background: var(--surface);
            border: 2px solid var(--border);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            padding: 12px;
            border-radius: 4px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            padding: 12px 18px;
            background: var(--accent);
            color: #000;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            box-shadow: 0 4px 0 #0099aa;
        }

        button:hover { background: #fff; }
        button:active { transform: translateY(3px); box-shadow: none; }

        .btn-secondary {
            background: #2a2a42;
            color: var(--text);
            box-shadow: 0 4px 0 #12121a;
        }

        .status-msg {
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 5px;
        }
        .success { color: var(--success); }
        .error { color: var(--error); }

        .code-badge {
            background: var(--surface);
            border: 1px dashed var(--accent);
            padding: 10px;
            font-family: monospace;
            word-break: break-all;
            color: var(--success);
            font-size: 0.9rem;
            border-radius: 4px;
            margin: 5px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px dashed var(--border);
            font-size: 0.9rem;
        }

        th {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            color: var(--accent);
        }

        .rank { font-weight: bold; color: var(--success); }
        
        .back-btn {
            margin-top: 20px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            text-decoration: none;
            padding: 10px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            display: inline-block;
            border-radius: 4px;
        }
        .back-btn:hover { color: #fff; border-color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <h1>PIXEL-GAMES LEADERBOARD</h1>
        <p style="color: var(--text-muted); font-size: 0.8rem;">Synchroniseer je scores op andere apparaten met je unieke Account Code!</p>
    </header>

    <div class="container">
        
        <div class="panel">
            <h2>🔑 ACCOUNT & SYNC CODE</h2>
            <div class="account-box">
                <div>
                    <label style="font-size: 0.8rem; color: var(--text-muted);">HUIDIGE SPELERSNAAM:</label>
                    <input type="text" id="playerNameInput" placeholder="Voer je naam in...">
                </div>

                <div>
                    <label style="font-size: 0.8rem; color: var(--text-muted);">JOUW UNIEKE ACCOUNT CODE:</label>
                    <div id="displayCodeBox" class="code-badge">Geen code actief</div>
                </div>

                <div class="btn-group">
                    <button onclick="saveName()">NAAM OPSLAAN</button>
                    <button class="btn-secondary" onclick="generateNewCode()">NIEUWE CODE</button>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">

                <div>
                    <label style="font-size: 0.8rem; color: var(--text-muted);">INLOGGEN MET CODE VAN ANDER APPARAAT:</label>
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <input type="text" id="codeInput" placeholder="Plak je code hier...">
                        <button onclick="loginWithCode()" style="white-space: nowrap;">INLADEN</button>
                    </div>
                </div>

                <div id="statusMessage" class="status-msg"></div>
            </div>
        </div>

        <div class="panel">
            <h2>🏆 GLOBAL HIGHSCORES</h2>
            <div style="margin-bottom: 15px;">
                <label style="font-size: 0.8rem; color: var(--text-muted);">KIES SPEL:</label>
                <select id="gameSelect" onchange="loadScores()" style="background: var(--surface); color: var(--accent); border: 1px solid var(--border); padding: 8px; font-family: 'Inconsolata', monospace; font-size: 0.9rem; border-radius: 4px; margin-left: 10px;">
                    <option value="luckyGuyScores">Lucky Guy</option>
                    <option value="snakeScores">Snake Arcade</option>
                    <option value="miniApocalypseScores">Mini Apocalypse</option>
                    <option value="bugEscapeScores">Bug Escape</option>
                    <option value="dodgingArenaScores">Dodging Arena</option>
                    <option value="scores">Money Digger</option>
                    <option value="platformerScores">Mini Platformer</option>
                </select>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>SPELER</th>
                        <th>SCORE / LEVEL</th>
                    </tr>
                </thead>
                <tbody id="scoresTableBody">
                    <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Leaderboard laden...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <a href="index.html" class="back-btn">◀ TERUG NAAR HOME</a>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9wKFVXmT6kUpuaBgwlPilF86LaKKDYFU",
            authDomain: "money-digger-9b05e.firebaseapp.com",
            databaseURL: "https://money-digger-9b05e-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "money-digger-9b05e",
            storageBucket: "money-digger-9b05e.firebasestorage.app",
            messagingSenderId: "883506536944",
            appId: "1:883506536944:web:921b342dff76154fcbbd35"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const nameInput = document.getElementById('playerNameInput');
        const codeDisplay = document.getElementById('displayCodeBox');
        const codeInput = document.getElementById('codeInput');
        const statusMsg = document.getElementById('statusMessage');
        const scoresTable = document.getElementById('scoresTableBody');

        window.addEventListener('DOMContentLoaded', () => {
            initAccount();
            loadScores();
        });

        function initAccount() {
            let currentName = localStorage.getItem('pg_player_name') || 'Speler_' + Math.floor(Math.random() * 1000);
            let currentCode = localStorage.getItem('pg_player_code');

            if (!currentCode) {
                currentCode = generateRandomCode();
                localStorage.setItem('pg_player_code', currentCode);
            }

            localStorage.setItem('pg_player_name', currentName);
            nameInput.value = currentName;
            codeDisplay.innerText = currentCode;
        }

        function generateRandomCode() {
            let array = new Uint8Array(16);
            window.crypto.getRandomValues(array);
            return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        function saveName() {
            const newName = nameInput.value.trim();
            if (!newName) {
                showStatus("Voer een geldige naam in!", false);
                return;
            }
            localStorage.setItem('pg_player_name', newName);
            showStatus("Naam succesvol opgeslagen!", true);
            updateNameInFirebase(newName);
        }

        function generateNewCode() {
            if (confirm("Weet je het zeker? Dit genereert een NIEUWE accountcode op dit apparaat.")) {
                const newCode = generateRandomCode();
                localStorage.setItem('pg_player_code', newCode);
                codeDisplay.innerText = newCode;
                showStatus("Nieuwe accountcode aangemaakt!", true);
            }
        }

        async function loginWithCode() {
            const targetCode = codeInput.value.trim().toUpperCase();
            if (!targetCode) {
                showStatus("Voer een code in om in te laden!", false);
                return;
            }

            showStatus("Zoeken op de server...", true);

            const games = ["luckyGuyScores", "snakeScores", "miniApocalypseScores", "bugEscapeScores", "dodgingArenaScores", "scores", "platformerScores"];
            let foundName = null;

            try {
                for (let gameTable of games) {
                    const snap = await db.ref(gameTable).orderByChild('code').equalTo(targetCode).once('value');
                    if (snap.exists()) {
                        snap.forEach(child => {
                            const val = child.val();
                            if (val.name) foundName = val.name;
                        });
                        if (foundName) break;
                    }
                }

                if (foundName) {
                    localStorage.setItem('pg_player_code', targetCode);
                    localStorage.setItem('pg_player_name', foundName);
                    nameInput.value = foundName;
                    codeDisplay.innerText = targetCode;
                    codeInput.value = '';
                    showStatus(`Account ingeladen! Welkom terug, ${foundName}.`, true);
                    loadScores();
                } else {
                    localStorage.setItem('pg_player_code', targetCode);
                    codeDisplay.innerText = targetCode;
                    codeInput.value = '';
                    showStatus("Code geactiveerd! Speel spellen om scores aan deze code te koppelen.", true);
                }
            } catch (e) {
                console.error("Fout bij laden code:", e);
                showStatus("Fout bij ophalen van account vanaf de server.", false);
            }
        }

        async function updateNameInFirebase(newName) {
            const currentCode = localStorage.getItem('pg_player_code');
            if (!currentCode) return;

            const games = ["luckyGuyScores", "snakeScores", "miniApocalypseScores", "bugEscapeScores", "dodgingArenaScores", "scores", "platformerScores"];
            
            for (let gameTable of games) {
                try {
                    const snap = await db.ref(gameTable).orderByChild('code').equalTo(currentCode).once('value');
                    if (snap.exists()) {
                        snap.forEach(child => {
                            child.ref.update({ name: newName });
                        });
                    }
                } catch(e) {
                    console.warn("Kon naam niet updaten in tabel:", gameTable);
                }
            }
            loadScores();
        }

        function showStatus(text, isSuccess) {
            statusMsg.innerText = text;
            statusMsg.className = "status-msg " + (isSuccess ? "success" : "error");
            setTimeout(() => { statusMsg.innerText = ""; }, 4000);
        }

        async function loadScores() {
            const selectedTable = document.getElementById('gameSelect').value;
            scoresTable.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Laden...</td></tr>';

            try {
                const snap = await db.ref(selectedTable).once('value');
                if (!snap.exists()) {
                    scoresTable.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Nog geen scores aanwezig!</td></tr>';
                    return;
                }

                let list = [];
                snap.forEach(child => {
                    const data = child.val();
                    const scoreVal = data.level || data.score || data.clicks || 0;
                    list.push({
                        name: data.name || 'Anoniem',
                        score: parseInt(scoreVal, 10),
                        code: data.code || ''
                    });
                });

                list.sort((a, b) => b.score - a.score);

                let html = '';
                const myCode = localStorage.getItem('pg_player_code');

                list.slice(0, 10).forEach((item, index) => {
                    const isMe = item.code && item.code === myCode;
                    const highlightStyle = isMe ? 'style="color: var(--accent); font-weight: bold;"' : '';
                    html += `
                        <tr ${highlightStyle}>
                            <td class="rank">#${index + 1}</td>
                            <td>${item.name}${isMe ? ' (JIJ)' : ''}</td>
                            <td>${item.score}</td>
                        </tr>
