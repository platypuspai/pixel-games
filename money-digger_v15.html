<!DOCTYPE html>

<title>Money Digger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif; background-color: #111;}
#c{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud{position:absolute;top:20px;left:20px}
#alt{font-size:2.4rem;font-weight:700;color:#fff;line-height:1;text-shadow:0 2px 24px rgba(0,0,0,.7);letter-spacing:-1px}
#unit{font-size:.88rem;font-weight:300;color:rgba(255,255,255,.6);margin-top:2px}
#nxt{margin-top:8px;font-size:.66rem;color:rgba(255,255,255,.42);max-width:240px;line-height:1.5}

#bctr{position:absolute;bottom:110px;right:28px;text-align:right}
#bnum{font-size:1.2rem;font-weight:700;color:#22c55e;font-family:'DM Mono',monospace;text-shadow:0 2px 12px rgba(34,197,94,.4)}
#blbl{font-size:.56rem;color:rgba(255,255,255,.3);margin-top:2px}
#cbtn{position:fixed;bottom:28px;right:28px;z-index:20;width:72px;height:72px;border-radius:50%;border:none;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 20px rgba(34,197,94,.5);display:flex;align-items:center;justify-content:center;animation:pulse 2.5s infinite;transition:transform .08s;pointer-events:all}
@keyframes pulse{0%,100%{box-shadow:0 4px 20px rgba(34,197,94,.5),0 0 0 0 rgba(34,197,94,.3)}70%{box-shadow:0 4px 20px rgba(34,197,94,.5),0 0 0 16px rgba(34,197,94,0)}}
#cbtn:active{transform:scale(.88);animation:none}
#online{position:absolute;bottom:28px;left:20px;font-size:.58rem;color:rgba(255,255,255,.3)}

#msb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .5s;pointer-events:none;background:rgba(0,0,0,.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px 32px}
#msb.show{opacity:1}
#mse{font-size:3.5rem}
#msn{font-size:1.3rem;font-weight:700;color:#fff;margin-top:6px}
#mss{font-size:.62rem;color:rgba(255,255,255,.5);margin-top:3px}
.fb{position:fixed;font-size:1.1rem;pointer-events:none;z-index:25;animation:fup .85s ease-out forwards}
@keyframes fup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-70px)}}

/* ── ACHIEVEMENTS & MINIGAMES BUTTONS ── */
#sp-btns{position:absolute;top:20px;right:20px;display:none;align-items:center;gap:8px;pointer-events:all}
.sp-btn{background:rgba(0,0,0,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px 13px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:.62rem;color:rgba(255,255,255,.55);transition:border-color .2s,color .2s;white-space:nowrap}
#ach-btn:hover,.sp-btn:hover{border-color:rgba(234,179,8,.4);color:#fff}
#mg-btn:hover{border-color:rgba(99,102,241,.5);color:#fff}
#ach-badge{background:#eab308;color:#000;font-size:.48rem;font-weight:700;padding:2px 5px;border-radius:99px;display:none}
#mg-badge{background:#6366f1;color:#fff;font-size:.48rem;font-weight:700;padding:2px 5px;border-radius:99px;display:none}

#ach-panel,#mg-panel{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none;padding:20px;padding-bottom:110px;padding-top:65px}
#ach-box,#mg-box{width:310px;max-height:calc(100vh - 175px);background:rgba(10,10,10,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.09);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transform:translateX(340px);transition:transform .35s cubic-bezier(.22,1,.36,1);pointer-events:all}
#ach-box.open,#mg-box.open{transform:translateX(0)}
#ach-head,#mg-head{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center}
#ach-head h2,#mg-head h2{font-size:.72rem;font-weight:700;color:#fff;letter-spacing:1.5px;text-transform:uppercase}
#ach-close,#mg-close{background:none;border:none;color:rgba(255,255,255,.3);font-size:1.1rem;cursor:pointer;line-height:1;padding:2px 4px;pointer-events:all}
#ach-close:hover,#mg-close:hover{color:#fff}
#ach-prog{padding:10px 16px 8px;font-size:.56rem;color:rgba(255,255,255,.3);display:flex;justify-content:space-between}
#ach-bar-wrap{margin:0 16px 10px;height:3px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
#ach-bar{height:100%;background:linear-gradient(90deg,#ca8a04,#eab308);border-radius:99px;transition:width .4s}
#ach-list{overflow-y:auto;padding:6px 10px 14px;display:flex;flex-direction:column;gap:5px}
.ach-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);transition:background .2s}
.ach-row.unlocked{background:rgba(234,179,8,.06);border-color:rgba(234,179,8,.18)}
.ach-icon{font-size:1.5rem;flex-shrink:0;width:32px;text-align:center;filter:grayscale(1) opacity(.25)}
.ach-row.unlocked .ach-icon{filter:none}
.ach-info{flex:1;min-width:0}
.ach-name{font-size:.65rem;font-weight:700;color:rgba(255,255,255,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach-row.unlocked .ach-name{color:#fde047}
.ach-desc{font-size:.54rem;color:rgba(255,255,255,.22);margin-top:2px;line-height:1.4}
.ach-row.unlocked .ach-desc{color:rgba(255,255,255,.45)}
.ach-check{font-size:.9rem;opacity:0}
.ach-row.unlocked .ach-check{opacity:1}

#mg-list{overflow-y:auto;padding:8px 10px 14px;display:flex;flex-direction:column;gap:6px}
.mg-row{border-radius:12px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);transition:border-color .2s}
.mg-row.unlocked{border-color:rgba(99,102,241,.25);background:rgba(99,102,241,.05)}
.mg-row.locked .mg-play{display:none}
.mg-header{display:flex;align-items:center;gap:9px;padding:9px 11px}
.mg-hicon{font-size:1.4rem;flex-shrink:0}
.mg-hinfo{flex:1;min-width:0}
.mg-hname{font-size:.65rem;font-weight:700;color:rgba(255,255,255,.3)}
.mg-row.unlocked .mg-hname{color:#a5b4fc}
.mg-hlock{font-size:.52rem;color:rgba(255,255,255,.2);margin-top:2px}
.mg-row.unlocked .mg-hlock{color:rgba(99,102,241,.6)}
.mg-play{background:rgba(99,102,241,.18);border:1px solid rgba(99,102,241,.35);color:#a5b4fc;font-size:.58rem;font-weight:700;border-radius:7px;padding:5px 11px;cursor:pointer;pointer-events:all;transition:background .15s;white-space:nowrap;flex-shrink:0}
.mg-play:hover{background:rgba(99,102,241,.35)}
.mg-game{padding:0 11px 14px;display:none}
.mg-row.playing .mg-game{display:block}
.mg-canvas{width:100%;border-radius:8px;background:#000;display:block;image-rendering:pixelated}
.mg-score{font-size:.55rem;color:rgba(99,102,241,.7);text-align:right;margin-top:5px;margin-bottom:2px;font-family:'DM Mono',monospace;padding:0 2px;white-space:nowrap;display:block}

#ach-toast{position:fixed;bottom:114px;right:28px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.ach-toast-item{background:rgba(10,10,10,.95);border:1px solid rgba(234,179,8,.4);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;animation:ach-in .4s cubic-bezier(.22,1,.36,1) forwards}
@keyframes ach-in{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
.ach-toast-item.out{animation:ach-out .35s ease-in forwards}
@keyframes ach-out{to{opacity:0;transform:translateX(60px)}}

// ═══════════════════════════════

function fmtN(n){
  if(n>=1e15) return(n/1e15).toFixed(2)+'P';
  if(n>=1e12) return(n/1e12).toFixed(2)+'T';
  if(n>=1e9)  return(n/1e9).toFixed(2)+'B';
  if(n>=1e6)  return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)  return(n/1e3).toFixed(1)+'K';
  return n.toLocaleString('nl-NL');
}
function fmtH(m){
  if(m>=1e12)  return(m/1e12).toFixed(3)+' Tm';
  if(m>=1e9)   return(m/1e9).toFixed(3)+' Gm';
  if(m>=1e6)   return(m/1e6).toFixed(3)+' Mm';
  if(m>=1000)  return(m/1000).toFixed(3)+' km';
  if(m>=1)     return m.toFixed(3)+' m';
  if(m>=0.01)  return(m*100).toFixed(2)+' cm';
  return(m*1000).toFixed(2)+' mm';
}

function drawSky(altM){
  const t  = Math.min(1, altM/100000);
  const r0 = Math.round(20*(1-t)),  g0 = Math.round(42*(1-t)),  b0 = Math.round(58*(1-t));
  const r1 = Math.round(135*(1-t)+2*t), g1 = Math.round(186*(1-t)+5*t), b1 = Math.round(235*(1-t)+18*t);
  const sg = ctx.createLinearGradient(0, 0, 0, GY);
  sg.addColorStop(0, `rgb(${r0},${g0},${b0})`);
  sg.addColorStop(1, `rgb(${r1},${g1},${b1})`);
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, GY);
}

function drawGround(altM){
  const ag = ctx.createLinearGradient(0,GY,0,H);
  ag.addColorStop(0,'#1c1c1c'); ag.addColorStop(.3,'#242424'); ag.addColorStop(1,'#111');
  ctx.fillStyle = ag;
  ctx.fillRect(0, GY, W, H-GY);
}

function drawStack(bills){
  if(bills <= 0) return;
  const cx   = W/2;
  const maxH = H * 0.38;
  const sh   = Math.min(bills * 0.5, maxH);
  const top  = GY - sh;
  const sw   = 110, depth = 20;

  const ff = ctx.createLinearGradient(cx,top,cx,GY);
  ff.addColorStop(0,'#166534'); ff.addColorStop(.3,'#22c55e');
  ff.addColorStop(.7,'#16a34a'); ff.addColorStop(1,'#14532d');
  ctx.fillStyle = ff;
  ctx.fillRect(cx-sw/2, top, sw, sh);

  const tf = ctx.createLinearGradient(cx-sw/2,top,cx+sw/2+depth,top-depth*.5);
  tf.addColorStop(0,'#4ade80'); tf.addColorStop(.5,'#86efac'); tf.addColorStop(1,'#22c55e');
  ctx.fillStyle = tf;
  ctx.beginPath();
  ctx.moveTo(cx-sw/2,top); ctx.lineTo(cx+sw/2,top);
  ctx.lineTo(cx+sw/2+depth,top-depth*.5); ctx.lineTo(cx-sw/2+depth,top-depth*.5);
  ctx.closePath(); ctx.fill();
}

function drawObjects(bills){
  if(bills <= 0) return;
  const altM    = bills * BILL_M;
  const maxH    = H * 0.38;
  const pxPerM  = maxH / Math.max(altM, BILL_M);
  const stackCX = W/2;
  const stackSW = 110, stackDepth = 20;
  
  const stackR  = stackCX + stackSW/2 + stackDepth + 14;
  const stackL  = stackCX - stackSW/2 - 14;
  
  const stackPx = Math.min(bills * 0.5, maxH);
  const MIN_PX  = Math.max(15, stackPx * 0.25);  

  const vis = [];
  for(let i=0;i<OBJECTS.length;i++){
    const obj   = OBJECTS[i];
    const ph    = obj.m * pxPerM;
    const ratio = obj.m / altM;
    
    if(ratio > 8) break;
    if(ratio < 0.0001) continue; 
    
    const drawH = Math.min(ph, H*0.9);
    if(drawH < MIN_PX) continue; 

    const opIn  = Math.min(1,(ratio-0.0005)/0.03);
    const opOut = Math.min(1,(8-ratio)/3);
    const opacity = opIn * opOut;
    
    const emojiW = Math.max(drawH * 0.65, 30); 
    vis.push({obj, drawH, emojiW, ratio, opacity});
  }
  if(!vis.length) return;

  const smaller = vis.filter(v=>v.ratio<=1).sort((a,b)=>b.ratio-a.ratio); 
  const bigger  = vis.filter(v=>v.ratio>1).sort((a,b)=>a.ratio-b.ratio);  

  let gapL = 16; 
  if(smaller.length > 0){
    const totW = smaller.reduce((sum, v) => sum + v.emojiW, 0);
    if(totW + smaller.length * 16 < stackL){
      gapL = (stackL - totW) / smaller.length;
    }
  }

  let curX = stackL;
  for(const v of smaller){
    curX -= gapL / 2;
    const cx2 = curX - v.emojiW / 2;
    if(cx2 + v.emojiW / 2 < 0) break; 
    drawOneObject(v, cx2);
    curX -= v.emojiW; 
    curX -= gapL / 2; 
  }

  const rightAvail = W - stackR; 
  let gapR = 16;
  if(bigger.length > 0){
    const totW = bigger.reduce((sum, v) => sum + v.emojiW, 0);
    if(totW + bigger.length * 16 < rightAvail){
      gapR = (rightAvail - totW) / bigger.length;
    }
  }

  curX = stackR;
  for(const v of bigger){
    curX += gapR / 2;
    const cx2 = curX + v.emojiW / 2;
    if(cx2 - v.emojiW / 2 > W) break;
    drawOneObject(v, cx2);
    curX += v.emojiW;
    curX += gapR / 2;
  }
}

function drawOneObject(v, cx2){
  const {obj, drawH, opacity} = v;
  ctx.save();
  ctx.globalAlpha = Math.max(0.04, opacity);
  const shRX = drawH*0.28, shRY = Math.max(3, drawH*0.036);
  const shg = ctx.createRadialGradient(cx2,GY,0,cx2,GY,shRX);
  shg.addColorStop(0,'rgba(0,0,0,.4)'); shg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = shg;
  ctx.beginPath(); ctx.ellipse(cx2,GY+shRY*.4,shRX,shRY,0,0,Math.PI*2); ctx.fill();

  const fs = Math.min(drawH, 500);
  ctx.font = `${fs}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(obj.emoji, cx2, GY);
  ctx.restore();
}

function updateHUD(){

  if(altM>=1e9){ae.textContent=(altM/1e9).toFixed(3);ue.textContent='gigameter';}
  else if(altM>=1e6){ae.textContent=(altM/1e6).toFixed(3);ue.textContent='megameter';}
  else if(altM>=1000){ae.textContent=(altM/1000).toFixed(4);ue.textContent='kilometer';}
  else if(altM>=1){ae.textContent=altM.toFixed(4);ue.textContent='meter';}
  else if(altM>=.01){ae.textContent=(altM*100).toFixed(3);ue.textContent='centimeter';}
  else{ae.textContent=(altM*1000).toFixed(3);ue.textContent=t('unitMm');}

  let next = null;
  for(const o of OBJECTS) if(o.m > altM){ next=o; break; }
  document.getElementById('nxt').textContent = next
    ? `${next.emoji} ${next.label} — ${fmtN(Math.ceil((next.m-altM)/BILL_M))} clicks left`
    : t('beyondMilestones');

  for(const obj of OBJECTS){
    if(obj.m > 0 && altM >= obj.m && !shownMS.has(obj.label)){
      shownMS.add(obj.label);
      safeSetLS('md6_m', JSON.stringify([...shownMS]));
      showBanner(obj);
      break;
    }
  }
}

function getAchState(){
  const now = Date.now();

  return {
    clicks: totalBills,
    altM: totalBills * BILL_M,
    playSeconds: spPlaySeconds,
    recentClicks: recentClickBuf.length,
    returnVisit: !!safeGetLS('md6_sp_bills', '') && parseInt(safeGetLS('md6_sp_bills','0')) > 0

function checkAchievements(){
  if(gameMode !== 'sp') return;
  const state = getAchState();
  for(const ach of ACHIEVEMENTS){

      unlockedAch.add(ach.id);

      showAchToast(ach);

      updateAchBadge();
      renderAchPanel();
