<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Money Digger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif; background-color: #111;}
#c{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud{position:absolute;top:20px;left:20px}
#alt{font-size:2.4rem;font-weight:700;color:#fff;line-height:1;text-shadow:0 2px 24px rgba(0,0,0,.7);letter-spacing:-1px}
#unit{font-size:.88rem;font-weight:300;color:rgba(255,255,255,.6);margin-top:2px}
#nxt{margin-top:8px;font-size:.66rem;color:rgba(255,255,255,.42);max-width:240px;line-height:1.5}






#bctr{position:absolute;bottom:110px;right:28px;text-align:right}
#bnum{font-size:1.2rem;font-weight:700;color:#22c55e;font-family:'DM Mono',monospace;text-shadow:0 2px 12px rgba(34,197,94,.4)}
#blbl{font-size:.56rem;color:rgba(255,255,255,.3);margin-top:2px}
#cbtn{position:fixed;bottom:28px;right:28px;z-index:20;width:72px;height:72px;border-radius:50%;border:none;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 20px rgba(34,197,94,.5);display:flex;align-items:center;justify-content:center;animation:pulse 2.5s infinite;transition:transform .08s;pointer-events:all}
@keyframes pulse{0%,100%{box-shadow:0 4px 20px rgba(34,197,94,.5),0 0 0 0 rgba(34,197,94,.3)}70%{box-shadow:0 4px 20px rgba(34,197,94,.5),0 0 0 16px rgba(34,197,94,0)}}
#cbtn:active{transform:scale(.88);animation:none}
#online{position:absolute;bottom:28px;left:20px;font-size:.58rem;color:rgba(255,255,255,.3)}



#msb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .5s;pointer-events:none;background:rgba(0,0,0,.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px 32px}
#msb.show{opacity:1}
#mse{font-size:3.5rem}
#msn{font-size:1.3rem;font-weight:700;color:#fff;margin-top:6px}
#mss{font-size:.62rem;color:rgba(255,255,255,.5);margin-top:3px}
.fb{position:fixed;font-size:1.1rem;pointer-events:none;z-index:25;animation:fup .85s ease-out forwards}
@keyframes fup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-70px)}}

/* ── ACHIEVEMENTS & MINIGAMES BUTTONS ── */
#sp-btns{position:absolute;top:20px;right:20px;display:none;align-items:center;gap:8px;pointer-events:all}
.sp-btn{background:rgba(0,0,0,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px 13px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:.62rem;color:rgba(255,255,255,.55);transition:border-color .2s,color .2s;white-space:nowrap}
#ach-btn:hover,.sp-btn:hover{border-color:rgba(234,179,8,.4);color:#fff}
#mg-btn:hover{border-color:rgba(99,102,241,.5);color:#fff}
#ach-badge{background:#eab308;color:#000;font-size:.48rem;font-weight:700;padding:2px 5px;border-radius:99px;display:none}
#mg-badge{background:#6366f1;color:#fff;font-size:.48rem;font-weight:700;padding:2px 5px;border-radius:99px;display:none}

/* shared panel base */
#ach-panel,#mg-panel{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none;padding:20px;padding-bottom:110px;padding-top:65px}
#ach-box,#mg-box{width:310px;max-height:calc(100vh - 175px);background:rgba(10,10,10,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.09);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transform:translateX(340px);transition:transform .35s cubic-bezier(.22,1,.36,1);pointer-events:all}
#ach-box.open,#mg-box.open{transform:translateX(0)}
#ach-head,#mg-head{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center}
#ach-head h2,#mg-head h2{font-size:.72rem;font-weight:700;color:#fff;letter-spacing:1.5px;text-transform:uppercase}
#ach-close,#mg-close{background:none;border:none;color:rgba(255,255,255,.3);font-size:1.1rem;cursor:pointer;line-height:1;padding:2px 4px;pointer-events:all}
#ach-close:hover,#mg-close:hover{color:#fff}
#ach-prog{padding:10px 16px 8px;font-size:.56rem;color:rgba(255,255,255,.3);display:flex;justify-content:space-between}
#ach-bar-wrap{margin:0 16px 10px;height:3px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
#ach-bar{height:100%;background:linear-gradient(90deg,#ca8a04,#eab308);border-radius:99px;transition:width .4s}
#ach-list{overflow-y:auto;padding:6px 10px 14px;display:flex;flex-direction:column;gap:5px}
.ach-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);transition:background .2s}
.ach-row.unlocked{background:rgba(234,179,8,.06);border-color:rgba(234,179,8,.18)}
.ach-icon{font-size:1.5rem;flex-shrink:0;width:32px;text-align:center;filter:grayscale(1) opacity(.25)}
.ach-row.unlocked .ach-icon{filter:none}
.ach-info{flex:1;min-width:0}
.ach-name{font-size:.65rem;font-weight:700;color:rgba(255,255,255,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach-row.unlocked .ach-name{color:#fde047}
.ach-desc{font-size:.54rem;color:rgba(255,255,255,.22);margin-top:2px;line-height:1.4}
.ach-row.unlocked .ach-desc{color:rgba(255,255,255,.45)}
.ach-check{font-size:.9rem;opacity:0}
.ach-row.unlocked .ach-check{opacity:1}

/* mini game panel */
#mg-list{overflow-y:auto;padding:8px 10px 14px;display:flex;flex-direction:column;gap:6px}
.mg-row{border-radius:12px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);transition:border-color .2s}
.mg-row.unlocked{border-color:rgba(99,102,241,.25);background:rgba(99,102,241,.05)}
.mg-row.locked .mg-play{display:none}
.mg-header{display:flex;align-items:center;gap:9px;padding:9px 11px}
.mg-hicon{font-size:1.4rem;flex-shrink:0}
.mg-hinfo{flex:1;min-width:0}
.mg-hname{font-size:.65rem;font-weight:700;color:rgba(255,255,255,.3)}
.mg-row.unlocked .mg-hname{color:#a5b4fc}
.mg-hlock{font-size:.52rem;color:rgba(255,255,255,.2);margin-top:2px}
.mg-row.unlocked .mg-hlock{color:rgba(99,102,241,.6)}
.mg-play{background:rgba(99,102,241,.18);border:1px solid rgba(99,102,241,.35);color:#a5b4fc;font-size:.58rem;font-weight:700;border-radius:7px;padding:5px 11px;cursor:pointer;pointer-events:all;transition:background .15s;white-space:nowrap;flex-shrink:0}
.mg-play:hover{background:rgba(99,102,241,.35)}
/* inline game canvas area */
.mg-game{padding:0 11px 14px;display:none}
.mg-row.playing .mg-game{display:block}
.mg-canvas{width:100%;border-radius:8px;background:#000;display:block;image-rendering:pixelated}
.mg-score{font-size:.55rem;color:rgba(99,102,241,.7);text-align:right;margin-top:5px;margin-bottom:2px;font-family:'DM Mono',monospace;padding:0 2px;white-space:nowrap;display:block}

/* toasts */
#ach-toast{position:fixed;bottom:114px;right:28px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.ach-toast-item{background:rgba(10,10,10,.95);border:1px solid rgba(234,179,8,.4);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;animation:ach-in .4s cubic-bezier(.22,1,.36,1) forwards}
@keyframes ach-in{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
.ach-toast-item.out{animation:ach-out .35s ease-in forwards}

.mcard.mp .mcard-title{color:#22c55e}

</style>

</div>

<script>
// ═══════════════════════════════
// SAFE STORAGE
// ═══════════════════════════════
function safeGetLS(key, def) { try { return localStorage.getItem(key) || def; } catch(e) { return def; } }
function safeSetLS(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

// ═══════════════════════════════
// CONSTANTS
// ═══════════════════════════════
const BILL_M = 0.0001; 

const OBJECTS = [
  {m:0.001,   label:'Ant', emoji:'🐜'},

  {m:5500,    label:'Oxygen dropped to 50%', emoji:'😮‍💨'},
  {m:6500,    label:'65 football fields stacked on top of each other', emoji:'⚽'},
  {m:7000,    label:'Death zone', emoji:'💀'},

  {m:26000,   label:'SR-71 Blackbird maximum height', emoji:'✈️'},
  {m:38969,   label:'Felix Baumgartner', emoji:'🪂'},
  {m:100000,  label:'Kármán line (space)', emoji:'🌌'},
  {m:408000,  label:'ISS Space Station', emoji:'🛸'},
  {m:384400000, label:'The moon', emoji:'🌕'},
  {m:149600000000, label:'The sun', emoji:'☀️'}
];

// ═══════════════════════════════
// STATE
// ═══════════════════════════════
let totalBills   = 0;
let displayBills = 0;
let cloudT       = 0;

let deviceId = safeGetLS('md6_did', '');
if(!deviceId){ deviceId = 'dev-'+Math.random().toString(36).slice(2,12); safeSetLS('md6_did',deviceId); }
let myName = safeGetLS('pg_player_name','') || safeGetLS('md6_n','Speler'+Math.floor(Math.random()*9000+1000));
safeSetLS('md6_n', myName);
let myClicks = 0;
let scores   = {};

let shownMS = new Set();
try { shownMS = new Set(JSON.parse(safeGetLS('md6_m', '[]'))); } catch(e){}

// ═══════════════════════════════
// CANVAS
// ═══════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0, GY = 0;

function resize(){
  W  = canvas.width  = window.innerWidth;
  H  = canvas.height = window.innerHeight;
  GY = Math.round(H * 0.72);
}
resize();
window.addEventListener('resize', resize);

// ═══════════════════════════════
// HELPERS
// ═══════════════════════════════
function fmtN(n){
  if(n>=1e15) return(n/1e15).toFixed(2)+'P';
  if(n>=1e12) return(n/1e12).toFixed(2)+'T';
  if(n>=1e9)  return(n/1e9).toFixed(2)+'B';
  if(n>=1e6)  return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)  return(n/1e3).toFixed(1)+'K';
  return n.toLocaleString('nl-NL');
}
function fmtH(m){
  if(m>=1e12)  return(m/1e12).toFixed(3)+' Tm';
  if(m>=1e9)   return(m/1e9).toFixed(3)+' Gm';
  if(m>=1e6)   return(m/1e6).toFixed(3)+' Mm';
  if(m>=1000)  return(m/1000).toFixed(3)+' km';
  if(m>=1)     return m.toFixed(3)+' m';
  if(m>=0.01)  return(m*100).toFixed(2)+' cm';
  return(m*1000).toFixed(2)+' mm';
}

// ═══════════════════════════════
// DRAW SKY & GROUND
// ═══════════════════════════════
function drawSky(altM){
  const t  = Math.min(1, altM/100000);
  const r0 = Math.round(20*(1-t)),  g0 = Math.round(42*(1-t)),  b0 = Math.round(58*(1-t));
  const r1 = Math.round(135*(1-t)+2*t), g1 = Math.round(186*(1-t)+5*t), b1 = Math.round(235*(1-t)+18*t);
  const sg = ctx.createLinearGradient(0, 0, 0, GY);
  sg.addColorStop(0, `rgb(${r0},${g0},${b0})`);
  sg.addColorStop(1, `rgb(${r1},${g1},${b1})`);
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, GY);

  const sa = Math.min(1, Math.max(0,(altM-30000)/70000));
  if(sa > 0){
    ctx.save(); ctx.globalAlpha = sa;
    for(let i=0;i<200;i++){
      const f = 0.5+0.5*Math.sin(Date.now()*.001+i);
      ctx.fillStyle = `rgba(255,255,255,${f*(0.3+(i%3)*.25)})`;
      ctx.beginPath();
      ctx.arc((i*137.5+50)%W,(i*97.3+10)%(GY*.9),0.4+(i%4)*.35,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  const ca = Math.min(Math.max(0,(altM-1500)/500), Math.max(0,1-(altM-12000)/3000));
  if(ca > 0){
    ctx.save(); ctx.globalAlpha = ca*.88;
    cloudT += 0.00015;
    const cd = [{x:.07,y:.26,s:90},{x:.3,y:.36,s:110},{x:.56,y:.2,s:75},{x:.76,y:.3,s:92},{x:.48,y:.44,s:65}];
    for(const c of cd){
      const cx = ((c.x+cloudT*.05)%1.15)*W, cy = c.y*GY;
      ctx.fillStyle='rgba(150,160,180,.3)';
      ctx.beginPath(); ctx.ellipse(cx,cy+c.s*.18,c.s*.7,c.s*.16,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.96)';
      ctx.beginPath();
      ctx.arc(cx,cy,c.s*.38,0,Math.PI*2);
      ctx.arc(cx+c.s*.36,cy-c.s*.1,c.s*.3,0,Math.PI*2);
      ctx.arc(cx-c.s*.3,cy+c.s*.06,c.s*.25,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawGround(altM){
  const ag = ctx.createLinearGradient(0,GY,0,H);
  ag.addColorStop(0,'#1c1c1c'); ag.addColorStop(.3,'#242424'); ag.addColorStop(1,'#111');
  ctx.fillStyle = ag;
  ctx.fillRect(0, GY, W, H-GY);
}

// ═══════════════════════════════
// DRAW STACK
// ═══════════════════════════════
function drawStack(bills){
  if(bills <= 0) return;
  const cx   = W/2;
  const maxH = H * 0.38;
  const sh   = Math.min(bills * 0.5, maxH);
  const top  = GY - sh;
  const sw   = 110, depth = 20;

  const shg = ctx.createRadialGradient(cx+depth*.4,GY+4,0,cx+depth*.4,GY+4,sw*.7);
  shg.addColorStop(0,'rgba(0,0,0,.5)'); shg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = shg;
  ctx.beginPath(); ctx.ellipse(cx+depth*.4,GY+4,sw*.7,10,0,0,Math.PI*2); ctx.fill();

  const rf = ctx.createLinearGradient(cx+sw/2,top,cx+sw/2+depth,top-depth*.5);
  rf.addColorStop(0,'#14532d'); rf.addColorStop(1,'#052e16');
  ctx.fillStyle = rf;
  ctx.beginPath();
  ctx.moveTo(cx+sw/2,top); ctx.lineTo(cx+sw/2+depth,top-depth*.5);
  ctx.lineTo(cx+sw/2+depth,GY-depth*.5); ctx.lineTo(cx+sw/2,GY); ctx.fill();

  const ff = ctx.createLinearGradient(cx,top,cx,GY);
  ff.addColorStop(0,'#166534'); ff.addColorStop(.3,'#22c55e');
  ff.addColorStop(.7,'#16a34a'); ff.addColorStop(1,'#14532d');
  ctx.fillStyle = ff;
  ctx.fillRect(cx-sw/2, top, sw, sh);

  const le = Math.max(1, Math.floor(sh/Math.min(100,bills)));
  ctx.strokeStyle='rgba(0,60,20,.22)'; ctx.lineWidth=.5;
  for(let y=GY;y>top;y-=le){
    ctx.beginPath(); ctx.moveTo(cx-sw/2,y); ctx.lineTo(cx+sw/2,y); ctx.stroke();
  }

  if(sh > 20){
    ctx.fillStyle='rgba(255,255,255,.1)';
    ctx.font=`bold ${Math.min(36,sh*.26)}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('$1', cx, top+sh*.52);
    ctx.strokeStyle='rgba(0,80,20,.15)'; ctx.lineWidth=1;
    ctx.strokeRect(cx-sw/2+3,top+3,sw-6,sh-6);
  }

  const tf = ctx.createLinearGradient(cx-sw/2,top,cx+sw/2+depth,top-depth*.5);
  tf.addColorStop(0,'#4ade80'); tf.addColorStop(.5,'#86efac'); tf.addColorStop(1,'#22c55e');
  ctx.fillStyle = tf;
  ctx.beginPath();
  ctx.moveTo(cx-sw/2,top); ctx.lineTo(cx+sw/2,top);
  ctx.lineTo(cx+sw/2+depth,top-depth*.5); ctx.lineTo(cx-sw/2+depth,top-depth*.5);
  ctx.closePath(); ctx.fill();

  ctx.save();
  ctx.shadowColor='#22c55e'; ctx.shadowBlur=14;
  ctx.strokeStyle='rgba(34,197,94,.28)'; ctx.lineWidth=1;
  ctx.strokeRect(cx-sw/2,top,sw,sh);
  ctx.restore();

  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1; ctx.setLineDash([2,6]);
  const lx = cx-sw/2-26;
  ctx.beginPath(); ctx.moveTo(lx,top); ctx.lineTo(cx-sw/2-10,top); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lx,GY); ctx.lineTo(cx-sw/2-10,GY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lx,top); ctx.lineTo(lx,GY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.4)';
  ctx.font='9px DM Mono,monospace';
  ctx.textAlign='right'; ctx.textBaseline='middle';
  ctx.fillText(fmtH(bills*BILL_M), lx-4, top+sh*.5);
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

// DRAW OBJECTS 
// ═══════════════════════════════
function drawObjects(bills){
  if(bills <= 0) return;
  const altM    = bills * BILL_M;
  const maxH    = H * 0.38;
  const pxPerM  = maxH / Math.max(altM, BILL_M);
  const stackCX = W/2;
  const stackSW = 110, stackDepth = 20;
  
  const stackR  = stackCX + stackSW/2 + stackDepth + 14;
  const stackL  = stackCX - stackSW/2 - 14;
  
  const stackPx = Math.min(bills * 0.5, maxH);
  const MIN_PX  = Math.max(15, stackPx * 0.25);  

  const vis = [];
  for(let i=0;i<OBJECTS.length;i++){
    const obj   = OBJECTS[i];
    const ph    = obj.m * pxPerM;
    const ratio = obj.m / altM;
    
    if(ratio > 8) break;
    if(ratio < 0.0001) continue; 
    
    const drawH = Math.min(ph, H*0.9);
    if(drawH < MIN_PX) continue; 

    const opIn  = Math.min(1,(ratio-0.0005)/0.03);
    const opOut = Math.min(1,(8-ratio)/3);
    const opacity = opIn * opOut;
    
    const emojiW = Math.max(drawH * 0.65, 30); 
    vis.push({obj, drawH, emojiW, ratio, opacity});
  }
  if(!vis.length) return;

  const smaller = vis.filter(v=>v.ratio<=1).sort((a,b)=>b.ratio-a.ratio); 
  const bigger  = vis.filter(v=>v.ratio>1).sort((a,b)=>a.ratio-b.ratio);  

  let gapL = 16; 
  if(smaller.length > 0){
    const totW = smaller.reduce((sum, v) => sum + v.emojiW, 0);
    if(totW + smaller.length * 16 < stackL){
      gapL = (stackL - totW) / smaller.length;
    }
  }

  let curX = stackL;
  for(const v of smaller){
    curX -= gapL / 2;
    const cx2 = curX - v.emojiW / 2;
    if(cx2 + v.emojiW / 2 < 0) break; 
    
    drawOneObject(v, cx2);
    
    curX -= v.emojiW; 
    curX -= gapL / 2; 
  }

  const rightAvail = W - stackR; 
  let gapR = 16;
  if(bigger.length > 0){
    const totW = bigger.reduce((sum, v) => sum + v.emojiW, 0);
    if(totW + bigger.length * 16 < rightAvail){
      gapR = (rightAvail - totW) / bigger.length;
    }
  }

  curX = stackR;
  for(const v of bigger){
    curX += gapR / 2;
    const cx2 = curX + v.emojiW / 2;
    if(cx2 - v.emojiW / 2 > W) break;
    
    drawOneObject(v, cx2);
    
    curX += v.emojiW;
    curX += gapR / 2;
  }
}

function drawOneObject(v, cx2){
  const {obj, drawH, opacity} = v;
  ctx.save();
  ctx.globalAlpha = Math.max(0.04, opacity);

  const shRX = drawH*0.28, shRY = Math.max(3, drawH*0.036);
  const shg = ctx.createRadialGradient(cx2,GY,0,cx2,GY,shRX);
  shg.addColorStop(0,'rgba(0,0,0,.4)'); shg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = shg;
  ctx.beginPath(); ctx.ellipse(cx2,GY+shRY*.4,shRX,shRY,0,0,Math.PI*2); ctx.fill();

  const fs = Math.min(drawH, 500);
  ctx.font = `${fs}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(obj.emoji, cx2, GY);

  if(drawH > 14){
    const lblSz = Math.min(13, Math.max(8, 8+drawH*.07));
    ctx.font = `600 ${lblSz}px DM Sans,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const tw = ctx.measureText(obj.label).width;
    const pad = 5, ph2 = lblSz+pad;
    
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    if(ctx.roundRect){
      ctx.beginPath(); ctx.roundRect(cx2-tw/2-pad, GY+4, tw+pad*2, ph2, ph2/2); ctx.fill();
    } else {
      ctx.fillRect(cx2-tw/2-pad, GY+4, tw+pad*2, ph2); 
    }
    
    ctx.fillStyle = '#fff';
    ctx.fillText(obj.label, cx2, GY+4+pad/2);
    
    // Show exact height below the label
    ctx.font = `${Math.max(8, lblSz - 2)}px DM Mono,monospace`;
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText(fmtH(obj.m), cx2, GY + 4 + ph2 + 2);
  }
  ctx.restore();
}

// ── GAME 1: Muizen vangen ─────────────────────────────
function buildMouseCannonGame(container, id){
  const W=288, H=170;
  container.innerHTML=`<canvas class="mg-canvas" id="mgc-${id}" width="${W}" height="${H}"></canvas><div class="mg-score" id="mgs-${id}">Score: 0 · Best: ${safeGetLS('mg_hi_'+id,'0')}</div>`;
  const cv=document.getElementById('mgc-'+id);
  const ctx=cv.getContext('2d');
  let score=0, t=0, running=true;
  let mice=[];

  function spawnMouse(){
    mice.push({
      x: Math.random()*(W-30)+15,
      y: Math.random()*(H-30)+15,
      vx: (Math.random()-.5)*2.6,
      vy: (Math.random()-.5)*2.6,
      r: 14,
      life: 200+Math.floor(Math.random()*80),
      maxLife: 280,
    });
  }

  for(let i=0;i<3;i++) spawnMouse();

  cv.addEventListener('click', e=>{
    const rect=cv.getBoundingClientRect();
    const sx=(e.clientX-rect.left)*(W/rect.width);
    const sy=(e.clientY-rect.top)*(H/rect.height);
    let caught=false;
    mice=mice.filter(m=>{
      if(!caught && Math.hypot(sx-m.x,sy-m.y)<m.r+10){ score++; caught=true; return false; }
      return true;
    });
  });

  function loop(){
    if(!running) return;
    t++;
    if(t%70===0) spawnMouse();
    if(mice.length>10) mice.shift();

    ctx.fillStyle='#0e1a10'; ctx.fillRect(0,0,W,H);

    // grid lines for depth
    ctx.strokeStyle='rgba(255,255,255,.03)'; ctx.lineWidth=1;
    for(let gx=0;gx<W;gx+=32){ ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke(); }
    for(let gy=0;gy<H;gy+=32){ ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke(); }

    mice=mice.filter(m=>{ 
      m.life--;
      if(m.life<=0){ score=0; return false; }
      return true;
    });
    for(const m of mice){
      m.x+=m.vx; m.y+=m.vy;
      if(m.x<m.r||m.x>W-m.r){ m.vx*=-1; m.x=Math.max(m.r,Math.min(W-m.r,m.x)); }
      if(m.y<m.r||m.y>H-m.r){ m.vy*=-1; m.y=Math.max(m.r,Math.min(H-m.r,m.y)); }

      const fade=Math.min(1, m.life/40);
      ctx.globalAlpha=fade;
      ctx.font='26px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🐭',m.x,m.y);
      // life ring
      ctx.beginPath();
      ctx.arc(m.x,m.y,m.r+3, -Math.PI/2, -Math.PI/2 + Math.PI*2*(m.life/m.maxLife));
      ctx.strokeStyle='#22c55e'; ctx.lineWidth=2; ctx.stroke();
      ctx.globalAlpha=1;
    }

    ctx.font='9px DM Mono,monospace'; ctx.fillStyle='rgba(255,255,255,.22)'; ctx.textAlign='left';
    ctx.fillText(`Mice: ${mice.length}`, 6, 13);

// ── GAME 2: Basketball shoot ──────────────────────────
function buildBasketballGame(container, id){
  const W=288, H=200;
  container.innerHTML=`<canvas class="mg-canvas" id="mgc-${id}" width="${W}" height="${H}"></canvas>`;
  const cv=document.getElementById('mgc-'+id);
  const ctx=cv.getContext('2d');

  const GRAVITY = 0.38;
  const BALL_R  = 11;
  const HOOP_X  = W-70, HOOP_Y=65, HOOP_W=42, RIM_R=5;

  let score=0, running=true;
  let ball={ x:44, y:H-30, vx:0, vy:0, flying:false };
  let dragStart=null, dragCur=null;
  let streak=0; // consecutive makes for streak bonus

  // trajectory preview dots
  function previewPoints(sx,sy,vx,vy,n=28){
    const pts=[];
    let px=sx,py=sy,pvx=vx,pvy=vy;
    for(let i=0;i<n;i++){
      pvy+=GRAVITY; px+=pvx; py+=pvy;
      pts.push({x:px,y:py});
      if(py>H) break;
    }
    return pts;
  }

  function dragVel(){
    if(!dragStart||!dragCur) return {vx:0,vy:0};
    const dx=(dragStart.x-dragCur.x)*0.09;
    const dy=(dragStart.y-dragCur.y)*0.09;
    return {vx:dx, vy:dy};
  }

  function getPos(e){
    const r=cv.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    return {x:(src.clientX-r.left)*(W/r.width), y:(src.clientY-r.top)*(H/r.height)};
  }

  cv.addEventListener('mousedown', e=>{ if(!ball.flying){ dragStart=getPos(e); dragCur=getPos(e); } });
  cv.addEventListener('mousemove', e=>{ if(dragStart&&!ball.flying) dragCur=getPos(e); });
  cv.addEventListener('mouseup',   e=>{ if(dragStart&&!ball.flying){ launch(); } });
  cv.addEventListener('touchstart', e=>{ e.preventDefault(); if(!ball.flying){ dragStart=getPos(e); dragCur=getPos(e); } },{passive:false});
  cv.addEventListener('touchmove',  e=>{ e.preventDefault(); if(dragStart&&!ball.flying) dragCur=getPos(e); },{passive:false});
  cv.addEventListener('touchend',   e=>{ e.preventDefault(); if(dragStart&&!ball.flying) launch(); },{passive:false});

  function launch(){
    const {vx,vy}=dragVel();
    ball.vx=vx; ball.vy=vy; ball.flying=true;
    dragStart=null; dragCur=null;
  }

  function resetBall(){ ball={x:44,y:H-30,vx:0,vy:0,flying:false}; dragStart=null; dragCur=null; }

  function drawHoop(){
    // backboard
    ctx.fillStyle='#e5e7eb';
    ctx.fillRect(W-20, HOOP_Y-30, 8, 55);
    ctx.fillStyle='#dc2626'; ctx.fillRect(W-20, HOOP_Y-18, 8, 24);
    // left rim
    ctx.beginPath(); ctx.arc(HOOP_X, HOOP_Y, RIM_R, 0, Math.PI*2);
    ctx.fillStyle='#ea580c'; ctx.fill();
    // right rim
    ctx.beginPath(); ctx.arc(HOOP_X+HOOP_W, HOOP_Y, RIM_R, 0, Math.PI*2);
    ctx.fill();
    // rim bar
    ctx.beginPath(); ctx.moveTo(HOOP_X,HOOP_Y); ctx.lineTo(HOOP_X+HOOP_W,HOOP_Y);
    ctx.strokeStyle='#f97316'; ctx.lineWidth=3; ctx.stroke();
    // net
    const nx=HOOP_X, nw=HOOP_W;
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1;
    for(let i=0;i<=4;i++){
      ctx.beginPath();
      ctx.moveTo(nx+nw*i/4, HOOP_Y+2);
      ctx.lineTo(nx+nw*(i*0.7/4+0.15), HOOP_Y+28);
      ctx.stroke();
    }
    for(let j=1;j<=3;j++){
      ctx.beginPath();
      ctx.moveTo(nx+nw*0.05, HOOP_Y+28*j/3.5);
      ctx.lineTo(nx+nw*0.95, HOOP_Y+28*j/3.5);
      ctx.stroke();
    }
  }

  function checkScore(){
    const cx=HOOP_X+HOOP_W/2, cy=HOOP_Y;
    // ball centre must pass through hoop window going downward
    if(ball.vy>0 &&
       ball.x > HOOP_X+RIM_R+1 && ball.x < HOOP_X+HOOP_W-RIM_R-1 &&
       Math.abs(ball.y - cy) < 10){
      streak++;
      const pts = streak>=3 ? 2 : 1;
      score += pts;
      // flash text
      flashText = {text: streak>=3?`+${pts} 🔥 x${streak}!`:`+${pts}`, x:cx, y:cy-20, life:50};
      resetBall();
    }
  }

  function checkRimCollision(){
    // bounce off left and right rim circles
    for(const rx of [HOOP_X, HOOP_X+HOOP_W]){
      const dx=ball.x-rx, dy=ball.y-HOOP_Y;
      const d=Math.hypot(dx,dy);
      if(d < BALL_R+RIM_R){
        const nx=dx/d, ny=dy/d;
        const dot=ball.vx*nx+ball.vy*ny;
        ball.vx=(ball.vx-2*dot*nx)*0.55;
        ball.vy=(ball.vy-2*dot*ny)*0.55;
        ball.x=rx+nx*(BALL_R+RIM_R+1);
        ball.y=HOOP_Y+ny*(BALL_R+RIM_R+1);
        streak=0; // rim hit resets streak
      }
    }
  }

  let flashText=null;

  function loop(){
    if(!running) return;

    // background: court
    ctx.fillStyle='#7c3f00'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#6d3500';
    for(let lx=0;lx<W;lx+=24){ ctx.fillRect(lx,0,12,H); }
    // floor line
    ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,H-18); ctx.lineTo(W,H-18); ctx.stroke();

    drawHoop();

    if(ball.flying){
      ball.vy+=GRAVITY;
      ball.x+=ball.vx; ball.y+=ball.vy;
      // floor
      if(ball.y>H-18){
        ball.y=H-18; ball.vy*=-0.42; ball.vx*=0.78;
        streak=0;
        if(Math.abs(ball.vy)<0.8){ score=0; resetBall(); }
      }
      // walls
      if(ball.x<BALL_R){ ball.x=BALL_R; ball.vx*=-0.5; }
      if(ball.x>W-BALL_R){ ball.x=W-BALL_R; ball.vx*=-0.5; }

      checkRimCollision();
      checkScore();
    }

    // trajectory preview when dragging
    if(dragStart&&dragCur&&!ball.flying){
      const {vx,vy}=dragVel();
      const pts=previewPoints(ball.x,ball.y,vx,vy);
      for(let i=0;i<pts.length;i++){
        ctx.globalAlpha=(1-i/pts.length)*0.5;
        ctx.beginPath(); ctx.arc(pts[i].x,pts[i].y,2,0,Math.PI*2);
        ctx.fillStyle='#fff'; ctx.fill();
      }
      ctx.globalAlpha=1;
      // drag arrow
      ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(dragStart.x,dragStart.y); ctx.lineTo(dragCur.x,dragCur.y); ctx.stroke();
    }

    // ball with spin shadow
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=8; ctx.shadowOffsetY=4;
    ctx.font=`${BALL_R*2}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🏀',ball.x,ball.y);
    ctx.restore();

    // flash score text
    if(flashText){
      ctx.globalAlpha=flashText.life/50;
      ctx.font='bold 14px DM Sans,sans-serif'; ctx.fillStyle='#fde047';
      ctx.textAlign='center'; ctx.fillText(flashText.text,flashText.x,flashText.y-=(50-flashText.life)*0.08);
      ctx.globalAlpha=1;
      if(--flashText.life<=0) flashText=null;
    }

    // hint
    if(!ball.flying&&!dragStart){
      ctx.font='9px DM Sans,sans-serif'; ctx.fillStyle='rgba(255,255,255,.3)'; ctx.textAlign='left';
      ctx.fillText('Drag to shoot',6,13);
    }

    const hi=Math.max(score,parseInt(safeGetLS('mg_hi_'+id,'0')));
    safeSetLS('mg_hi_'+id,hi);
    // draw score on canvas top-right so it's always visible
    ctx.font='bold 10px DM Mono,monospace';
    ctx.textAlign='right'; ctx.textBaseline='top';
    ctx.fillStyle='rgba(0,0,0,.5)';
    ctx.fillRect(W-110, 4, 106, 16);
    ctx.fillStyle='#a5b4fc';
    ctx.fillText(`Score: ${score}  Best: ${hi}${streak>=3?' 🔥':''}`, W-4, 6);
    requestAnimationFrame(loop);
  }
  loop();
  mgLoops[id]=()=>{running=false;};
}

// ── GAME 3: Kat ontwijken ─────────────────────────────
function buildCatGame(container, id){
  const W=288,H=160;
  container.innerHTML=`<canvas class="mg-canvas" id="mgc-${id}" width="${W}" height="${H}"></canvas><div class="mg-score" id="mgs-${id}">Time: 0s · Best: ${safeGetLS('mg_hi_'+id,'0')}s</div>`;
  const cv=document.getElementById('mgc-'+id);
  const ctx=cv.getContext('2d');
  let running=true, alive=true, t=0;
  let player={x:W/2,y:H/2};
  let cats=[];
  let mx=W/2,my=H/2;

  cv.addEventListener('mousemove',e=>{
    const r=cv.getBoundingClientRect();
    mx=(e.clientX-r.left)*(W/r.width);
    my=(e.clientY-r.top)*(H/r.height);
  });
  cv.addEventListener('touchmove',e=>{
    e.preventDefault();
    const r=cv.getBoundingClientRect();
    mx=(e.touches[0].clientX-r.left)*(W/r.width);
    my=(e.touches[0].clientY-r.top)*(H/r.height);
  },{passive:false});
  cv.addEventListener('click',()=>{ if(!alive){alive=true;t=0;cats=[];player={x:W/2,y:H/2};} });

  function spawnCat(){
    const side=Math.floor(Math.random()*4);
    let x,y;
    if(side===0){x=Math.random()*W;y=-20;}
    else if(side===1){x=W+20;y=Math.random()*H;}
    else if(side===2){x=Math.random()*W;y=H+20;}
    else{x=-20;y=Math.random()*H;}
    const spd=1.2+Math.min(t/300,2.5);
    cats.push({x,y,spd});
  }

  function loop(){
    if(!running) return;
    ctx.fillStyle='#0d0d1a'; ctx.fillRect(0,0,W,H);
    if(alive){
      t++;
      if(t%150===0) spawnCat();
      player.x+=(mx-player.x)*.18;
      player.y+=(my-player.y)*.18;
      player.x=Math.max(12,Math.min(W-12,player.x));
      player.y=Math.max(12,Math.min(H-12,player.y));
      for(const c of cats){
        const dx=player.x-c.x, dy=player.y-c.y, d=Math.hypot(dx,dy);
        c.x+=dx/d*c.spd; c.y+=dy/d*c.spd;
        if(d<18){ alive=false; }
        ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('🐱',c.x,c.y);
      }
      ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('💵',player.x,player.y);
      const secs=Math.floor(t/60);
      const hi=Math.max(secs,parseInt(safeGetLS('mg_hi_'+id,'0')));
      safeSetLS('mg_hi_'+id,hi);
      document.getElementById('mgs-'+id).textContent=`Time: ${secs}s · Best: ${hi}s`;
    } else {
      ctx.fillStyle='rgba(255,50,50,.12)'; ctx.fillRect(0,0,W,H);
      ctx.font='bold 14px DM Sans,sans-serif'; ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.fillText('You got caught! 🐱',W/2,H/2-10);
      ctx.font='10px DM Sans,sans-serif'; ctx.fillStyle='rgba(255,255,255,.4)';
      ctx.fillText('Click to play again',W/2,H/2+12);
    }
    requestAnimationFrame(loop);
  }
  loop();
  mgLoops[id]=()=>{running=false;};
}

// ── GAME 4: Paard Springt (dino-runner style) ─────────
function buildHorseGame(container, id){
  const W=288, H=160;
  container.innerHTML=`<canvas class="mg-canvas" id="mgc-${id}" width="${W}" height="${H}"></canvas><div class="mg-score" id="mgs-${id}">Distance: 0 m · Best: ${safeGetLS('mg_hi_'+id,'0')} m</div>`;
  const cv=document.getElementById('mgc-'+id);
  const ctx=cv.getContext('2d');

  const GROUND = H - 28;
  let running=true, alive=true, dist=0, speed=2.2, t=0;
  let horse = { x:50, y:GROUND, vy:0, onGround:true, frame:0, frameT:0 };
  let obstacles=[], clouds=[];
  // pre-seed some clouds
  for(let i=0;i<4;i++) clouds.push({x:Math.random()*W, y:20+Math.random()*40, w:30+Math.random()*30, spd:0.4+Math.random()*0.3});

  function reset(){
    alive=true; dist=0; speed=2.2; t=0;
    horse={x:50,y:GROUND,vy:0,onGround:true,frame:0,frameT:0};
    obstacles=[];
  }

  function jump(){
    if(horse.onGround){ horse.vy=-8.5; horse.onGround=false; }
  }

  cv.addEventListener('click', ()=>{ if(!alive) reset(); else jump(); });
  cv.addEventListener('keydown', e=>{ if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); if(!alive) reset(); else jump(); } });
  cv.addEventListener('touchstart', e=>{ e.preventDefault(); if(!alive) reset(); else jump(); }, {passive:false});

  // obstacle types: fence, bush, rock
  const OBS_TYPES = [
    { emoji:'🌵', w:20, h:32 },
    { emoji:'🪨', w:24, h:20 },
    { emoji:'🌾', w:18, h:26 },
  ];

  function spawnObstacle(){
    const type = OBS_TYPES[Math.floor(Math.random()*OBS_TYPES.length)];
    const gap  = Math.random() < 0.3 ? 20 : 0; // occasionally double obstacles
    obstacles.push({...type, x:W+10, gap});
    if(gap){ obstacles.push({...OBS_TYPES[Math.floor(Math.random()*OBS_TYPES.length)], x:W+10+28, gap:0}); }
  }

  let nextObs = 80;

  // horse leg animation frames (simple pixel legs)
  function drawHorse(h){
    const py = h.y;
    ctx.save();
    ctx.translate(h.x, py);

    // shadow
    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(0,4,16,4,0,0,Math.PI*2); ctx.fill();

    // body emoji
    ctx.font='28px serif';
    ctx.textAlign='center';
    ctx.textBaseline='bottom';
    // gallop: slight rotation while running
    const tilt = h.onGround ? Math.sin(h.frameT*0.3)*0.08 : -0.15;
    ctx.rotate(tilt);
    ctx.fillText('🐴', 0, 0);
    ctx.restore();
  }

  function loop(){
    if(!running) return;

    // background
    const skyG = ctx.createLinearGradient(0,0,0,GROUND);
    skyG.addColorStop(0,'#87ceeb'); skyG.addColorStop(1,'#c8e8f8');
    ctx.fillStyle=skyG; ctx.fillRect(0,0,W,GROUND);

    // clouds
    for(const c of clouds){
      c.x -= c.spd;
      if(c.x + c.w < 0) { c.x=W+10; c.y=15+Math.random()*35; }
      ctx.fillStyle='rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.ellipse(c.x,c.y,c.w/2,10,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(c.x+10,c.y-8,c.w/3,8,0,0,Math.PI*2); ctx.fill();
    }

    // ground
    ctx.fillStyle='#5c4a1e'; ctx.fillRect(0,GROUND,W,H-GROUND);
    ctx.fillStyle='#6aaa3a'; ctx.fillRect(0,GROUND,W,6);
    // ground detail lines
    ctx.strokeStyle='rgba(0,0,0,.1)'; ctx.lineWidth=1;
    for(let lx=(t*speed*0.5)%40; lx<W; lx+=40){
      ctx.beginPath(); ctx.moveTo(lx,GROUND+10); ctx.lineTo(lx+20,GROUND+10); ctx.stroke();
    }

    if(alive){
      t++;
      dist += speed/60;
      speed = Math.min(6, 2.2 + dist * 0.025);

      // horse physics
      horse.frameT++;
      if(!horse.onGround){
        horse.vy += 0.45;
        horse.y  += horse.vy;
        if(horse.y >= GROUND){ horse.y=GROUND; horse.vy=0; horse.onGround=true; }
      }

      // obstacles
      nextObs--;
      if(nextObs <= 0){
        spawnObstacle();
        nextObs = Math.round(90 + Math.random()*60 - dist*0.5);
        nextObs = Math.max(nextObs, 45);
      }
      obstacles = obstacles.filter(o=>o.x > -40);
      for(const o of obstacles){
        o.x -= speed;
        // draw
        ctx.font=`${o.h}px serif`;
        ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText(o.emoji, o.x, GROUND+2);
        // hitbox check
        if(Math.abs(o.x - horse.x) < 14 && horse.y > GROUND - o.h + 10){
          alive=false;
        }
      }

      drawHorse(horse);

      // hint
      ctx.font='8px DM Sans,sans-serif'; ctx.fillStyle='rgba(0,0,0,.3)'; ctx.textAlign='left';
      ctx.fillText('Click / space to jump', 5, 13);

      const m=Math.round(dist);
      const hi=Math.max(m,parseInt(safeGetLS('mg_hi_'+id,'0')));
      safeSetLS('mg_hi_'+id,hi);
      document.getElementById('mgs-'+id).textContent=`Distance: ${m} m · Best: ${hi} m`;

    } else {
      // death screen overlay
      ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(0,0,W,H);
      ctx.font='bold 15px DM Sans,sans-serif'; ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.fillText('🐴 Wiped out!', W/2, H/2-12);
      ctx.font='10px DM Sans,sans-serif'; ctx.fillStyle='rgba(255,255,255,.5)';
      ctx.fillText('Click to play again', W/2, H/2+10);
    }

    requestAnimationFrame(loop);
  }
  loop();
  mgLoops[id]=()=>{running=false;};
}

      });
    } else {
      scores[myName] = myClicks;
      updateScoreboard();
    }
  } catch(e) {}
});

let loopRunning = false;
function loop(){
  if(!gameMode) return; // wait for menu choice
  requestAnimationFrame(loop);
  
  displayBills += (totalBills - displayBills) * 0.1;
  const b = Math.round(displayBills);
  
  ctx.clearRect(0, 0, W, H);
  drawSky(b * BILL_M);
  drawGround(b * BILL_M);
  drawObjects(b);
  drawStack(displayBills);
  updateHUD();
}

// Draw static background while on menu
(function menuBg(){
  if(gameMode) return;
  ctx.clearRect(0,0,W,H);
  drawSky(0); drawGround(0);
  requestAnimationFrame(menuBg);
})();

updateScoreboard();
</script>
