body { overflow: hidden; background: #15181e; font-family: monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }

#mp-bar { width: 400px; height: 22px; background: #222; display: flex; align-items: center; padding: 0 4px; gap: 4px; flex-shrink: 0; border-bottom: 1px solid #111; }

#fs-btn, #home-btn, #restart-btn, #lb-btn { background: #333; border: 1px solid #555; color: #aaa; font-size: 9px; font-family: monospace; cursor: pointer; padding: 1px 5px; line-height: 1; border-radius: 2px; }
#reset-btn { background: #333; border: 1px solid #a44; color: #f88; font-size: 9px; font-family: monospace; cursor: pointer; padding: 1px 5px; line-height: 1; border-radius: 2px; }

#reset-btn:hover { background: #441111; color: #faa; border-color: #f44; }
#home-btn { color: #8af; border-color: #46a; }
#home-btn:hover { background: #223344; color: #adf; }
#restart-btn { color: #fa8; border-color: #a64; }
#restart-btn:hover { background: #332211; color: #fca; }
#lb-btn { color: #fda; border-color: #a84; }
#lb-btn:hover { background: #443322; color: #ff0; }
canvas { background: white; display: block; width: 400px; height: 300px; }

/* Match both games to the same 4:3 viewport fit in fullscreen. */
:fullscreen body { background: #15181e; justify-content: center; align-items: center; }
:fullscreen #game-container { width: 100vw; height: 100vh; justify-content: center; align-items: center; }
:fullscreen #mp-bar {
    width: min(100vw, calc((100vh - 22px) * 1.333333)) !important;
    background: #222;
}
:fullscreen canvas {
    width: min(100vw, calc((100vh - 22px) * 1.333333)) !important;
    height: min(calc(100vh - 22px), calc(100vw * 0.75)) !important;
    max-width: 100vw !important;
    max-height: calc(100vh - 22px) !important;
    aspect-ratio: 4 / 3 !important;
    object-fit: contain;
    image-rendering: pixelated;
}

function addPlixoProgress(missionId, amount = 1) {
    let globalProg = JSON.parse(localStorage.getItem('plixo_mission_progress') || '{}');
    globalProg[missionId] = (globalProg[missionId] || 0) + amount;
    localStorage.setItem('plixo_mission_progress', JSON.stringify(globalProg));

    let today = new Date().toDateString();
    let dailyKey = 'plixo_daily_progress_' + today;
    let dailyProg = JSON.parse(localStorage.getItem(dailyKey) || '{}');
    dailyProg[missionId] = (dailyProg[missionId] || 0) + amount;
    localStorage.setItem(dailyKey, JSON.stringify(dailyProg));
}

function setPlixoMaxProgress(missionId, value) {
    let globalProg = JSON.parse(localStorage.getItem('plixo_mission_progress') || '{}');
    if (value > (globalProg[missionId] || 0)) {
        globalProg[missionId] = value;
        localStorage.setItem('plixo_mission_progress', JSON.stringify(globalProg));
    }
}

const myPlayerId  = Math.random().toString(36).slice(2, 10);
let remotePlayers = {};
let remoteSkinImages = {};
let myFbRef       = null;
let fbSkinsRef    = null;


const gameModeParam = new URLSearchParams(window.location.search).get("mode");
const GAME_MODE = ["single", "multiplayer", "race"].includes(gameModeParam) ? gameModeParam : "multiplayer";
const GAME_CODE = "msp";
const GAME_ROOT = "platformer_spikes";
const GAME_LABEL = "Mini Spikes Platformer";
let raceRoomRef = null;
let raceRoomId = null;
let raceStartAt = 0;
let raceReady = GAME_MODE !== "race";
let raceStartTimer = null;
let raceFinishTimer = null;
let raceFinishRecorded = false;
let raceAwardApplied = false;
let raceFinalizeBusy = false;
const RACE_SIZE = 5;
const RACE_TROPHY_DELTA = [10, 5, 0, -5, -10];

function safeAccountCode() {
  const values = [localStorage.getItem("pg_account_code"), localStorage.getItem("pg_player_id"), localStorage.getItem("plixo_sync_code")];
  return values.map(v => String(v || "").trim().toUpperCase()).find(v => /^(?:[A-HJ-NP-Z2-9]{20}|[0-9]{20})$/.test(v)) || "";
}
function raceLeaderboardKey() {
  const code = safeAccountCode();
  if (code) return code;
  const name = String(localStorage.getItem("pg_player_name") || localStorage.getItem("pixel_games_username") || "Guest").toLowerCase().replace(/[^a-z0-9_-]/g, "_").slice(0, 28);
  return "guest_" + name + "_" + myPlayerId;
}
function countRacePlayers(room) { return Object.keys((room && room.players) || {}).length; }
function makeRoomPlayer(trophies) {
  return {
    id: myPlayerId,
    name: String(localStorage.getItem("pg_player_name") || localStorage.getItem("pixel_games_username") || "Player"),
    trophies: Math.max(0, Number(trophies) || 0),
    joinedAt: Date.now()
  };
}
function bindNetworkRoot(db, rootPath) {
  const fbPlayersRef = db.ref(rootPath + "/players");
  const onlineRef = db.ref(rootPath + "/online");
  fbSkinsRef = db.ref(rootPath + "/playerSkins");
  myFbRef = fbPlayersRef.child(myPlayerId);
  myFbRef.onDisconnect().remove();
  const mySkinData = localStorage.getItem("plixo_skin_image");
  if (mySkinData) fbSkinsRef.child(myPlayerId).set(mySkinData).catch(() => {});
  fbSkinsRef.child(myPlayerId).onDisconnect().remove();
  const myOnlineRef = onlineRef.child(myPlayerId);
  myOnlineRef.set(true).catch(() => {});
  myOnlineRef.onDisconnect().remove();
  onlineRef.on("value", snap => {
    if (GAME_MODE === "race" && raceRoomRef) return;
    setStatus("● " + snap.numChildren() + " online");
  });
  fbPlayersRef.on("child_added", snap => { if (snap.key !== myPlayerId && snap.val()) remotePlayers[snap.key] = snap.val(); });
  fbPlayersRef.on("child_changed", snap => { if (snap.key !== myPlayerId && snap.val()) remotePlayers[snap.key] = snap.val(); });
  fbPlayersRef.on("child_removed", snap => { delete remotePlayers[snap.key]; delete remoteSkinImages[snap.key]; });
  fbSkinsRef.on("child_added", snap => {
    if (snap.key !== myPlayerId && snap.val()) { const img = new Image(); img.src = snap.val(); remoteSkinImages[snap.key] = img; }
  });
  fbSkinsRef.on("child_changed", snap => {
    if (snap.key !== myPlayerId && snap.val()) { const img = new Image(); img.src = snap.val(); remoteSkinImages[snap.key] = img; }
  });
  fbSkinsRef.on("child_removed", snap => { delete remoteSkinImages[snap.key]; });
}
async function loadRaceTrophies(db) {
  const localKey = "plixo_race_trophies_" + GAME_CODE;
  let trophies = Math.max(0, Number(localStorage.getItem(localKey)) || 0);
  try {
    const snap = await db.ref("platformerRaceTrophies/" + GAME_CODE + "/" + raceLeaderboardKey()).once("value");
    const remote = snap.val();
    if (remote && Number.isFinite(Number(remote.trophies))) trophies = Math.max(0, Number(remote.trophies));
    localStorage.setItem(localKey, String(trophies));
  } catch (e) { console.warn("Could not load race trophies; using local trophy count.", e); }
  return trophies;
}
async function joinRaceRoom(db) {
  const roomsRef = db.ref("platformerRaceRooms/" + GAME_CODE);
  const trophies = await loadRaceTrophies(db);
  const me = makeRoomPlayer(trophies);
  const tolerance = Math.max(25, Math.min(80, Math.floor(trophies * 0.2) + 15));
  let joined = null;
  try {
    const snapshot = await roomsRef.orderByChild("status").equalTo("waiting").once("value");
    const choices = [];
    snapshot.forEach(child => {
      const data = child.val() || {};
      if (data.status !== "waiting" || Date.now() - (Number(data.createdAt) || 0) > 120000) return;
      const count = countRacePlayers(data);
      if (count >= RACE_SIZE) return;
      const average = Number(data.averageTrophies ?? data.trophyBase) || 0;
      const distance = Math.abs(trophies - average);
      if (distance <= tolerance) choices.push({ id: child.key, distance });
    });
    choices.sort((a, b) => a.distance - b.distance);
    for (const choice of choices) {
      const ref = roomsRef.child(choice.id);
      const result = await ref.transaction(current => {
        if (!current || current.status !== "waiting" || Date.now() - (Number(current.createdAt) || 0) > 120000) return;
        current.players = current.players && typeof current.players === "object" ? current.players : {};
        if (current.players[myPlayerId]) return current;
        const entries = Object.values(current.players);
        if (entries.length >= RACE_SIZE) return;
        const average = Number(current.averageTrophies ?? current.trophyBase) || 0;
        if (Math.abs(trophies - average) > tolerance) return;
        current.players[myPlayerId] = me;
        const all = Object.values(current.players);
        current.averageTrophies = all.reduce((sum, p) => sum + (Number(p.trophies) || 0), 0) / all.length;
        if (all.length === RACE_SIZE) { current.status = "starting"; current.startAt = Date.now() + 5000; }
        return current;
      }, undefined, false);
      const resultData = result.snapshot && result.snapshot.val();
      if (result.committed && resultData && resultData.players && resultData.players[myPlayerId]) { joined = ref; break; }
    }
  } catch (e) { console.warn("Race room scan failed; creating a new queue room.", e); }

  if (!joined) {
    const ref = roomsRef.push();
    const result = await ref.transaction(current => current || {
      game: GAME_CODE, status: "waiting", createdAt: Date.now(), trophyBase: trophies,
      averageTrophies: trophies, startAt: null, players: { [myPlayerId]: me }, finishes: {}, raceResults: null
    }, undefined, false);
    joined = ref;
  }

  raceRoomRef = joined;
  raceRoomId = joined.key;
  bindNetworkRoot(db, "platformerRaceWorlds/" + GAME_CODE + "/" + raceRoomId);
  raceRoomRef.on("value", snap => handleRaceRoomState(snap.val() || {}, db));
  setStatus("Race lobby: waiting for 5 players…", "#ffdd00");
}
function handleRaceRoomState(room, db) {
  const count = countRacePlayers(room);
  if (room.status === "waiting") {
    raceReady = false;
    setStatus("RACE LOBBY " + count + "/5 · NEED " + Math.max(0, 5-count), "#ffdd00");
  }
  if (room.status === "starting" && Number(room.startAt)) {
    raceReady = false;
    raceStartAt = Number(room.startAt);
    setStatus("RACE STARTS IN " + Math.max(1, Math.ceil((raceStartAt-Date.now())/1000)) + "…", "#ffdd00");
    if (!raceStartTimer) {
      raceStartTimer = setTimeout(() => {
        raceStartTimer = null;
        raceRoomRef.transaction(current => {
          if (!current || current.status !== "starting") return;
          if (countRacePlayers(current) !== RACE_SIZE || Number(current.startAt) > Date.now()) return current;
          current.status = "running";
          return current;
        }, undefined, false).catch(() => {});
      }, Math.max(50, raceStartAt - Date.now()));
    }
  }
  if (room.status === "running") {
    raceStartAt = Number(room.startAt) || Date.now();
    if (!raceReady && Date.now() >= raceStartAt) {
      raceReady = true;
      keys = {};
      timerStart = raceStartAt;
      timerCurrent = Math.max(0, Date.now() - raceStartAt);
      timerRunning = true;
      setStatus("🏁 RACE LIVE · " + count + " PLAYERS", "#6f6");
      if (!raceFinishTimer) raceFinishTimer = setTimeout(() => finalizeRace(true), Math.max(1000, raceStartAt + 300000 - Date.now()));
    } else if (!raceReady) {
      if (!raceStartTimer) raceStartTimer = setTimeout(() => { raceStartTimer = null; handleRaceRoomState(room, db); }, Math.max(50, raceStartAt - Date.now()));
    }
    if (room.finishes && Object.keys(room.finishes).length) finalizeRace(false);
  }
  if (room.status === "finished" && room.raceResults && room.raceResults.finalized) {
    raceReady = false;
    if (room.raceResults.byPlayer && room.raceResults.byPlayer[myPlayerId]) applyRaceAward(room, db, room.raceResults.byPlayer[myPlayerId]);
  }
}
function recordRaceFinish(timeMs) {
  if (GAME_MODE !== "race" || !raceRoomRef || raceFinishRecorded) return;
  raceFinishRecorded = true;
  const finishRecord = { finishedAt: Date.now(), time: Math.max(0, Number(timeMs) || 0), playerId: myPlayerId };
  raceRoomRef.child("finishes/" + myPlayerId).set(finishRecord)
    .then(() => { setStatus("FINISHED · WAITING FOR RACE RESULTS", "#ffdd00"); finalizeRace(false); })
    .catch(e => console.warn("Could not submit race finish.", e));
}
function finalizeRace(force) {
  if (GAME_MODE !== "race" || !raceRoomRef || raceFinalizeBusy) return;
  raceFinalizeBusy = true;
  raceRoomRef.transaction(current => {
    if (!current || current.status !== "running" || (current.raceResults && current.raceResults.finalized)) return;
    const players = Object.entries(current.players || {});
    if (players.length !== RACE_SIZE) return;
    const finishes = current.finishes && typeof current.finishes === "object" ? current.finishes : {};
    const finished = players.filter(([id]) => finishes[id]).sort((a,b) => (Number(finishes[a[0]].finishedAt)||Infinity) - (Number(finishes[b[0]].finishedAt)||Infinity));
    const expired = force || Date.now() >= (Number(current.startAt)||Date.now()) + 300000;
    if (finished.length < players.length && !expired) return;
    const finishedIds = new Set(finished.map(([id]) => id));
    const notFinished = players.filter(([id]) => !finishedIds.has(id)).sort((a,b) => (Number(a[1].joinedAt)||0) - (Number(b[1].joinedAt)||0));
    const ranking = [...finished, ...notFinished];
    const byPlayer = {};
    ranking.forEach(([id], index) => { byPlayer[id] = { place: index + 1, trophyDelta: RACE_TROPHY_DELTA[index] || 0, finishTime: finishes[id] ? Number(finishes[id].time)||0 : null }; });
    current.raceResults = { finalized: true, finalizedAt: Date.now(), byPlayer };
    current.status = "finished";
    return current;
  }, undefined, false).catch(() => {}).finally(() => { raceFinalizeBusy = false; });
}
function applyRaceAward(room, db, result) {
  if (raceAwardApplied || !room || !raceRoomId) return;
  raceAwardApplied = true;
  const key = raceLeaderboardKey();
  const name = String(localStorage.getItem("pg_player_name") || localStorage.getItem("pixel_games_username") || "Player");
  const trophiesPath = "platformerRaceTrophies/" + GAME_CODE + "/" + key;
  db.ref(trophiesPath).transaction(current => {
    const entry = current && typeof current === "object" ? { ...current } : {};
    if (entry.lastRaceId === raceRoomId) return entry;
    entry.name = name;
    entry.trophies = Math.max(0, (Number(entry.trophies) || 0) + (Number(result.trophyDelta) || 0));
    entry.lastRaceId = raceRoomId;
    entry.updatedAt = Date.now();
    return entry;
  }, undefined, false).then(snapshot => {
    const entry = snapshot.snapshot && snapshot.snapshot.val() || {};
    localStorage.setItem("plixo_race_trophies_" + GAME_CODE, String(Math.max(0, Number(entry.trophies) || 0)));
    const delta = Number(result.trophyDelta) || 0;
    setStatus("RACE OVER · PLACE " + result.place + "/5 · " + (delta > 0 ? "+" : "") + delta + " TROPHIES", delta >= 0 ? "#6f6" : "#f88");
  }).catch(e => console.warn("Could not save race trophy award.", e));
}

function initFirebase() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    window._pfDb = db;
    document.title = GAME_LABEL + " — " + GAME_MODE.toUpperCase();
    if (GAME_MODE === "single") {
      setStatus("● SINGLEPLAYER", "#8af");
      return; // No remote players or shared-world writes in singleplayer.
    }
    if (GAME_MODE === "multiplayer") {
      bindNetworkRoot(db, GAME_ROOT);
      return;
    }
    if (GAME_MODE === "race") {
      raceReady = false;
      joinRaceRoom(db).catch(e => { console.warn("Could not join race queue.", e); setStatus("Race unavailable · try Multiplayer", "#f88"); });
    }
  } catch(e) {
    setStatus("offline", "#888");
  }
}

const skinImage = new Image();
let skinReady = false;

// skin.html saves the selected 20x28 block as plixo_skin_image.
// Keep this sprite scale and its alignment identical in MBP and MSP.
function applySkinImage(dataUrl) {
    if (typeof dataUrl !== "string" || !/^data:image\//.test(dataUrl)) {
        skinReady = false;
        return;
    }
    skinReady = false;
    if (skinImage.src === dataUrl && skinImage.complete && skinImage.naturalWidth > 0) {
        skinReady = true;
    } else {
        skinImage.onload = () => { skinReady = true; };
        skinImage.onerror = () => { skinReady = false; };
        if (skinImage.src !== dataUrl) skinImage.src = dataUrl;
    }
    if (fbSkinsRef && myPlayerId) {
        fbSkinsRef.child(myPlayerId).set(dataUrl).catch(() => {});
    }
}

function refreshSkin() {
    const localImage = localStorage.getItem("plixo_skin_image");
    if (localImage) {
        applySkinImage(localImage);
        return;
    }

    // If this device has no cached image, restore the selected block from the same
    // PLIXO account record used by skin.html. Do not overwrite a local skin that
    // may be selected while the Firebase read is in flight.
    skinReady = false;
    const accountCode = typeof safeAccountCode === "function" ? safeAccountCode() : "";
    const db = window._pfDb || (window.firebase && firebase.apps && firebase.apps.length ? firebase.database() : null);
    if (!accountCode || !db) return;
    db.ref("plixo_users/" + accountCode + "/skin_image").once("value").then(snapshot => {
        const nowLocal = localStorage.getItem("plixo_skin_image");
        if (nowLocal) {
            applySkinImage(nowLocal);
            return;
        }
        const cloudImage = snapshot.val();
        if (typeof cloudImage === "string" && /^data:image\//.test(cloudImage)) {
            localStorage.setItem("plixo_skin_image", cloudImage);
            applySkinImage(cloudImage);
        }
    }).catch(() => {});
}
refreshSkin();
window.addEventListener("storage", e => {
    if (e.key === "plixo_skin_image" || e.key === "plixo_selected_skin") refreshSkin();
});

function timerString(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  const tenth = Math.floor((ms % 1000) / 100);
  return `${m}:${sec.toString().padStart(2,"0")}.${tenth}`;
}

class Dino {
  constructor(x, y) { 
    this.x=x; this.y=y; this.w=10; this.h=14; this.vx=0; this.vy=0; 
    this.extraJumpUsed=false; this.prevJumpKey=false; this.fallCounter=0; 
  }
  collides(o) { return(this.x<o.x+o.w&&this.x+this.w>o.x&&this.y<o.y+o.h&&this.y+this.h>o.y); }
  canJump(obs) {
    if(this.y>=GROUND_HEIGHT-this.h) return true;
    for(let o of obs) {
      if(this.x+this.w>o.x&&this.x<o.x+o.w&&Math.abs(this.y+this.h-o.y)<2) return true;
    }
    return false;
  }
  update(obs) {
    this.x+=this.vx;
    for(let o of obs) {
      if(this.collides(o)) {
        if(this.vx>0) this.x=o.x-this.w;
        if(this.vx<0) this.x=o.x+o.w;
      }
    }
    this.vy+=GRAVITY;
    this.y+=this.vy;
    let grounded = false;
    for(let o of obs) {
      if(this.collides(o)) {
        if(this.vy>0){this.y=o.y-this.h;this.vy=0; this.extraJumpUsed=false; grounded=true;}
        if(this.vy<0){this.y=o.y+o.h;this.vy=0;}
      }
    }
    this.x=Math.max(0,Math.min(WIDTH-this.w,this.x));
    if(this.y>=GROUND_HEIGHT-this.h){this.y=GROUND_HEIGHT-this.h;this.vy=0; this.extraJumpUsed=false; grounded=true;}

    if(grounded) {
      this.fallCounter = 0;
    } else if(this.vy > 0) {
      this.fallCounter++;
    }
  }
  draw() {
    if (skinReady) {
        ctx.imageSmoothingEnabled = false;
        const ratioX = this.w / 18;
        const ratioY = this.h / 26;
        const drawW = 20 * ratioX;
        const drawH = 28 * ratioY;
        const drawX = this.x - (1 * ratioX);
        const drawY = this.y - (1 * ratioY);
        ctx.drawImage(skinImage, drawX, drawY, drawW, drawH);
    } else {
        ctx.fillStyle = "red";
        ctx.fillRect(this.x, this.y, this.w, this.h);
    }
  }
}

let currentLevel=0, obstacles=[], spikes=[], star, dino, keys={};

function loadLevel() {
  const lvl = LEVELS[currentLevel];
  obstacles = lvl.obstacles.map(o=>({x:o[0],y:o[1],w:o[2],h:o[3]}));
  spikes = (lvl.spikes || []).map(s=>({x:s[0],y:s[1],w:s[2],h:s[3],rot:s[4]||0}));
  star = {x:lvl.star[0], y:lvl.star[1], size:10};
  dino = new Dino(lvl.player_start[0], lvl.player_start[1]);
}

function nextLevel() {
  let levelTime = Date.now() - levelStartTime;
  if(levelTime < 15000) setPlixoMaxProgress('dm_30', 1);
  levelStartTime = Date.now();
  levelDeaths = 0;

  currentLevel = (currentLevel + 1) % LEVELS.length;
  
  if(currentLevel === 0) {
    if(timerRunning) {
      timerCurrent = Date.now() - timerStart;
      timerRunning = false;
      if (GAME_MODE === "race") recordRaceFinish(timerCurrent);
      
      setPlixoMaxProgress('a_completed_spikes', 1);
      if (timerCurrent <= 35000) setPlixoMaxProgress('a_speedrun_spikes', 1);

      if(highscore === null || timerCurrent < highscore) {
        highscore = timerCurrent;
        localStorage.setItem("platformer_spike_levels_highscore", highscore);
        const pfName = localStorage.getItem('pg_player_name') || 'Speler';
        if(window._pfDb) {
          const pfRef = window._pfDb.ref('platformerSpikeLevelsScores');
          pfRef.orderByChild('name').equalTo(pfName).once('value').then(snap => {
            let existingKey = null, existingTime = Infinity;
            snap.forEach(child => { existingKey = child.key; existingTime = child.val().time || Infinity; });
            if(timerCurrent < existingTime) {
              const entry = { name: pfName, time: timerCurrent };
              if(existingKey) pfRef.child(existingKey).set(entry);
              else pfRef.push(entry);
            }
          }).catch(()=>{});
        }
      }
    }
  } else if(currentLevel === 1) {
    timerStart = Date.now();
    timerRunning = true;
    timerCurrent = 0;
  }
  
  loadLevel();
}

window.addEventListener("keydown", e=>{ if (GAME_MODE === "race" && !raceReady) return; keys[e.key]=true; });
window.addEventListener("keyup", e=>keys[e.key]=false);

const TARGET_FPS = 60;
const FRAME_TIME = 1000 / TARGET_FPS;
let lastTime = 0;
let frameCount = 0;

function loop(timestamp) {
  requestAnimationFrame(loop);

  if(timestamp - lastTime < FRAME_TIME) return;
  lastTime = timestamp;

  dino.vx = 0;
  if(keys["ArrowLeft"]) dino.vx = -2.5;
  if(keys["ArrowRight"]) dino.vx = 2.5;
  
  const jumpPressed = keys["ArrowUp"];
  if(jumpPressed) {
      if(dino.canJump(obstacles)) {
          dino.vy = -7;
          dino.extraJumpUsed = true;
          addPlixoProgress('dm_21', 1); addPlixoProgress('dm_22', 1);
      } else if(!dino.prevJumpKey && !dino.extraJumpUsed && dino.vy > 0 && dino.fallCounter <= 4) {
          dino.vy = -7;
          dino.extraJumpUsed = true;
          addPlixoProgress('dm_21', 1); addPlixoProgress('dm_22', 1);
      }
  }
  dino.prevJumpKey = jumpPressed;

  dino.update(obstacles);

  if(dino.x < star.x+star.size && dino.x+dino.w > star.x &&
     dino.y < star.y+star.size && dino.y+dino.h > star.y) {
      nextLevel();
      return; 
  }
  
  let hitSpike = false;
  for(let s of spikes) {
      if(dino.collides(s)) {
          hitSpike = true;
          break;
      }
  }
  if(hitSpike) {
      addPlixoProgress('dm_25', 1); 
      addPlixoProgress('dm_26', 1); 
      addPlixoProgress('dm_29', 1);
      levelDeaths++;
      if (levelDeaths >= 100) setPlixoMaxProgress('a39', 100); 

      loadLevel();
      return;
  }

  frameCount++;
  broadcastPosition();
  if(frameCount % 30 === 0) cleanupRemotePlayers();

  if(timerRunning) timerCurrent = Date.now() - timerStart;

  ctx.clearRect(0,0,WIDTH,HEIGHT);

  ctx.fillStyle = "black";
  ctx.fillRect(0,GROUND_HEIGHT,WIDTH,HEIGHT-GROUND_HEIGHT);

  ctx.fillStyle = "#ccc";
  ctx.font = "bold 8px monospace";
  ctx.fillText(timerString(timerCurrent), 4, GROUND_HEIGHT + 12);
  if(highscore !== null) {
    ctx.fillStyle = "gold";
    ctx.fillText("best: " + timerString(highscore), 4, GROUND_HEIGHT + 26);
  }

  ctx.fillStyle = "gray";
  for(let o of obstacles) ctx.fillRect(o.x,o.y,o.w,o.h);

  ctx.fillStyle = "#aa22aa"; 
  for(let s of spikes) {
      ctx.save();
      ctx.translate(s.x + s.w/2, s.y + s.h/2);
      ctx.rotate((s.rot || 0) * Math.PI / 180);
      ctx.translate(-(s.x + s.w/2), -(s.y + s.h/2));

      ctx.beginPath();
      const numSpikes = Math.max(1, Math.floor(s.w / 10));
      const spW = s.w / numSpikes;
      for (let j = 0; j < numSpikes; j++) {
          ctx.moveTo(s.x + j * spW, s.y + s.h);
          ctx.lineTo(s.x + j * spW + spW / 2, s.y);
          ctx.lineTo(s.x + (j + 1) * spW, s.y + s.h);
      }
      ctx.fill();
      ctx.restore();
  }

  ctx.fillStyle = "gold";
  ctx.beginPath();
  ctx.arc(star.x+5, star.y+5, 5, 0, Math.PI*2);
  ctx.fill();

  for(let id in remotePlayers) {
    const rp = remotePlayers[id];
    if(rp.level === currentLevel) {
      const rSkin = remoteSkinImages[id];
      if (rSkin && rSkin.complete && rSkin.naturalWidth > 0) {
          ctx.imageSmoothingEnabled = false;
          const ratioX = 10 / 18; 
          const ratioY = 14 / 26; 
          const drawW = 20 * ratioX;
          const drawH = 28 * ratioY;
          const drawX = rp.x - (1 * ratioX);
          const drawY = rp.y - (1 * ratioY);
          
          ctx.drawImage(rSkin, drawX, drawY, drawW, drawH);
      } else {
          ctx.fillStyle = "blue";
          ctx.fillRect(rp.x, rp.y, 10, 14);
      }
    }
  }

  dino.draw();
}
