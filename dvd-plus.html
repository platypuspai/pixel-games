            --accent-green: #00ff88;
            --accent-pink: #ff44aa;
            --accent-purple: #9944ff;

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: ''; position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px);

        header { text-align: center; margin-bottom: 20px; position: relative; z-index: 10;}
        h1 { font-family: 'Press Start 2P', monospace; font-size: 1.8rem; color: var(--accent-pink); margin-bottom: 5px; text-shadow: 2px 2px 0px rgba(255, 68, 170, 0.3); }
        .subtitle { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.1em; }

        .top-bar {
            width: 100%; max-width: 1050px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; position: relative; z-index: 10; gap: 10px; flex-wrap: wrap;
        }
        
        .currency-wrapper { display: flex; gap: 10px; }

        .money-display, .dvdp-display {
            background: var(--card); border: 2px solid var(--accent-green);
            padding: 10px 15px; border-radius: 4px;
            font-family: 'Press Start 2P', monospace; color: var(--accent-green);
            font-size: 1rem; box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }
        .dvdp-display { border-color: var(--accent-purple); color: var(--accent-purple); box-shadow: 0 0 15px rgba(153, 68, 255, 0.2); }

        .btn-back {
            background: transparent; border: 1px solid var(--border); color: var(--text-muted);
            padding: 8px 12px; font-family: 'Press Start 2P', monospace; font-size: 0.6rem;
            cursor: pointer; text-decoration: none; transition: 0.2s;
        }
        .btn-back:hover { color: #fff; border-color: #fff; }

        .game-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            width: 100%; max-width: 1050px;
            position: relative; z-index: 10;
        }

        .main-col { display: flex; flex-direction: column; gap: 10px; }

        .canvas-wrap {
            background: #000;
            border: 4px solid var(--border);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            aspect-ratio: 16/10;
            width: 100%;
        }

        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

        .level-bar-container {
            background: var(--card); border: 2px solid var(--border);
            border-radius: 6px; padding: 12px 15px; display: flex; align-items: center; gap: 15px;
            width: 100%;
        }
        .level-badge {
            font-family: 'Press Start 2P', monospace; font-size: 0.6rem; color: var(--accent-yellow); white-space: nowrap;
        }
        .progress-track-h {
            flex: 1; height: 18px; background: #000; border: 1px solid var(--border);
            border-radius: 4px; overflow: hidden; position: relative;
            display: flex; align-items: center;
        }
        .progress-fill-h {
            height: 100%; width: 0%; background: var(--accent-yellow); transition: width 0.1s ease-out;
        }
        .progress-text-h {
            font-family: 'Press Start 2P', monospace; font-size: 0.5rem; color: var(--text-muted); white-space: nowrap;
        }

        .pause-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Press Start 2P', monospace; font-size: 1rem; color: var(--accent-yellow);
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 500;
        }
        .pause-overlay.active { opacity: 1; }

        .corner-flash {
            position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none;
            transition: opacity 0.5s;
        }
        .corner-flash.active { opacity: 0.4; transition: opacity 0.05s; }

        .panel {
            background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            display: flex; flex-direction: column; height: 614px;
        }

        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab {
            flex: 1; padding: 12px 0; text-align: center; font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem; cursor: pointer; background: rgba(0,0,0,0.2);
            color: var(--text-muted); transition: 0.2s; border: none; outline: none;
        }
        .tab.active { background: transparent; color: var(--accent-yellow); border-bottom: 2px solid var(--accent-yellow); }
        .tab:hover:not(.active) { color: #fff; }

        .tab-content { padding: 15px; overflow-y: auto; flex: 1; display: none; }
        .tab-content.active { display: block; }
        .tab-content::-webkit-scrollbar { width: 6px; }
        .tab-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .shop-item {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            padding: 10px; margin-bottom: 10px; border-radius: 4px;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .shop-info { flex: 1; }
        .shop-title { font-family: 'Press Start 2P', monospace; font-size: 0.55rem; color: var(--text); margin-bottom: 4px; line-height: 1.4; }
        .shop-desc { font-size: 0.7rem; color: var(--text-muted); }
        .shop-btn {
            background: var(--accent-blue); color: #000; border: none;
            padding: 8px 10px; font-family: 'Press Start 2P', monospace; font-size: 0.5rem;
            border-radius: 2px; cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        .shop-btn:hover:not(:disabled) { filter: brightness(1.2); }
        .shop-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
        
        .skin-btn { background: var(--accent-purple); color: #fff; }
        .skin-btn.equipped { background: var(--accent-green); color: #000; pointer-events: none; }

        .predictor-box {
            text-align: center; padding: 15px; background: rgba(0,0,0,0.3);
            border: 1px dashed var(--accent-yellow); border-radius: 4px; margin-bottom: 15px;
        }
        .predictor-status { font-family: 'Press Start 2P', monospace; font-size: 0.6rem; color: var(--accent-yellow); margin-bottom: 5px; line-height: 1.5; }
        .predictor-reward-preview { font-family: 'Press Start 2P', monospace; font-size: 0.55rem; color: var(--accent-green); margin-bottom: 10px; }
        .btn-predict { background: var(--accent-yellow); width: 100%; font-size: 0.6rem; padding: 12px; }

        .notification {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,255,136,0.1); border: 1px solid var(--accent-green); color: var(--accent-green);

        }
        .notification.show { opacity: 1; }

        @media (max-width: 850px) {
            .game-layout { grid-template-columns: 1fr; }
            .panel { height: auto; max-height: 500px; }

            { id: 'diamond', name: 'Diamond Block', cost: 5000, type: 'emoji', val: '💎' },
            { id: 'fire', name: 'Inferno Core', cost: 10000, type: 'emoji', val: '🔥' }
        ]
    };

    const flagImageCache = {};
    function getFlagImage(countryCode) {
        if (flagImageCache[countryCode]) return flagImageCache[countryCode];
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = `https://flagcdn.com/w320/${countryCode}.png`;
        img.onload = () => { logoCache = {}; };
        flagImageCache[countryCode] = img;
        return img;
    }

    function getUserDbRef() {
        let safeKey = playerCode ? playerCode : playerName.replace(/[^a-zA-Z0-9]/g, "");
        return db.ref('scores/dvdPlus/' + safeKey);
    }

    function loadProgressFromFirebase() {
        const userRef = getUserDbRef();
        userRef.once('value').then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                money = data.money || 0;
                dvdp = data.dvdp || 0;
                level = data.level || 1;
                levelProgress = data.levelProgress || 0;
                upgradeLevels = data.upgradeLevels || {};
                unlockedSkins = data.unlockedSkins || ['#4488ff'];
                currentSkin = data.currentSkin || '#4488ff';
                dvdTiers = data.dvdTiers || [0]; 

                reapplyUpgrades();
            } else {
                saveProgressToFirebase();
            }
            updateCurrencies();
            updateLevelUI();
            rebuildDVDsFromTiers();
            initShop();
            equipSkin(currentSkin);
        }).catch((err) => {
            console.error("Error loading Firebase data:", err);
            initShop();
            spawnDVD(0);
        });
    }

    function saveProgressToFirebase() {
        if (!playerName) return;
        dvdTiers = dvds.map(d => d.tier);

        const userRef = getUserDbRef();
        userRef.set({
            name: playerName,
            money: money,
            dvdp: dvdp,
            level: level,
            levelProgress: levelProgress,
            upgradeLevels: upgradeLevels,
            unlockedSkins: unlockedSkins,
            currentSkin: currentSkin,
            dvdTiers: dvdTiers, 
            lastUpdated: Date.now()
        });
    }

    function reapplyUpgrades() {
        stats.moneyPerBounce = 1;
        stats.cornerMultiplier = 50;
        stats.speedMultiplier = 1;
        stats.dvdCount = 1;
        stats.predictRewardMult = 1000;
        stats.predictDurationSec = 30;
        stats.predictCooldownSec = 120;
        stats.autopilotLevel = 0;
        stats.multiTargetLevel = 0;

        upgradesData.forEach(up => {
            let lvl = upgradeLevels[up.id] || 0;
            stats[up.stat] += lvl * up.increase;
        });

        predictUpgradesData.forEach(up => {
            let lvl = upgradeLevels[up.id] || 0;
            stats[up.stat] += lvl * up.increase;
        });

        if (stats.multiTargetLevel > 3) stats.multiTargetLevel = 3;
        if (stats.autopilotLevel > 1) stats.autopilotLevel = 1;
    }

    function rebuildDVDsFromTiers() {
        dvds = [];
        if (!dvdTiers || dvdTiers.length === 0) dvdTiers = [0];
        dvdTiers.forEach(tier => {
            dvds.push(new DVD(Date.now() + Math.random(), tier));
        });
    }

        const overlay = document.getElementById('pauseOverlay');
        if (document.hidden) {

            overlay.classList.add('active');
        } else {
            isPaused = false;

    let logoCache = {};
    function getDVDCanvas(skinVal, isFlag, flagCode, tier = 0) {
        const cacheKey = skinVal + '_flag_' + isFlag + '_code_' + flagCode + '_tier_' + tier;
        if (logoCache[cacheKey]) return logoCache[cacheKey];
        
        const offscreen = document.createElement('canvas');
        offscreen.width = 90;
        offscreen.height = 42;
        const octx = offscreen.getContext('2d');
        
        octx.clearRect(0, 0, 90, 42);

        if (isFlag) {
            let flagImg = getFlagImage(flagCode);
            if (flagImg.complete && flagImg.naturalWidth !== 0) {
                octx.drawImage(flagImg, 0, 0, 90, 42);
            }
            octx.strokeStyle = '#000';
            octx.lineWidth = 2 + tier;
            octx.strokeRect(1, 1, 88, 40);
        } else {
            let lineWidth = 2 + tier; 
            octx.strokeStyle = skinVal;
            octx.lineWidth = lineWidth;
            octx.strokeRect(1, 1, 88, 40);
            octx.fillStyle = skinVal;
            
            octx.save();
            octx.translate(10, 0);
            octx.transform(1, 0, -0.26, 1, 0, 0);
            octx.font = '900 34px "Arial Black", Impact, sans-serif';
            octx.textAlign = 'center';
            octx.fillText('DVD', 40, 28);
            octx.restore();
            
            octx.beginPath();
            octx.ellipse(45, 34, 42, 7, 0, 0, Math.PI * 2);
            octx.fill();
            
            octx.globalCompositeOperation = 'destination-out';
            octx.beginPath();
            octx.ellipse(45, 34, 14, 2.5, 0, 0, Math.PI * 2);
            octx.fill();
            
            octx.globalCompositeOperation = 'source-over';
            octx.fillStyle = skinVal;
            octx.font = '900 7px "Arial Black", Impact, sans-serif';
            octx.textAlign = 'center';
            
            let tierLabel = tierNames[tier] || `Tier ${tier + 1}`;
            let subText = tier === 0 ? 'V I D E O' : `${tierLabel} (${Math.pow(3, tier)}X)`;
            octx.fillText(subText, 45, 37);
        }
        
        logoCache[cacheKey] = offscreen;
        return offscreen;
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('cornerFlash');

    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class DVD {
        constructor(id, tier = 0) {
            this.id = id;
            this.w = 90; 
            this.h = 42;  
            this.tier = tier; 

            this.x = Math.random() * (canvas.width - this.w - 100) + 50;
            this.y = Math.random() * (canvas.height - this.h - 100) + 50;

            const corners = [
                { x: 0, y: 0 },                                 
                { x: canvas.width, y: 0 },                      
                { x: 0, y: canvas.height },                     
                { x: canvas.width, y: canvas.height }           
            ];
            const targetCorner = corners[Math.floor(Math.random() * corners.length)];

            const dx = targetCorner.x - (this.x + this.w / 2);
            const dy = targetCorner.y - (this.y + this.h / 2);
            const angle = Math.atan2(dy, dx);

            const baseSpeed = 150;
            this.vx = Math.cos(angle) * baseSpeed;
            this.vy = Math.sin(angle) * baseSpeed;
        }

        update(dt) {
            const currentSpeedX = this.vx * stats.speedMultiplier;
            const currentSpeedY = this.vy * stats.speedMultiplier;
            this.x += currentSpeedX * dt;
            this.y += currentSpeedY * dt;

            let hitX = false;
            let hitY = false;

            if (this.x <= 0) { this.x = 0; this.vx *= -1; hitX = true; } 
            else if (this.x + this.w >= canvas.width) { this.x = canvas.width - this.w; this.vx *= -1; hitX = true; }

            if (this.y <= 0) { this.y = 0; this.vy *= -1; hitY = true; } 
            else if (this.y + this.h >= canvas.height) { this.y = canvas.height - this.h; this.vy *= -1; hitY = true; }

            if (hitX || hitY) {
                addProgress(1); 
                if (hitX && hitY) handleCornerHit(this);
                else handleWallHit(this);
            }
        }

        draw() {
            let isTarget = predictStates.some(p => p.status === 'active' && p.targetId === this.id);
            if (isTarget) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffdd00';
                ctx.strokeStyle = '#ffdd00';
                ctx.lineWidth = 3;
                ctx.strokeRect(this.x - 2, this.y - 2, this.w + 4, this.h + 4);
            } else {
                ctx.shadowBlur = 0;
            }

            let skinObj = findSkinObj(currentSkin);
            if (skinObj.type === 'color') {
                const imgCanvas = getDVDCanvas(skinObj.val, false, '', this.tier);
                ctx.drawImage(imgCanvas, this.x, this.y, this.w, this.h);
            } else if (skinObj.type === 'flag') {
                const imgCanvas = getDVDCanvas('', true, skinObj.code, this.tier);
                ctx.drawImage(imgCanvas, this.x, this.y, this.w, this.h);
            } else if (skinObj.type === 'emoji') {
                ctx.strokeStyle = '#4488ff'; ctx.lineWidth = 2 + this.tier;
                ctx.strokeRect(this.x, this.y, this.w, this.h);
                ctx.font = '35px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(skinObj.val, this.x + this.w/2, this.y + this.h/2 + 2);
            }
        }
    }

    function findSkinObj(id) {
        for(let key in skinsData) {
            let found = skinsData[key].find(s => s.id === id);
            if(found) return found;
        }
        let flagFound = allWorldFlags.find(f => 'flag_' + f.code === id);
        if (flagFound) {
            return { id: 'flag_' + flagFound.code, name: flagFound.name, cost: 150, type: 'flag', code: flagFound.code };
        }
        return skinsData.basic[0];
    }

    function getHighestUnlockedTier() {
        if (!dvds || dvds.length === 0) return 0;
        let maxTier = 0;
        dvds.forEach(d => {
            if (d.tier > maxTier) maxTier = d.tier;
        });
        return maxTier;
    }

    function spawnDVD(tier = 0) {
        dvds.push(new DVD(Date.now() + Math.random(), tier));
        checkAndMerge(tier);
        saveProgressToFirebase();
        initShop();
    }

    function handleBuyDVD() {
        let highestTier = getHighestUnlockedTier();
        spawnDVD(highestTier); 
    }

    function checkAndMerge(tier) {
        let sameTierList = dvds.filter(d => d.tier === tier);
        
        while (sameTierList.length >= 5) {
            let removedCount = 0;
            dvds = dvds.filter(d => {
                if (d.tier === tier && removedCount < 5) {
                    removedCount++;
                    return false;
                }
                return true;
            });

            let nextTier = tier + 1;
            let multiplier = Math.pow(3, nextTier);
            let nameDesc = tierNames[nextTier] || `Tier ${nextTier + 1}`;
            
            dvds.push(new DVD(Date.now() + Math.random(), nextTier));
            
            showNotification(`⚡ MERGED! 5x gecombineerd naar ${nameDesc} (${multiplier}x Waarde)!`);
            
            tier = nextTier;
            sameTierList = dvds.filter(d => d.tier === tier);
        }
        saveProgressToFirebase();
        initShop();
    }

    function addProgress(amount) {
        let req = 100 + (level - 1) * 25; 
        levelProgress += amount;
        
        if (levelProgress >= req) {
            levelProgress = 0;
            levelUp();
        }
        updateLevelUI();
        saveProgressToFirebase();
    }

    function levelUp() {
        level++;
        const bonusMoney = level * 300;
        const bonusDvdp = level * 3;
        money += bonusMoney;
        dvdp += bonusDvdp;
        showNotification(`🎉 LEVEL UP! Lvl ${level}! +$${bonusMoney.toLocaleString()}, +${bonusDvdp} DVDp`);
        updateCurrencies();
        updateUIButtons();
        saveProgressToFirebase();
    }

    function updateLevelUI() {
        let req = 100 + (level - 1) * 25;
        let pct = Math.min(100, Math.floor((levelProgress / req) * 100));
        
        document.querySelector('.progress-fill-h').style.width = pct + '%';
        document.getElementById('progress-pct').innerText = pct + '%';
        document.getElementById('level-label').innerText = 'LVL ' + level;
    }

    function handleWallHit(dvd) {
        const mult = Math.pow(3, dvd.tier);
        addMoney(stats.moneyPerBounce * mult);
    }

    function handleCornerHit(dvd) {
        const mult = Math.pow(3, dvd.tier);
        const reward = stats.moneyPerBounce * stats.cornerMultiplier * mult;
        addMoney(reward);
        triggerCornerFlash();
        showNotification(`CORNER HIT! +$${reward.toLocaleString()}`);

        predictStates.forEach(p => {
            if (p.status === 'active' && p.targetId === dvd.id) {
                const jackpot = stats.moneyPerBounce * stats.predictRewardMult * mult;
                addMoney(jackpot);
                showNotification(`🎯 PREDICTION SUCCESS! JACKPOT +$${jackpot.toLocaleString()}`);
                p.status = 'cooldown';
                p.cooldownTimer = stats.predictCooldownSec;
                updatePredictUI();
            }
        });
    }

    function addMoney(amount) { 
        money += amount; 
        updateCurrencies(); 
        saveProgressToFirebase();
    }

    function updateCurrencies() {
        document.getElementById('money').innerText = Math.floor(money).toLocaleString('en-US');
        document.getElementById('dvdp').innerText = dvdp.toLocaleString('en-US');
        updateUIButtons();
        updatePredictUI();
    }

    function triggerCornerFlash() {
        flashEl.classList.add('active');
        setTimeout(() => flashEl.classList.remove('active'), 100);
    }

    canvas.addEventListener('click', (e) => {
        let selectingP = predictStates.find(p => p.status === 'selecting');
        if (!selectingP) return;
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;
        for (let dvd of dvds) {
            let alreadyTargeted = predictStates.some(p => p.targetId === dvd.id && (p.status === 'selecting' || p.status === 'active'));
            if (!alreadyTargeted && clickX >= dvd.x && clickX <= dvd.x + dvd.w && clickY >= dvd.y && clickY <= dvd.y + dvd.h) {
                selectingP.status = 'active';
                selectingP.targetId = dvd.id;
                selectingP.timer = stats.predictDurationSec;
                
                let nextSelecting = predictStates.find(p => p.status === 'ready');
                if (nextSelecting) {
                    nextSelecting.status = 'selecting';
                }
                
                updatePredictUI();
                break;
            }
        }
    });

    function activatePredictor() {
        let maxSlots = 1 + stats.multiTargetLevel;
        if (maxSlots > 4) maxSlots = 4;

        while (predictStates.length < maxSlots) {
            predictStates.push({ status: 'ready', targetId: null, timer: 0, cooldownTimer: 0 });
        }

        let readySlots = predictStates.filter(p => p.status === 'ready');
        if (readySlots.length > 0) {
            readySlots.forEach(p => {
                p.status = 'selecting';
            });
            updatePredictUI();
        }
    }

    function updatePredictorLogic(dt) {
        let maxSlots = 1 + stats.multiTargetLevel;
        if (maxSlots > 4) maxSlots = 4;

        while (predictStates.length < maxSlots) {
            predictStates.push({ status: 'ready', targetId: null, timer: 0, cooldownTimer: 0 });
        }

        predictStates.forEach(p => {
            if (p.status === 'active') {
                p.timer -= dt;
                if (p.timer <= 0) {
                    p.status = 'cooldown';
                    p.cooldownTimer = stats.predictCooldownSec;
                    showNotification("Prediction failed. Try again later!");
                }
            } else if (p.status === 'cooldown') {
                p.cooldownTimer -= dt;
                if (p.cooldownTimer <= 0) {
                    p.status = 'ready';
                }
            }

            if (p.status === 'ready' && stats.autopilotLevel > 0 && dvds.length > 0) {
                let availableDvds = dvds.filter(d => !predictStates.some(ps => ps.targetId === d.id && ps.status === 'active'));
                if (availableDvds.length === 0) availableDvds = dvds;
                let randomDvd = availableDvds[Math.floor(Math.random() * availableDvds.length)];
                
                p.status = 'active';
                p.targetId = randomDvd.id;
                p.timer = stats.predictDurationSec;
                showNotification("🤖 Autopilot auto-started prediction!");
            }
        });
        updatePredictUI();
    }

    function updatePredictUI() {
        const btn = document.getElementById('btn-activate-predict');
        const statusText = document.getElementById('predict-status');
        const rewardPreviewText = document.getElementById('predict-reward-preview');
        
        // Bereken gemiddelde of basis prediction bonus op basis van hoogste tier of standaard bounce damage
        let highestTier = getHighestUnlockedTier();
        let tierMult = Math.pow(3, highestTier);
        let previewBonus = stats.moneyPerBounce * stats.predictRewardMult * tierMult;
        rewardPreviewText.innerText = `REWARD BONUS: +$${previewBonus.toLocaleString()}`;

        let selectingCount = predictStates.filter(p => p.status === 'selecting').length;
        let readyCount = predictStates.filter(p => p.status === 'ready').length;
        let activeCount = predictStates.filter(p => p.status === 'active').length;

        if (selectingCount > 0) {
            btn.disabled = true; 
            btn.innerText = "SELECT DVD(S)..."; 
            statusText.innerText = `CLICK DVD(S) ON SCREEN (${selectingCount} left)!`; 
            statusText.style.color = "var(--accent-pink)";
        } else if (readyCount > 0) {
            btn.disabled = stats.autopilotLevel > 0; 
            btn.innerText = stats.autopilotLevel > 0 ? "AUTOPILOT RUNNING" : "START PREDICTION"; 
            statusText.innerText = stats.autopilotLevel > 0 ? "AUTOPILOT MANAGING SLOTS" : "READY TO PREDICT!"; 
            statusText.style.color = "var(--accent-yellow)";
        } else if (activeCount > 0) {
            btn.disabled = true; 
            btn.innerText = "PREDICTIONS ACTIVE"; 
            statusText.innerText = `ACTIVE SLOTS: ${activeCount}`; 
            statusText.style.color = "var(--accent-green)";
        } else {
            btn.disabled = true; 
            btn.innerText = "COOLING DOWN..."; 
            statusText.innerText = "ALL SLOTS ON COOLDOWN"; 
            statusText.style.color = "var(--text-muted)";
        }
    }

    function initShop() {
        const upContainer = document.getElementById('upgrades-container');
        upContainer.innerHTML = '';
        
        let highestTier = getHighestUnlockedTier();
        let currentMultiplier = Math.pow(3, highestTier);
        let tierLabelName = tierNames[highestTier] || `Tier ${highestTier + 1}`;

        upgradesData.forEach(up => {
            if (upgradeLevels[up.id] === undefined) upgradeLevels[up.id] = 0;
            let lvl = upgradeLevels[up.id] || 0;
            
            let descText = up.desc;
            let titleText = up.title;
            if (up.id === 'bounce') {
                let currentDamage = 1 + (lvl * up.increase);
                titleText = `${up.title} <span style="color:var(--accent-green); font-size:0.45rem;">(DMG: +${currentDamage})</span>`;
            } else if (up.id === 'dvd') {
                descText = `Spawns a new ${tierLabelName} DVD (x${currentMultiplier} value, merges at 5!).`;
            }

            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <div class="shop-info">
                    <div class="shop-title">${titleText} <span style="color:var(--text-muted)">Lvl <span id="lvl-${up.id}">${lvl}</span></span></div>
                    <div class="shop-desc">${descText}</div>
                </div>
                <button class="shop-btn" id="btn-up-${up.id}" onclick="buyUpgrade('${up.id}', 'general')">$${getUpgradeCost(up).toLocaleString()}</button>
            `;
            upContainer.appendChild(div);
        });

        const pContainer = document.getElementById('predict-upgrades-container');
        pContainer.innerHTML = '';
        predictUpgradesData.forEach(up => {
            if (upgradeLevels[up.id] === undefined) upgradeLevels[up.id] = 0;
            let lvl = upgradeLevels[up.id] || 0;
            
            if (up.maxLevel && lvl >= up.maxLevel) return;

            let cost = getUpgradeCost(up);
            let currencySign = up.currency === 'dvdp' ? ' DVDp' : '$';

            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <div class="shop-info">
                    <div class="shop-title">${up.title} <span style="color:var(--text-muted)">Lvl <span id="lvl-${up.id}">${lvl}</span></span></div>
                    <div class="shop-desc">${up.desc}</div>
                </div>
                <button class="shop-btn" id="btn-up-${up.id}" onclick="buyUpgrade('${up.id}', 'predict')">${currencySign}${cost.toLocaleString()}</button>
            `;
            pContainer.appendChild(div);
        });

        buildSkinCategory(skinsData.basic, 'skins-basic-container');
        buildFlagCategory();
        buildSkinCategory(skinsData.expensive, 'skins-expensive-container');
    }

    function buildSkinCategory(skinList, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        skinList.forEach(s => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            
            const unlocked = unlockedSkins.includes(s.id);
            let btnHtml = unlocked ? 
                `<button class="shop-btn skin-btn" id="btn-skin-${s.id}" onclick="equipSkin('${s.id}')">EQUIP</button>` : 
                `<button class="shop-btn skin-btn" id="btn-skin-${s.id}" onclick="buySkin('${s.id}')">${s.cost} DVDp</button>`;

            div.innerHTML = `
                <div class="shop-info">
                    <div class="shop-title">${s.name}</div>
                    <div class="shop-desc">${s.val}</div>
                </div>
                ${btnHtml}
            `;
            container.appendChild(div);
        });
    }

    function buildFlagCategory() {
        const container = document.getElementById('skins-flag-container');
        container.innerHTML = '';
        allWorldFlags.forEach(f => {
            let skinId = 'flag_' + f.code;
            const div = document.createElement('div');
            div.className = 'shop-item';
            
            const unlocked = unlockedSkins.includes(skinId);
            let btnHtml = unlocked ? 
                `<button class="shop-btn skin-btn" id="btn-skin-${skinId}" onclick="equipSkin('${skinId}')">EQUIP</button>` : 
                `<button class="shop-btn skin-btn" id="btn-skin-${skinId}" onclick="buySkin('${skinId}')">150 DVDp</button>`;

            div.innerHTML = `
                <div class="shop-info">
                    <div class="shop-title">${f.name}</div>
                    <div class="shop-desc"><img src="https://flagcdn.com/w40/${f.code}.png" style="width: 30px; vertical-align: middle;"></div>
                </div>
                ${btnHtml}
            `;
            container.appendChild(div);
        });
    }

    function getUpgradeCost(upData) {
        const lvl = upgradeLevels[upData.id] || 0;
        return Math.floor(upData.baseCost * Math.pow(upData.costMult, lvl));
    }

    function buyUpgrade(id, type) {
        const list = type === 'general' ? upgradesData : predictUpgradesData;
        const upData = list.find(u => u.id === id);
        if (!upData) return;
        
        let lvl = upgradeLevels[id] || 0;
        if (upData.maxLevel && lvl >= upData.maxLevel) return;

        const cost = getUpgradeCost(upData);
        let canAfford = upData.currency === 'dvdp' ? (dvdp >= cost) : (money >= cost);
        
        if (canAfford) {
            if (upData.currency === 'dvdp') dvdp -= cost;
            else money -= cost;

            if (!upgradeLevels[id]) upgradeLevels[id] = 0;
            upgradeLevels[id]++;
            reapplyUpgrades();
            
            if (upData.onBuy) upData.onBuy();
            
            initShop();
            updateCurrencies(); 
            saveProgressToFirebase();
        } else {
            showNotification(upData.currency === 'dvdp' ? "Not enough DVDp!" : "Not enough money!");
        }
    }

    function buySkin(id) {
        let skin = findSkinObj(id);
        let cost = skin.cost !== undefined ? skin.cost : 150;
        if (dvdp >= cost && !unlockedSkins.includes(id)) {
            dvdp -= cost;
            unlockedSkins.push(id);
            updateCurrencies();
            initShop();
            equipSkin(id);
            saveProgressToFirebase();
        } else {
            showNotification("Not enough DVDp!");
        }
    }

    function equipSkin(id) {
        if (!unlockedSkins.includes(id)) return;
        currentSkin = id;
        logoCache = {};
        document.querySelectorAll('.skin-btn').forEach(btn => {
            if (btn.innerText === 'EQUIPPED') btn.innerText = 'EQUIP';
            btn.classList.remove('equipped');
        });
        const activeBtn = document.getElementById(`btn-skin-${id}`);
        if (activeBtn) {
            activeBtn.innerText = 'EQUIPPED';
            activeBtn.classList.add('equipped');
        }
        saveProgressToFirebase();
    }

    function updateUIButtons() {
        upgradesData.forEach(up => {
            const btn = document.getElementById(`btn-up-${up.id}`);
            if (btn) btn.disabled = money < getUpgradeCost(up);
        });
        predictUpgradesData.forEach(up => {
            const btn = document.getElementById(`btn-up-${up.id}`);
            if (btn) {
                let cost = getUpgradeCost(up);
                let lvl = upgradeLevels[up.id] || 0;
                btn.disabled = (up.maxLevel && lvl >= up.maxLevel) || (up.currency === 'dvdp' ? (dvdp < cost) : (money < cost));
            }
        });
        for(let key in skinsData) {
            skinsData[key].forEach(s => {
                const btn = document.getElementById(`btn-skin-${s.id}`);
                if (btn && !unlockedSkins.includes(s.id)) btn.disabled = dvdp < s.cost;
            });
        }
        allWorldFlags.forEach(f => {
            let skinId = 'flag_' + f.code;
            const btn = document.getElementById(`btn-skin-${skinId}`);
            if (btn && !unlockedSkins.includes(skinId)) btn.disabled = dvdp < 150;
        });
    }

    function showNotification(msg) {
        const el = document.getElementById('notification');
        el.innerText = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 3000);
    }

    window.switchTab = function(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = (timestamp - lastTime) / 1000; 
        lastTime = timestamp;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!isPaused) {
            dvds.forEach(dvd => { dvd.update(dt); dvd.draw(); });
            updatePredictorLogic(dt);
        } else {
            dvds.forEach(dvd => { dvd.draw(); });
        }

        requestAnimationFrame(gameLoop);
    }

    window.onload = () => {
        loadProgressFromFirebase();
        requestAnimationFrame(gameLoop);
    };
</script>
</body>
</html>
