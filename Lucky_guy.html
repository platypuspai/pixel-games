<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Guy v4.1 - Pixel-Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --card: #1a1a28;
            --border: #2a2a42;
            --accent: #00e5ff;
            --text: #e8e8ff;
            --text-muted: #7777aa;
            --error: #ff44aa;
            --success: #00ff88;
        }

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            color: var(--accent);
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .version-tag {
            background: var(--accent);
            color: #000;
            padding: 2px 6px;
            font-size: 0.6rem;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 10px;
        }

        .game-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 950px;
            width: 100%;
        }

        .play-area, .leaderboard {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 30px;
            border-top: 3px solid var(--accent);
            width: 100%;
            max-width: 450px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px 0 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 35px solid #fff;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -35px;
            left: -10px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 25px solid var(--accent);
        }

        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.3));
        }

        .level-display {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.5rem;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .info-text {
            color: var(--text-muted);
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        input[type="number"], input[type="text"] {
            width: 80%;
            background: var(--surface);
            border: 2px solid var(--border);
            color: var(--accent);
            font-family: 'Press Start 2P', monospace;
            font-size: 1rem;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        button {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            padding: 15px 20px;
            background: var(--accent);
            color: #000;
            border: none;
            cursor: pointer;
            letter-spacing: 0.1em;
            transition: 0.2s;
            width: 80%;
            box-shadow: 0 4px 0 #0099aa;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0099aa;
        }

        button:disabled {
            background: var(--border);
            color: var(--text-muted);
            box-shadow: 0 4px 0 #1a1a28;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            margin-top: 25px;
            min-height: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        .leaderboard h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: var(--accent);
        }

        .score-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
            width: 100%;
        }

        .score-list li {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.9rem;
        }

        .score-list li span:last-child {
            color: var(--accent);
            font-weight: bold;
        }

        .back-btn {
            margin-top: 40px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            text-decoration: none;
            padding: 10px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            transition: 0.3s;
        }

        .back-btn:hover {
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>LUCKY GUY <span class="version-tag">v4.1</span></h1>
        <p style="color: var(--text-muted); font-size: 0.8rem;">Pure chaos mode. Pick your number.</p>
    </header>

    <div class="game-container">
        
        <div class="play-area" id="start-ui">
            <h2 style="font-family: 'Press Start 2P'; font-size: 1.2rem; color: var(--accent); margin-bottom: 20px;">WIE BEN JIJ?</h2>
            <p class="info-text">Vul je naam in om te beginnen.</p>
            <input type="text" id="player-name-input" placeholder="JOUW NAAM" maxlength="15">
            <button onclick="startGame()">START GAME</button>
        </div>

        <div class="play-area" id="game-ui" style="display: none;">
            <div class="info-text">HUIDIG LEVEL</div>
            <div class="level-display" id="level-text">1</div>
            <p class="info-text" id="instruction">Kies een getal tussen 1 en 1</p>
            
            <div class="wheel-wrapper">
                <div class="pointer"></div>
                <canvas id="wheel-canvas" class="wheel-canvas" width="600" height="600"></canvas>
            </div>

            <input type="number" id="guess-input" min="1" placeholder="Jouw getal?">
            <button id="spin-btn" onclick="spinWheel()">DRAAI HET RAD</button>

            <div class="result-box" id="result-message"></div>
        </div>

        <div class="leaderboard">
            <h2>TOP 10 LUCKIEST</h2>
            <ul class="score-list" id="leaderboard-list"></ul>
        </div>
    </div>

    <a href="index.html" class="back-btn">◀ TERUG NAAR HOME</a>

    <script>
        let currentPlayerName = "";
        let currentLevel = 1;
        let isSpinning = false;
        let currentRotation = Math.floor(Math.random() * 360); 
        
        const wheelColors = ['#00e5ff', '#ff44aa', '#00ff88', '#ffdd00', '#ff8844', '#b344ff'];
        let topScores = JSON.parse(localStorage.getItem('luckyGuyScoresV3')) || [];

        const startUI = document.getElementById('start-ui');
        const gameUI = document.getElementById('game-ui');
        const levelText = document.getElementById('level-text');
        const instruction = document.getElementById('instruction');
        const guessInput = document.getElementById('guess-input');
        const resultMessage = document.getElementById('result-message');
        const spinBtn = document.getElementById('spin-btn');
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');

        canvas.style.transform = `rotate(${currentRotation}deg)`;

        function startGame() {
            const nameInput = document.getElementById('player-name-input').value.trim();
            currentPlayerName = nameInput !== "" ? nameInput : "ANONYMOUS";
            
            startUI.style.display = 'none';
            gameUI.style.display = 'flex';
            
            updateUI();
            renderLeaderboard();
        }

        function getSecureRandomNumber(maxNumber) {
            const randomBuffer = new Uint32Array(1);
            window.crypto.getRandomValues(randomBuffer);
            return (randomBuffer[0] % maxNumber) + 1;
        }

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10; 
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const sliceAngle = (2 * Math.PI) / currentLevel;

            for (let i = 0; i < currentLevel; i++) {
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.fillStyle = wheelColors[i % wheelColors.length];
                ctx.fill();
                
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#12121a";
                ctx.stroke();

                if (currentLevel <= 80) {
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(i * sliceAngle + sliceAngle / 2);
                    ctx.textAlign = "right";
                    ctx.textBaseline = "middle";
                    ctx.fillStyle = "#000"; 
                    
                    const fontSize = Math.max(12, 35 - (currentLevel / 2));
                    ctx.font = `bold ${fontSize}px Arial`;
                    ctx.fillText(i + 1, radius - 20, 0);
                    ctx.restore();
                }
            }

            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
            ctx.fillStyle = "#1a1a28";
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00e5ff";
            ctx.stroke();
        }

        function updateUI() {
            levelText.innerText = currentLevel;
            instruction.innerText = `Kies een getal tussen 1 en ${currentLevel}`;
            guessInput.value = '';
            guessInput.max = currentLevel;
            resultMessage.innerText = '';
            
            drawWheel();
        }

        function spinWheel() {
            if (isSpinning) return;

            const guess = parseInt(guessInput.value);
            
            if (isNaN(guess) || guess < 1 || guess > currentLevel) {
                resultMessage.style.color = 'var(--accent-orange)';
                resultMessage.innerText = 'Vul een geldig getal in!';
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            resultMessage.style.color = '#fff';
            resultMessage.innerText = 'Draaien...';
            
            const winningNumber = getSecureRandomNumber(currentLevel);
            
            const sliceAngleDeg = 360 / currentLevel;
            const middleAngle = (winningNumber - 1 + 0.5) * sliceAngleDeg;
            
            const randomOffset = (Math.random() * 0.8 - 0.4) * sliceAngleDeg;
            const targetDegree = 270 - middleAngle + randomOffset;

            const spinRounds = Math.floor(Math.random() * 8) + 5;
            const extraSpins = spinRounds * 360; 
            
            const currentMod = currentRotation % 360;
            let diff = targetDegree - currentMod;
            if (diff < 0) diff += 360; 

            currentRotation += extraSpins + diff;
            
            const spinDuration = Math.random() * 3.5 + 4;
            
            canvas.style.transition = `transform ${spinDuration}s cubic-bezier(0.15, 0.85, 0.1, 1)`;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                checkResult(guess, winningNumber);
            }, spinDuration * 1000);
        }

        function checkResult(guess, winningNumber) {
            if (guess === winningNumber) {
                resultMessage.style.color = 'var(--success)';
                resultMessage.innerText = `BINGO! Het was ${winningNumber}.`;
                
                saveScore(currentLevel);

                setTimeout(() => {
                    currentLevel++;
                    updateUI();
                    isSpinning = false;
                    spinBtn.disabled = false;
                }, 2000);

            } else {
                resultMessage.style.color = 'var(--error)';
                resultMessage.innerText = `FOUT! Het was ${winningNumber}. Probeer het opnieuw!`;
                
                setTimeout(() => {
                    // JE BEHOUDT JE LEVEL! (currentLevel wordt niet meer naar 1 gezet)
                    
                    currentRotation = Math.floor(Math.random() * 360);
                    canvas.style.transition = 'none'; 
                    canvas.style.transform = `rotate(${currentRotation}deg)`;
                    
                    updateUI();
                    isSpinning = false;
                    spinBtn.disabled = false;
                }, 2500);
            }
        }

        function saveScore(levelReached) {
            let existingPlayer = topScores.find(s => s.name === currentPlayerName);
            
            if (existingPlayer) {
                if (levelReached > existingPlayer.level) {
                    existingPlayer.level = levelReached;
                }
            } else {
                topScores.push({ name: currentPlayerName, level: levelReached });
            }

            topScores.sort((a, b) => b.level - a.level);
            topScores = topScores.slice(0, 10);
            localStorage.setItem('luckyGuyScoresV3', JSON.stringify(topScores));
            
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            
            if (topScores.length === 0) {
                list.innerHTML = '<li style="color: var(--text-muted);">Nog geen scores...</li>';
                return;
            }

            topScores.forEach((score, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${index + 1}. ${score.name}</span> <span>LVL ${score.level}</span>`;
                list.appendChild(li);
            });
        }

        renderLeaderboard();
    </script>
</body>
</html>
