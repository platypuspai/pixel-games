<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Lucky Guy v4.3 - Pixel-Games (Online)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --card: #1a1a28;
            --border: #2a2a42;
            --accent: #00e5ff;
            --text: #e8e8ff;
            --text-muted: #7777aa;
            --error: #ff44aa;
            --success: #00ff88;
        }

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header { margin-bottom: 20px; text-align: center; }

        h1 {
            font-family: 'Press Start 2P', monospace;
            color: var(--accent);
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .version-tag {
            background: var(--accent);
            color: #000;
            padding: 2px 6px;
            font-size: 0.6rem;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 10px;
        }

        .game-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 950px;
            width: 100%;
        }

        .play-area {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 30px;
            border-top: 3px solid var(--accent);
            width: 100%;
            max-width: 450px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px 0 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 35px solid #fff;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -35px;
            left: -10px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 25px solid var(--accent);
        }

        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.3));
        }

        .level-display {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.5rem;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .info-text { color: var(--text-muted); margin-bottom: 15px; font-size: 0.9rem; }

        input[type="number"], input[type="text"] {
            width: 80%; background: var(--surface);
            border: 2px solid var(--border); color: var(--accent);
            font-family: 'Press Start 2P', monospace; font-size: 1rem;
            padding: 15px; text-align: center; margin-bottom: 20px; outline: none; transition: 0.2s;
        }

        input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 229, 255, 0.2); }

        button {
            font-family: 'Press Start 2P', monospace; font-size: 0.8rem;
            padding: 15px 20px; background: var(--accent); color: #000;
            border: none; cursor: pointer; letter-spacing: 0.1em;
            transition: 0.2s; width: 80%; box-shadow: 0 4px 0 #0099aa;
        }

        button:active { transform: translateY(4px); box-shadow: 0 0 0 #0099aa; }
        button:disabled { background: var(--border); color: var(--text-muted); box-shadow: 0 4px 0 #1a1a28; cursor: not-allowed; transform: none; }

        .result-box { margin-top: 25px; min-height: 40px; font-weight: bold; font-size: 1.1rem; text-shadow: 0 0 5px rgba(255,255,255,0.2); }


        .global-badge { font-size: 0.6rem; color: var(--success); margin-bottom: 20px; letter-spacing: 0.1em; }

        .score-list { list-style: none; padding: 0; margin: 0; text-align: left; width: 100%; }
        .score-list li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed var(--border); font-size: 0.9rem; }
        .score-list li span:last-child { color: var(--accent); font-weight: bold; }

        .back-btn { margin-top: 40px; background: transparent; color: var(--text-muted); border: 1px solid var(--border); text-decoration: none; padding: 10px 20px; font-family: 'Press Start 2P', monospace; font-size: 0.6rem; transition: 0.3s; }
        .back-btn:hover { color: #fff; border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }

        #save-status { font-size: 0.6rem; color: var(--success); margin-top: 10px; font-family: 'Press Start 2P', monospace; }
    </style>
</head>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9wKFVXmT6kUpuaBgwlPilF86LaKKDYFU",
            authDomain: "money-digger-9b05e.firebaseapp.com",
            databaseURL: "https://money-digger-9b05e-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "money-digger-9b05e",
            storageBucket: "money-digger-9b05e.firebasestorage.app",
            messagingSenderId: "883506536944",
            appId: "1:883506536944:web:921b342dff76154fcbbd35"
        };

        const lgApp = firebase.initializeApp(firebaseConfig, 'lucky-guy-app');
        const db = lgApp.database().ref('luckyGuyScores');

        window.currentPlayerName = "";
        window.currentLevel = 1;
        window.isSpinning = false;
        window.currentRotation = Math.floor(Math.random() * 360); 
        
        const wheelColors = ['#00e5ff', '#ff44aa', '#00ff88', '#ffdd00', '#ff8844', '#b344ff'];

        const startUI = document.getElementById('start-ui');
        const gameUI = document.getElementById('game-ui');
        const levelText = document.getElementById('level-text');
        const instruction = document.getElementById('instruction');
        const guessInput = document.getElementById('guess-input');
        const resultMessage = document.getElementById('result-message');
        const spinBtn = document.getElementById('spin-btn');
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const displayNameEl = document.getElementById('display-name');

        canvas.style.transform = `rotate(${window.currentRotation}deg)`;

        // Actieve naam en code ophalen uit localStorage
        let finalName = localStorage.getItem('pg_player_name') || localStorage.getItem('pixel_games_username') || 'Speler';
        let userCode = localStorage.getItem('pg_account_code') || localStorage.getItem('pg_account_code');

        if (displayNameEl) displayNameEl.textContent = finalName;

        window.startGame = async function() {
            // Update actieve naam en code opnieuw
            finalName = localStorage.getItem('pg_player_name') || localStorage.getItem('pixel_games_username') || 'Speler';
            userCode = localStorage.getItem('pg_account_code') || '';
            if (displayNameEl) displayNameEl.textContent = finalName;

            window.currentPlayerName = finalName;
            
            // Haal lokale opslag op
            let personalSave = null;
            try { personalSave = JSON.parse(localStorage.getItem('luckyGuySaveData')); } catch(e){}

            let startingLevel = 1;
            if (personalSave && personalSave.level) {
                startingLevel = personalSave.level;
            }

            const startBtn = document.querySelector('#start-ui button') || document.getElementById('start-btn');
            const oldText = startBtn ? startBtn.innerText : "START GAME";
            if (startBtn) { startBtn.innerText = "SERVER CHECKEN..."; startBtn.disabled = true; }

            try {
                let highestLevel = 0;
                
                // 1. Kijken op de server via ACCOUNT CODE
                if (userCode) {
                    const codeSnap = await db.orderByChild('code').equalTo(userCode).once('value');
                    if (codeSnap.exists()) {
                        codeSnap.forEach(child => {
                            const val = child.val();
                            if (val && val.level && val.level > highestLevel) highestLevel = val.level;
                        });
                    }
                }

                // 2. Als er niks via code was, kijken via SPELERSNAAM
                if (highestLevel === 0 && finalName) {
                    const nameSnap = await db.orderByChild('name').equalTo(finalName).once('value');
                    if (nameSnap.exists()) {
                        nameSnap.forEach(child => {
                            const val = child.val();
                            if (val && val.level && val.level > highestLevel) highestLevel = val.level;
                        });
                    }
                }

                // Server heeft altijd gelijk als het level daar hoger is!
                if (highestLevel > startingLevel) {
                    startingLevel = highestLevel;
                }
            } catch (e) {
                console.warn("Kon Firebase niet bereiken, we gebruiken de lokale save.", e);
            }

            window.currentLevel = startingLevel;
            savePersonalProgress();

            if (startBtn) { startBtn.innerText = oldText; startBtn.disabled = false; }
            startUI.style.display = 'none';
            gameUI.style.display = 'flex';
            updateUI();
        };

        function savePersonalProgress() {
            const saveData = { name: window.currentPlayerName, level: window.currentLevel, code: userCode };
            localStorage.setItem('luckyGuySaveData', JSON.stringify(saveData));
        }

        function getSecureRandomNumber(maxNumber) {
            const randomBuffer = new Uint32Array(1);
            window.crypto.getRandomValues(randomBuffer);
            return (randomBuffer[0] % maxNumber) + 1;
        }

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10; 
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const sliceAngle = (2 * Math.PI) / window.currentLevel;

            for (let i = 0; i < window.currentLevel; i++) {
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.fillStyle = wheelColors[i % wheelColors.length];
                ctx.fill();
                
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#12121a";
                ctx.stroke();

                if (window.currentLevel <= 80) {
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(i * sliceAngle + sliceAngle / 2);
                    ctx.textAlign = "right";
                    ctx.textBaseline = "middle";
                    ctx.fillStyle = "#000"; 
                    const fontSize = Math.max(12, 35 - (window.currentLevel / 2));
                    ctx.font = `bold ${fontSize}px Arial`;
                    ctx.fillText(i + 1, radius - 20, 0);
                    ctx.restore();
                }
            }

            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
            ctx.fillStyle = "#1a1a28";
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00e5ff";
            ctx.stroke();
        }

        function updateUI() {
            levelText.innerText = window.currentLevel;
            instruction.innerText = `Pick a number between 1 and ${window.currentLevel}`;
            guessInput.value = '';
            guessInput.max = window.currentLevel;
            resultMessage.innerText = '';
            drawWheel();
        }

        window.spinWheel = function() {
            if (window.isSpinning) return;

            const guess = parseInt(guessInput.value);
            
            if (isNaN(guess) || guess < 1 || guess > window.currentLevel) {
                resultMessage.style.color = 'var(--error)';
                resultMessage.innerText = 'Enter a valid number!';
                return;
            }

            window.isSpinning = true;
            spinBtn.disabled = true;
            resultMessage.style.color = '#fff';
            resultMessage.innerText = 'Spinning...';
            
            const winningNumber = getSecureRandomNumber(window.currentLevel);
            
            const sliceAngleDeg = 360 / window.currentLevel;
            const middleAngle = (winningNumber - 1 + 0.5) * sliceAngleDeg;
            
            const randomOffset = (Math.random() * 0.8 - 0.4) * sliceAngleDeg;
            const targetDegree = 270 - middleAngle + randomOffset;

            const spinRounds = Math.floor(Math.random() * 8) + 5;
            const extraSpins = spinRounds * 360; 
            
            const currentMod = window.currentRotation % 360;
            let diff = targetDegree - currentMod;
            if (diff < 0) diff += 360; 

            window.currentRotation += extraSpins + diff;
            
            const spinDuration = Math.random() * 3.5 + 4;
            
            canvas.style.transition = `transform ${spinDuration}s cubic-bezier(0.15, 0.85, 0.1, 1)`;
            canvas.style.transform = `rotate(${window.currentRotation}deg)`;

            setTimeout(() => {
                checkResult(guess, winningNumber);
            }, spinDuration * 1000);
        };

        function checkResult(guess, winningNumber) {
            // Count a spin only after the wheel animation has completed.
            if (typeof window.__plixoRecordLuckyGuySpin === 'function') {
                try { window.__plixoRecordLuckyGuySpin(); } catch (error) { console.warn('Lucky Guy mission tracking failed.', error); }
            }
            if (guess === winningNumber) {
                resultMessage.style.color = 'var(--success)';
                resultMessage.innerText = `BINGO! It was ${winningNumber}.`;
                
                // Verhoog level EN sla direct lokaal + op Firebase op!
                window.currentLevel++;
                savePersonalProgress();
                saveScoreToFirebase(window.currentLevel);

                setTimeout(() => {
                    updateUI();
                    window.isSpinning = false;
                    spinBtn.disabled = false;
                }, 2000);

            } else {
                resultMessage.style.color = 'var(--error)';
                resultMessage.innerText = `WRONG! It was ${winningNumber}. Try again!`;
                
                setTimeout(() => {
                    window.currentRotation = Math.floor(Math.random() * 360);
                    canvas.style.transition = 'none'; 
                    canvas.style.transform = `rotate(${window.currentRotation}deg)`;
                    
                    updateUI();
                    window.isSpinning = false;
                    spinBtn.disabled = false;
                }, 2500);
            }
        }

        // --- ALLESOMVATTENDE SCORE OPSLAAN FUNCTIE ---
        async function saveScoreToFirebase(levelReached) {
            let currentName = localStorage.getItem('pg_player_name') || localStorage.getItem('pixel_games_username') || window.currentPlayerName;
            let accountCode = localStorage.getItem('pg_account_code') || localStorage.getItem('pg_account_code');

            if (!currentName || currentName === "null") return; 

            try {
                let snap = null;

                // 1. Zoek op ACCOUNT CODE
                if (accountCode) {
                    snap = await db.orderByChild('code').equalTo(accountCode).once('value');
                }

                // 2. Zoek op SPELERSNAAM als er via code niks gevonden werd
                if (!snap || !snap.exists()) {
                    snap = await db.orderByChild('name').equalTo(currentName).once('value');
                }

                if (snap && snap.exists()) {
                    // Bestaande rij bijwerken
                    snap.forEach(child => {
                        const existing = child.val();
                        const oldLvl = existing.level || 0;
                        const newLvl = Math.max(levelReached, oldLvl);

                        child.ref.update({
                            level: newLvl,
                            name: currentName,
                            code: accountCode || existing.code || ""
                        });
                        console.log("🔥 Firebase record bijgewerkt:", currentName, "Level:", newLvl);
                    });
                } else {
                    // Nieuwe rij aanmaken voor deze speler/code
                    await db.push({ 
                        name: currentName, 
                        level: levelReached,
                        code: accountCode || "" 
                    });
                    console.log("🔥 Nieuwe score in Firebase gezet:", currentName, "Level:", levelReached);
                }
            } catch (e) {
                console.error("Fout bij opslaan in Firebase: ", e);
            }
        }

        window.saveScoreToFirebase = saveScoreToFirebase;
    </script>


    <script>
(function() {
    let clickTimestamps = [];
    let isWarningActive = false;
    let warningTimer;
    let timeLeft = 15;
    let lastCheatTime = 0;
    const MAX_CPS = 15;
    let bar = null;

    document.addEventListener('click', function(e) {
        const now = Date.now();
        let isCheating = false;

        // 1. Detecteer console scripts en virtuele klikken
        if (!e.isTrusted) {
            isCheating = true;
        } else {
            clickTimestamps.push(now);
            
            // Verwijder klikken ouder dan 1 seconde
            clickTimestamps = clickTimestamps.filter(t => now - t <= 1000);

            // 2. CPS Limiet Check
            if (clickTimestamps.length > MAX_CPS) {
                isCheating = true;
            } 
            // 3. Mechanisch ritme check (laatste 5 klikken)
            else if (clickTimestamps.length >= 5) {
                let isMachine = true;
                let targetInterval = clickTimestamps[clickTimestamps.length - 1] - clickTimestamps[clickTimestamps.length - 2];
                
                for (let i = clickTimestamps.length - 2; i > clickTimestamps.length - 5; i--) {
                    let interval = clickTimestamps[i] - clickTimestamps[i - 1];
                    if (Math.abs(interval - targetInterval) > 3) {
                        isMachine = false; 
                        break;
                    }
                }
                if (isMachine && targetInterval > 0 && targetInterval < 200) {
                    isCheating = true;
                }
            }
        }

        if (isCheating) {
            e.stopPropagation();
            e.preventDefault();
            lastCheatTime = now; 
            
            if (!isWarningActive) {
                startWarning();
            }
        } 
        else if (isWarningActive) {
            e.stopPropagation();
            e.preventDefault();
        }
    }, true); 

    function startWarning() {
        isWarningActive = true;
        timeLeft = 15;
        
        if (!bar) {
            bar = document.createElement('div');
            bar.style.position = 'fixed';
            bar.style.top = '0';
            bar.style.left = '0';
            bar.style.width = '100%';
            bar.style.background = '#ff0044';
            bar.style.color = '#ffffff';
            bar.style.textAlign = 'center';
            bar.style.padding = '15px';
            bar.style.fontFamily = '"Press Start 2P", monospace, sans-serif'; 
            bar.style.fontSize = '12px';
            bar.style.zIndex = '9999999';
            bar.style.boxShadow = '0 5px 15px rgba(0,0,0,0.8)';
            bar.style.lineHeight = '1.5';
            document.body.appendChild(bar);
        }
        bar.style.display = 'block';
        
        function updateBar() {
            bar.innerText = `⚠️ AUTOCLICKER DETECTED! ⚠️\nGame closing in: ${timeLeft} seconds. Turn off your autoclicker to cancel!`;
        }
        
        updateBar();

        warningTimer = setInterval(() => {
            let timeSinceLastCheat = Date.now() - lastCheatTime;
            
            // Vergevings-mechanisme: annuleer zodra ze 3 seconden lang niet cheaten
            if (timeSinceLastCheat > 3000) {
                cancelWarning();
                return;
            }

            // BEVRIES DE TIMER: Telt alleen af als ze in de afgelopen seconde nog gecheat hebben
            // Hierdoor stopt de tijd met lopen op bijv. 2 seconden, totdat de 3 seconden vergevings-tijd voorbij is.
            if (timeSinceLastCheat <= 1000) {
                timeLeft--;
            }
            
            updateBar();

            // Voer de straf uit als de tijd op is
            if (timeLeft <= 0) {
                clearInterval(warningTimer);
                localStorage.setItem('cheat_detectie', 'WAAR');
                window.parent.postMessage('AUTOCLICKER_DETECTED', '*');
                window.location.href = 'index.html'; 
            }
        }, 1000);
    }

    function cancelWarning() {
        clearInterval(warningTimer);
        isWarningActive = false;
        bar.style.display = 'none'; 
        clickTimestamps = []; 
    }
})();
</script>

  let trackingReady = !getAccountCode();
  let pendingTracking = [];
  let lastTick = Date.now(), activeMs = 0;
  let gameMarked = false;
  let lastObservedLuckyLevel = null;

  function ensureDay() {
    const today = DAY_KEY();
    if (today === currentDay) return;
    currentDay = today;
    dailyProgress = safeJSON(dailyKey(currentDay), {});
    dailyGames = unique(safeJSON('plixo_daily_games_' + currentDay, []));
  }
  function refreshLocal() {
    ensureDay();
    globalProgress = mergeProgress(globalProgress, safeJSON('plixo_mission_progress', {}));
    dailyProgress = mergeProgress(dailyProgress, safeJSON(dailyKey(currentDay), {}));
    playedGames = unique([...playedGames, ...safeJSON('plixo_played_games', [])]);
    dailyGames = unique([...dailyGames, ...safeJSON('plixo_daily_games_' + currentDay, [])]);
  }
  function saveLocalNow() {
    refreshLocal();
    try {
      localStorage.setItem('plixo_mission_progress', JSON.stringify(globalProgress));
      localStorage.setItem(dailyKey(currentDay), JSON.stringify(dailyProgress));
      localStorage.setItem('plixo_played_games', JSON.stringify(playedGames));
      localStorage.setItem('plixo_daily_games_' + currentDay, JSON.stringify(dailyGames));
    } catch (error) { console.warn('Lucky Guy: could not save mission progress locally.', error); }
  }
  function scheduleLocalSave() {
    if (localTimer) return;
    localTimer = setTimeout(() => { localTimer = null; saveLocalNow(); }, 100);
  }
  function scheduleCloudSync() {
    if (!getAccountCode() || cloudTimer) return;
    cloudTimer = setTimeout(() => {
      cloudTimer = null;
      syncProgressToFirebase().catch(error => console.warn('Lucky Guy: mission sync failed.', error));
    }, 1400);
  }
  function queueOrRun(action) {
    if (trackingReady) action();
    else pendingTracking.push(action);
  }
  function releaseTracking() {
    if (trackingReady) return;
    trackingReady = true;
    const pending = pendingTracking;
    pendingTracking = [];
    pending.forEach(action => { try { action(); } catch (error) { console.warn('Lucky Guy: deferred tracking failed.', error); } });
  }
  function setGlobalMax(id, value) {
    queueOrRun(() => {
      refreshLocal();
      const n = Math.max(0, num(value));
      if (n <= num(globalProgress[id])) return;
      globalProgress[id] = n;
      scheduleLocalSave(); scheduleCloudSync();
    });
  }
  function incrementGlobal(id, amount = 1) {
    queueOrRun(() => {
      refreshLocal();
      const n = Math.max(0, num(amount));
      if (!id || n <= 0) return;
      globalProgress[id] = num(globalProgress[id]) + n;
      scheduleLocalSave(); scheduleCloudSync();
    });
  }
  function setDailyMax(id, value) {
    queueOrRun(() => {
      refreshLocal();
      const n = Math.max(0, num(value));
      dailyProgress[id] = Math.max(num(dailyProgress[id]), n);
      globalProgress[id] = Math.max(num(globalProgress[id]), n);
      scheduleLocalSave(); scheduleCloudSync();
    });
  }
  function incrementDaily(id, amount = 1) {
    queueOrRun(() => {
      refreshLocal();
      const n = Math.max(0, num(amount));
      if (!id || n <= 0) return;
      dailyProgress[id] = num(dailyProgress[id]) + n;
      globalProgress[id] = Math.max(num(globalProgress[id]), num(dailyProgress[id]));
      scheduleLocalSave(); scheduleCloudSync();
    });
  }
  // Each completed wheel animation increments today's progress for both spin missions.
  // These IDs are included in DAILY_IDS so the current day's progress is synced to Firebase.
  window.__plixoRecordLuckyGuySpin = function() {
    incrementDaily('a_lucky_spin_3', 1);
    incrementDaily('a_lucky_spin_5', 1);
  };
  function markGamePlayedNow() {
    refreshLocal();
    playedGames = unique([...playedGames, GAME_ID]);
    dailyGames = unique([...dailyGames, GAME_ID]);
    globalProgress.a9 = Math.max(num(globalProgress.a9), playedGames.length);
    for (const id of ['dm_1', 'dm_2', 'dm_3']) {
      dailyProgress[id] = Math.max(num(dailyProgress[id]), dailyGames.length);
      globalProgress[id] = Math.max(num(globalProgress[id]), dailyGames.length);
    }
    scheduleLocalSave(); scheduleCloudSync();
  }
  function markGamePlayed() {
    if (gameMarked) return;
    gameMarked = true;
    queueOrRun(markGamePlayedNow);
  }

  function ensureFirebaseSDK() {
    if (window.firebase && typeof window.firebase.database === 'function') return Promise.resolve();
    if (sdkPromise) return sdkPromise;
    const load = src => new Promise((resolve, reject) => {
      const existing = [...document.scripts].find(script => script.src === src);
      if (existing) {
        if (existing.dataset.plixoLoaded === 'true' || (window.firebase && typeof window.firebase.database === 'function')) return resolve();
        existing.addEventListener('load', () => resolve(), { once: true });
        existing.addEventListener('error', () => reject(new Error('Could not load ' + src)), { once: true });
        return;
      }
      const script = document.createElement('script');
      script.src = src; script.async = true;
      script.onload = () => { script.dataset.plixoLoaded = 'true'; resolve(); };
      script.onerror = () => reject(new Error('Could not load ' + src));
      (document.head || document.documentElement).appendChild(script);
    });
    sdkPromise = load('https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js')
      .then(() => window.firebase && typeof window.firebase.database === 'function' ? null : load('https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js'))
      .then(() => { if (!window.firebase || typeof window.firebase.database !== 'function') throw new Error('Firebase database SDK not available.'); });
    return sdkPromise;
  }
  async function getDatabase() {
    if (dbRef) return dbRef;
    await ensureFirebaseSDK();
    const apps = window.firebase.apps || [];
    if (!apps.some(app => app && app.name === '[DEFAULT]')) window.firebase.initializeApp(FIREBASE_CONFIG);
    dbRef = window.firebase.database();
    return dbRef;
  }
  async function syncProgressToFirebase() {
    const code = getAccountCode();
    if (!code) return;
    if (syncInFlight) { syncAgain = true; return syncInFlight; }
    syncInFlight = (async () => {
      const db = await getDatabase();
      refreshLocal();
      const root = db.ref('plixo_users/' + code);
      const snapshot = await root.once('value');
      const record = snapshot && snapshot.exists() ? (snapshot.val() || {}) : {};
      const remoteGlobal = record.mission_progress && typeof record.mission_progress === 'object' ? record.mission_progress : {};
      const remotePlayed = Array.isArray(record.played_games) ? record.played_games : [];
      const remoteDailyGames = record.daily_games && record.daily_games.date === currentDay && Array.isArray(record.daily_games.games) ? record.daily_games.games : [];
      playedGames = unique([...remotePlayed, ...playedGames]);
      dailyGames = unique([...remoteDailyGames, ...dailyGames]);
      globalProgress.a9 = Math.max(num(globalProgress.a9), playedGames.length);
      for (const id of ['dm_1', 'dm_2', 'dm_3']) {
        dailyProgress[id] = Math.max(num(dailyProgress[id]), dailyGames.length);
        globalProgress[id] = Math.max(num(globalProgress[id]), dailyGames.length);
      }

      // Merge only the mission/achievement IDs this game actually tracks.
      const globalUpdates = {};
      for (const id of GLOBAL_IDS) {
        if (!id) continue;
        const localValue = num(globalProgress[id]);
        const remoteValue = num(remoteGlobal[id]);
        if (localValue > 0 || remoteValue > 0 || globalProgress[id] !== undefined || remoteGlobal[id] !== undefined) {
          const merged = Math.max(localValue, remoteValue);
          globalProgress[id] = merged;
          globalUpdates[id] = merged;
        }
      }
      if (Object.keys(globalUpdates).length) await root.child('mission_progress').update(globalUpdates);

      const today = currentDay = DAY_KEY();
      const localDaily = mergeProgress(safeJSON(dailyKey(today), {}), dailyProgress);
      dailyProgress = localDaily;
      const remoteDaily = record.daily && typeof record.daily === 'object' ? record.daily : {};
      const remoteDailyProgress = remoteDaily.date === today && remoteDaily.progress && typeof remoteDaily.progress === 'object' ? remoteDaily.progress : {};
      const dailyUpdates = {};
      for (const id of DAILY_IDS) {
        if (!id) continue;
        const merged = Math.max(num(remoteDailyProgress[id]), num(localDaily[id]), num(dailyProgress[id]));
        if (merged > 0 || remoteDailyProgress[id] !== undefined || localDaily[id] !== undefined || dailyProgress[id] !== undefined) {
          dailyProgress[id] = merged;
          globalProgress[id] = Math.max(num(globalProgress[id]), merged);
          dailyUpdates[id] = merged;
        }
      }
      if (remoteDaily.date === today) {
        if (Object.keys(dailyUpdates).length) await root.child('daily/progress').update(dailyUpdates);
      } else {
        // A new day gets today's local progress/claims; the previous day's daily progress is reset.
        await root.child('daily').update({
          date: today,
          progress: dailyProgress,
          claimed: safeJSON('plixo_daily_claimed_' + today, {}),
          bonus: localStorage.getItem('plixo_daily_bonus_date') || ''
        });
      }
      await root.update({
        played_games: playedGames,
        daily_games: { date: today, games: dailyGames }
      });
      saveLocalNow();
    })().catch(error => {
      console.warn('Lucky Guy: Firebase mission sync unavailable; local progress is retained.', error);
    }).finally(() => {
      syncInFlight = null;
      if (syncAgain) { syncAgain = false; scheduleCloudSync(); }
    });
    return syncInFlight;
  }

  function isActuallyPlaying() { return (function(){ const el = document.getElementById('game-ui'); return !!el && el.style.display !== 'none' && getComputedStyle(el).display !== 'none'; })(); }
  function gameHasStarted() { return (function(){ const el = document.getElementById('game-ui'); return !!el && el.style.display !== 'none' && getComputedStyle(el).display !== 'none'; })(); }
  function pollGameProgress() {     const gameUI = document.getElementById('game-ui');
    const active = !!gameUI && gameUI.style.display !== 'none' && getComputedStyle(gameUI).display !== 'none';
    const currentLevel = Number(window.currentLevel || 0);
    if (!active || !Number.isFinite(currentLevel) || currentLevel < 1) {
      lastObservedLuckyLevel = null;
      return;
    }
    setGlobalMax('a_lucky_level25', currentLevel);
    if (lastObservedLuckyLevel === null) {
      lastObservedLuckyLevel = currentLevel; // Loaded save/server level is not a level earned today.
    } else if (currentLevel > lastObservedLuckyLevel) {
      incrementDaily('dm_lucky_level_5', currentLevel - lastObservedLuckyLevel);
      lastObservedLuckyLevel = currentLevel;
    } else if (currentLevel < lastObservedLuckyLevel) {
      lastObservedLuckyLevel = currentLevel;
    }
 }
  function installGameHooks() {     // Level gains are polled from the game's existing public currentLevel variable.
 }

  try { installGameHooks(); } catch (error) { console.warn('Lucky Guy: could not attach all progress hooks.', error); }

  function tick() {
    ensureDay();
    const now = Date.now();
    const elapsed = Math.max(0, Math.min(5000, now - lastTick));
    lastTick = now;
    if (document.visibilityState !== 'hidden' && isActuallyPlaying()) {
      activeMs += elapsed;
      while (activeMs >= 60000) { activeMs -= 60000; incrementGlobal('a13', 1);  }
    }
    try { pollGameProgress(); } catch (error) { console.warn('Lucky Guy: progress poll failed.', error); }
    if (!gameMarked && gameHasStarted()) markGamePlayed();
  }

  window.addEventListener('storage', event => {
    const today = DAY_KEY();
    if ([ 'plixo_mission_progress', 'plixo_played_games', 'plixo_daily_games_' + today, dailyKey(today), 'pg_account_code', 'pg_player_id', 'plixo_sync_code' ].includes(event.key)) {
      refreshLocal();
      if (getAccountCode()) scheduleCloudSync();
    }
  });
  window.addEventListener('focus', () => { refreshLocal(); if (getAccountCode()) syncProgressToFirebase().catch(() => {}); });
  window.addEventListener('pageshow', () => { refreshLocal(); if (getAccountCode()) scheduleCloudSync(); });
  window.addEventListener('pagehide', () => {
    if (localTimer) { clearTimeout(localTimer); localTimer = null; saveLocalNow(); }
    if (cloudTimer) { clearTimeout(cloudTimer); cloudTimer = null; }
    if (getAccountCode()) syncProgressToFirebase().catch(() => {});
  });
  document.addEventListener('visibilitychange', () => { lastTick = Date.now(); if (document.visibilityState !== 'hidden') { refreshLocal(); if (getAccountCode()) scheduleCloudSync(); } });

  if (getAccountCode()) {
    // Load/merge remote counters before applying new lifetime-counter increments.
    const releaseTimer = setTimeout(releaseTracking, 6000);
    syncProgressToFirebase().finally(() => { clearTimeout(releaseTimer); releaseTracking(); });
  } else {
    trackingReady = true;
  }
  setInterval(tick, 1000);
  setInterval(() => { if (getAccountCode()) syncProgressToFirebase().catch(() => {}); }, 30000);
})();

</script>
</body>
</html>
