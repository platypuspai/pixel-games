<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Guy v4.2 - Pixel-Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --card: #1a1a28;
            --border: #2a2a42;
            --accent: #00e5ff;
            --text: #e8e8ff;
            --text-muted: #7777aa;
            --error: #ff44aa;
            --success: #00ff88;
        }

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            color: var(--accent);
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .version-tag {
            background: var(--accent);
            color: #000;
            padding: 2px 6px;
            font-size: 0.6rem;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 10px;
        }

        .game-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 950px;
            width: 100%;
        }

        .play-area, .leaderboard {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 30px;
            border-top: 3px solid var(--accent);
            width: 100%;
            max-width: 450px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px 0 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 35px solid #fff;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -35px;
            left: -10px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 25px solid var(--accent);
        }

        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.3));
        }

        .level-display {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.5rem;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .info-text {
            color: var(--text-muted);
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        input[type="number"], input[type="text"] {
            width: 80%;
            background: var(--surface);
            border: 2px solid var(--border);
            color: var(--accent);
            font-family: 'Press Start 2P', monospace;
            font-size: 1rem;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        button {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            padding: 15px 20px;
            background: var(--accent);
            color: #000;
            border: none;
            cursor: pointer;
            letter-spacing: 0.1em;
            transition: 0.2s;
            width: 80%;
            box-shadow: 0 4px 0 #0099aa;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0099aa;
        }

        button:disabled {
            background: var(--border);
            color: var(--text-muted);
            box-shadow: 0 4px 0 #1a1a28;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            margin-top: 25px;
            min-height: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        .leaderboard h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: var(--accent);
        }

        .score-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
            width: 100%;
        }

        .score-list li {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.9rem;
        }

        .score-list li span:last-child {
            color: var(--accent);
            font-weight: bold;
        }

        .back-btn {
            margin-top: 40px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            text-decoration: none;
            padding: 10px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            transition: 0.3s;
        }

        .back-btn:hover {
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        #save-status {
            font-size: 0.6rem;
            color: var(--success);
            margin-top: 10px;
            font-family: 'Press Start 2P', monospace;
        }
    </style>
</head>
<body>

    <header>
        <h1>LUCKY GUY <span class="version-tag">v4.2</span></h1>
        <p style="color: var(--text-muted); font-size: 0.8rem;">Pure chaos mode. Pick your number.</p>
    </header>

    <div class="game-container">

            <input type="text" id="player-name-input" placeholder="YOUR NAME" maxlength="15">

            <div class="wheel-wrapper">

                <canvas id="wheel-canvas" class="wheel-canvas" width="600" height="600"></canvas>
            </div>

            <input type="number" id="guess-input" min="1" placeholder="Your number?">
            <button id="spin-btn" onclick="spinWheel()">SPIN THE WHEEL</button>

            <div class="result-box" id="result-message"></div>
        </div>

        <div class="leaderboard">
            <h2>TOP 10 LUCKIEST</h2>
            <ul class="score-list" id="leaderboard-list"></ul>
        </div>
    </div>

    <a href="index.html" class="back-btn">◀ BACK TO HOME</a>
