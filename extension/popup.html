<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Guy v4.3</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --card: #1a1a28;
            --border: #2a2a42;
            --accent: #00e5ff;
            --text: #e8e8ff;
            --text-muted: #7777aa;
            --error: #ff44aa;
            --success: #00ff88;
        }

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
            padding: 20px;
            width: 100%;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            color: var(--accent);
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .version-tag {
            background: var(--accent);
            color: #000;
            padding: 2px 6px;
            font-size: 0.6rem;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 10px;
        }

        .game-container {
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .play-area {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 20px;
            border-top: 3px solid var(--accent);
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .wheel-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px 0 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 28px solid #fff;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -28px;
            left: -8px;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 20px solid var(--accent);
        }

        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.3));
        }

        .level-display {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.3rem;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .info-text {
            color: var(--text-muted);
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        input[type="number"], input[type="text"] {
            width: 85%;
            background: var(--surface);
            border: 2px solid var(--border);
            color: var(--accent);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9rem;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            transition: 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        button {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            padding: 12px 15px;
            background: var(--accent);
            color: #000;
            border: none;
            cursor: pointer;
            letter-spacing: 0.1em;
            transition: 0.2s;
            width: 85%;
            box-shadow: 0 4px 0 #0099aa;
            box-sizing: border-box;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0099aa;
        }

        button:disabled {
            background: var(--border);
            color: var(--text-muted);
            box-shadow: 0 4px 0 #1a1a28;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            margin-top: 15px;
            min-height: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
            width: 100%;
        }

        .global-badge {
            font-size: 0.6rem;
            color: var(--success);
            margin-bottom: 15px;
            letter-spacing: 0.1em;
        }

        #save-status {
            font-size: 0.65rem;
            color: var(--success);
            margin-top: 8px;
            font-family: 'Press Start 2P', monospace;
        }
    </style>
</head>
<body>
    <header>
        <h1>LUCKY GUY <span class="version-tag">v4.3</span></h1>
        <p style="color: var(--text-muted); font-size: 0.75rem; margin: 5px 0 0 0;">Pure chaos mode</p>
    </header>

    <div class="game-container">
        <div class="play-area" id="start-ui">
            <h2 style="font-family: 'Press Start 2P'; font-size: 1rem; color: var(--accent); margin: 0 0 15px 0;">LUCKY GUY</h2>
            <p class="info-text">Spelen als: <strong id="display-name" style="color:var(--accent)">—</strong></p>
            <input type="text" id="name-input" placeholder="Je naam?" style="display: none;">
            <p class="info-text" id="save-status" style="font-size:0.65rem; margin-top:6px; opacity:0.6;"></p>
            <button onclick="startGame()" style="margin-top:15px;">START GAME</button>
        </div>

        <div class="play-area" id="game-ui" style="display: none;">
            <div class="info-text">CURRENT LEVEL</div>
            <div class="level-display" id="level-text">1</div>
            <p class="info-text" id="instruction">Pick a number between 1 and 1</p>

            <div class="wheel-wrapper">
                <div class="pointer"></div>
                <canvas id="wheel-canvas" class="wheel-canvas" width="500" height="500"></canvas>
            </div>

            <input type="number" id="guess-input" min="1" placeholder="Your number?">
            <button id="spin-btn" onclick="spinWheel()">SPIN!</button>

            <div class="result-box" id="result-message"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="popup.js"></script>
</body>
</html>
