<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess.com Stijl — Klik-schaken</title>
    
    <!-- Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- Chessboard.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com">
    
    <style>
        :root {
            --bg: #161512;
            --surface: #262421;
            --surface-light: #363431;
            --border: #3b3835;
            --accent: #81b64c;
            --text: #babbb6;
            --text-light: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chess-layout {
            display: flex;
            gap: 24px;
            background: var(--surface);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 900px;
            width: 100%;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        #board-container {
            width: 440px;
            height: 440px;
        }

        .sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 440px;
        }

        .player-card {
            background: var(--surface-light);
            padding: 12px 16px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            color: var(--text-light);
            border-left: 4px solid var(--border);
        }

        .player-card.active {
            border-left-color: var(--accent);
        }

        .moves-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.9rem;
            color: var(--text);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .moves-box h3 {
            font-size: 0.8rem;
            color: var(--text);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .move-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: filter 0.2s;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button.secondary {
            background: var(--surface-light);
            color: var(--text-light);
        }

        #status {
            font-size: 0.85rem;
            color: var(--text-light);
            text-align: center;
            min-height: 1.2em;
        }

        /* Markeringsstijlen voor legale zetten (Chess.com look) */
        .highlight-square {
            box-shadow: inset 0 0 3px 3px rgba(129, 182, 76, 0.7) !important;
        }
        
        #board .square-55d63 {
            position: relative;
        }

        .highlight-legal::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 22px; height: 22px;
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        .highlight-legal-capture::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 4px solid rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="chess-layout">
        <div id="board-container">
            <div id="board" style="width: 100%"></div>
        </div>

        <div class="sidebar">
            <div class="player-card" id="card-black">
                <span>🤖 Chess Bot (Zwart)</span>
            </div>
            
            <div class="moves-box">
                <h3>Zettenhistorie</h3>
                <div id="moves-list" style="display: flex; flex-direction: column; gap: 2px;"></div>
            </div>

            <div class="player-card active" id="card-white">
                <span>👤 Jij (Wit)</span>
            </div>

            <div id="status">Laden...</div>

            <div class="controls">
                <button class="secondary" onclick="resetGame()">Nieuw Spel</button>
                <button onclick="forceAiMove()">Zet AI</button>
            </div>
        </div>
    </div>

    <!-- Libraries in exact de juiste laadvolgorde -->
    <script src="https://jquery.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    
    <!-- Firebase SDK (Compat Modus) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // ===================================================
        // 1. FIREBASE CONFIGURATIE (VEILIGE REALTIME SYNC)
        // ===================================================
        // VUL HIER JOUW EIGEN CONFIG IN UIT JE MONEY DIGGER BESTAND!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_://firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_://firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_://appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        let database = null;
        let firebaseReady = false;

        // Foutbestendige initialisatie: als de sleutels hierboven nog op demo staan, crasht het spel niet!
        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY" && firebaseConfig.apiKey !== "") {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                database = firebase.database();
                firebaseReady = true;
                console.log("Firebase gekoppeld aan de schaak-AI!");
            } else {
                console.warn("Draait in lokale demo-modus. Vul je Firebase-sleutels in voor wereldwijd leren.");
            }
        } catch (e) {
            console.error("Firebase database kon niet starten: ", e);
        }

        // ===================================================
        // 2. LOGICA EN COÖRDINATIE
        // ===================================================
        let board = null;
        let game = new Chess();
        let selectedSquare = null;
        let legalMoves = [];
        let moveHistory = []; 

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight-square highlight-legal highlight-legal-capture');
        }

        function highlightSquare(square) {
            let $square = $('#board .square-' + square);
            $square.addClass('highlight-square');
        }

        function highlightLegalMoves(moves) {
            moves.forEach(move => {
                let $square = $('#board .square-' + move.to);
                if (move.captured) {
                    $square.addClass('highlight-legal-capture');
                } else {
                    $square.addClass('highlight-legal');
                }
            });
        }

        function onSquareClick(square) {
            if (game.game_over()) return;
            if (game.turn() !== 'w') return; 

            let matchMove = legalMoves.find(m => m.to === square);
            if (selectedSquare && matchMove) {
                // Handmatige afhandeling van pionpromotie om chess.js fouten te voorkomen
                const sourcePiece = game.get(selectedSquare);
                let promotionPiece = undefined;
                if (sourcePiece && sourcePiece.type === 'p' && square.charAt(1) === '8') {
                    promotionPiece = 'q';
                }

                let move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: promotionPiece
                });

                if (move) {
                    selectedSquare = null;
                    legalMoves = [];
                    removeHighlights();
                    board.position(game.fen());
                    updateGameState();

                    if (!game.game_over()) {
                        window.setTimeout(makeAiMove, 500);
                    }
                    return;
                }
            }
