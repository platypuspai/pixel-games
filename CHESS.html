<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plixo-Arcade · Wereld Schaak AI</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e222b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #282c34;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        /* --- HET KLEINE MANNETJE (AVATAR) --- */
        .opponent-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            height: 110px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background: #ffbd59;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        .avatar::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 5px;
            width: 50px;
            height: 15px;
            background: #e74c3c;
            border-radius: 10px 10px 0 0;
        }

        .avatar-eyes {
            position: absolute;
            top: 22px;
            left: 12px;
            width: 36px;
            display: flex;
            justify-content: space-between;
        }

        .eye {
            width: 8px;
            height: 8px;
            background: #2c3e50;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .avatar-mouth {
            position: absolute;
            bottom: 12px;
            left: 22px;
            width: 16px;
            height: 8px;
            border-bottom: 3px solid #2c3e50;
            border-radius: 0 0 10px 10px;
            transition: all 0.2s;
        }

        /* Animaties & Emoties */
        .avatar.thinking .eye { animation: blink 0.4s infinite alternate; }
        .avatar.thinking { background: #f39c12; }

        .avatar.winning .avatar-mouth {
            border-radius: 0 0 15px 15px;
            height: 10px;
            background: transparent;
        }

        .avatar.losing .avatar-mouth {
            border: none;
            border-top: 3px solid #2c3e50;
            border-radius: 10px 10px 0 0;
            bottom: 8px;
        }

        .opponent-name {
            font-size: 14px;
            font-weight: bold;
            color: #a0a5b5;
            margin-top: 8px;
        }

        /* --- MODERN SCHAAKBORD ELEMENT --- */
        chess-board {
            width: 400px;
            max-width: 90vw;
            border: 4px solid #3e4451;
            border-radius: 4px;
            margin-bottom: 15px;
            display: block;
        }

        .control-panel {
            text-align: center;
            width: 100%;
        }

        .status-text {
            font-size: 15px;
            color: #abb2bf;
            margin-bottom: 12px;
            min-height: 22px;
        }

        button {
            background: #4b7bec;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #3867d6; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        @keyframes blink {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(0.1); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- De AI Tegenstander -->
        <div class="opponent-area">
            <div id="ai-avatar" class="avatar">
                <div class="avatar-eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="avatar-mouth"></div>
            </div>
            <div class="opponent-name">Plixo Chess-Bot AI</div>
        </div>

        <!-- Het Nieuwe Web-Component Bord (Inclusief ingebouwde SVG stukken) -->
        <chess-board id="board" draggable></chess-board>

        <!-- Besturing -->
        <div class="control-panel">
            <div id="status" class="status-text">Initialiseren...</div>
            <button onclick="resetGame()">Nieuw Potje</button>
        </div>
    </div>

    <!-- Betrouwbare modules inladen (Geen jQuery vereist) -->
    <script src="https://cloudflare.com"></script>
    <script type="module" src="https://unpkg.com"></script>
    
    <!-- Firebase SDK (Compat Modus) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // ===================================================
        // FIREBASE INITIALISATIE
        // ===================================================
        // VUL HIER JOUW EIGEN CONFIG IN UIT DE ARCADE INDEX!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_://firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_://firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_://appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        let database = null;
        let firebaseReady = false;

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                database = firebase.database();
                firebaseReady = true;
            }
        } catch(e) { console.error("Firebase fout: ", e); }

        // ===================================================
        // AI ENGINE LOGICA
        // ===================================================
        const boardEl = document.getElementById('board');
        const avatarEl = document.getElementById('ai-avatar');
        const statusEl = document.getElementById('status');
        
        let game = new Chess();
        let moveHistory = [];

        // Luister naar zetten op het nieuwe bord element
        boardEl.addEventListener('change', (e) => {
            // Synchroniseer visuele component updates
        });

        // Blokkeer slepen van zwarte stukken
        boardEl.addEventListener('drag-start', (e) => {
            const { source, piece, position, orientation } = e.detail;
            if (game.game_over()) { e.preventDefault(); return; }
            if (piece.search(/^b/) !== -1) { e.preventDefault(); return; }
        });

        // Verwerk de menselijke zet
        boardEl.addEventListener('drop', (e) => {
            const { source, target } = e.detail;

            const sourcePiece = game.get(source);
            let promotionPiece = undefined;
            if (sourcePiece && sourcePiece.type === 'p') {
                if ((sourcePiece.color === 'w' && target.charAt(1) === '8') || 
                    (sourcePiece.color === 'b' && target.charAt(1) === '1')) {
                    promotionPiece = 'q'; 
                }
            }

            let move = game.move({
                from: source,
                to: target,
                promotion: promotionPiece
            });

            if (move === null) {
                e.detail.actionBar = 'snapback';
                boardEl.setPosition(game.fen());
                return;
            }

            updateStatus();
            window.setTimeout(makeAIMove, 500);
        });

        async function makeAIMove() {
            if (game.game_over()) return;

            avatarEl.className = 'avatar thinking';

            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;

            const currentFen = game.fen().replace(/\//g, "_");
            let learnedMoves = {};

            if (firebaseReady && database) {
                try {
                    const snapshot = await database.ref('plixo_arcade/chess_ai/' + currentFen).once('value');
                    if (snapshot.exists()) {
                        learnedMoves = snapshot.val();
                    }
                } catch(e) { console.error(e); }
            }

            let bestMove = null;
            let maxScore = -Infinity;

            moves.forEach(move => {
                const moveSan = move.san;
                const score = learnedMoves[moveSan] || 0;
                const finalScore = score + (Math.random() * 0.25);

                if (finalScore > maxScore) {
                    maxScore = finalScore;
                    bestMove = move;
                }
            });

            game.move(bestMove.san);
            boardEl.setPosition(game.fen());

            moveHistory.push({ fen: currentFen, move: bestMove.san });
            avatarEl.className = 'avatar';
            updateStatus();
        }

        function updateStatus() {
            let statusText = '';
            let turnColor = game.turn() === 'b' ? 'Zwart (AI)' : 'Wit (Jij)';
