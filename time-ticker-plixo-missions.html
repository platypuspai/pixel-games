<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Ticker - Pixel Games</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #0a0a0f;
            --card: #1a1a28;
            --border: #2a2a42;
            --accent-blue: #4488ff;
            --accent-yellow: #ffdd00;
            --accent-green: #00ff88;
            --text: #e8e8ff;
            --text-muted: #7777aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 60px;
            overflow-x: hidden;
        }

        /* Scanline Animatie */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
            pointer-events: none; z-index: 1000;
        }

        header { text-align: center; margin-bottom: 30px; animation: fadeInDown 0.8s ease-out; }
        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(1.2rem, 4vw, 2rem);
            color: var(--accent-blue);
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(68,136,255,0.3);
        }
        .subtitle { font-size: 0.9rem; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }

        /* ====== DE NOTEBOOK ====== */
        .notebook {
            background: #fffdfa; color: #0f172a;
            width: 100%; max-width: 750px;
            border-radius: 4px; padding: 30px 20px 30px 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-left: 14px solid #ef4444;
            position: relative; z-index: 10;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Ringen van het notitieblok */
        .notebook::before {
            content: ''; position: absolute;
            top: 20px; left: -22px; bottom: 20px; width: 14px;
            background: radial-gradient(circle, #cbd5e1 3px, transparent 4px);
            background-size: 14px 28px;
        }

        /* ====== HOOFD TUSSENSCHOT (GROTE SCORE) ====== */
        .main-score-container {
            border-bottom: 6px solid #ef4444;
            padding-bottom: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .main-score-title {
            font-family: 'Press Start 2P', monospace;
            color: #0f172a;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .main-score-val {
            font-family: 'Press Start 2P', monospace;
            color: #ef4444;
            font-size: 1.6rem;
            line-height: 1.8;
            text-shadow: 2px 2px 0px rgba(239, 68, 68, 0.2);
        }

        /* Notebook regels voor de 18 feiten */
        .notebook-line {
            border-bottom: 1.5px solid #cbd5e1;
            padding: 15px 0;
            display: grid;
            grid-template-columns: 50px 1fr auto;
            align-items: center; gap: 15px;
            opacity: 0; animation: fadeInLine 0.5s forwards;
        }

        /* Icoon container */
        .anim-box {
            width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2.2rem;
        }

        /* Tekst (Titel & Beschrijving) */
        .text-box { display: flex; flex-direction: column; gap: 4px; }
        .fact-title { font-weight: 700; font-size: 1.1rem; color: #0f172a; }
        .fact-desc { font-size: 0.85rem; color: #475569; line-height: 1.3; }

        /* Waarde (Blauwe pen stijl) */
        .val-box {
            font-family: 'Press Start 2P', monospace; font-size: 0.75rem;
            color: #1e3a8a; text-align: right; line-height: 1.4;
            max-width: 200px; word-wrap: break-word;
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInLine { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        /* Back Link */
        .back-link {
            margin-top: 40px; position: relative; z-index: 10;
            color: var(--accent-blue); text-decoration: none;
            font-family: 'Press Start 2P', monospace; font-size: 0.7rem;
            transition: color 0.2s; padding: 10px;
        }
        .back-link:hover { color: var(--accent-green); }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; backdrop-filter: blur(5px);
        }
        .modal {
            background: var(--card); border: 2px solid var(--accent-yellow);
            padding: 30px; max-width: 420px; width: 90%;
            border-radius: 4px; text-align: center;
        }
        .modal h2 { font-family: 'Press Start 2P', monospace; font-size: 0.8rem; color: var(--accent-yellow); margin-bottom: 15px; }
        .modal p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .modal input {
            width: 100%; padding: 12px; margin-bottom: 12px;
            background: var(--bg); border: 1px solid var(--border);
            color: #fff; font-family: 'Inconsolata', monospace; font-size: 1rem; outline: none;
        }
        .modal input:focus { border-color: var(--accent-yellow); }
        .modal button {
            width: 100%; padding: 14px; background: var(--accent-yellow); color: #000;
            border: none; font-family: 'Press Start 2P', monospace; font-size: 0.6rem;
            cursor: pointer; margin-top: 10px; transition: filter 0.2s;
        }
        .modal button:hover { filter: brightness(1.2); }
    </style>
</head>
<body>

<header>
    <h1>⏳ TIME TICKER</h1>
    <div class="subtitle">Watch the world change every second</div>
</header>

<!-- Het Notitieblok -->
<div class="notebook" id="notebook-container">
    
    <!-- HOOFD SCORE BALK -->
    <div class="main-score-container">
        <div class="main-score-title">⏱️ YOUR SURVIVAL TIME</div>
        <div class="main-score-val" id="main-score-val">0s</div>
    </div>

</div>

<a class="back-link" href="index.html">◄ TERUG NAAR HOME</a>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="auth-modal" style="display:none;">
    <div class="modal">
        <h2>LOGIN / LEADERBOARD INFO</h2>
        <p>Voer je algemene leaderboard-naam in om je tijdscore op te slaan.</p>
        <input type="text" id="inp-name" placeholder="Jouw Spelernaam (max 18)" maxlength="18" autocomplete="off">
        <button onclick="saveUserAndConnect()">► BEVESTIGEN</button>
    </div>
</div>

<script>
    // 1. Firebase Configuratie
    const firebaseConfig = {
        apiKey: "AIzaSyA9wKFVXmT6kUpuaBgwlPilF86LaKKDYFU",
        authDomain: "money-digger-9b05e.firebaseapp.com",
        databaseURL: "https://money-digger-9b05e-default-rtdb.europe-west1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. Gedeelde Platform Sleutels
    const LB_KEY = 'pg_player_name';
    const ACC_KEY = 'pg_account_code'; 
    const DEV_KEY = 'pg_device_id';
    
    function getDeviceId() {
        let id = localStorage.getItem(DEV_KEY);
        if (!id) { 
            id = 'tt-' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); 
            localStorage.setItem(DEV_KEY, id); 
        }
        return id;
    }
    const MY_DEVICE_ID = getDeviceId();

    function getOrCreateCode() {
        let code = localStorage.getItem(ACC_KEY);
        if (!code || code.length !== 20) {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            code = Array.from({length: 20}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
            localStorage.setItem(ACC_KEY, code);
        }
        return code;
    }

    let playerCode = getOrCreateCode();
    let playerName = localStorage.getItem(LB_KEY) || '';
    let scoreTime = 0; 

    const factDefs = [
        { id: 'btc', icon: '🪙', title: 'Bitcoin Value', desc: 'Worth of 1 BTC bought at $0.0009 rate back in 2009.', calc: s => '$' + (60000 + (s * 0.05)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) },
        { id: 'brain_power', icon: '🧠', title: 'Brain Power', desc: 'Bio-electrical energy produced continuously by your brain (20W).', calc: s => (s * 20 < 1000) ? (s * 20) + ' Joules' : ((s * 20) / 1000).toFixed(2) + ' kJ' },
        { id: 'lego', icon: '🧱', title: 'Lego Spire', desc: 'Height of a tower built by stacking 1 brick every single second.', calc: s => (s * 0.0096 < 1000) ? (s * 0.0096).toFixed(2) + ' m' : ((s * 0.0096) / 1000).toFixed(3) + ' km' },
        { id: 'pizza_slices', icon: '🍕', title: 'Pizza Slices', desc: 'Slices eaten worldwide (~350/s) & total weight in kilograms.', calc: s => { const sl = Math.floor(s * 350); return sl.toLocaleString('en-US') + ' slices (' + Math.floor(sl * 0.107).toLocaleString('en-US') + ' kg)'; } },
        { id: 'hair_growth', icon: '💇', title: 'Hair Growth', desc: 'Combined length grown across all 8 billion people on Earth.', calc: s => Math.floor(s * 12000).toLocaleString('en-US') + ' km' },
        { id: 'youtube_watchtime', icon: '📺', title: 'YouTube Streamed', desc: 'Combined years of video watched by humanity continuously.', calc: s => ((s * 11574) / 365.25).toFixed(2) + ' video yrs' },
        { id: 'sun_energy', icon: '☀️', title: 'Sun Energy', desc: 'Energy radiated into deep space by the Sun in Megatons TNT.', calc: s => Math.floor(s * 91000000000).toLocaleString('en-US') + ' MT' },
        { id: 'sneezes', icon: '🤧', title: 'Global Sneezes', desc: 'Human sneezes happening across the world population.', calc: s => Math.floor(s * 9300).toLocaleString('en-US') },
        { id: 'ants', icon: '🐜', title: 'Ants Born', desc: 'New ant eggs hatching around the globe right now.', calc: s => Math.floor(s * 3200000).toLocaleString('en-US') },
        { id: 'coffee_cups', icon: '☕', title: 'Coffee Cups', desc: 'Cups of coffee freshly consumed worldwide.', calc: s => Math.floor(s * 25000).toLocaleString('en-US') + ' cups' },
        { id: 'olympic_tears', icon: '💧', title: 'Tear Pool Fill', desc: 'Olympic pools filled if every human cried 1 tear per second.', calc: s => (s * 0.16).toFixed(2) + ' pools' },
        { id: 'boba_straw', icon: '🧋', title: 'Infinite Straw', desc: 'Length of a pipe made by joining all Bubble Tea straws used globally.', calc: s => (s * 125 < 1000) ? Math.floor(s * 125).toLocaleString('en-US') + ' m' : ((s * 125) / 1000).toFixed(2) + ' km' },
        { id: 'toilet_paper_moon', icon: '🧻', title: 'Paper to Moon', desc: '% of distance to Moon reached by unrolling 1 toilet paper roll/sec.', calc: s => (((s * 0.00005 / 384400) * 100)).toFixed(6) + ' %' },
        { id: 'avocado_toast', icon: '🥑', title: 'Avocado Toast', desc: 'Avocado toasts prepared globally and total money spent ($8 each).', calc: s => { const t = Math.floor(s * 120); return t.toLocaleString('en-US') + ' ($' + (t * 8).toLocaleString('en-US') + ')'; } },
        { id: 'cat_purrs', icon: '🐱', title: 'Cat Purrs', desc: 'Vibrational purr cycles produced by all pet cats lounging right now.', calc: s => Math.floor(s * 15000000).toLocaleString('en-US') + ' purrs' },
        { id: 'lightning_batteries', icon: '🔋', title: 'Batteries Charged', desc: 'AA batteries charged if harvesting all global lightning energy.', calc: s => Math.floor(s * 18000000).toLocaleString('en-US') + ' cells' },
        { id: 'shark_teeth', icon: '🦈', title: 'Shark Teeth Shed', desc: 'Teeth naturally shed by all sharks in ocean depths.', calc: s => Math.floor(s * 450).toLocaleString('en-US') + ' teeth' },
        { id: 'marshmallows', icon: '🍡', title: 'Marshmallows', desc: 'Marshmallows roasted over campfires and grills globally.', calc: s => Math.floor(s * 1200).toLocaleString('en-US') + ' roasted' }
    ];

    function buildNotebook() {
        const container = document.getElementById('notebook-container');
        
        factDefs.forEach((fact, index) => {
            const delay = (index + 1) * 0.1; 
            const line = document.createElement('div');
            line.className = 'notebook-line';
            line.style.animationDelay = `${delay}s`;

            line.innerHTML = `
                <div class="anim-box">${fact.icon}</div>
                <div class="text-box">
                    <span class="fact-title">${fact.title}</span>
                    <span class="fact-desc">${fact.desc}</span>
                </div>
                <div class="val-box" id="fact-val-${index}">0</div>
            `;
            container.appendChild(line);
        });
    }

    function formatTime(totalSeconds) {
        if (totalSeconds === 0) return "0s";
        let s = totalSeconds;
        
        const y = Math.floor(s / 31536000); s %= 31536000;
        const mo = Math.floor(s / 2592000); s %= 2592000;
        const w = Math.floor(s / 604800); s %= 604800;
        const d = Math.floor(s / 86400); s %= 86400;
        const h = Math.floor(s / 3600); s %= 3600;
        const m = Math.floor(s / 60); s %= 60;

        let parts = [];
        if (y > 0) parts.push(y + "j");
        if (mo > 0) parts.push(mo + "mnd");
        if (w > 0) parts.push(w + "w");
        if (d > 0) parts.push(d + "d");
        if (h > 0) parts.push(h + "u");
        if (m > 0) parts.push(m + "m");
        if (s > 0 || parts.length === 0) parts.push(s + "s");

        return parts.join(" ");
    }

    function checkUserAuth() {
        if (!playerName) {
            showAuthModal();
        } else {
            hideAuthModal();
            loadProgressFromFirebase();
        }
    }

    function showAuthModal() {
        document.getElementById('inp-name').value = playerName;
        document.getElementById('auth-modal').style.display = 'flex';
    }

    function hideAuthModal() {
        document.getElementById('auth-modal').style.display = 'none';
    }

    function saveUserAndConnect() {
        const nameInput = document.getElementById('inp-name').value.trim();
        if (!nameInput) {
            alert('Voer een geldige spelernaam in!');
            return;
        }

        playerName = nameInput.substring(0, 18);
        localStorage.setItem(LB_KEY, playerName);

        hideAuthModal();
        loadProgressFromFirebase();
    }

    function getUserDbRef() {
        return db.ref('timeTickerScores/' + playerCode);
    }

    function loadProgressFromFirebase() {
        // Registreer direct in platform databanken zodat het leaderboard het herkent
        db.ref('accountCodes/' + playerCode).set({ deviceId: MY_DEVICE_ID, name: playerName }).catch(()=>{});
        db.ref('nameOwners/' + MY_DEVICE_ID).set({ name: playerName }).catch(()=>{});

        const userRef = getUserDbRef();
        userRef.once('value').then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                scoreTime = data.score || 0;
            } else {
                scoreTime = 0;
                saveProgressToFirebase(); 
            }
            updateUI();
        }).catch((err) => {
            console.error("Fout bij laden van Firebase data:", err);
        });
    }

    function saveProgressToFirebase() {
        if (!playerName) return;

        const userRef = getUserDbRef();
        userRef.set({
            name: playerName,
            score: scoreTime,
            code: playerCode,
            deviceId: MY_DEVICE_ID,
            lastUpdated: Date.now()
        });
        db.ref('accountCodes/' + playerCode).set({ deviceId: MY_DEVICE_ID, name: playerName }).catch(()=>{});
    }

    // Ticker Loop
    setInterval(() => {
        if (playerName && document.getElementById('auth-modal').style.display === 'none') {
            scoreTime++;
            updateUI();
            
            if (scoreTime % 3 === 0) {
                saveProgressToFirebase();
            }
        }
    }, 1000);

    function updateUI() {
        const mainScoreEl = document.getElementById('main-score-val');
        if(mainScoreEl) mainScoreEl.innerText = formatTime(scoreTime);

        factDefs.forEach((fact, index) => {
            const valElement = document.getElementById(`fact-val-${index}`);
            if (valElement) {
                valElement.innerText = fact.calc(scoreTime);
            }
        });
    }

    window.onload = () => {
        buildNotebook();
        checkUserAuth();
    };
</script>

</body>
</html>

<script>

  const GAME_ID = 'time_ticker';
  const FIREBASE_CONFIG = {

  };
  const DAY_KEY = () => new Date().toDateString();
  const safeJSON = (key, fallback) => {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (_) { return fallback; }
  };
  const number = value => { const n = Number(value); return Number.isFinite(n) ? n : 0; };
  const unique = list => [...new Set((Array.isArray(list) ? list : []).map(String).filter(Boolean))];
  function accountCode() {
    const candidates = [localStorage.getItem('pg_account_code'), localStorage.getItem('pg_player_id'), localStorage.getItem('plixo_sync_code')];
    return candidates.map(v => String(v || '').trim().toUpperCase())
      .find(v => /^(?:[A-HJ-NP-Z2-9]{20}|[0-9]{20})$/.test(v)) || null;
  }
  function dailyKey() { return 'plixo_daily_progress_' + DAY_KEY(); }
  let activeDate = DAY_KEY();
  let globalProgress = safeJSON('plixo_mission_progress', {});
  let dailyProgress = safeJSON(dailyKey(), {});
  let playedGames = unique(safeJSON('plixo_played_games', []));
  let dailyGames = unique(safeJSON('plixo_daily_games_' + activeDate, []));
  let database = null;
  let syncing = null;
  let syncQueued = false;
  let syncTimer = null;
  let cloudInitialized = false;
  let localArcadeMinutes = Math.max(0, number(localStorage.getItem('plixo_arcade_minutes_' + GAME_ID)));

  function refreshDay() {
    const now = DAY_KEY();
    if (now === activeDate) return;
    activeDate = now;
    dailyProgress = safeJSON(dailyKey(), {});
    dailyGames = unique(safeJSON('plixo_daily_games_' + activeDate, []));
  }
  function persistLocal() {
    try {
      localStorage.setItem('plixo_mission_progress', JSON.stringify(globalProgress));
      localStorage.setItem(dailyKey(), JSON.stringify(dailyProgress));
      localStorage.setItem('plixo_played_games', JSON.stringify(playedGames));
      localStorage.setItem('plixo_daily_games_' + activeDate, JSON.stringify(dailyGames));
      localStorage.setItem('plixo_arcade_minutes_' + GAME_ID, String(localArcadeMinutes));
    } catch (error) { console.warn('PLIXO local progress save failed:', error); }
  }
  function scheduleSync() {
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(() => { syncTimer = null; syncCloud(); }, 650);
  }
  function maxGlobal(id, value) {
    value = Math.max(0, number(value));
    if (value > number(globalProgress[id])) { globalProgress[id] = value; persistLocal(); scheduleSync(); }
  }
  function maxDaily(id, value) {
    refreshDay();
    value = Math.max(0, number(value));
    let changed = false;
    if (value > number(globalProgress[id])) { globalProgress[id] = value; changed = true; }
    if (value > number(dailyProgress[id])) { dailyProgress[id] = value; changed = true; }
    if (changed) { persistLocal(); scheduleSync(); }
  }
  function addBoth(id, amount = 1) {
    refreshDay(); amount = Math.max(0, number(amount)); if (!id || amount <= 0) return;
    globalProgress[id] = number(globalProgress[id]) + amount;
    dailyProgress[id] = number(dailyProgress[id]) + amount;
    persistLocal(); scheduleSync();
  }
  function addGlobal(id, amount = 1) {
    amount = Math.max(0, number(amount)); if (!id || amount <= 0) return;
    globalProgress[id] = number(globalProgress[id]) + amount;
    persistLocal(); scheduleSync();
  }
  function markGamePlayed() {

    playedGames = unique([...playedGames, GAME_ID]);
    dailyGames = unique([...dailyGames, GAME_ID]);
    maxGlobal('a9', playedGames.length);
    // These missions count different games played, not page reloads.
    const count = dailyGames.length;
    maxDaily('dm_1', count); maxDaily('dm_2', count); maxDaily('dm_3', count);
    persistLocal(); scheduleSync();
  }
  function mergeMaximum(remote, local) {
    const out = { ...(remote && typeof remote === 'object' ? remote : {}) };
    for (const [key, value] of Object.entries(local && typeof local === 'object' ? local : {})) {
      if (value !== '' && Number.isFinite(Number(value))) out[key] = Math.max(number(out[key]), number(value));
      else if (out[key] === undefined) out[key] = value;
    }
    return out;
  }
  function adoptCloudRecord(record) {
    if (!record || typeof record !== 'object') return;
    globalProgress = mergeMaximum(record.mission_progress, globalProgress);
    refreshDay();
    if (record.daily && record.daily.date === activeDate) {
      dailyProgress = mergeMaximum(record.daily.progress, dailyProgress);
    }
    playedGames = unique([...(Array.isArray(record.played_games) ? record.played_games : []), ...playedGames]);
    const remoteDailyGames = record.daily_games && record.daily_games.date === activeDate && Array.isArray(record.daily_games.games)
      ? record.daily_games.games : [];
    dailyGames = unique([...remoteDailyGames, ...dailyGames]);
    const remoteMinutes = record.arcade_minutes_by_game && record.arcade_minutes_by_game[GAME_ID];
    localArcadeMinutes = Math.max(localArcadeMinutes, number(remoteMinutes));
    const count = dailyGames.length;
    for (const id of ['dm_1','dm_2','dm_3']) dailyProgress[id] = Math.max(number(dailyProgress[id]), count);
    globalProgress.a9 = Math.max(number(globalProgress.a9), playedGames.length);
    persistLocal();
  }
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      if ([...document.scripts].some(s => s.src === src) && window.firebase) { resolve(); return; }
      const current = [...document.scripts].find(s => s.src === src);
      if (current) {
        current.addEventListener('load', resolve, { once: true });
        current.addEventListener('error', reject, { once: true });
        return;
      }
      const script = document.createElement('script'); script.src = src; script.async = true;
      script.onload = resolve; script.onerror = () => reject(new Error('Could not load ' + src));
      (document.head || document.documentElement).appendChild(script);

  }
  async function getDatabase() {

  async function syncCloud() {
    refreshDay();
    const code = accountCode();
    if (!code) return;
    if (syncing) { syncQueued = true; return syncing; }
    syncing = (async () => {
      try {
        const db = await getDatabase();
        const today = activeDate;
        const localGlobal = { ...globalProgress };
        const localDaily = { ...dailyProgress };

          const mergedGlobal = mergeMaximum(remoteGlobal, localGlobal);
          const minutesByGame = current.arcade_minutes_by_game && typeof current.arcade_minutes_by_game === 'object'
            ? { ...current.arcade_minutes_by_game } : {};

          minutesByGame[GAME_ID] = nextGameMinutes;

          current.played_games = unique([...remotePlayed, ...localPlayed]);

          current.mission_progress = mergedGlobal;
          const remoteDaily = current.daily && typeof current.daily === 'object' ? current.daily : {};
          const dailyProgressMerged = mergeMaximum(remoteDaily.date === today ? remoteDaily.progress : {}, localDaily);
          const remoteDailyGames = current.daily_games && current.daily_games.date === today && Array.isArray(current.daily_games.games)
            ? current.daily_games.games : [];
          const dailyGamesMerged = unique([...remoteDailyGames, ...localDailyGames]);
          for (const id of ['dm_1','dm_2','dm_3']) dailyProgressMerged[id] = Math.max(number(dailyProgressMerged[id]), dailyGamesMerged.length);
          current.daily = {
            ...remoteDaily,
            date: today,
            progress: dailyProgressMerged,
            claimed: remoteDaily.date === today && remoteDaily.claimed && typeof remoteDaily.claimed === 'object' ? remoteDaily.claimed : {},
            bonus: remoteDaily.date === today ? (remoteDaily.bonus || '') : ''
          };
          current.daily_games = { date: today, games: dailyGamesMerged };

        }, undefined, false);
        if (result && result.snapshot && result.snapshot.exists()) {

        }

      }

  }
  async function pullCloud() {
    const code = accountCode();
    if (!code) { cloudInitialized = true; return; }

      const db = await getDatabase();

      scheduleSync();

  }

  let timeStats = safeJSON(timeStatsKey, { totalVisibleSeconds: 0, dailyDate: DAY_KEY(), dailyVisibleSeconds: 0, readFacts: [] });
  if (!Array.isArray(timeStats.readFacts)) timeStats.readFacts = [];
  if (timeStats.dailyDate !== DAY_KEY()) { timeStats.dailyDate = DAY_KEY(); timeStats.dailyVisibleSeconds = 0; timeStats.readFacts = []; }
  timeStats.totalVisibleSeconds = Math.max(0, number(timeStats.totalVisibleSeconds));
  timeStats.dailyVisibleSeconds = Math.max(0, number(timeStats.dailyVisibleSeconds));
  let lastVisibleMinuteMilestone = localArcadeMinutes;
  let lastScoreObserved = null;
  function saveTimeStats() { try { localStorage.setItem(timeStatsKey, JSON.stringify(timeStats)); } catch (_) {} }

  }
  function activeTicker() {

        document.getElementById('auth-modal') && document.getElementById('auth-modal').style.display === 'none';
    } catch (_) { return false; }
  }
  function watchTicker() {
    refreshDay();
    if (timeStats.dailyDate !== DAY_KEY()) { timeStats.dailyDate = DAY_KEY(); timeStats.dailyVisibleSeconds = 0; timeStats.readFacts = []; }

  setInterval(watchTicker, 1000);
  // Count a fact once per day only after its row has actually remained visible briefly.
  function installFactReadingObserver() {
    const root = document.getElementById('notebook-container');

    const rows = [...root.querySelectorAll('.notebook-line')];

  }
  function waitForFacts(attempt = 0) {
    if (installFactReadingObserver() || attempt > 80) return;
    setTimeout(() => waitForFacts(attempt + 1), 250);
  }
  waitForFacts();

})();
