<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINI SPIKES PLATFORMER — Game Modes</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #111;
    color: #fff;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 28px 18px;
    text-align: center;
  }
  h1 {
    margin: 0 0 12px;
    color: #fff;
    font-size: clamp(18px, 3vw, 24px);
    letter-spacing: 2px;
    line-height: 1.5;
    text-transform: uppercase;
  }
  .container {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 760px;
  }
  .card {
    background: #222;
    border: 3px solid #444;
    border-radius: 12px;
    width: 220px;
    min-height: 260px;
    padding: 20px 17px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: white;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-8px);
    border-color: #ff44aa;
    box-shadow: 0 10px 25px rgba(255, 68, 170, 0.3);
  }
  .number {
    color: #ff44aa;
    font-size: 66px;
    font-weight: bold;
    line-height: 1.1;
    margin-bottom: 16px;
  }
  .title {
    font-size: 16px;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .back {
    display: inline-block;
    margin-top: 32px;
    padding: 10px 15px;
    background: #222;
    border: 1px solid #444;
    border-radius: 6px;
    color: #aaa;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 1px;
    transition: color 0.2s, border-color 0.2s;
  }
  .back:hover { color: #fff; border-color: #ff44aa; }
  @media (max-width: 540px) {
    body { justify-content: flex-start; padding-top: 36px; }
    .container { gap: 18px; }
    .card { width: min(100%, 300px); min-height: 220px; }
    .number { font-size: 56px; margin-bottom: 10px; }
  }
</style>
</head>
<body>
  <h1>MINI SPIKES PLATFORMER</h1>

  <div class="container">
    <a href="mini-spikes-platformer.html?mode=single" class="card">
      <div class="number">1</div>
      <div class="title">Singleplayer</div>
    </a>

    <a href="mini-spikes-platformer.html?mode=multiplayer" class="card">
      <div class="number">2</div>
      <div class="title">Multiplayer</div>
    </a>

    <a href="mini-spikes-platformer.html?mode=race" class="card">
      <div class="number">3</div>
      <div class="title">Race</div>
    </a>
  </div>

  <a class="back" href="index.html">&#8592; BACK TO PLIXO ARCADE</a>
</body>
</html>
