<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Ticker - Pixel Games</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #0a0a0f;
            --card: #1a1a28;
            --border: #2a2a42;
            --accent-blue: #4488ff;
            --accent-yellow: #ffdd00;
            --accent-green: #00ff88;
            --text: #e8e8ff;
            --text-muted: #7777aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 60px;
            overflow-x: hidden;
        }

        /* Scanline Animatie */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
            pointer-events: none; z-index: 1000;
        }

        header { text-align: center; margin-bottom: 30px; animation: fadeInDown 0.8s ease-out; }
        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(1.2rem, 4vw, 2rem);
            color: var(--accent-blue);
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(68,136,255,0.3);
        }
        .subtitle { font-size: 0.9rem; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }

        /* ====== DE NOTEBOOK ====== */
        .notebook {
            background: #fffdfa; color: #0f172a;
            width: 100%; max-width: 750px;
            border-radius: 4px; padding: 30px 20px 30px 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-left: 14px solid #ef4444; /* De bekende rode kantlijn */
            position: relative; z-index: 10;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Ringen van het notitieblok */
        .notebook::before {
            content: ''; position: absolute;
            top: 20px; left: -22px; bottom: 20px; width: 14px;
            background: radial-gradient(circle, #cbd5e1 3px, transparent 4px);
            background-size: 14px 28px;
        }

        /* ====== HOOFD TUSSENSCHOT (GROTE SCORE) ====== */
        .main-score-container {
            border-bottom: 6px solid #ef4444;
            padding-bottom: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .main-score-title {
            font-family: 'Press Start 2P', monospace;
            color: #0f172a;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .main-score-val {
            font-family: 'Press Start 2P', monospace;
            color: #ef4444;
            font-size: 1.6rem;
            line-height: 1.8;
            text-shadow: 2px 2px 0px rgba(239, 68, 68, 0.2);
        }

        /* Notebook regels voor de 18 feiten */
        .notebook-line {
            border-bottom: 1.5px solid #cbd5e1;
            padding: 15px 0;
            display: grid;
            grid-template-columns: 50px 1fr auto;
            align-items: center; gap: 15px;
            opacity: 0; animation: fadeInLine 0.5s forwards;
        }

        /* Icoon container */
        .anim-box {
            width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2.2rem; /* Iets grotere emojis */
        }

        /* Tekst (Titel & Beschrijving) */
        .text-box { display: flex; flex-direction: column; gap: 4px; }
        .fact-title { font-weight: 700; font-size: 1.1rem; color: #0f172a; }
        .fact-desc { font-size: 0.85rem; color: #475569; line-height: 1.3; }

        /* Waarde (Blauwe pen stijl) */
        .val-box {
            font-family: 'Press Start 2P', monospace; font-size: 0.75rem;
            color: #1e3a8a; text-align: right; line-height: 1.4;
            max-width: 200px; word-wrap: break-word;
        }

        /* Animaties voor layout etc */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInLine { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        /* Back Link */
        .back-link {
            margin-top: 40px; position: relative; z-index: 10;
            color: var(--accent-blue); text-decoration: none;
            font-family: 'Press Start 2P', monospace; font-size: 0.7rem;
            transition: color 0.2s; padding: 10px;
        }
        .back-link:hover { color: var(--accent-green); }

        /* Modal Overlay (Valback als gegevens ontbreken) */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; backdrop-filter: blur(5px);
        }
        .modal {
            background: var(--card); border: 2px solid var(--accent-yellow);
            padding: 30px; max-width: 420px; width: 90%;
            border-radius: 4px; text-align: center;
        }
        .modal h2 { font-family: 'Press Start 2P', monospace; font-size: 0.8rem; color: var(--accent-yellow); margin-bottom: 15px; }
        .modal p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .modal input {
            width: 100%; padding: 12px; margin-bottom: 12px;
            background: var(--bg); border: 1px solid var(--border);
            color: #fff; font-family: 'Inconsolata', monospace; font-size: 1rem; outline: none;
        }
        .modal input:focus { border-color: var(--accent-yellow); }
        .modal button {
            width: 100%; padding: 14px; background: var(--accent-yellow); color: #000;
            border: none; font-family: 'Press Start 2P', monospace; font-size: 0.6rem;
            cursor: pointer; margin-top: 10px; transition: filter 0.2s;
        }
        .modal button:hover { filter: brightness(1.2); }
    </style>
</head>
<body>

<header>
    <h1>⏳ TIME TICKER</h1>
    <div class="subtitle">Watch the world change every second</div>
</header>

<!-- Het Notitieblok -->
<div class="notebook" id="notebook-container">
    
    <!-- HOOFD SCORE BALK -->
    <div class="main-score-container">
        <div class="main-score-title">⏱️ YOUR SURVIVAL TIME</div>
        <div class="main-score-val" id="main-score-val">0s</div>
    </div>

    <!-- De regels met de 18 feiten komen hier dynamisch onder -->
</div>

<a class="back-link" href="index.html">◄ TERUG NAAR HOME</a>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="auth-modal" style="display:none;">
    <div class="modal">
        <h2>LOGIN / LEADERBOARD INFO</h2>
        <p>Voer je algemene leaderboard-naam in en je code om je tijdscore op te slaan.</p>
        <input type="text" id="inp-name" placeholder="Jouw Spelernaam (max 18)" maxlength="18" autocomplete="off">
        <input type="text" id="inp-code" placeholder="Jouw code (bijv. 20 cijfers)" autocomplete="off">
        <button onclick="saveUserAndConnect()">► BEVESTIGEN</button>
    </div>
</div>

<script>
    // 1. Firebase Configuratie
    const firebaseConfig = {
        apiKey: "AIzaSyA9wKFVXmT6kUpuaBgwlPilF86LaKKDYFU",
        authDomain: "money-digger-9b05e.firebaseapp.com",
        databaseURL: "https://money-digger-9b05e-default-rtdb.europe-west1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. Variabelen & Feiten (Alleen emoji's, zonder custom HTML)
    const LB_KEY = 'pg_player_name';
    const CODE_KEY = 'pg_player_code'; 
    
    let playerName = localStorage.getItem(LB_KEY) || '';
    let playerCode = localStorage.getItem(CODE_KEY) || '';
    let scoreTime = 0; 

    const factDefs = [
        { id: 'btc', icon: '🪙', title: 'Bitcoin Value', desc: 'Worth of 1 BTC bought at $0.0009 rate back in 2009.', calc: s => '$' + (60000 + (s * 0.05)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) },
        { id: 'brain_power', icon: '🧠', title: 'Brain Power', desc: 'Bio-electrical energy produced continuously by your brain (20W).', calc: s => (s * 20 < 1000) ? (s * 20) + ' Joules' : ((s * 20) / 1000).toFixed(2) + ' kJ' },
        { id: 'lego', icon: '🧱', title: 'Lego Spire', desc: 'Height of a tower built by stacking 1 brick every single second.', calc: s => (s * 0.0096 < 1000) ? (s * 0.0096).toFixed(2) + ' m' : ((s * 0.0096) / 1000).toFixed(3) + ' km' },
        { id: 'pizza_slices', icon: '🍕', title: 'Pizza Slices', desc: 'Slices eaten worldwide (~350/s) & total weight in kilograms.', calc: s => { const sl = Math.floor(s * 350); return sl.toLocaleString('en-US') + ' slices (' + Math.floor(sl * 0.107).toLocaleString('en-US') + ' kg)'; } },
        { id: 'hair_growth', icon: '💇', title: 'Hair Growth', desc: 'Combined length grown across all 8 billion people on Earth.', calc: s => Math.floor(s * 12000).toLocaleString('en-US') + ' km' },
        { id: 'youtube_watchtime', icon: '📺', title: 'YouTube Streamed', desc: 'Combined years of video watched by humanity continuously.', calc: s => ((s * 11574) / 365.25).toFixed(2) + ' video yrs' },
        { id: 'sun_energy', icon: '☀️', title: 'Sun Energy', desc: 'Energy radiated into deep space by the Sun in Megatons TNT.', calc: s => Math.floor(s * 91000000000).toLocaleString('en-US') + ' MT' },
        { id: 'sneezes', icon: '🤧', title: 'Global Sneezes', desc: 'Human sneezes happening across the world population.', calc: s => Math.floor(s * 9300).toLocaleString('en-US') },
        { id: 'ants', icon: '🐜', title: 'Ants Born', desc: 'New ant eggs hatching around the globe right now.', calc: s => Math.floor(s * 3200000).toLocaleString('en-US') },
        { id: 'coffee_cups', icon: '☕', title: 'Coffee Cups', desc: 'Cups of coffee freshly consumed worldwide.', calc: s => Math.floor(s * 25000).toLocaleString('en-US') + ' cups' },
        { id: 'olympic_tears', icon: '💧', title: 'Tear Pool Fill', desc: 'Olympic pools filled if every human cried 1 tear per second.', calc: s => (s * 0.16).toFixed(2) + ' pools' },
        { id: 'boba_straw', icon: '🧋', title: 'Infinite Straw', desc: 'Length of a pipe made by joining all Bubble Tea straws used globally.', calc: s => (s * 125 < 1000) ? Math.floor(s * 125).toLocaleString('en-US') + ' m' : ((s * 125) / 1000).toFixed(2) + ' km' },
        { id: 'toilet_paper_moon', icon: '🧻', title: 'Paper to Moon', desc: '% of distance to Moon reached by unrolling 1 toilet paper roll/sec.', calc: s => (((s * 0.00005 / 384400) * 100)).toFixed(6) + ' %' },
        { id: 'avocado_toast', icon: '🥑', title: 'Avocado Toast', desc: 'Avocado toasts prepared globally and total money spent ($8 each).', calc: s => { const t = Math.floor(s * 120); return t.toLocaleString('en-US') + ' ($' + (t * 8).toLocaleString('en-US') + ')'; } },
        { id: 'cat_purrs', icon: '🐱', title: 'Cat Purrs', desc: 'Vibrational purr cycles produced by all pet cats lounging right now.', calc: s => Math.floor(s * 15000000).toLocaleString('en-US') + ' purrs' },
        { id: 'lightning_batteries', icon: '🔋', title: 'Batteries Charged', desc: 'AA batteries charged if harvesting all global lightning energy.', calc: s => Math.floor(s * 18000000).toLocaleString('en-US') + ' cells' },
        { id: 'shark_teeth', icon: '🦈', title: 'Shark Teeth Shed', desc: 'Teeth naturally shed by all sharks in ocean depths.', calc: s => Math.floor(s * 450).toLocaleString('en-US') + ' teeth' },
        { id: 'marshmallows', icon: '🍡', title: 'Marshmallows', desc: 'Marshmallows roasted over campfires and grills globally.', calc: s => Math.floor(s * 1200).toLocaleString('en-US') + ' roasted' }
    ];

    // 3. UI Opbouwen
    function buildNotebook() {
        const container = document.getElementById('notebook-container');
        
        factDefs.forEach((fact, index) => {
            const delay = (index + 1) * 0.1; 
            const line = document.createElement('div');
            line.className = 'notebook-line';
            line.style.animationDelay = `${delay}s`;

            line.innerHTML = `
                <div class="anim-box">${fact.icon}</div>
                <div class="text-box">
                    <span class="fact-title">${fact.title}</span>
                    <span class="fact-desc">${fact.desc}</span>
                </div>
                <div class="val-box" id="fact-val-${index}">0</div>
            `;
            container.appendChild(line);
        });
    }

    // 4. Tijdsformattering Functie
    function formatTime(totalSeconds) {
        if (totalSeconds === 0) return "0s";
        
        let s = totalSeconds;
        
        // Berekeningen
        const y = Math.floor(s / 31536000); s %= 31536000;
        const mo = Math.floor(s / 2592000); s %= 2592000; // ~30 dagen per maand
        const w = Math.floor(s / 604800); s %= 604800;
        const d = Math.floor(s / 86400); s %= 86400;
        const h = Math.floor(s / 3600); s %= 3600;
        const m = Math.floor(s / 60); s %= 60;

        let parts = [];
        if (y > 0) parts.push(y + "j");
        if (mo > 0) parts.push(mo + "mnd");
        if (w > 0) parts.push(w + "w");
        if (d > 0) parts.push(d + "d");
        if (h > 0) parts.push(h + "u");
        if (m > 0) parts.push(m + "m");
        if (s > 0 || parts.length === 0) parts.push(s + "s");

        return parts.join(" ");
    }

    // 5. Authenticatie Controle (Stille inlog via LocalStorage)
    function checkUserAuth() {
        if (!playerName) {
            showAuthModal();
        } else {
            hideAuthModal();
            loadProgressFromFirebase();
        }
    }

    function showAuthModal() {
        document.getElementById('inp-name').value = playerName;
        document.getElementById('inp-code').value = playerCode;
        document.getElementById('auth-modal').style.display = 'flex';
    }

    function hideAuthModal() {
        document.getElementById('auth-modal').style.display = 'none';
    }

    function saveUserAndConnect() {
        const nameInput = document.getElementById('inp-name').value.trim();
        const codeInput = document.getElementById('inp-code').value.trim();

        if (!nameInput) {
            alert('Voer een geldige spelernaam in!');
            return;
        }

        playerName = nameInput.substring(0, 18);
        playerCode = codeInput;

        localStorage.setItem(LB_KEY, playerName);
        localStorage.setItem(CODE_KEY, playerCode);

        hideAuthModal();
        loadProgressFromFirebase();
    }

    function getUserDbRef() {
        let safeKey = playerCode ? playerCode : playerName.replace(/[^a-zA-Z0-9]/g, "");
        return db.ref('scores/timeTicker/' + safeKey);
    }

    // 6. Data Laden & Firebase
    function loadProgressFromFirebase() {
        const userRef = getUserDbRef();

        userRef.once('value').then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                scoreTime = data.score || 0;
            } else {
                scoreTime = 0;
                saveProgressToFirebase(); 
            }
            updateUI();
        }).catch((err) => {
            console.error("Fout bij laden van Firebase data:", err);
        });
    }

    function saveProgressToFirebase() {
        if (!playerName) return;

        const userRef = getUserDbRef();
        userRef.set({
            name: playerName,
            score: scoreTime,
            code: playerCode,
            lastUpdated: Date.now()
        });
    }

    // 7. De Ticker Loop (Elke seconde update)
    setInterval(() => {
        if (playerName && document.getElementById('auth-modal').style.display === 'none') {
            scoreTime++;
            updateUI();
            
            // Sla elke 3 seconden op
            if (scoreTime % 3 === 0) {
                saveProgressToFirebase();
            }
        }
    }, 1000);

    function updateUI() {
        // Formatteer hoofdscore met de formatTime functie
        const mainScoreEl = document.getElementById('main-score-val');
        if(mainScoreEl) mainScoreEl.innerText = formatTime(scoreTime);

        // De 18 feiten berekenen via de meegeleverde 'calc' functies
        factDefs.forEach((fact, index) => {
            const valElement = document.getElementById(`fact-val-${index}`);
            if (valElement) {
                valElement.innerText = fact.calc(scoreTime);
            }
        });
    }

    // Start!
    window.onload = () => {
        buildNotebook();
        checkUserAuth();
    };
</script>

</body>
</html>
