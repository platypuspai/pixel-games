<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Ticker - Pixel Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #0a0a0f;
            --card: #1a1a28;
            --border: #2a2a42;
            --accent-blue: #4488ff;
            --accent-yellow: #ffdd00;
            --accent-green: #00ff88;
            --text: #e8e8ff;
            --text-muted: #7777aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.5rem;
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .user-bar {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.9rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .user-bar span {
            color: var(--accent-yellow);
            font-weight: bold;
        }

        .btn-change {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-change:hover { color: #fff; border-color: #fff; }

        /* Notebook Interface */
        .notebook {
            background: #fffdfa;
            color: #0f172a;
            width: 100%;
            max-width: 500px;
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-left: 12px solid #ef4444;
            position: relative;
        }

        .notebook-line {
            border-bottom: 1px solid #cbd5e1;
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .ticker-val {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9rem;
            color: #1e3a8a;
        }

        /* Login Overlay Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: var(--card);
            border: 2px solid var(--accent-yellow);
            padding: 30px;
            max-width: 420px;
            width: 90%;
            border-radius: 4px;
            text-align: center;
        }

        .modal h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            color: var(--accent-yellow);
            margin-bottom: 15px;
        }

        .modal p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: #fff;
            font-family: 'Inconsolata', monospace;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .modal input:focus { border-color: var(--accent-yellow); }

        .modal button {
            width: 100%;
            padding: 14px;
            background: var(--accent-yellow);
            color: #000;
            border: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            cursor: pointer;
            transition: filter 0.2s;
            margin-top: 10px;
        }

        .modal button:hover { filter: brightness(1.2); }

        .back-link {
            margin-top: 25px;
            color: var(--accent-blue);
            text-decoration: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent-green); }
    </style>
</head>
<body>

<header>
    <h1>⏳ TIME TICKER</h1>
</header>

<div class="user-bar">
    <div>SPELER: <span id="disp-name">—</span></div>
    <div>CODE: <span id="disp-code">—</span></div>
    <button class="btn-change" onclick="showAuthModal()">NAAM / CODE WIJZIGEN</button>
</div>

<div class="notebook">
    <div class="notebook-line">
        <span>⏱️ Tijdscore (score):</span>
        <span class="ticker-val" id="val-seconds">0</span>
    </div>
    <div class="notebook-line">
        <span>💓 Hartslagen wereldwijd:</span>
        <span class="ticker-val" id="val-heartbeats">0</span>
    </div>
    <div class="notebook-line">
        <span>⚡ Blikseminslagen:</span>
        <span class="ticker-val" id="val-lightning">0</span>
    </div>
    <div class="notebook-line">
        <span>🍕 Pizza's gegeten:</span>
        <span class="ticker-val" id="val-pizza">0</span>
    </div>
</div>

<a class="back-link" href="index.html">◄ TERUG NAAR HOME</a>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="auth-modal" style="display:none;">
    <div class="modal">
        <h2>LOGIN / LEADERBOARD INFO</h2>
        <p>Voer je algemene leaderboard-naam in en de vereiste 20-cijferige code om je tijdscore op te slaan.</p>
        <input type="text" id="inp-name" placeholder="Jouw Spelernaam (max 18)" maxlength="18" autocomplete="off">
        <input type="text" id="inp-code" placeholder="20-cijferige code" maxlength="20" autocomplete="off">
        <button onclick="saveUserAndConnect()">► BEVESTIGEN</button>
    </div>
</div>

<script>
    // 1. Firebase Configuratie
    const firebaseConfig = {
        apiKey: "AIzaSyA9wKFVXmT6kUpuaBgwlPilF86LaKKDYFU",
        authDomain: "money-digger-9b05e.firebaseapp.com",
        databaseURL: "https://money-digger-9b05e-default-rtdb.europe-west1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. Variabelen & State (gebruikt dezelfde key als de andere games)
    const LB_KEY = 'pg_player_name';
    const CODE_KEY = 'pg_player_code';
    
    let playerName = localStorage.getItem(LB_KEY) || '';
    let playerCode = localStorage.getItem(CODE_KEY) || '';
    let scoreTime = 0; 

    // 3. Authenticatie en Weergave
    function checkUserAuth() {
        if (!playerName || playerCode.length !== 20) {
            showAuthModal();
        } else {
            hideAuthModal();
            updateUserBar();
            loadProgressFromFirebase();
        }
    }

    function showAuthModal() {
        document.getElementById('inp-name').value = playerName;
        document.getElementById('inp-code').value = playerCode;
        document.getElementById('auth-modal').style.display = 'flex';
    }

    function hideAuthModal() {
        document.getElementById('auth-modal').style.display = 'none';
    }

    function saveUserAndConnect() {
        const nameInput = document.getElementById('inp-name').value.trim();
        const codeInput = document.getElementById('inp-code').value.trim();

        if (!nameInput) {
            alert('Voer een geldige spelernaam in!');
            return;
        }
        
        if (codeInput.length !== 20 || !/^\d+$/.test(codeInput)) {
            alert('De code moet exact 20 cijfers bevatten!');
            return;
        }

        playerName = nameInput.substring(0, 18);
        playerCode = codeInput;

        localStorage.setItem(LB_KEY, playerName);
        localStorage.setItem(CODE_KEY, playerCode);

        updateUserBar();
        hideAuthModal();
        loadProgressFromFirebase();
    }

    function updateUserBar() {
        document.getElementById('disp-name').innerText = playerName;
        // Maskeer de code gedeeltelijk voor de netheid, of toon hem volledig.
        document.getElementById('disp-code').innerText = playerCode.substring(0,4) + '...';
    }

    function getUserDbRef() {
        // We slaan de score op basis van de 20-cijferige code
        return db.ref('scores/timeTicker/' + playerCode);
    }

    // 4. Data Laden & Opslaan naar Firebase leaderboard stijl
    function loadProgressFromFirebase() {
        const userRef = getUserDbRef();

        userRef.once('value').then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                scoreTime = data.score || 0;
            } else {
                scoreTime = 0;
                saveProgressToFirebase(); 
            }
            updateUI();
        }).catch((err) => {
            console.error("Fout bij laden van Firebase data:", err);
        });
    }

    function saveProgressToFirebase() {
        if (!playerName || playerCode.length !== 20) return;

        const userRef = getUserDbRef();
        // Sla het op met de eigenschappen "name" en "score" zodat een algemeen leaderboard dit soepel kan lezen.
        userRef.set({
            name: playerName,
            score: scoreTime,
            code: playerCode,
            lastUpdated: Date.now()
        });
    }

    // 5. De "Game" / Ticker Loop
    setInterval(() => {
        if (playerName && playerCode.length === 20 && document.getElementById('auth-modal').style.display === 'none') {
            scoreTime++;
            updateUI();
            
            // Sla elke 3 seconden op naar Firebase 
            if (scoreTime % 3 === 0) {
                saveProgressToFirebase();
            }
        }
    }, 1000);

    function updateUI() {
        document.getElementById('val-seconds').innerText = scoreTime;
        document.getElementById('val-heartbeats').innerText = (scoreTime * 80).toLocaleString('nl-NL');
        document.getElementById('val-lightning').innerText = (scoreTime * 44).toLocaleString('nl-NL');
        document.getElementById('val-pizza').innerText = Math.floor(scoreTime * 4.5).toLocaleString('nl-NL');
    }

    // Start
    window.onload = checkUserAuth;
</script>

</body>
        </html>
