<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Ticker - Pixel Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #0a0a0f;
            --card: #1a1a28;
            --border: #2a2a42;
            --accent-blue: #4488ff;
            --accent-yellow: #ffdd00;
            --accent-green: #00ff88;
            --text: #e8e8ff;
            --text-muted: #7777aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.5rem;
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .user-bar {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.9rem;
        }

        .user-bar span {
            color: var(--accent-yellow);
            font-weight: bold;
        }

        .btn-change {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
            cursor: pointer;
        }
        .btn-change:hover { color: #fff; border-color: #fff; }

        /* Notebook Interface */
        .notebook {
            background: #fffdfa;
            color: #0f172a;
            width: 100%;
            max-width: 500px;
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-left: 12px solid #ef4444;
            position: relative;
        }

        .notebook-line {
            border-bottom: 1px solid #cbd5e1;
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .ticker-val {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9rem;
            color: #1e3a8a;
        }

        /* Login Overlay Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: var(--card);
            border: 2px solid var(--accent-blue);
            padding: 30px;
            max-width: 400px;
            width: 90%;
            border-radius: 6px;
            text-align: center;
        }

        .modal h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            color: var(--accent-blue);
            margin-bottom: 15px;
        }

        .modal p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: #fff;
            font-family: 'Inconsolata', monospace;
            font-size: 1rem;
            outline: none;
        }

        .modal input:focus { border-color: var(--accent-blue); }

        .modal button {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            color: #000;
            border: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            cursor: pointer;
            transition: filter 0.2s;
        }

        .modal button:hover { filter: brightness(1.2); }

        .back-link {
            margin-top: 25px;
            color: var(--accent-blue);
            text-decoration: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
        }
    </style>
</head>
<body>

<header>
    <h1>⏳ TIME TICKER</h1>
</header>

<div class="user-bar">
    <div>SPELER: <span id="disp-name">-</span></div>
    <div>CODE: <span id="disp-code">-</span></div>
    <button class="btn-change" onclick="showAuthModal()">WIJZIGEN</button>
</div>

<div class="notebook">
    <div class="notebook-line">
        <span>⏱️ Verstreken tijd:</span>
        <span class="ticker-val" id="val-seconds">0s</span>
    </div>
    <div class="notebook-line">
        <span>💓 Hartslagen wereldwijd:</span>
        <span class="ticker-val" id="val-heartbeats">0</span>
    </div>
    <div class="notebook-line">
        <span>⚡ Blikseminslagen:</span>
        <span class="ticker-val" id="val-lightning">0</span>
    </div>
    <div class="notebook-line">
        <span>🍕 Pizza's gegeten:</span>
        <span class="ticker-val" id="val-pizza">0</span>
    </div>
</div>

<a class="back-link" href="index.html">◄ TERUG NAAR HOME</a>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="auth-modal">
    <div class="modal">
        <h2>LOGIN / REGISTREER</h2>
        <p>Voer je naam en je persoonlijke koppelcode in om je voortgang op te slaan in Firebase.</p>
        <input type="text" id="inp-name" placeholder="Jouw Spelernaam" maxlength="16" autocomplete="off">
        <input type="password" id="inp-code" placeholder="Koppelcode (bijv. 1234)" maxlength="10" autocomplete="off">
        <button onclick="saveUserAndConnect()">VERBINDEN MET FIREBASE</button>
    </div>
</div>

<script>
    // 1. Firebase Configuratie
    const firebaseConfig = {
        apiKey: "AIzaSyA9wKFVXmT6kUpuaBgwlPilF86LaKKDYFU",
        authDomain: "money-digger-9b05e.firebaseapp.com",
        databaseURL: "https://money-digger-9b05e-default-rtdb.europe-west1.firebasedatabase.app"
    };

    // Firebase Initialiseren
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. Variabelen & State
    let playerName = localStorage.getItem('tt_player_name') || '';
    let playerCode = localStorage.getItem('tt_player_code') || '';
    let secondsActive = 0;
    let syncInterval = null;

    // 3. User Authentication & Modal
    function checkUserAuth() {
        if (!playerName || !playerCode) {
            showAuthModal();
        } else {
            hideAuthModal();
            updateUserBar();
            loadProgressFromFirebase();
        }
    }

    function showAuthModal() {
        document.getElementById('inp-name').value = playerName;
        document.getElementById('inp-code').value = playerCode;
        document.getElementById('auth-modal').style.display = 'flex';
    }

    function hideAuthModal() {
        document.getElementById('auth-modal').style.display = 'none';
    }

    function saveUserAndConnect() {
        const nameInput = document.getElementById('inp-name').value.trim();
        const codeInput = document.getElementById('inp-code').value.trim();

        if (!nameInput || !codeInput) {
            alert('Vul a.u.b. zowel een naam als een koppelcode in!');
            return;
        }

        playerName = nameInput.replace(/[^a-zA-Z0-9_-]/g, ""); // Veilige karakters
        playerCode = codeInput;

        localStorage.setItem('tt_player_name', playerName);
        localStorage.setItem('tt_player_code', playerCode);

        updateUserBar();
        hideAuthModal();
        loadProgressFromFirebase();
    }

    function updateUserBar() {
        document.getElementById('disp-name').innerText = playerName;
        document.getElementById('disp-code').innerText = '****';
    }

    // Unieke Firebase-sleutel op basis van Naam + Code
    function getUserDbRef() {
        // Maak een unieke hash/padcombinatie van naam en code
        const userKey = `${playerName.toLowerCase()}_${playerCode}`;
        return db.ref('scores/timeTicker/' + userKey);
    }

    // 4. Data Laden & Opslaan via Firebase
    function loadProgressFromFirebase() {
        const userRef = getUserDbRef();

        userRef.once('value').then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                secondsActive = data.secondsActive || 0;
            } else {
                secondsActive = 0;
                saveProgressToFirebase(); // Maak nieuw profiel aan
            }
            updateUI();
        }).catch((err) => {
            console.error("Fout bij laden van Firebase data:", err);
        });
    }

    function saveProgressToFirebase() {
        if (!playerName || !playerCode) return;

        const userRef = getUserDbRef();
        userRef.set({
            name: playerName,
            secondsActive: secondsActive,
            lastUpdated: Date.now()
        });
    }

    // 5. Game Loop & Ticker Logica
    setInterval(() => {
        if (playerName && playerCode && document.getElementById('auth-modal').style.display === 'none') {
            secondsActive++;
            updateUI();
            
            // Sla elke 5 seconden op naar Firebase om de server niet te overbelasten
            if (secondsActive % 5 === 0) {
                saveProgressToFirebase();
            }
        }
    }, 1000);

    function updateUI() {
        document.getElementById('val-seconds').innerText = secondsActive + 's';
        document.getElementById('val-heartbeats').innerText = (secondsActive * 80).toLocaleString();
        document.getElementById('val-lightning').innerText = (secondsActive * 44).toLocaleString();
        document.getElementById('val-pizza').innerText = Math.floor(secondsActive * 4.5).toLocaleString();
    }

    // Initialiseren bij opstarten
    window.onload = checkUserAuth;
</script>

</body>
    </html>
