// Real movement is written to the race room at a modest rate. Other racers can
// therefore detect an idle player without treating ordinary heartbeat writes
// or an open-but-abandoned tab as activity.
function noteRaceMovement() {
  if (GAME_MODE !== "race" || !raceRoomRef || !raceReady || raceFinishRecorded || raceForfeited) return;
  const now = raceNow();
  if (now < raceStartAt || now - lastRaceActivityWriteAt < 750) return;
  lastRaceActivityWriteAt = now;
  raceRoomRef.child("players/" + myPlayerId).transaction(player => {
    // A late client must never recreate a player who has already left or been
    // marked inactive by another racer.
    if (!player || player.disconnected) return;
    return { ...player, lastMoveAt: now };
  }, undefined, false).catch(() => {});
}

function ensureRaceInactivityMonitor(db) {
  if (GAME_MODE !== "race" || raceInactivityInterval) return;

// If a racer has not changed position for 30 seconds, mark them as a quitter.
// This runs as a room transaction so that concurrent clients cannot rank or
// penalize the same racer more than once.
async function markInactiveRacePlayers(db) {
  if (GAME_MODE !== "race" || !raceRoomRef || raceInactivityCheckBusy) return;
  raceInactivityCheckBusy = true;
  try {
    const transaction = await raceRoomRef.transaction(current => {
      if (!current || current.status !== "running" || (current.raceResults && current.raceResults.finalized)) return;
      const players = current.players && typeof current.players === "object" ? { ...current.players } : {};
      const finishes = current.finishes && typeof current.finishes === "object" ? { ...current.finishes } : {};
      const now = raceNow();
      let changed = false;
      for (const [id, originalPlayer] of Object.entries(players)) {
        const player = originalPlayer && typeof originalPlayer === "object" ? originalPlayer : null;
        if (!player || player.disconnected) continue;
        const existingFinish = finishes[id];
        if (existingFinish && existingFinish.reachedFinalSun === true) continue;
        if (existingFinish && existingFinish.reachedFinalSun === false) {
          players[id] = {
            ...player,
            disconnected: true,
            disconnectedAt: Number(player.disconnectedAt || existingFinish.finishedAt) || now,
            quitReason: player.quitReason || existingFinish.reason || "left_game"
          };
          changed = true;
          continue;
        }
        const lastMoveAt = Number(player.lastMoveAt) || Number(current.startedAt) || Number(current.startAt) || Number(player.joinedAt) || now;
        if (now - lastMoveAt >= RACE_INACTIVE_MS) {
          const quitAt = lastMoveAt + RACE_INACTIVE_MS;
          players[id] = { ...player, disconnected: true, disconnectedAt: quitAt, quitReason: "inactive_30_seconds" };
          finishes[id] = {
            playerId: id,
            reachedFinalSun: false,
            finishedAt: quitAt,
            time: null,
            reason: "inactive_30_seconds"
          };
          changed = true;
        }
      }
      if (!changed) return;
      current.players = players;
      current.finishes = finishes;
      return current;
    }, undefined, false);
    const currentRoom = transaction && transaction.snapshot ? transaction.snapshot.val() : null;
    if (currentRoom && currentRoom.status === "running" && raceDoneCount(currentRoom) >= RACE_SIZE) finalizeRace();
  } catch (error) {
    console.warn("Could not check idle racers.", error);
  } finally {
    raceInactivityCheckBusy = false;
  }
}

async function leaveRaceAndNavigate(destination = "index.html?build=linked-race-20261025-v1") {
  if (GAME_MODE !== "race" || !raceRoomRef || !raceRoomId) {
    window.location.href = destination;
    return;
  }
  const currentRoomRef = raceRoomRef;
  const playerRef = currentRoomRef.child("players/" + myPlayerId);
  const hadFinished = raceFinishRecorded;
  raceReady = false;
  keys = {};
  timerRunning = false;
  if (!hadFinished) {
    raceForfeited = true;
    hideForfeitedPlayerAvatar();
  } else {
    hideForfeitedPlayerAvatar();
  }

  let sawPreStartRoom = false;
  try {
    const roomSnapshot = await currentRoomRef.once("value");
    const observed = roomSnapshot.val() || {};
    sawPreStartRoom = observed.status === "waiting" || observed.status === "starting";
    // Before a race starts, remove the seat cleanly so onDisconnect cannot
    // recreate the removed participant. During a live race, leave the fallback
    // registered until the explicit DNF transaction has safely committed.
    if (sawPreStartRoom) await playerRef.onDisconnect().cancel();

    const result = await currentRoomRef.transaction(current => {
      if (!current || !current.players || !current.players[myPlayerId]) return;
      const players = { ...current.players };
      const player = { ...(players[myPlayerId] || {}) };
      const now = raceNow();
      const finishes = current.finishes && typeof current.finishes === "object" ? { ...current.finishes } : {};
      const ownExistingFinish = finishes[myPlayerId];
      const alreadyFinished = !!(ownExistingFinish && ownExistingFinish.reachedFinalSun === true);
      // Do not shift the original leave time if this player has already been
      // ruled inactive or has deliberately left.
      if (player.disconnected || (ownExistingFinish && ownExistingFinish.reachedFinalSun === false)) return current;
      if (current.status === "running" && !alreadyFinished) {
        player.disconnected = true;
        player.disconnectedAt = now;
        player.quitReason = "left_game";
        players[myPlayerId] = player;
        finishes[myPlayerId] = { playerId: myPlayerId, reachedFinalSun: false, finishedAt: now, time: null, reason: "left_game" };
        current.players = players;
        current.finishes = finishes;
        return current;
      }
      if (current.status === "waiting" || current.status === "starting") {
        delete players[myPlayerId];
        const remainingCount = Object.values(players).filter(p => p && !p.disconnected).length;
        current.players = players;
        current.status = "waiting";
        current.startAt = null;
        current.finishes = {};
        current.raceResults = null;
        if (remainingCount === 0) return null;
        return current;
      }
      // Leaving after finishing never removes or changes the earned finish.
      player.disconnected = true;
      player.disconnectedAt = now;
      player.quitReason = alreadyFinished ? "left_after_finish" : (player.quitReason || "left_game");
      players[myPlayerId] = player;
      current.players = players;
      return current;
    }, undefined, false);

    // The transaction may be a no-op when another client already marked this
    // player as DNF. Cancel the disconnect write anyway so it cannot overwrite
    // the original leave/inactivity timestamp when this tab navigates away.
    if (result) await playerRef.onDisconnect().cancel().catch(() => {});
  } catch (error) {
    console.warn("Could not fully record race exit; keeping Firebase onDisconnect as fallback.", error);
    if (sawPreStartRoom) {
      await playerRef.onDisconnect().update({
        disconnected: true,
        disconnectedAt: firebase.database.ServerValue.TIMESTAMP,
        quitReason: "left_before_start"
      }).catch(() => {});
    }
  }
  window.location.href = destination;
}

function showRaceLeaderboard(room, isFinal) {

  const finishes = room.finishes && typeof room.finishes === "object" ? room.finishes : {};

  let rows = [];

  if (isFinal && room.raceResults && room.raceResults.order) {
    const savedOrder = room.raceResults.order;

      ? savedOrder
      : Object.entries(savedOrder).sort((a, b) => Number(a[0]) - Number(b[0])).map(entry => entry[1]);
    rows = orderedIds.map(id => ({
      id,
      player: players[id] || {},
      finish: finishes[id] || null,
      result: results[id] || { place: 0, trophyDelta: 0, reason: "no_sun_finish" }

      const dt = (Number(a.finish.finishedAt) || Infinity) - (Number(b.finish.finishedAt) || Infinity);

    });
    const quitters = all.filter(row => row.player.disconnected || (row.finish && row.finish.reachedFinalSun === false)).sort((a, b) => {

    rows = [
      ...finished.map((row, i) => ({ ...row, result: { place: i + 1, trophyDelta: null }, liveState: "FINISHED" })),
      ...racing.map(row => ({ ...row, result: { place: null, trophyDelta: null }, liveState: "RACING" })),
      ...quitters.map((row, i) => ({ ...row, result: { place: finished.length + racing.length + i + 1, trophyDelta: null }, liveState: "LEFT" }))
    ];

    title = raceForfeited ? "RACE FORFEIT · LAST PLACE" : (raceFinishRecorded ? "YOU REACHED THE FINAL SUN!" : "RACE STANDINGS");
    subtitle = raceForfeited
      ? "YOU LEFT OR DID NOT MOVE FOR 30 SECONDS · DNF"
      : ("FINISHED: " + finishedCount + "/3 · WAITING FOR " + Math.max(0, 3 - doneCount) + " RACER(S) · IDLE 30S = DNF");
  } else {
    const ownResult = results[myPlayerId];
    if (!room.raceResults.winnerId) {
      title = "RACE ENDED · NO WINNER";
      subtitle = "NOBODY REACHED THE FINAL SUN · NO TROPHIES CHANGED";
    } else if (ownResult && ownResult.place === 1) {
      title = "YOU WON! +5 TROPHIES";
      subtitle = "YOU REACHED THE FINAL SUN FIRST";
    } else if (ownResult && ownResult.place === 2) {
      title = "YOU FINISHED 2ND";
      subtitle = "NO TROPHIES GAINED OR LOST";
    } else if (ownResult && ownResult.place === 3) {
      title = "YOU FINISHED 3RD · -5 TROPHIES";
      subtitle = "THE TROPHY BALANCE CANNOT GO BELOW ZERO";
    }
  }

  overlay.classList.add("visible");
  overlay.setAttribute("aria-hidden", "false");
  document.getElementById("race-overlay-title").textContent = title;
  document.getElementById("race-countdown-number").style.display = "none";
  document.getElementById("race-overlay-subtitle").textContent = subtitle;
  const standings = document.getElementById("race-standings");
  standings.style.display = "block";
  document.getElementById("race-exit-btn").style.display = (isFinal || raceFinishRecorded || raceForfeited) ? "block" : "none";
  standings.innerHTML = rows.map((row, index) => {
    const playerName = raceEscapeHtml(row.player.name || (row.id === myPlayerId ? "You" : "Player"));
    const own = row.id === myPlayerId;
    const place = isFinal ? Number(row.result.place) : (row.finish && row.finish.reachedFinalSun === true ? Number(row.result.place) : Number(row.result.place) || null);
    const isQuit = !!(row.player.disconnected || (row.finish && row.finish.reachedFinalSun === false));
    const placeText = isFinal
      ? (!room.raceResults.winnerId ? (row.finish && row.finish.reachedFinalSun === true ? "FINISHED" : "DNF") : (place ? racePlaceLabel(place) : "—"))
      : (row.finish && row.finish.reachedFinalSun === true ? racePlaceLabel(place) : (isQuit ? (place ? racePlaceLabel(place) + " · LEFT" : "LEFT") : "RACING"));
    const delta = row.result.trophyDelta;
    const trophies = isFinal ? (Number(delta) > 0 ? "+" + Number(delta) : Number(delta) < 0 ? String(Number(delta)) : "0") : (row.finish && row.finish.reachedFinalSun === true ? "FINISHED" : (isQuit ? "DNF" : "IN RACE"));
    const nameText = playerName + (own ? " (YOU)" : "");
    const rowClass = (isFinal && place === 1 ? " winner" : "") + (own ? " own" : "");
    return '<div class="race-standing-row' + rowClass + '"><span class="race-standing-place">' + raceEscapeHtml(placeText) + '</span><span class="race-standing-name">' + nameText + '</span><span class="race-standing-score">' + raceEscapeHtml(trophies) + '</span></div>';
  }).join("");
  if (!isFinal && raceFinishRecorded) {
    setStatus("FINISH SAVED · WAITING FOR THE OTHER RACERS", "#ffdd00");
  }
}

async function joinRaceRoom(db) {
  const roomsRef = db.ref("platformerRaceRooms/" + GAME_CODE);
  const trophies = await loadRaceTrophies(db);
  const me = makeRoomPlayer(trophies);
  const newRoomKey = roomsRef.push().key;
  const myAccountCode = safeAccountCode();
  let duplicateInRace = false;

  // One root transaction allocates queue slots in FIFO order. Every world has
  // exactly three seats; when the third slot is filled, that world locks and
  // starts its synchronized 3-2-1 countdown. World numbers remain monotonic.
  const result = await roomsRef.transaction(currentRooms => {
    duplicateInRace = false;
    const rooms = currentRooms && typeof currentRooms === "object" ? { ...currentRooms } : {};
    const transactionNow = raceNow();
    const meta = rooms.__meta && typeof rooms.__meta === "object" ? { ...rooms.__meta } : {};
    let maxWorldNumber = 0;
    for (const [id, room] of Object.entries(rooms)) {
      if (id === "__meta" || !room || typeof room !== "object") continue;
      maxWorldNumber = Math.max(maxWorldNumber, Number(room.worldNumber) || 0);
    }
    let nextWorldNumber = Math.max(1, Number(meta.nextWorldNumber) || 1, maxWorldNumber + 1);

    // Clean up stale rooms while preserving the world-number counter.
    for (const [id, rawRoom] of Object.entries(rooms)) {
      if (id === "__meta") continue;
      if (!rawRoom || typeof rawRoom !== "object") { delete rooms[id]; continue; }
      const age = transactionNow - (Number(rawRoom.createdAt) || 0);
      const finalizedAt = Number(rawRoom.raceResults && rawRoom.raceResults.finalizedAt) || 0;
      if (rawRoom.status === "finished" && finalizedAt && transactionNow - finalizedAt > 600000) {
        delete rooms[id];
        continue;
      }
      if (rawRoom.status === "waiting" || rawRoom.status === "starting") {
        let players = rawRoom.players && typeof rawRoom.players === "object" ? { ...rawRoom.players } : {};
        // Keep live participants only and cap even legacy/corrupt rooms at three.
        players = Object.fromEntries(Object.entries(players)
          .filter(([, player]) => player && !player.disconnected)
          .sort((a, b) => (Number(a[1].joinedAt) || 0) - (Number(b[1].joinedAt) || 0))
          .slice(0, RACE_SIZE));
        if (!Object.keys(players).length) { delete rooms[id]; continue; }
        const full = Object.keys(players).length === RACE_SIZE;
        let repaired = { ...rawRoom, players };
        if (full && rawRoom.status !== "starting") {
          if (!Number(repaired.worldNumber)) repaired.worldNumber = nextWorldNumber++;
          repaired.status = "starting";
          repaired.startAt = transactionNow + 3000;
          repaired.finishes = {};
          repaired.raceResults = null;
        } else if (!full && rawRoom.status === "starting") {
          repaired.status = "waiting";
          repaired.startAt = null;
          repaired.finishes = {};
          repaired.raceResults = null;
        } else if (!full && rawRoom.status === "waiting") {
          repaired.status = "waiting";
          repaired.startAt = null;
        }
        rooms[id] = repaired;
      } else if (["starting", "running"].includes(rawRoom.status) && age > 120000 && countRacePlayers(rawRoom) === 0) {
        delete rooms[id];
      }
    }

    const isSameHuman = player => {
      if (!player || player.disconnected) return false;
      if (myAccountCode && player.accountKey === myAccountCode) return true;
      return !!me.deviceId && player.deviceId === me.deviceId;
    };
    for (const [id, room] of Object.entries(rooms)) {
      if (id === "__meta" || !room || !["waiting", "starting", "running"].includes(room.status)) continue;
      if (Object.values(room.players || {}).some(isSameHuman)) {
        duplicateInRace = true;
        return;
      }
    }

    const candidates = [];
    for (const [id, room] of Object.entries(rooms)) {
      if (id === "__meta" || !room || room.status !== "waiting") continue;
      const activePlayers = Object.entries(room.players || {}).filter(([, player]) => player && !player.disconnected);
      if (activePlayers.length > 0 && activePlayers.length < RACE_SIZE) {
        candidates.push({ id, createdAt: Number(room.createdAt) || 0, worldNumber: Number(room.worldNumber) || Number.MAX_SAFE_INTEGER });
      }
    }
    candidates.sort((a, b) => a.createdAt - b.createdAt || a.worldNumber - b.worldNumber || a.id.localeCompare(b.id));

    if (candidates.length) {
      const chosen = candidates[0];
      const room = { ...rooms[chosen.id] };
      const players = room.players && typeof room.players === "object" ? { ...room.players } : {};
      players[myPlayerId] = { ...me, joinedAt: transactionNow };
      room.players = players;
      room.game = GAME_CODE;
      if (!Number(room.worldNumber)) {
        room.worldNumber = nextWorldNumber++;
      }
      if (countRacePlayers(room) === RACE_SIZE) {
        room.status = "starting";
        room.startAt = transactionNow + 3000;
        room.finishes = {};
        room.raceResults = null;
        room.finishedAt = null;
      }
      rooms[chosen.id] = room;
    } else {
      const worldNumber = nextWorldNumber++;
      rooms[newRoomKey] = {
        game: GAME_CODE,
        worldNumber,
        status: "waiting",
        createdAt: transactionNow,
        startAt: null,
        players: { [myPlayerId]: { ...me, joinedAt: transactionNow } },
        finishes: {},
        raceResults: null
      };
    }
    meta.nextWorldNumber = nextWorldNumber;
    rooms.__meta = meta;
    return rooms;
  }, undefined, false);

  if (duplicateInRace) throw new Error("ALREADY_IN_RACE");
  const allRooms = result && result.snapshot ? result.snapshot.val() || {} : {};
  let joinedId = null;
  for (const [id, room] of Object.entries(allRooms)) {
    if (id !== "__meta" && room && room.players && room.players[myPlayerId]) { joinedId = id; break; }
  }
  if (!result || !result.committed || !joinedId) throw new Error("COULD_NOT_RESERVE_RACE_ROOM");

  raceRoomRef = roomsRef.child(joinedId);
  raceRoomId = joinedId;
  const initialRoom = allRooms[joinedId] || {};
  raceWorldNumber = Number(initialRoom.worldNumber) || 0;
  await raceRoomRef.child("players/" + myPlayerId).onDisconnect().update({
    disconnected: true,
    disconnectedAt: firebase.database.ServerValue.TIMESTAMP
  }).catch(e => console.warn("Could not register race disconnect marker.", e));
  bindNetworkRoot(db, "platformerRaceWorlds/" + GAME_CODE + "/" + raceRoomId);
  raceRoomRef.on("value", snap => handleRaceRoomState(snap.val() || {}, db));
  setStatus("RACE QUEUE V3 CONNECTED · WORLD " + (raceWorldNumber || "—") + " · WAITING FOR 3 PLAYERS", "#ffdd00");
}

function resetUnderfilledStartingRoom() {
  if (!raceRoomRef) return;
  clearRaceTimers();
  raceGameplayStarted = false;
  hideRaceOverlay();
  raceRoomRef.transaction(current => {
    if (!current || current.status !== "starting") return;
    let players = current.players && typeof current.players === "object" ? { ...current.players } : {};
    players = Object.fromEntries(Object.entries(players)
      .filter(([, player]) => player && !player.disconnected)
      .sort((a, b) => (Number(a[1].joinedAt) || 0) - (Number(b[1].joinedAt) || 0))
      .slice(0, RACE_SIZE));
    if (Object.keys(players).length === RACE_SIZE) {
      current.status = "starting";
      current.startAt = raceNow() + 3000;
    } else {
      current.status = "waiting";
      current.startAt = null;
    }
    current.players = players;
    current.finishes = {};
    current.raceResults = null;
    return current;
  }, undefined, false).catch(() => {});
}

function raceDoneCount(room) {
  const players = room && room.players && typeof room.players === "object" ? room.players : {};
  const finishes = room && room.finishes && typeof room.finishes === "object" ? room.finishes : {};
  return Object.entries(players).filter(([id, player]) =>
    (finishes[id] && finishes[id].reachedFinalSun !== false) || (player && player.disconnected)
  ).length;
}
function handleRaceRoomState(room, db) {
  const count = countRacePlayers(room);
  raceWorldNumber = Number(room.worldNumber) || raceWorldNumber;
  if (room.status === "waiting") {
    clearRaceTimers();
    raceReady = false;
    if (!raceFinishRecorded) hideRaceOverlay();
    setStatus("RACE LOBBY V3 " + count + "/" + RACE_SIZE + " · WORLD " + (raceWorldNumber || "—") + " · NEED " + Math.max(0, RACE_SIZE - count), "#ffdd00");
    return;
  }

  if (room.status === "starting" && Number(room.startAt)) {
    if (count !== RACE_SIZE || Object.keys(room.players || {}).length !== RACE_SIZE) {
      raceReady = false;
      resetUnderfilledStartingRoom();
      return;
    }
    raceReady = false;
    raceStartAt = Number(room.startAt);
    showRaceCountdown(Math.ceil((raceStartAt - raceNow()) / 1000), raceWorldNumber);
    if (!raceCountdownInterval) {
      raceCountdownInterval = setInterval(() => {
        if (!raceStartAt || raceNow() >= raceStartAt) return;
        showRaceCountdown(Math.ceil((raceStartAt - raceNow()) / 1000), raceWorldNumber);
      }, 100);
    }
    if (!raceStartTimer) {
      raceStartTimer = setTimeout(() => {
        raceStartTimer = null;
        raceRoomRef.transaction(current => {
          if (!current || current.status !== "starting") return;
          if (countRacePlayers(current) !== RACE_SIZE || Object.keys(current.players || {}).length !== RACE_SIZE) return;
          if (Number(current.startAt) > raceNow()) return;
          current.status = "running";
          current.startedAt = Number(current.startAt) || raceNow();
          const startedAt = current.startedAt;
          const players = current.players && typeof current.players === "object" ? { ...current.players } : {};
          for (const [id, player] of Object.entries(players)) {
            if (!player) continue;
            players[id] = { ...player, lastMoveAt: startedAt, disconnected: false, quitReason: null };
          }
          current.players = players;
          return current;
        }, undefined, false).then(result => {
          const latest = result && result.snapshot ? result.snapshot.val() : null;
          if (latest && latest.status === "starting" && countRacePlayers(latest) < RACE_SIZE) resetUnderfilledStartingRoom();
        }).catch(e => console.warn("Could not start race room.", e));
      }, Math.max(20, raceStartAt - raceNow()));
    }
    return;
  }

  if (room.status === "running") {
    if (raceStartTimer) { clearTimeout(raceStartTimer); raceStartTimer = null; }
    if (raceCountdownInterval) { clearInterval(raceCountdownInterval); raceCountdownInterval = null; }
    raceStartAt = Number(room.startAt) || Number(room.startedAt) || raceNow();
    ensureRaceInactivityMonitor(db);

    const myRoomPlayer = room.players && room.players[myPlayerId];
    const myFinish = room.finishes && room.finishes[myPlayerId];
    if (myRoomPlayer && myRoomPlayer.disconnected && !(myFinish && myFinish.reachedFinalSun === true)) {
      raceForfeited = true;
      hideForfeitedPlayerAvatar();
    }
    if (raceFinishRecorded) {
      raceReady = false;
      keys = {};
      timerRunning = false;
      showRaceLeaderboard(room, false);
    } else if (raceForfeited) {
      raceReady = false;
      keys = {};
      timerRunning = false;
      showRaceLeaderboard(room, false);
      setStatus("RACE FORFEIT · LAST PLACE · -5 TROPHIES IF LAST", "#f88");
    } else if (raceNow() >= raceStartAt) {
      if (!raceGameplayStarted) {
        raceGameplayStarted = true;
        keys = {};
        hideRaceOverlay();
        timerStart = raceStartAt;
        timerCurrent = Math.max(0, raceNow() - raceStartAt);
        timerRunning = true;
        lastRaceActivityWriteAt = 0;
        setStatus("🏁 RACE V3 LIVE · 3 PLAYERS · WORLD " + (raceWorldNumber || "—") + " · IDLE 30S = DNF", "#6f6");
      } else {
        timerCurrent = Math.max(0, raceNow() - raceStartAt);
        timerRunning = true;
      }
      raceReady = true;
    } else {
      raceReady = false;
      if (!raceStartTimer) {
        raceStartTimer = setTimeout(() => {
          raceStartTimer = null;
          handleRaceRoomState(room, db);
        }, Math.max(20, raceStartAt - raceNow()));
      }
    }
    if (raceDoneCount(room) >= RACE_SIZE) finalizeRace();
    return;
  }

  if (room.status === "finished" && room.raceResults && room.raceResults.finalized) {
    clearRaceTimers();
    raceReady = false;
    raceGameplayStarted = false;
    keys = {};
    timerRunning = false;
    showRaceLeaderboard(room, true);
    applyRaceAward(room, db);
  }
}

function recordRaceFinish(timeMs) {
  if (GAME_MODE !== "race" || !raceRoomRef || raceFinishRecorded) return;
  raceFinishRecorded = true;
  raceReady = false;
  keys = {};
  timerRunning = false;
  const finishRecord = {
    finishedAt: raceNow(),
    time: Math.max(0, Number(timeMs) || 0),
    playerId: myPlayerId,
    reachedFinalSun: true
  };
  setStatus("FINAL SUN REACHED · WAITING FOR THE OTHER RACERS…", "#ffdd00");
  raceRoomRef.child("finishes/" + myPlayerId).set(finishRecord).catch(e => {
    raceFinishRecorded = false;
    console.warn("Could not submit race finish.", e);
    setStatus("COULD NOT SAVE FINISH · CHECK CONNECTION", "#f88");
  });
}

function finalizeRace() {
  if (GAME_MODE !== "race" || !raceRoomRef || raceFinalizeBusy) return;
  raceFinalizeBusy = true;
  raceRoomRef.transaction(current => {
    if (!current || current.status !== "running" || (current.raceResults && current.raceResults.finalized)) return;
    const players = Object.entries(current.players || {});
    if (players.length !== RACE_SIZE) return;
    const finishes = current.finishes && typeof current.finishes === "object" ? current.finishes : {};
    const allDone = players.every(([id, player]) =>
      (finishes[id] && finishes[id].reachedFinalSun !== false) || (player && player.disconnected)
    );
    if (!allDone) return;

    const finished = players.filter(([id]) => finishes[id] && finishes[id].reachedFinalSun !== false).sort((a, b) => {
      const delta = (Number(finishes[a[0]].finishedAt) || Infinity) - (Number(finishes[b[0]].finishedAt) || Infinity);
      return delta || a[0].localeCompare(b[0]);
    });
    // Racers who left before touching the last sun are ranked after every
    // finisher. A player who stayed longer is placed ahead of an earlier leaver.
    const didNotFinish = players.filter(([id]) => !(finishes[id] && finishes[id].reachedFinalSun !== false)).sort((a, b) => {
      const leftA = Number(a[1] && (a[1].disconnectedAt || a[1].joinedAt)) || 0;
      const leftB = Number(b[1] && (b[1].disconnectedAt || b[1].joinedAt)) || 0;
      return leftB - leftA || a[0].localeCompare(b[0]);
    });
    const ordered = [...finished, ...didNotFinish];
    const winnerId = finished.length ? finished[0][0] : null;
    const byPlayer = {};
    ordered.forEach(([id, player], index) => {
      const place = index + 1;
      let trophyDelta = 0;
      if (winnerId) {
        if (place === 1) trophyDelta = RACE_WIN_TROPHIES;
        else if (place === RACE_SIZE) trophyDelta = RACE_LOSS_TROPHIES;
      }
      byPlayer[id] = {
        place,
        trophyDelta,
        finishTime: finishes[id] ? Number(finishes[id].time) || 0 : null,
        reason: !winnerId ? "no_sun_finish" : (place === 1 ? "last_sun" : (finishes[id] ? "finished_race" : "did_not_finish"))
      };
    });
    current.raceResults = {
      finalized: true,
      finalizedAt: raceNow(),
      winnerId,
      order: ordered.map(([id]) => id),
      byPlayer
    };
    current.status = "finished";
    current.finishedAt = raceNow();
    return current;
  }, undefined, false).then(result => {
    const settledRoom = result && result.snapshot ? result.snapshot.val() : null;
    if (settledRoom && settledRoom.status === "finished" && settledRoom.raceResults && settledRoom.raceResults.finalized) {
      showRaceLeaderboard(settledRoom, true);
      applyRaceAward(settledRoom, window._pfDb);
    }
  }).catch(e => console.warn("Could not finalize race.", e)).finally(() => { raceFinalizeBusy = false; });
}

function applyRaceAward(room, db) {
  if (raceAwardApplied || !db || !room || !raceRoomId || !room.raceResults || !room.raceResults.byPlayer) return;
  raceAwardApplied = true;
  const results = room.raceResults.byPlayer;
  const participants = room.players || {};
  const awards = Object.entries(results).map(([playerId, result]) => {
    const player = participants[playerId] || {};
    const key = player.accountKey || (playerId === myPlayerId ? raceLeaderboardKey() : "guest_" + String(player.name || "player").toLowerCase().replace(/[^a-z0-9_-]/g, "_").slice(0, 28) + "_" + playerId);
    const playerName = String(player.name || (playerId === myPlayerId ? localStorage.getItem("pg_player_name") || localStorage.getItem("pixel_games_username") || "Player" : "Player"));
    const trophiesPath = "platformerRaceTrophies/" + GAME_CODE + "/" + key;
    return db.ref(trophiesPath).transaction(current => {
      const entry = current && typeof current === "object" ? { ...current } : {};
      if (entry.lastRaceId === raceRoomId) return entry;
      entry.name = playerName;
      entry.trophies = Math.max(0, (Number(entry.trophies) || 0) + (Number(result.trophyDelta) || 0));
      entry.lastRaceId = raceRoomId;
      entry.lastRacePlace = Number(result.place) || 0;
      entry.lastRaceAt = raceNow();
      entry.updatedAt = raceNow();
      return entry;
    }, undefined, false).then(snapshot => {
      const entry = snapshot.snapshot && snapshot.snapshot.val() || {};
      if (playerId === myPlayerId) localStorage.setItem("plixo_race_trophies_" + GAME_CODE, String(Math.max(0, Number(entry.trophies) || 0)));
      return { playerId, result, entry };
    });
  });
  Promise.all(awards).then(() => {
    const ownResult = results[myPlayerId];
    if (!ownResult) return;
    const delta = Number(ownResult.trophyDelta) || 0;
    const message = !room.raceResults.winnerId
      ? "RACE OVER · NO ONE REACHED THE FINAL SUN · NO TROPHIES CHANGED"
      : (ownResult.place === 1 ? "RACE WON · +5 TROPHIES" : ownResult.place === 2 ? "RACE SECOND · NO TROPHY CHANGE" : "RACE THIRD · -5 TROPHIES (MINIMUM 0)");
    setStatus(message, ownResult.place === 1 ? "#6f6" : ownResult.place === 2 ? "#ffdd00" : "#f88");
    showRaceLeaderboard(room, true);
  }).catch(e => {
    raceAwardApplied = false;
    console.warn("Could not save race trophy awards; room updates will retry.", e);
  });
}

function initFirebase() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    window._pfDb = db;
    document.title = GAME_LABEL + " — " + GAME_MODE.toUpperCase();
    if (GAME_MODE === "single") {
      setStatus("● SINGLEPLAYER", "#8af");
      return; // No remote players or shared-world writes in singleplayer.
    }
    if (GAME_MODE === "multiplayer") {
      bindNetworkRoot(db, GAME_ROOT);
      return;
    }
    if (GAME_MODE === "race") {
      raceReady = false;
      initializeRaceClock(db).then(() => joinRaceRoom(db)).catch(e => {
        console.warn("Could not join race queue.", e);
        if (e && e.message === "ALREADY_IN_RACE") setStatus("THIS ACCOUNT IS ALREADY IN A RACE", "#f88");
        else setStatus("RACE CONNECTION FAILED · CHECK CONNECTION AND TRY AGAIN", "#f88");
      });
    }
  } catch(e) {
    setStatus("offline", "#888");
  }
}

const skinImage = new Image();
let skinReady = false;

// skin.html saves the selected 20x28 block as plixo_skin_image.
// Keep this sprite scale and its alignment identical in MBP and MSP.
function applySkinImage(dataUrl) {
    if (typeof dataUrl !== "string" || !/^data:image\//.test(dataUrl)) {
        skinReady = false;
        return;
    }
    skinReady = false;
    if (skinImage.src === dataUrl && skinImage.complete && skinImage.naturalWidth > 0) {
        skinReady = true;
    } else {
        skinImage.onload = () => { skinReady = true; };
        skinImage.onerror = () => { skinReady = false; };
        if (skinImage.src !== dataUrl) skinImage.src = dataUrl;
    }
    if (fbSkinsRef && myPlayerId) {
        fbSkinsRef.child(myPlayerId).set(dataUrl).catch(() => {});
    }
}

function refreshSkin() {
    const localImage = localStorage.getItem("plixo_skin_image");
    if (localImage) {
        applySkinImage(localImage);
        return;
    }

    // If this device has no cached image, restore the selected block from the same
    // PLIXO account record used by skin.html. Do not overwrite a local skin that
    // may be selected while the Firebase read is in flight.
    skinReady = false;
    const accountCode = typeof safeAccountCode === "function" ? safeAccountCode() : "";
    const db = window._pfDb || (window.firebase && firebase.apps && firebase.apps.length ? firebase.database() : null);
    if (!accountCode || !db) return;
    db.ref("plixo_users/" + accountCode + "/skin_image").once("value").then(snapshot => {
        const nowLocal = localStorage.getItem("plixo_skin_image");
        if (nowLocal) {
            applySkinImage(nowLocal);
            return;
        }
        const cloudImage = snapshot.val();
        if (typeof cloudImage === "string" && /^data:image\//.test(cloudImage)) {
            localStorage.setItem("plixo_skin_image", cloudImage);
            applySkinImage(cloudImage);
        }
    }).catch(() => {});
}

let lastSentX = -1, lastSentY = -1, fbThrottle = 0;
function broadcastPosition() {
  if(!myFbRef || (GAME_MODE === "race" && raceForfeited)) return;
  fbThrottle++;
  const moved = Math.round(dino.x) !== lastSentX || Math.round(dino.y) !== lastSentY;
  if (moved) noteRaceMovement();
  if(!moved && fbThrottle < 20) return;
  fbThrottle = 0;
  lastSentX = Math.round(dino.x);
  lastSentY = Math.round(dino.y);
  myFbRef.set({ x: lastSentX, y: lastSentY, level: currentLevel, t: Date.now() });
}

function cleanupRemotePlayers() {
  const now = Date.now();
  for(let id in remotePlayers) {
    if(now - (remotePlayers[id].t || 0) > 15000) delete remotePlayers[id];
  }
}

function timerString(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  const tenth = Math.floor((ms % 1000) / 100);
  return `${m}:${sec.toString().padStart(2,"0")}.${tenth}`;
}

class Dino {
  constructor(x, y) { 
    this.x=x; this.y=y; this.w=10; this.h=14; this.vx=0; this.vy=0; 
    this.extraJumpUsed=false; this.prevJumpKey=false; this.fallCounter=0; 
  }
  collides(o) { return(this.x<o.x+o.w&&this.x+this.w>o.x&&this.y<o.y+o.h&&this.y+this.h>o.y); }
  canJump(obs) {
    if(this.y>=GROUND_HEIGHT-this.h) return true;
    for(let o of obs) {
      if(this.x+this.w>o.x&&this.x<o.x+o.w&&Math.abs(this.y+this.h-o.y)<2) return true;
    }
    return false;
  }
  update(obs) {
    this.x+=this.vx;
    for(let o of obs) {
      if(this.collides(o)) {
        if(this.vx>0) this.x=o.x-this.w;
        if(this.vx<0) this.x=o.x+o.w;
      }
    }
    this.vy+=GRAVITY;
    this.y+=this.vy;
    let grounded = false;
    for(let o of obs) {
      if(this.collides(o)) {
        if(this.vy>0){this.y=o.y-this.h;this.vy=0; this.extraJumpUsed=false; grounded=true;}
        if(this.vy<0){this.y=o.y+o.h;this.vy=0;}
      }
    }
    this.x=Math.max(0,Math.min(WIDTH-this.w,this.x));
    if(this.y>=GROUND_HEIGHT-this.h){this.y=GROUND_HEIGHT-this.h;this.vy=0; this.extraJumpUsed=false; grounded=true;}

    if(grounded) {
      this.fallCounter = 0;
    } else if(this.vy > 0) {
      this.fallCounter++;
    }
  }
  draw() {
    if (skinReady) {
        ctx.imageSmoothingEnabled = false;
        const ratioX = this.w / 18;
        const ratioY = this.h / 26;
        const drawW = 20 * ratioX;
        const drawH = 28 * ratioY;
        const drawX = this.x - (1 * ratioX);
        const drawY = this.y - (1 * ratioY);
        ctx.drawImage(skinImage, drawX, drawY, drawW, drawH);
    } else {
        ctx.fillStyle = "red";
        ctx.fillRect(this.x, this.y, this.w, this.h);
    }
  }
}

let currentLevel=0, obstacles=[], star, dino, keys={};

function loadLevel() {
  const lvl = LEVELS[currentLevel];
  obstacles = lvl.obstacles.map(o=>({x:o[0],y:o[1],w:o[2],h:o[3]}));
  star = {x:lvl.star[0], y:lvl.star[1], size:10};
  dino = new Dino(lvl.player_start[0], lvl.player_start[1]);
}

function nextLevel() {
  let levelTime = Date.now() - levelStartTime;
  if(levelTime < 15000) setPlixoMaxProgress('dm_30', 1);
  levelStartTime = Date.now();

  currentLevel = (currentLevel + 1) % LEVELS.length;
  if(currentLevel === 0) {
    if(timerRunning) {
      timerCurrent = (GAME_MODE === "race" ? raceNow() : Date.now()) - timerStart;
      timerRunning = false;
      if (GAME_MODE === "race") recordRaceFinish(timerCurrent);
      
      setPlixoMaxProgress('a36', 1);
      if (totalDeaths === 0) setPlixoMaxProgress('a41', 1); 
      if (timerCurrent <= 60000) setPlixoMaxProgress('a_speedrun_mbp', 1);

      if(highscore === null || timerCurrent < highscore) {
        highscore = timerCurrent;
        localStorage.setItem("platformer_highscore", highscore);
        const pfName = localStorage.getItem('pg_player_name') || 'Speler';
        if(window._pfDb) {
          const pfRef = window._pfDb.ref('platformerScores');
          pfRef.orderByChild('name').equalTo(pfName).once('value').then(snap => {
            let existingKey = null, existingTime = Infinity;
            snap.forEach(child => { existingKey = child.key; existingTime = child.val().time || Infinity; });
            if(timerCurrent < existingTime) {
              const entry = { name: pfName, time: timerCurrent };
              if(existingKey) pfRef.child(existingKey).set(entry);
              else pfRef.push(entry);
            }
          }).catch(()=>{});
        }
      }
    }
  } else if(currentLevel === 1 && !timerRunning) {
    timerStart = Date.now();
    timerRunning = true;
    timerCurrent = 0;
  }
  loadLevel();
}

window.addEventListener("keydown", e=>{ if (GAME_MODE === "race" && !raceReady) return; keys[e.key]=true; });
window.addEventListener("keyup", e=>keys[e.key]=false);

const TARGET_FPS = 60;
const FRAME_TIME = 1000 / TARGET_FPS;
let lastTime = 0;
let frameCount = 0;

function loop(timestamp) {
  requestAnimationFrame(loop);

  if(timestamp - lastTime < FRAME_TIME) return;
  lastTime = timestamp;

  dino.vx = 0;
  if(keys["ArrowLeft"]) dino.vx = -2.5;
  if(keys["ArrowRight"]) dino.vx = 2.5;

  const jumpPressed = keys["ArrowUp"];
  if(jumpPressed) {
      if(dino.canJump(obstacles)) {
          dino.vy = -7;
          dino.extraJumpUsed = true;
          addPlixoProgress('dm_21', 1); addPlixoProgress('dm_22', 1);
      } else if(!dino.prevJumpKey && !dino.extraJumpUsed && dino.vy > 0 && dino.fallCounter <= 4) {
          dino.vy = -7;
          dino.extraJumpUsed = true;
          addPlixoProgress('dm_21', 1); addPlixoProgress('dm_22', 1);
      }
  }
  dino.prevJumpKey = jumpPressed;

  dino.update(obstacles);

  if(dino.x < star.x+star.size && dino.x+dino.w > star.x &&
     dino.y < star.y+star.size && dino.y+dino.h > star.y) nextLevel();

  frameCount++;
  broadcastPosition();
  if(frameCount % 30 === 0) cleanupRemotePlayers();

  if(timerRunning) timerCurrent = (GAME_MODE === "race" ? raceNow() : Date.now()) - timerStart;

  ctx.clearRect(0,0,WIDTH,HEIGHT);

  ctx.fillStyle = "black";
  ctx.fillRect(0,GROUND_HEIGHT,WIDTH,HEIGHT-GROUND_HEIGHT);

  ctx.fillStyle = "#ccc";
  ctx.font = "bold 8px monospace";
  ctx.fillText(timerString(timerCurrent), 4, GROUND_HEIGHT + 12);
  if(highscore !== null) {
    ctx.fillStyle = "gold";
    ctx.fillText("best: " + timerString(highscore), 4, GROUND_HEIGHT + 26);
  }

  ctx.fillStyle = "gray";
  for(let o of obstacles) ctx.fillRect(o.x,o.y,o.w,o.h);

  ctx.fillStyle = "gold";
  ctx.beginPath();
  ctx.arc(star.x+5, star.y+5, 5, 0, Math.PI*2);
  ctx.fill();

  for(let id in remotePlayers) {
    const rp = remotePlayers[id];
    if(rp.level === currentLevel) {
      const rSkin = remoteSkinImages[id];
      if (rSkin && rSkin.complete && rSkin.naturalWidth > 0) {
          ctx.imageSmoothingEnabled = false;
          const ratioX = 10 / 18; 
          const ratioY = 14 / 26; 
          const drawW = 20 * ratioX;
          const drawH = 28 * ratioY;
          const drawX = rp.x - (1 * ratioX);
          const drawY = rp.y - (1 * ratioY);
          
          ctx.drawImage(rSkin, drawX, drawY, drawW, drawH);
      } else {
          ctx.fillStyle = "blue";
          ctx.fillRect(rp.x, rp.y, 10, 14);
      }
    }
  }

  dino.draw();
}

});

document.getElementById("reset-btn").addEventListener("click", () => {
  if (!confirm("Reset your highscore?")) return;
  highscore = null;
  localStorage.removeItem("platformer_highscore");
  const pfName = localStorage.getItem('pg_player_name') || null;
  if (pfName && window._pfDb) {
    window._pfDb.ref('platformerScores').orderByChild('name').equalTo(pfName).once('value').then(snap => {
      snap.forEach(child => child.ref.remove());
    }).catch(()=>{});
  }
});

fsBtn.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    document.body.requestFullscreen().catch(() => {});
    fsBtn.textContent = "✕";
    fsBtn.title = "Verlaat fullscreen";
  } else {
    document.exitFullscreen();
  }
});

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    fsBtn.textContent = "⛶";
    fsBtn.title = "Fullscreen";
  }
});

loadLevel();
requestAnimationFrame(loop);
</script>
</body>
</html>
