<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Money Digger</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif; background-color: #111;}
#c{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud{position:absolute;top:20px;left:20px}
#alt{font-size:2.4rem;font-weight:700;color:#fff;line-height:1;text-shadow:0 2px 24px rgba(0,0,0,.7);letter-spacing:-1px}
#unit{font-size:.88rem;font-weight:300;color:rgba(255,255,255,.6);margin-top:2px}
#nxt{margin-top:8px;font-size:.66rem;color:rgba(255,255,255,.42);max-width:240px;line-height:1.5}
#sb{position:absolute;top:20px;right:20px;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;min-width:135px}
#sb h3{font-size:.52rem;font-weight:500;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase;margin-bottom:7px}
.sr{display:flex;justify-content:space-between;gap:10px;font-size:.6rem;color:rgba(255,255,255,.5);padding:2px 0}
.sr.me{color:#22c55e}
.sn{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv{font-family:'DM Mono',monospace;font-size:.56rem}
#bctr{position:absolute;bottom:110px;right:28px;text-align:right}
#bnum{font-size:1.2rem;font-weight:700;color:#22c55e;font-family:'DM Mono',monospace;text-shadow:0 2px 12px rgba(34,197,94,.4)}
#blbl{font-size:.56rem;color:rgba(255,255,255,.3);margin-top:2px}
#cbtn{position:fixed;bottom:28px;right:28px;z-index:20;width:72px;height:72px;border-radius:50%;border:none;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 20px rgba(34,197,94,.5);display:flex;align-items:center;justify-content:center;animation:pulse 2.5s infinite;transition:transform .08s;pointer-events:all}
@keyframes pulse{0%,100%{box-shadow:0 4px 20px rgba(34,197,94,.5),0 0 0 0 rgba(34,197,94,.3)}70%{box-shadow:0 4px 20px rgba(34,197,94,.5),0 0 0 16px rgba(34,197,94,0)}}
#cbtn:active{transform:scale(.88);animation:none}
#online{position:absolute;bottom:28px;left:20px;font-size:.58rem;color:rgba(255,255,255,.3)}
#nw{position:absolute;bottom:54px;left:20px;display:flex;align-items:center;gap:5px}
#nl{font-size:.52rem;color:rgba(255,255,255,.22)}
#ni { font-family:'DM Sans',sans-serif; font-size:.56rem; padding:3px 7px; background:rgba(255,255,255,0.05); color:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.08); border-radius:5px; width:100px; pointer-events:all; outline: none; }
#ni:focus { background: rgba(255,255,255,0.1); border-color: #22c55e; }

#msb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .5s;pointer-events:none;background:rgba(0,0,0,.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px 32px}
#msb.show{opacity:1}
#mse{font-size:3.5rem}
#msn{font-size:1.3rem;font-weight:700;color:#fff;margin-top:6px}
#mss{font-size:.62rem;color:rgba(255,255,255,.5);margin-top:3px}
.fb{position:fixed;font-size:1.1rem;pointer-events:none;z-index:25;animation:fup .85s ease-out forwards}
@keyframes fup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-70px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud"><div id="alt">0,000</div><div id="unit">millimeter</div><div id="nxt">Verbinden...</div></div>
  <div id="sb"><h3>Top klikkers</h3><div id="sl"></div></div>
  <div id="bctr"><div id="bnum">0</div><div id="blbl">biljetten gestapeld</div></div>
  <div id="nw"><span id="nl">naam:</span><input id="ni" type="text" maxlength="16" placeholder="Kies naam..."/></div>
  <div id="online">● offline</div>
  <div id="msb"><div id="mse"></div><div id="msn"></div><div id="mss"></div></div>
</div>
<button id="cbtn">💵</button>

<script>
// --- CONFIGURATIE ---
const firebaseConfig = {
    apiKey: "AIzaSyA9wKFVXmT6kUpuaBgwlPilF86LaKKDYFU",
    authDomain: "money-digger-9b05e.firebaseapp.com",
    databaseURL: "https://money-digger-9b05e-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "money-digger-9b05e",
    storageBucket: "money-digger-9b05e.firebasestorage.app",
    messagingSenderId: "883506536944",
    appId: "1:883506536944:web:921b342dff76154fcbbd35"
};

// Initialiseer Firebase (Compat mode)
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();
const billsRef = db.ref('totalBills');
const scoresRef = db.ref('scores');

function safeGetLS(key, def) { try { return localStorage.getItem(key) || def; } catch(e) { return def; } }
function safeSetLS(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

const BILL_M = 0.0001; 
const OBJECTS = [
  {m:0.001,   label:'Mier', emoji:'🐜'},
  {m:0.015,   label:'Druif', emoji:'🍇'},
  {m:0.040,   label:'Aardbei', emoji:'🍓'},
  {m:0.070,   label:'Muis', emoji:'🐭'},
  {m:0.112,   label:'Appel', emoji:'🍎'},
  {m:0.240,   label:'Basketbal', emoji:'🏀'},
  {m:0.300,   label:'Tulp', emoji:'🌷'},
  {m:0.450,   label:'Zonnebloem', emoji:'🌻'},
  {m:0.600,   label:'Kat', emoji:'🐱'},
  {m:0.900,   label:'Hond', emoji:'🐕'},
  {m:1.750,   label:'Mens', emoji:'🧍'},
  {m:2.400,   label:'Paard', emoji:'🐴'},
  {m:4.000,   label:'Olifant', emoji:'🐘'},
  {m:5.500,   label:'Giraf', emoji:'🦒'},
  {m:7.000,   label:'Jonge boom', emoji:'🌲'},
  {m:8.500,   label:'Huis', emoji:'🏠'},
  {m:15.00,   label:'Grote eik', emoji:'🌳'},
  {m:25.00,   label:'Sequoia', emoji:'🌲'},
  {m:46.00,   label:'Toren van Pisa', emoji:'🗼'},
  {m:93.00,   label:'Vrijheidsbeeld', emoji:'🗽'},
  {m:115.0,   label:'Reuzensequoia', emoji:'🌲'},
  {m:169.0,   label:'Washington Monument', emoji:'🏛️'},
  {m:324.0,   label:'Eiffeltoren', emoji:'🗼'},
  {m:443.0,   label:'Empire State Building', emoji:'🏙️'},
  {m:600.0,   label:'Pterodactylus', emoji:'🦕'},
  {m:828.0,   label:'Burj Khalifa', emoji:'🏙️'},
  {m:1000,    label:'1 kilometer!', emoji:'🎊'},
  {m:1100,    label:'Luchtballon', emoji:'🎈'},
  {m:1178,    label:'Jeddah Tower', emoji:'🏗️'},
  {m:1200,    label:'Monarchvlinder', emoji:'🦋'},
  {m:1345,    label:'Ben Nevis', emoji:'⛰️'},
  {m:1620,    label:'5× de Eiffeltoren', emoji:'🗼'},
  {m:1909,    label:'Mont Ventoux', emoji:'🚴'},
  {m:2250,    label:'Mil V-12 helikopter', emoji:'🚁'},
  {m:3776,    label:'Mount Fuji', emoji:'🗻'},
  {m:4800,    label:'1 uur wandelen omhoog', emoji:'🥾'},
  {m:5500,    label:'Zuurstof gedaald tot 50%', emoji:'😮‍💨'},
  {m:5850,    label:'65 voetbalvelden op elkaar', emoji:'⚽'},
  {m:7000,    label:'Death zone', emoji:'💀'},
  {m:8849,    label:'Mount Everest', emoji:'🏔️'},
  {m:10000,   label:'Verloren ballon knapt!', emoji:'🎈'},
  {m:26000,   label:'SR-71 Blackbird', emoji:'✈️'},
  {m:38969,   label:'Felix Baumgartner', emoji:'🪂'},
  {m:100000,  label:'Kármánlijn (Ruimte)', emoji:'🌌'},
  {m:408000,  label:'ISS Ruimtestation', emoji:'🛸'},
  {m:384400000, label:'De Maan', emoji:'🌕'},
  {m:149600000000, label:'De Zon', emoji:'☀️'}
];

let totalBills = 0, displayBills = 0;
let localDeviceId = safeGetLS('md6_did', '');
if(!localDeviceId){ localDeviceId = 'dev-'+Math.random().toString(36).slice(2,12); safeSetLS('md6_did',localDeviceId); }
let deviceId = localDeviceId; 
let myName   = safeGetLS('md6_n', 'Gast'+Math.floor(Math.random()*9000+1000));
let myClicks = 0, scores = {};

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, GY = 0;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; GY = Math.round(H * 0.72); }
resize(); window.addEventListener('resize', resize);

function fmtN(n){
  if(n>=1e9) return(n/1e9).toFixed(2)+'B'; if(n>=1e6) return(n/1e6).toFixed(2)+'M';
  if(n>=1e3) return(n/1e3).toFixed(1)+'K'; return n.toLocaleString('nl-NL');
}
function fmtH(m){
  if(m>=1000) return(m/1000).toFixed(3)+' km'; if(m>=1) return m.toFixed(3)+' m';
  return(m*1000).toFixed(2)+' mm';
}

function updateHUD(){
  const altM=displayBills*BILL_M, ae=document.getElementById('alt'), ue=document.getElementById('unit');
  if(altM>=1000){ ae.textContent=(altM/1000).toFixed(3); ue.textContent='kilometer'; }
  else if(altM>=1){ ae.textContent=altM.toFixed(3); ue.textContent='meter'; }
  else { ae.textContent=(altM*1000).toFixed(2); ue.textContent='millimeter'; }
  
  let next=null; for(const o of OBJECTS) if(o.m>altM){ next=o; break; }
  document.getElementById('nxt').textContent=next?`${next.emoji} ${next.label} — nog ${fmtN(Math.ceil((next.m-altM)/BILL_M))} klikken`:'🌌 Oneindigheid!';
  document.getElementById('bnum').textContent=fmtN(Math.round(totalBills));
}

function updateScoreboard(){
  const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,7), list=document.getElementById('sl'); 
  if(!list) return;
  list.innerHTML='';
  for(const [name,clicks] of sorted){
    const row=document.createElement('div'); row.className='sr'+(name===myName?' me':''); 
    row.innerHTML=`<span class="sn">${name}</span><span class="sv">${fmtN(clicks)}</span>`; 
    list.appendChild(row);
  }
}

// Database Listeners
billsRef.on('value', snap => { totalBills = snap.val() || 0; });
scoresRef.on('value', snap => {
    scores = {};
    snap.forEach(child => {
        const rec = child.val();
        if(rec && rec.name) scores[rec.name] = rec.clicks || 0;
    });
    updateScoreboard();
});

const onlineRef = db.ref('online'), myRef = onlineRef.push();
myRef.set(true); myRef.onDisconnect().remove();
onlineRef.on('value', snap => { document.getElementById('online').textContent = `● ${snap.numChildren()} online`; });

document.getElementById('cbtn').addEventListener('click', ()=>{
  myClicks++; totalBills++; 
  billsRef.transaction(v => (v||0)+1);
  scoresRef.child(deviceId).update({ clicks: myClicks, name: myName });
});

// Naam wijzigen
document.getElementById('ni').addEventListener('change', (e)=>{
    myName = e.target.value.trim() || myName;
    safeSetLS('md6_n', myName);
    scoresRef.child(deviceId).update({ name: myName });
});

function loop(){
  requestAnimationFrame(loop);
  displayBills += (totalBills - displayBills) * 0.1;
  ctx.clearRect(0, 0, W, H);
  
  // Sky & Ground
  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0,0,W,GY);
  ctx.fillStyle = '#111'; ctx.fillRect(0,GY,W,H-GY);
  
  // Simpele Stack
  const sh = Math.min(displayBills * 0.5, H * 0.4);
  ctx.fillStyle = '#22c55e'; ctx.fillRect(W/2-50, GY-sh, 100, sh);
  
  updateHUD();
}
loop();
</script>
</body>
</html>
