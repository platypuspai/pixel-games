<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Digger v10</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 { color: #ffcc00; font-size: 3rem; margin-bottom: 10px; }

        /* Game container styling */
        #game-canvas {
            background: #222;
            border: 4px solid #444;
            border-radius: 10px;
            display: block;
            margin: 20px auto;
            max-width: 100%;
        }

        .stats {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .btn {
            background: #ffcc00;
            color: #111;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover { transform: scale(1.1); }

        /* De navigatie/home-knop sectie is hier volledig verwijderd */
    </style>
</head>
<body>

    <header>
        <h1>💰 Money Digger</h1>
        <div class="stats">
            Geld: $<span id="money">0</span>
        </div>
    </header>

    <main>
        <div id="game-area">
            <button class="btn" id="dig-button">GRAAF!</button>
        </div>
        
        <canvas id="game-canvas" width="600" height="400"></canvas>
    </main>

    <script>
        // Simpele game logica voorbeeld (vervang dit door je eigen unieke game code)
        let money = 0;
        const moneyDisplay = document.getElementById('money');
        const digButton = document.getElementById('dig-button');

        digButton.addEventListener('click', () => {
            money += 10;
            moneyDisplay.textContent = money;
            
            // Visueel effectje
            digButton.style.backgroundColor = "#fff";
            setTimeout(() => { digButton.style.backgroundColor = "#ffcc00"; }, 50);
        });

        // Jouw specifieke Money Digger v10 engine code komt hieronder:
        console.log("Money Digger v10 is geladen zonder home-knop.");
    </script>

</body>
</html>
