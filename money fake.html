<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Money Digger - Volledige Versie</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif; background-color: #111;}
#c{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud{position:absolute;top:20px;left:20px}
#alt{font-size:2.4rem;font-weight:700;color:#fff;line-height:1;text-shadow:0 2px 24px rgba(0,0,0,.7);letter-spacing:-1px}
#unit{font-size:.88rem;font-weight:300;color:rgba(255,255,255,.6);margin-top:2px}
#nxt{margin-top:8px;font-size:.66rem;color:rgba(255,255,255,.42);max-width:240px;line-height:1.5}
#sb{position:absolute;top:20px;right:20px;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;min-width:135px}
#sb h3{font-size:.52rem;font-weight:500;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase;margin-bottom:7px}
.sr{display:flex;justify-content:space-between;gap:10px;font-size:.6rem;color:rgba(255,255,255,.5);padding:2px 0}
.sr.me{color:#22c55e}
.sn{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv{font-family:'DM Mono',monospace;font-size:.56rem}
#bctr{position:absolute;bottom:110px;right:28px;text-align:right}
#bnum{font-size:1.2rem;font-weight:700;color:#22c55e;font-family:'DM Mono',monospace;text-shadow:0 2px 12px rgba(34,197,94,.4)}
#blbl{font-size:.56rem;color:rgba(255,255,255,.3);margin-top:2px}
#cbtn{position:fixed;bottom:28px;right:28px;z-index:20;width:72px;height:72px;border-radius:50%;border:none;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 20px rgba(34,197,94,.5);display:flex;align-items:center;justify-content:center;animation:pulse 2.5s infinite;transition:transform .08s;pointer-events:all}
@keyframes pulse{0%,100%{box-shadow:0 4px 20px rgba(34,197,94,.5),0 0 0 0 rgba(34,197,94,.3)}70%{box-shadow:0 4px 20px rgba(34,197,94,.5),0 0 0 16px rgba(34,197,94,0)}}
#cbtn:active{transform:scale(.88);animation:none}
#online{position:absolute;bottom:28px;left:20px;font-size:.58rem;color:rgba(255,255,255,.3)}
#nw{position:absolute;bottom:54px;left:20px;display:flex;align-items:center;gap:5px}
#nl{font-size:.52rem;color:rgba(255,255,255,.22)}
#ni{font-family:'DM Sans',sans-serif;font-size:.56rem;padding:3px 7px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.08);border-radius:5px;width:100px;pointer-events:all}
#msb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .5s;pointer-events:none;background:rgba(0,0,0,.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px 32px}
#msb.show{opacity:1}
#mse{font-size:3.5rem}
#msn{font-size:1.3rem;font-weight:700;color:#fff;margin-top:6px}
#mss{font-size:.62rem;color:rgba(255,255,255,.5);margin-top:3px}
.fb{position:fixed;font-size:1.1rem;pointer-events:none;z-index:25;animation:fup .85s ease-out forwards}
@keyframes fup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-70px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud"><div id="alt">0,000</div><div id="unit">millimeter</div><div id="nxt">Laadt...</div></div>
  <div id="sb"><h3>Top klikkers</h3><div id="sl"></div></div>
  <div id="bctr"><div id="bnum">0</div><div id="blbl">biljetten gestapeld</div></div>
  <div id="nw"><span id="nl">naam:</span><input id="ni" type="text" maxlength="16"/></div>
  <div id="online">● verbinden...</div>
  <div id="msb"><div id="mse"></div><div id="msn"></div><div id="mss"></div></div>
</div>
<button id="cbtn">💵</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// --- CONSTANTS ---
const BILL_M = 0.0001; 
const OBJECTS = [
  {m:0.001, label:'Mier', emoji:'🐜'}, {m:0.015, label:'Druif', emoji:'🍇'},
  {m:0.040, label:'Aardbei', emoji:'🍓'}, {m:0.070, label:'Muis', emoji:'🐭'},
  {m:0.112, label:'Appel', emoji:'🍎'}, {m:0.240, label:'Basketbal', emoji:'🏀'},
  {m:0.300, label:'Tulp', emoji:'🌷'}, {m:0.450, label:'Zonnebloem', emoji:'🌻'},
  {m:0.600, label:'Kat', emoji:'🐱'}, {m:0.900, label:'Hond', emoji:'🐕'},
  {m:1.750, label:'Mens', emoji:'🧍'}, {m:2.400, label:'Paard', emoji:'🐴'},
  {m:4.000, label:'Olifant', emoji:'🐘'}, {m:5.500, label:'Giraf', emoji:'🦒'},
  {m:7.000, label:'Jonge boom', emoji:'🌲'}, {m:8.500, label:'Huis', emoji:'🏠'},
  {m:15.00, label:'Grote eik', emoji:'🌳'}, {m:25.00, label:'Sequoia', emoji:'🌲'},
  {m:46.00, label:'Toren van Pisa', emoji:'🗼'}, {m:93.00, label:'Vrijheidsbeeld', emoji:'🗽'},
  {m:115.0, label:'Reuzensequoia', emoji:'🌲'}, {m:169.0, label:'Washington Monument', emoji:'🏛️'},
  {m:324.0, label:'Eiffeltoren', emoji:'🗼'}, {m:443.0, label:'Empire State Building', emoji:'🏙️'},
  {m:600.0, label:'Pterodactylus', emoji:'🦕'}, {m:828.0, label:'Burj Khalifa', emoji:'🏙️'},
  {m:1000, label:'1 kilometer!', emoji:'🎊'}, {m:3776, label:'Mount Fuji', emoji:'🗻'},
  {m:8849, label:'Mount Everest', emoji:'🏔️'}, {m:100000, label:'Kármánlijn', emoji:'🌌'},
  {m:384400000, label:'De Maan', emoji:'🌕'}, {m:149600000000, label:'De Zon', emoji:'☀️'}
];

// --- STATE ---
let totalBills = 0;
let displayBills = 0;
let cloudT = 0;
let deviceId = localStorage.getItem('md6_did') || 'dev-'+Math.random().toString(36).slice(2,12);
localStorage.setItem('md6_did', deviceId);
let myName = localStorage.getItem('md6_n') || 'Gast';
let myClicks = 0;
let scores = {};
let shownMS = new Set();
try { shownMS = new Set(JSON.parse(localStorage.getItem('md6_m') || '[]')); } catch(e){}

// --- FIREBASE ---
firebase.initializeApp({
    apiKey: "AIzaSyA9wKFVXmT6kUpuaBgwlPilF86LaKKDYFU",
    authDomain: "money-digger-9b05e.firebaseapp.com",
    databaseURL: "https://money-digger-9b05e-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "money-digger-9b05e",
});

const auth = firebase.auth();
const db = firebase.database();
const billsRef = db.ref('totalBills');
const scoresRef = db.ref('scores');

// --- LOGIN & SYNC ---
auth.onAuthStateChanged(user => {
    if(user) {
        deviceId = user.uid; // Gebruik Firebase UID voor opslag
        myName = user.displayName;
        document.getElementById('ni').value = myName;
        // Haal bestaande clicks op voor deze gebruiker
        scoresRef.child(deviceId).once('value', snap => {
            if(snap.val()) myClicks = snap.val().clicks || 0;
        });
    }
});

// Realtime updates van database
billsRef.on('value', snap => { totalBills = snap.val() || 0; });
scoresRef.on('value', snap => {
    scores = {};
    snap.forEach(child => {
        const rec = child.val();
        if(rec && rec.name) scores[child.key] = rec;
    });
    updateScoreboard();
});

const onlineRef = db.ref('online');
const myPresence = onlineRef.push();
myPresence.set(true);
myPresence.onDisconnect().remove();
onlineRef.on('value', snap => { document.getElementById('online').textContent = `● ${snap.numChildren()} online`; });

// --- CANVAS & DRAWING ---
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, GY;
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; GY=Math.round(H*0.72); }
resize(); window.addEventListener('resize', resize);

function fmtN(n){
    if(n>=1e12) return(n/1e12).toFixed(2)+'T';
    if(n>=1e9)  return(n/1e9).toFixed(2)+'B';
    if(n>=1e6)  return(n/1e6).toFixed(2)+'M';
    if(n>=1e3)  return(n/1e3).toFixed(1)+'K';
    return Math.round(n).toLocaleString('nl-NL');
}

function fmtH(m){
    if(m>=1000) return(m/1000).toFixed(3)+' km';
    if(m>=1)    return m.toFixed(3)+' m';
    return(m*1000).toFixed(2)+' mm';
}

function drawSky(altM){
    const t = Math.min(1, altM/100000);
    const sg = ctx.createLinearGradient(0, 0, 0, GY);
    sg.addColorStop(0, `rgb(${Math.round(20*(1-t))},${Math.round(42*(1-t))},${Math.round(58*(1-t))})`);
    sg.addColorStop(1, `rgb(${Math.round(135*(1-t)+2*t)},${Math.round(186*(1-t)+5*t)},${Math.round(235*(1-t)+18*t)})`);
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, GY);
}

function drawStack(bills){
    if(bills <= 0) return;
    const cx = W/2, maxH = H * 0.38, sh = Math.min(bills * 0.5, maxH), top = GY - sh, sw = 110, depth = 20;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx+depth*.4, GY+4, sw*.7, 10, 0, 0, Math.PI*2); ctx.fill();
    // 3D Side
    ctx.fillStyle = '#14532d';
    ctx.beginPath(); ctx.moveTo(cx+sw/2, top); ctx.lineTo(cx+sw/2+depth, top-depth*.5);
    ctx.lineTo(cx+sw/2+depth, GY-depth*.5); ctx.lineTo(cx+sw/2, GY); ctx.fill();
    // Front
    const ff = ctx.createLinearGradient(cx, top, cx, GY);
    ff.addColorStop(0,'#166534'); ff.addColorStop(1,'#14532d');
    ctx.fillStyle = ff; ctx.fillRect(cx-sw/2, top, sw, sh);
    // $1 label
    if(sh > 20){
        ctx.fillStyle='rgba(255,255,255,.1)';
        ctx.font=`bold ${Math.min(36,sh*.26)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('$1', cx, top+sh*.52);
    }
    // Top
    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.moveTo(cx-sw/2, top); ctx.lineTo(cx+sw/2, top);
    ctx.lineTo(cx+sw/2+depth, top-depth*.5); ctx.lineTo(cx-sw/2+depth, top-depth*.5); ctx.closePath(); ctx.fill();
}

function drawObjects(bills){
    const altM = bills * BILL_M;
    const pxPerM = (H * 0.38) / Math.max(altM, BILL_M);
    OBJECTS.forEach(obj => {
        const ratio = obj.m / altM;
        if(ratio > 0.001 && ratio < 8) {
            const drawH = Math.min(obj.m * pxPerM, H*0.8);
            if(drawH > 10) {
                ctx.globalAlpha = Math.min(1, (8-ratio)/2);
                ctx.font = `${Math.min(drawH, 150)}px serif`; ctx.textAlign='center';
                ctx.fillText(obj.emoji, W/2 - 150, GY); 
                ctx.globalAlpha = 1;
            }
        }
    });
}

// --- LOGIC ---
function updateHUD(){
    const altM = displayBills * BILL_M;
    document.getElementById('alt').textContent = fmtH(altM);
    let next = OBJECTS.find(o => o.m > altM);
    document.getElementById('nxt').textContent = next ? `${next.emoji} ${next.label} - nog ${fmtN((next.m-altM)/BILL_M)} klikken` : 'Limit reached!';
    document.getElementById('bnum').textContent = fmtN(totalBills);
    
    // Milestones banner
    for(const obj of OBJECTS){
        if(altM >= obj.m && !shownMS.has(obj.label)){
            shownMS.add(obj.label); localStorage.setItem('md6_m', JSON.stringify([...shownMS]));
            showBanner(obj); break;
        }
    }
}

function showBanner(obj){
    document.getElementById('mse').textContent = obj.emoji;
    document.getElementById('msn').textContent = obj.label;
    document.getElementById('mss').textContent = `${fmtH(obj.m)} hoog`;
    document.getElementById('msb').classList.add('show');
    setTimeout(()=>document.getElementById('msb').classList.remove('show'), 3000);
}

function updateScoreboard(){
    const sorted = Object.values(scores).sort((a,b)=>b.clicks-a.clicks).slice(0,7);
    const list = document.getElementById('sl'); list.innerHTML = '';
    sorted.forEach(s => {
        const row = document.createElement('div');
        row.className = 'sr'+(s.name===myName?' me':'');
        row.innerHTML = `<span class="sn">${s.name}</span><span class="sv">${fmtN(s.clicks)}</span>`;
        list.appendChild(row);
    });
}

function spawnBill(){
    const el = document.createElement('div'); el.className = 'fb'; el.textContent = '💵';
    el.style.left = (W - 60 + (Math.random()-0.5)*40) + 'px';
    el.style.top = (H - 80) + 'px';
    document.body.appendChild(el); setTimeout(()=>el.remove(), 800);
}

document.getElementById('cbtn').addEventListener('click', ()=>{
    myClicks++; totalBills++; spawnBill();
    billsRef.transaction(v => (v||0)+1);
    scoresRef.child(deviceId).update({ name: myName, clicks: myClicks });
});

document.getElementById('ni').addEventListener('change', (e)=>{
    myName = e.target.value; localStorage.setItem('md6_n', myName);
    if(auth.currentUser) scoresRef.child(deviceId).update({name: myName});
});

function loop(){
    displayBills += (totalBills - displayBills) * 0.1;
    ctx.clearRect(0,0,W,H);
    drawSky(displayBills * BILL_M);
    ctx.fillStyle = '#1c1c1c'; ctx.fillRect(0, GY, W, H-GY);
    drawObjects(displayBills);
    drawStack(displayBills);
    updateHUD();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
