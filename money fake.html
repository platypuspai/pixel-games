<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Pixel-games</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #111; 
            color: white; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
        }

        h1 { margin-top: 50px; margin-bottom: 30px; font-size: 2.5rem; }

        .game { 
            border: 1px solid #333; 
            padding: 20px; 
            margin: 20px auto; 
            max-width: 500px; 
            border-radius: 10px; 
            background: #1a1a1a; 
            transition: transform 0.2s; 
        }
        .game:hover { transform: scale(1.02); }

        h2 { margin-top: 0; color: #eee; }

        a, .btn-action { display: inline-block; margin: 10px; padding: 10px 20px; text-decoration: none; color: white; border-radius: 5px; font-weight: bold; cursor: pointer; border: none; }
        .play { background: #22c55e; }
        .chrome { background: #3b82f6; }
        .achievements-btn { background: #f59e0b; font-size: 14px; width: 100%; margin: 10px 0 0 0; }

        /* --- TOP 10 & STATS RECHTSBOVEN --- */
        .sidebar-container { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            width: 220px;
            z-index: 100;
        }
        
        .sidebar-container h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #22c55e;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .top-players-list {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            font-size: 13px;
        }

        .top-players-list li {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            color: #ccc;
        }

        .top-players-list li span { color: #fff; font-weight: bold; }

        /* Achievements Overlay */
        #achievements-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            border: 2px solid #f59e0b;
            padding: 30px;
            border-radius: 15px;
            z-index: 1000;
            max-width: 500px;
            width: 90%;
            text-align: left;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .achievement-item {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .achievement-item.locked { opacity: 0.5; }
        .achievement-item.unlocked { border-left: 4px solid #22c55e; padding-left: 10px; opacity: 1; }
        
        .achievement-item h4 { margin: 0; color: #f59e0b; }
        .achievement-item p { margin: 5px 0; font-size: 13px; color: #bbb; }

        .close-btn { background: #ef4444; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="sidebar-container">
    <h3>🏆 Top 10 Klikkers</h3>
    <ul class="top-players-list">
        <li>1. PixelKing <span>999k</span></li>
        <li>2. DinoMaster <span>850k</span></li>
        <li>3. SquareJump <span>720k</span></li>
        <li>4. MoneyMaker <span>600k</span></li>
        <li>5. GoldDigger <span>550k</span></li>
    </ul>
    
    <h3>📊 Jouw Score</h3>
    <div style="font-size: 14px; margin-bottom: 10px;">
        Gegraven: <span id="current-depth" style="color: #22c55e; font-weight: bold;">0</span> meter
    </div>

    <button class="btn-action achievements-btn" onclick="toggleAchievements()">🏅 Achievements</button>
</div>

<h1>🎮 My Games</h1>

<div class="game">
    <h2>Dino World</h2>
    <a class="play" href="dino-world.html">Play</a>
    <a class="chrome" href="https://chromewebstore.google.com/detail/iejbajahighjdjjpembncgkgjolpbkfh?utm_source=item-share-cb">Extension</a>
</div>

<div class="game">
    <h2>Money Digger</h2>
    <a class="play" href="money-digger v10.html">Play</a>
</div>

<div id="achievements-modal">
    <h2 style="margin-top:0;">🏅 Achievements Progressie</h2>
    <div id="achievements-list">
        </div>
    <button class="btn-action close-btn" onclick="toggleAchievements()">Sluiten</button>
</div>

<script>
    // Dit simuleert de data uit je game. 
    // In je echte game moet je "localStorage.setItem('totalMeters', score)" gebruiken.
    let userMeters = localStorage.getItem('totalMeters') || 0;
    document.getElementById('current-depth').textContent = userMeters;

    const achievements = [
        { threshold: 1, title: "De Leraar", desc: "$10.000 = 26 dagen lesgeven" },
        { threshold: 5, title: "De CEO", desc: "$50.000 = 12,5 uur Fortune 500 CEO" },
        { threshold: 10, title: "De Ruimtevaarder", desc: "$100.000 = NASA budget (2m 24s)" },
        { threshold: 50, title: "Huizenbezitter", desc: "$500.000 = Gemiddeld NL huis" },
        { threshold: 100, title: "De Staat", desc: "$1.000.000 = Wat de overheid per minuut uitgeeft" },
        { threshold: 1000, title: "Elon Mode", desc: "$10.000.000 = De waarde van een privé eiland" }
    ];

    function toggleAchievements() {
        const modal = document.getElementById('achievements-modal');
        const list = document.getElementById('achievements-list');
        
        if (modal.style.display === 'block') {
            modal.style.display = 'none';
        } else {
            // Update lijst voordat we deze tonen
            list.innerHTML = '';
            achievements.forEach(ach => {
                const isUnlocked = userMeters >= ach.threshold;
                const div = document.createElement('div');
                div.className = `achievement-item ${isUnlocked ? 'unlocked' : 'locked'}`;
                div.innerHTML = `
                    <h4>${isUnlocked ? '✅' : '🔒'} ${ach.title} (${ach.threshold}m)</h4>
                    <p>${ach.desc}</p>
                    ${!isUnlocked ? `<small style="color: #666">Nog ${ach.threshold - userMeters} meter te gaan</small>` : ''}
                `;
                list.appendChild(div);
            });
            modal.style.display = 'block';
        }
    }
</script>

</body>
</html>
