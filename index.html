<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="vFyjfpaZyQDaelgYFm_fUoEzAsOiA_SvKDvWOMbUTl0" />
    <meta name="description" content="Speel de leukste gratis pixel games direct in je browser op Plixo-Arcade. Ontdek onze retro arcade en pixel art spellen!" />

    
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Plixo-Arcade</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --card: #1a1a28;
            --border: #2a2a42;
            --accent-green: #00ff88;
            --accent-blue: #4488ff;
            --accent-orange: #ff8844;
            --accent-pink: #ff44aa;
            --accent-yellow: #ffdd00;
            --accent-cyan: #00e5ff;
            --text: #e8e8ff;
            --text-muted: #7777aa;
            --pixel-size: 4px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Scanline overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.12) 2px,
                rgba(0,0,0,0.12) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* Animated bg grid */
        body::after {
            content: '';
            position: fixed;
            inset: -100%;
            background-image:
                linear-gradient(rgba(68,136,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(68,136,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        /* Stars */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* ---- HEADER ---- */
        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 20px 40px;
        }

        .logo-container {
            display: inline-block;
            position: relative;
        }

        .logo-pixel-deco {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            animation: decoFloat 4s ease-in-out infinite;
        }
        @keyframes decoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .pixel-block {
            width: 12px;
            height: 12px;
            image-rendering: pixelated;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(1.2rem, 5vw, 2.2rem);
            letter-spacing: 0.05em;
            line-height: 1.4;
            position: relative;
        }

        .title-pixel {color: var(--accent-green); }
        .title-dash {color: var(--text-muted); }
        .title-games {color: var(--accent-blue); }

        /* Glitch effect */
        h1::before, h1::after {
            content: 'PLIXO_ARCADE';
            position: absolute;
            top: 0; left: 0; right: 0;
            font-family: 'Press Start 2P', monospace;
        }
        h1::before {
            color: var(--accent-pink);
            animation: glitch1 6s infinite;
            clip-path: polygon(0 30%, 100% 30%, 100% 55%, 0 55%);
        }
        h1::after {
            color: var(--accent-blue);
            animation: glitch2 6s infinite;
            clip-path: polygon(0 65%, 100% 65%, 100% 80%, 0 80%);
        }
        @keyframes glitch1 {
            0%, 90%, 100% { transform: none; opacity: 0; }
            92% { transform: translateX(-4px); opacity: 0.8; }
            94% { transform: translateX(4px); opacity: 0; }
            96% { transform: translateX(-2px); opacity: 0.6; }
        }
        @keyframes glitch2 {
            0%, 88%, 100% { transform: none; opacity: 0; }
            90% { transform: translateX(4px); opacity: 0.7; }
            92% { transform: translateX(-2px); opacity: 0; }
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 16px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .subtitle span {
            color: var(--accent-green);
            animation: blink 1.2s step-end infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ---- NAVBAR ---- */
        .navbar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px auto 0;
            position: relative;
            z-index: 10;
        }
        .nav-btn { padding: 10px 20px; 
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            letter-spacing: 0.08em;
            padding: 10px 20px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            display: inline-block;
        }
        .nav-btn:hover { color: var(--text); border-color: var(--text-muted); }
        .nav-btn.active { color: #000; background: var(--accent-green); border-color: var(--accent-green); }

        /* ---- PAGES ---- */
        .page { display: none; }
        .page.active { display: block; }

        /* ---- CONTACT PAGE ---- */
        .contact-wrap {
            position: relative; z-index: 10;
            max-width: 560px; margin: 50px auto 80px; padding: 0 20px;
        }
        .contact-wrap h2 {
            font-family: 'Press Start 2P', monospace; font-size: 0.85rem;
            color: var(--accent-green); margin-bottom: 10px;
        }
        .contact-wrap > p { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 30px; line-height: 1.7; }
        .contact-form {
            background: var(--card); border: 1px solid var(--border);
            border-top: 2px solid var(--accent-green); padding: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.65rem; letter-spacing: 0.15em; color: var(--text-muted); margin-bottom: 8px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; background: var(--surface); border: 1px solid var(--border);
            color: var(--text); font-family: 'Inconsolata', monospace; font-size: 0.85rem;
            padding: 10px 12px; outline: none; transition: border-color 0.15s;
            border-radius: 0; appearance: none;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent-green); }
        .form-group textarea { height: 120px; resize: vertical; }
        .btn-send {
            font-family: 'Press Start 2P', monospace; font-size: 0.55rem;
            padding: 12px 24px; background: var(--accent-green); color: #000;
            border: none; cursor: pointer; letter-spacing: 0.1em;
            transition: filter 0.15s; width: 100%;
        }
        .btn-send:hover { filter: brightness(1.15); }
        .form-success { display: none; text-align: center; padding: 20px; color: var(--accent-green); font-size: 0.7rem; letter-spacing: 0.1em; }

        /* ---- INFO PAGE ---- */
        .info-wrap {
            position: relative; z-index: 10;
            max-width: 700px; margin: 50px auto 80px; padding: 0 20px;
        }
        .info-wrap h2 { font-family: 'Press Start 2P', monospace; font-size: 0.85rem; color: var(--accent-blue); margin-bottom: 30px; }
        .info-block { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--accent-blue); padding: 24px; margin-bottom: 20px; }
        .info-block h3 { font-family: 'Press Start 2P', monospace; font-size: 0.6rem; color: var(--accent-blue); margin-bottom: 12px; letter-spacing: 0.1em; }
        .info-block p { color: var(--text-muted); font-size: 0.82rem; line-height: 1.7; }
        .info-block a { color: var(--accent-green); text-decoration: none; }
        .info-block a:hover { text-decoration: underline; }
        .info-tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .info-tag { font-size: 0.65rem; padding: 4px 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); letter-spacing: 0.1em; }

        /* ---- GAME GRID ---- */
        main {
            position: relative;
            z-index: 10;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 20px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* ---- GAME CARD ---- */
        .game-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .game-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 60%, rgba(255,255,255,0.02));
            pointer-events: none;
        }

        .game-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px var(--card-accent, var(--accent-green));
        }

        /* Pixel art preview canvas */
        .card-preview {
            height: 140px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--preview-bg, #0d0d18);
        }

        .pixel-art {
            image-rendering: pixelated;
            width: 80px;
            height: 80px;
        }

        .card-preview .badge-new {
            position: absolute;
            top: 12px; right: 12px;
            background: var(--accent-pink);
            color: #fff;
            font-size: 0.6rem;
            font-family: 'Press Start 2P', monospace;
            padding: 4px 8px;
            letter-spacing: 0.05em;
        }

        /* Scan animation on preview */
        .card-preview::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: var(--card-accent, var(--accent-green));
            opacity: 0.5;
            top: -2px;
            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan {
            0% { top: -2px; }
            100% { top: 142px; }
        }

        .card-body {
            padding: 20px;
        }

        .card-tag {
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--card-accent, var(--accent-green));
            margin-bottom: 8px;
            display: block;
        }

        .card-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .card-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            font-family: 'Inconsolata', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.05em;
            border: 1px solid transparent;
            transition: all 0.15s;
            border-radius: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.08);
            transform: translateX(-100%);
            transition: transform 0.2s;
        }
        .btn:hover::before { transform: translateX(0); }

        .btn-play {
            background: var(--card-accent, var(--accent-green));
            color: #000;
        }
        .btn-play:hover { filter: brightness(1.15); }

        .btn-ext {
            background: transparent;
            color: var(--accent-blue);
            border-color: var(--accent-blue);
        }
        .btn-ext:hover { background: rgba(68,136,255,0.12); }

        .btn-app {
            background: transparent;
            color: var(--accent-orange);
            border-color: var(--accent-orange);
        }
        .btn-app:hover { background: rgba(255,136,68,0.12); }

        /* Pixel corner decorations */
        .card-corner {
            position: absolute;
            width: 8px; height: 8px;
            background: var(--card-accent, var(--accent-green));
            opacity: 0.5;
        }
        .card-corner.tl { top: 0; left: 0; }
        .card-corner.br { bottom: 0; right: 0; }


        @keyframes bugFly {0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
        @keyframes balloonMove {from{transform:translateX(120px)}to{transform:translateX(-120px)}}
        .bug-escape-card .balloon {animation: balloonMove 3s linear infinite;}
        .bug-escape-card .bug {animation: bugFly 1.2s ease-in-out infinite;}

        /* ---- FOOTER ---- */
        footer {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.75rem;
            border-top: 1px solid var(--border);
        }

        footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }
        footer a:hover { color: var(--accent-green); }

        /* ---- Pixel art SVG illustrations ---- */
        .pixel-sprite { image-rendering: pixelated; }

        /* Animations for sprites */
        @keyframes bobUp {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.85; }
        }

        .animate-bob { animation: bobUp 2s ease-in-out infinite; }
        .animate-spin { animation: spin 4s linear infinite; transform-origin: center; }
        .animate-pulse { animation: pulse 2s ease-in-out infinite; }

        /* LEADERBOARD */
        .lb-wrap{position:relative;z-index:10;max-width:960px;margin:50px auto 80px;padding:0 20px}
        .lb-wrap>h2{font-family:'Press Start 2P',monospace;font-size:.85rem;color:var(--accent-yellow);margin-bottom:6px}
        .lb-wrap>p{color:var(--text-muted);font-size:.78rem;margin-bottom:24px}
        .lb-name-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent-yellow);padding:14px 20px;margin-bottom:20px;justify-content:space-between}
        .lb-name-bar-label{font-family:'Press Start 2P',monospace;font-size:.45rem;color:var(--text-muted);letter-spacing:.1em}
        .lb-name-bar-value{font-size:.88rem;font-weight:700;color:var(--accent-yellow);flex:1}
        .lb-change-btn{font-family:'Press Start 2P',monospace;font-size:.4rem;padding:7px 14px;background:transparent;color:var(--text-muted);border:1px solid var(--border);cursor:pointer;letter-spacing:.08em;transition:all .15s;white-space:nowrap}
        .lb-change-btn:hover{border-color:var(--accent-yellow);color:var(--accent-yellow)}
        .lb-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
        .lb-overlay.lb-hidden{display:none}
        .lb-modal{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--accent-yellow);padding:40px 36px;max-width:420px;width:90%}
        .lb-modal h3{font-family:'Press Start 2P',monospace;font-size:.62rem;color:var(--accent-yellow);margin-bottom:10px}
        .lb-modal p{color:var(--text-muted);font-size:.78rem;line-height:1.6;margin-bottom:22px}
        .lb-modal input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Inconsolata',monospace;font-size:1rem;padding:11px 14px;outline:none;transition:border-color .15s;margin-bottom:18px}
        .lb-modal input:focus{border-color:var(--accent-yellow)}
        .lb-modal-btn{font-family:'Press Start 2P',monospace;font-size:.5rem;padding:12px 20px;background:var(--accent-yellow);color:#000;border:none;cursor:pointer;width:100%;letter-spacing:.1em;transition:filter .15s}
        .lb-modal-btn:hover{filter:brightness(1.1)}
        .lb-grid{display:grid;grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));;gap: 20px;align-items:start}
        .lb-board{background:var(--card);border:1px solid var(--border);border-radius:2px}
        .lb-board-head{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.18)}
        .lb-live{width:6px;height:6px;border-radius:50%;background:var(--accent-green);animation:pulse 1.5s ease-in-out infinite;flex-shrink:0}
        .lb-board-title{font-family:'Press Start 2P',monospace;font-size:.47rem;letter-spacing:.08em;flex:1;line-height:1.6}
        .lb-board-meta{font-size:.6rem;color:var(--text-muted);white-space:nowrap}
        .lb-board-body{max-height:400px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
        .lb-board-body::-webkit-scrollbar{width:4px}
        .lb-board-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
        .lb-row{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid rgba(255,255,255,.03);transition:background .1s}
        .lb-row:hover{background:rgba(255,255,255,.04)}
        .lb-row.me{background:rgba(255,221,0,.07)}
        .lb-rank{font-family:'Press Start 2P',monospace;font-size:.4rem;color:var(--text-muted);width:22px;text-align:center;flex-shrink:0}
        .lb-rank.g{color:#ffd700;font-size:.68rem}.lb-rank.s{color:#c0c0c0;font-size:.68rem}.lb-rank.b{color:#cd7f32;font-size:.68rem}
        .lb-name-c{flex:1;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .lb-name-c.me{color:var(--accent-yellow);font-weight:700}
        .lb-score-c{font-size:.75rem;color:var(--text-muted);white-space:nowrap;font-family:'Inconsolata',monospace}
        .lb-empty,.lb-loading{padding:24px 18px;color:var(--text-muted);font-size:.75rem;text-align:center;line-height:1.7}
        .lb-loading::after{content:'...';animation:blink 1s step-end infinite}
        .lb-foot{border-top:1px solid var(--border);padding:9px 18px;font-size:.7rem;color:var(--text-muted);background:rgba(255,221,0,.04);display:none}
        .lb-foot span{color:var(--accent-yellow);font-weight:700}
        .lb-notice{padding:8px 18px 14px;font-size:.64rem;color:var(--text-muted);line-height:1.6;border-top:1px solid var(--border)}
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<header>
    <div class="logo-pixel-deco">
        <svg class="pixel-block" width="20" height="20" viewBox="0 0 3 3"><rect width="1" height="1" x="1" y="0" fill="#00ff88"/><rect width="1" height="1" x="0" y="1" fill="#00ff88"/><rect width="1" height="1" x="2" y="1" fill="#00ff88"/></svg>
        <svg class="pixel-block" width="20" height="20" viewBox="0 0 3 3"><rect width="3" height="3" fill="#ff4444"/></svg>
        <svg class="pixel-block" width="20" height="20" viewBox="0 0 3 3"><rect width="1" height="1" x="1" y="0" fill="#4488ff"/><rect width="1" height="1" x="0" y="1" fill="#4488ff"/><rect width="1" height="1" x="2" y="1" fill="#4488ff"/></svg>
        <svg class="pixel-block" width="20" height="20" viewBox="0 0 3 3"><rect width="1" height="1" x="0" y="0" fill="#ffdd00"/><rect width="1" height="1" x="2" y="0" fill="#ffdd00"/><rect width="1" height="1" x="1" y="1" fill="#ffdd00"/><rect width="1" height="1" x="0" y="2" fill="#ffdd00"/><rect width="1" height="1" x="2" y="2" fill="#ffdd00"/></svg>
        <svg class="pixel-block" width="20" height="20" viewBox="0 0 3 3"><rect width="3" height="3" fill="#ff8844"/></svg>
        <svg class="pixel-block" width="20" height="20" viewBox="0 0 3 3"><rect width="1" height="1" x="1" y="0" fill="#ff44aa"/><rect width="1" height="1" x="0" y="1" fill="#ff44aa"/><rect width="1" height="1" x="2" y="1" fill="#ff44aa"/></svg>
    </div>

    <div class="logo-container">
        <h1><span class="title-pixel">PLIXO</span><span class="title-dash">-</span><span class="title-games">ARCADE</span></h1>
    </div>
    <p class="subtitle">10 games &nbsp;·&nbsp; play in browser &nbsp;·&nbsp; school project <span>_</span></p>

    <nav class="navbar">
        <button class="nav-btn active" onclick="showPage('home', this)">▶ HOME</button>
        <button class="nav-btn" onclick="showPage('contact', this)">✉ CONTACT</button>
        <button class="nav-btn" onclick="showPage('info', this)">ℹ INFO</button>
        <a class="nav-btn" href="leaderboard.html">LEADERBOARD</a>
    </nav>
</header>

<div id="page-home" class="page active" style="display:block;">
<main>
